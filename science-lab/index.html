<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style><script id="nozoom-js">/* Block browser page zoom (iOS ignores user-scalable=no); in-game zoom uses pointer events and still works. */(function(){var p=function(e){e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,p,{passive:false})});})();</script>
<title>The Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --st:#9b5de5;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--ink); background:#2d2b55;
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  body { background:#2d2b55; background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),
    linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px); background-size:48px 48px; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .screen[hidden], .overlay[hidden] { display:none !important; }
  svg.i { width:1.1em; height:1.1em; vertical-align:-.18em; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px; padding:8px 26px 4px;
    background:var(--accent); color:#fff; font-family:var(--toon); font-size:24px; letter-spacing:1px; border-radius:999px;
    border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); text-decoration:none; transition:transform .05s; white-space:nowrap; }
  .btn:active, .btn.pressed { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn.blue { background:var(--blue); color:var(--ink); }
  .btn.sq { width:60px; padding:0; font-size:26px; }
  .btn.on { background:var(--ink); color:#fff; }
  .btn[hidden] { display:none; }
  .btn[disabled] { opacity:.45; pointer-events:none; }
  .btn.glow { animation:glow 1.1s ease-in-out infinite; }
  @keyframes glow { 50% { transform:scale(1.07); } }
  .btn.muted { background:#e9e2cf; color:#5c5566; }

  /* ---------- title ---------- */
  #title { overflow-y:auto; overflow-x:hidden; align-items:center; padding:14px 16px 30px; gap:12px; }
  .topbar { width:100%; max-width:1260px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .topbar .r { display:flex; gap:10px; }
  .hero { display:flex; align-items:center; justify-content:center; gap:14px 28px; width:100%; max-width:1200px; flex-wrap:wrap; }
  #pupBig { width:250px; height:290px; touch-action:manipulation; cursor:pointer; }
  .hero-txt { display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; max-width:640px; }
  h1 { margin:0; font-size:76px; line-height:.95; color:var(--yellow); -webkit-text-stroke:3px var(--ink); paint-order:stroke;
    text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); font-family:var(--toon); font-weight:400; letter-spacing:2px; }
  h1 span { color:var(--accent); }
  .subs { color:#fff; font-size:28px; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); }
  .subs b { color:var(--purple); font-weight:400; } .subs i { color:var(--orange); font-style:normal; } .subs u { color:var(--green); text-decoration:none; }
  .tag { margin:0; color:#fff; font-size:22px; }
  .say { position:relative; padding:10px 16px; font-size:19px; line-height:1.25; }
  .stations { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; width:100%; max-width:1260px; }
  .station { position:relative; padding:12px 14px 14px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;
    border-top:14px solid var(--c); cursor:pointer; }
  .station .ico { width:96px; height:96px; }
  .station h3 { margin:0; font-family:var(--toon); font-weight:400; font-size:26px; letter-spacing:1px; color:var(--ink); }
  .station p { margin:0; font-size:18px; line-height:1.2; min-height:24px; }
  .station .stars { font-size:30px; letter-spacing:4px; }
  .station .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .station .btn { font-size:21px; padding:8px 18px 4px; }
  .station.locked { filter:grayscale(.9); opacity:.75; }
  .station .lock { position:absolute; top:8px; right:10px; width:38px; height:38px; }
  .star-on { color:#f4a100; -webkit-text-stroke:1.5px var(--ink); } .star-off { color:#d8d0bd; }
  .foot { color:#fff; margin:4px 0 0; font-size:18px; }
  @media (max-width:1000px) { .stations { grid-template-columns:repeat(2,1fr); } h1 { font-size:60px; } }
  @media (max-width:560px) { .stations { grid-template-columns:1fr; } h1 { font-size:46px; } .subs { font-size:21px; }
    #pupBig { width:180px; height:210px; } .tag { font-size:18px; } .topbar .btn { font-size:19px; padding:6px 14px 2px; } }

  /* ---------- mission ---------- */
  #mbar { display:flex; align-items:center; gap:8px; padding:8px 10px; flex-wrap:wrap; }
  #mTitle { color:#fff; font-size:28px; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); margin-right:auto; }
  #steps { display:flex; gap:4px; flex-wrap:nowrap; }
  .stp { padding:6px 10px 2px; border-radius:999px; border:3px solid var(--ink); background:#e9e2cf; color:#6d6577; font-family:var(--toon); font-size:16px; white-space:nowrap; }
  .stp.done { background:var(--green); color:var(--ink); }
  .stp.cur { background:var(--st); color:#fff; -webkit-text-stroke:1px var(--ink); paint-order:stroke; transform:rotate(-2deg) scale(1.08); }
  #clock { padding:8px 14px 4px; font-size:22px; min-width:86px; text-align:center; border-radius:999px; }
  #clock.low { background:#ffd6dc; } #clock.free { background:#c7f9e5; }
  #stage { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:4px 10px 8px; }
  #mfoot { display:flex; align-items:center; gap:10px; padding:4px 10px 10px; }
  #pupSmall { width:96px; height:96px; flex:none; cursor:pointer; touch-action:manipulation; }
  #say { flex:1; min-height:60px; display:flex; align-items:center; }
  #say:before { content:""; position:absolute; left:-15px; top:50%; margin-top:-10px; border:10px solid transparent; border-right:14px solid var(--ink); border-left:0; }
  #next { flex:none; }
  @media (max-width:1100px) { .stp:not(.cur) .lbl { display:none; } }
  @media (max-width:640px) { #mTitle { font-size:22px; } #steps { order:5; width:100%; justify-content:center; } #say { font-size:16px; }
    #pupSmall { width:70px; height:70px; } #next { font-size:20px; padding:6px 16px 2px; } }

  /* generic phase layout */
  .ph { display:flex; gap:12px; height:100%; min-height:420px; }
  .main { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .ph .main { flex:1; }
  .ph .side { width:340px; flex:none; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  .cvwrap { flex:1; min-height:240px; position:relative; overflow:hidden; background:#fff; }
  .cvwrap canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .ctrls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; }
  .box { padding:10px 14px; }
  .box h4 { margin:0 0 6px; font-family:var(--toon); font-weight:400; font-size:22px; letter-spacing:1px; color:var(--st); -webkit-text-stroke:.6px var(--ink); }
  .task { background:#fff4c4; }
  .task b.toon { font-size:20px; }
  .lbl-sm { font-size:13px; opacity:.7; letter-spacing:1px; text-transform:uppercase; }
  .chiprow { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { min-height:60px; padding:6px 14px 2px; border-radius:16px; border:3px solid var(--ink); background:#fff; font-family:var(--toon); font-size:19px; box-shadow:0 4px 0 var(--ink); }
  .chip.on { background:var(--st); color:#fff; -webkit-text-stroke:.8px var(--ink); }
  .chip.solved:after { content:" ✔"; color:#059669; -webkit-text-stroke:0; }
  .chip:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  @media (orientation:portrait), (max-width:820px) {
    .ph { flex-direction:column; height:auto; min-height:0; }
    .ph .side { width:auto; overflow:visible; }
    .cvwrap { flex:none; height:52vh; min-height:260px; }
  }

  /* discover */
  .disc { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding-bottom:6px; }
  @media (orientation:portrait), (max-width:820px) { .disc { grid-template-columns:1fr; } }
  .dcard { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; min-height:240px; }
  .dhead { font-size:24px; color:var(--st); -webkit-text-stroke:.8px var(--ink); }
  .dbody { flex:1; display:flex; flex-direction:column; gap:6px; }
  .dfront { flex:1; min-height:150px; border:3px dashed var(--ink); border-radius:14px; background:repeating-linear-gradient(45deg,#fff4c4 0 14px,#fffaf0 14px 28px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:20px; }
  .dfront .q { font-size:58px; color:var(--st); -webkit-text-stroke:2px var(--ink); paint-order:stroke; animation:wob 1.6s ease-in-out infinite; }
  @keyframes wob { 50% { transform:rotate(8deg) scale(1.1); } }
  .dinner { display:flex; flex-direction:column; gap:6px; animation:popin .35s ease-out; }
  @keyframes popin { from { transform:scale(.8); opacity:0; } }
  .dinner .mini { position:relative; height:190px; border:3px solid var(--ink); border-radius:14px; overflow:hidden; background:#fff; }
  .dinner .mini canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .fact { margin:0; font-size:17px; line-height:1.3; }
  .fact b { color:#c9184a; }

  /* quiz */
  .quiz { max-width:820px; margin:10px auto; padding:18px 22px; display:flex; flex-direction:column; gap:12px; }
  .qnum { color:var(--st); font-size:22px; -webkit-text-stroke:.8px var(--ink); }
  .qq { font-size:26px; line-height:1.25; }
  .qopts { display:flex; flex-direction:column; gap:12px; }
  .qopt { justify-content:flex-start; text-align:left; white-space:normal; font-family:Nunito,system-ui,sans-serif; font-weight:900; font-size:21px; padding:10px 22px; border-radius:22px; }
  .qopt.right { background:var(--green); } .qopt.wrong { background:#ff8fa3; } .qopt.dim { opacity:.5; }
  .why { margin:0; font-size:19px; line-height:1.35; background:#fff4c4; border:3px solid var(--ink); border-radius:14px; padding:10px 14px; }

  /* results */
  .res { max-width:760px; margin:10px auto; padding:20px 24px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .res h2, .card h2 { margin:0; font-size:44px; color:var(--st); -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .bigstars { font-size:72px; letter-spacing:10px; line-height:1; }
  .bigstars span { display:inline-block; animation:popin .5s backwards; }
  .res ul { list-style:none; padding:0; margin:0; font-size:19px; text-align:left; }
  .res li { padding:3px 0; }

  /* overlays */
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(30,20,60,.55); z-index:20; padding:12px; }
  .card { padding:18px 22px; max-width:min(860px,96vw); max-height:92vh; overflow:auto; text-align:center; border-radius:24px; box-shadow:6px 6px 0 var(--ink); }
  .card p { font-size:19px; }
  .card .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  #nbBody { text-align:left; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:10px 0; }
  @media (max-width:700px) { #nbBody { grid-template-columns:1fr; } }
  .nbsec { border:3px solid var(--ink); border-radius:14px; padding:8px 12px; background:#fff; border-top:10px solid var(--c); }
  .nbsec h3 { margin:0 0 4px; font-family:var(--toon); font-weight:400; font-size:22px; display:flex; justify-content:space-between; }
  .nbe { padding:5px 0; border-bottom:2px dashed #e4dccb; font-size:15px; line-height:1.25; }
  .nbe:last-child { border:0; }
  .nbe b { display:block; font-size:16px; color:#3a2f7a; }
  .nbe.lock { color:#aaa29a; } .nbe.lock b { color:#aaa29a; }

  #fx { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; }
  .burst { position:absolute; left:50%; top:42%; width:300px; height:220px; transform:translate(-50%,-50%); animation:burst 1.1s ease-out forwards; }
  .burst svg { width:100%; height:100%; }
  .burst b { position:absolute; inset:0; display:grid; place-items:center; font-size:44px; color:#fff; -webkit-text-stroke:2.5px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); }
  @keyframes burst { 0% { transform:translate(-50%,-50%) scale(.2) rotate(-14deg); opacity:0; } 18% { transform:translate(-50%,-50%) scale(1.12) rotate(4deg); opacity:1; }
    75% { opacity:1; } 100% { transform:translate(-50%,-70%) scale(1) rotate(0); opacity:0; } }
  #toast { position:fixed; left:50%; top:auto; bottom:96px; transform:translate(-50%,200%); visibility:hidden; padding:10px 20px 6px; font-size:21px; z-index:31; background:var(--yellow);
    transition:transform .3s; pointer-events:none; text-align:center; max-width:92vw; width:max-content; }
  #toast.show { transform:translate(-50%,0) rotate(-1deg); visibility:visible; }

  /* chemistry */
  .chem { display:flex; gap:12px; min-height:100%; }
  .shelf { width:200px; flex:none; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .tile { min-height:84px; border:3px solid var(--ink); border-radius:16px; background:#fff; box-shadow:0 4px 0 var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:2px; touch-action:none; font-size:12px; line-height:1.05; text-align:center; }
  .tile svg { width:50px; height:50px; pointer-events:none; }
  .tile:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .drag-ghost { position:fixed; z-index:40; width:64px; height:64px; pointer-events:none; transform:translate(-50%,-50%) scale(1.15); }
  .bench { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; }
  .flaskzone { position:relative; width:min(260px,62vw); aspect-ratio:200/230; }
  .flaskzone.withb { margin-top:70px; }
  .flaskzone > svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .flaskzone.hot > svg .glass { filter:drop-shadow(0 0 14px #ff9f1c); }
  .flaskzone.over > svg .glass { stroke:#06d6a0; }
  .fitems { position:absolute; left:16%; right:16%; top:52%; bottom:8%; display:flex; flex-wrap:wrap; align-content:flex-end; justify-content:center; gap:2px; }
  .fitems svg { width:40px; height:40px; animation:popin .25s; }
  .fbub { position:absolute; width:14px; height:14px; border:2px solid var(--ink); border-radius:50%; background:rgba(255,255,255,.75); animation:rise 1.4s ease-in forwards; }
  @keyframes rise { to { transform:translateY(-190px) scale(1.4); opacity:0; } }
  .shake { animation:shake .5s; }
  @keyframes shake { 20% { transform:rotate(-8deg); } 40% { transform:rotate(8deg); } 60% { transform:rotate(-6deg); } 80% { transform:rotate(5deg); } }
  .flash { position:absolute; inset:-20%; border-radius:50%; background:radial-gradient(#fff 0,#fff7 40%,transparent 70%); animation:flash .6s forwards; pointer-events:none; }
  @keyframes flash { from { opacity:1; transform:scale(.4); } to { opacity:0; transform:scale(1.3); } }
  .product { min-height:150px; width:100%; max-width:520px; padding:8px 12px; display:flex; gap:12px; align-items:center; }
  .product .pic { width:110px; height:110px; flex:none; }
  .product .pic svg { width:100%; height:100%; }
  .product .nm { font-family:var(--toon); font-size:26px; line-height:1; }
  .product .fm { font-size:20px; color:#5a189a; }
  .product p { margin:4px 0 0; font-size:15px; line-height:1.25; }
  .signs { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .sign { font-size:12px; padding:2px 8px; border-radius:999px; border:2px solid var(--ink); background:var(--yellow); }
  .sign.bubbles { background:#bde0fe; } .sign.heat { background:#ffb4a2; } .sign.light { background:#fff3b0; } .sign.color { background:#f7b267; } .sign.new { background:#b9fbc0; } .sign.phys { background:#e9e2cf; }
  .book { width:280px; flex:none; padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .recipes { display:flex; flex-direction:column; gap:4px; }
  .rec { display:flex; gap:8px; align-items:center; border:2px solid var(--ink); border-radius:12px; padding:3px 6px; background:#fff; font-size:14px; line-height:1.1; }
  .rec svg { width:36px; height:36px; flex:none; }
  .rec.lock { background:#ece6d6; color:#958d80; }
  .rec.new { animation:popin .5s; background:#c7f9e5; }
  .scale svg { width:100%; height:90px; }
  .scale .cap { font-size:14px; text-align:center; }
  @media (orientation:portrait), (max-width:900px) {
    .chem { flex-direction:column; }
    .shelf, .book { width:auto; }
    .tiles { grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); }
  }

  /* states */
  .rng { width:100%; height:60px; -webkit-appearance:none; appearance:none; background:transparent; touch-action:pan-y; }
  .rng::-webkit-slider-runnable-track { height:18px; border-radius:10px; border:3px solid var(--ink); background:var(--trk,#ddd); }
  .rng::-webkit-slider-thumb { -webkit-appearance:none; width:44px; height:44px; margin-top:-16px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  .rng::-moz-range-track { height:14px; border-radius:10px; border:3px solid var(--ink); background:var(--trk,#ddd); }
  .rng::-moz-range-thumb { width:40px; height:40px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); }
  .rng:disabled { opacity:.5; }
  .ticks { display:flex; justify-content:space-between; font-size:12px; opacity:.75; margin-top:-6px; }
  .readout { font-size:18px; line-height:1.35; }
  .readout .big { font-family:var(--toon); font-size:30px; }
  .statebadge { display:inline-block; padding:4px 12px 0; border:3px solid var(--ink); border-radius:12px; font-family:var(--toon); font-size:22px; }

  /* detective */
  .tests { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .tbtn { min-height:64px; border:3px solid var(--ink); border-radius:14px; background:#fff; box-shadow:0 4px 0 var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; padding:2px; }
  .tbtn svg { width:30px; height:30px; }
  .tbtn.used { background:#e9e2cf; }
  .tbtn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .samples { display:flex; gap:6px; flex-wrap:wrap; }
  .samp { min-height:60px; padding:4px 10px; border:3px solid var(--ink); border-radius:14px; background:#fff; box-shadow:0 4px 0 var(--ink); font-size:15px; display:flex; align-items:center; gap:6px; }
  .samp svg { width:30px; height:30px; }
  .samp.on { background:var(--st); color:#fff; }
  .samp.out { opacity:.4; text-decoration:line-through; }
  .tbl { overflow:auto; border:3px solid var(--ink); border-radius:12px; background:#fff; max-height:46vh; }
  .tbl table { border-collapse:collapse; font-size:13px; width:100%; }
  .tbl th, .tbl td { border:1px solid #d8d0bd; padding:4px 5px; text-align:center; white-space:nowrap; }
  .tbl th { background:#f3ecdb; position:sticky; top:0; }
  .tbl td.c { cursor:pointer; color:#b5ab98; min-width:62px; }
  .tbl td.c.f { color:var(--ink); background:#f2fff9; }
  .tbl td.c.f.hi { background:#ffe8a3; }
  .tbl td.c.mine { outline:3px solid var(--accent); outline-offset:-3px; }
  .reslist { font-size:16px; line-height:1.35; margin:0; padding-left:18px; }
  .bottles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .bot { padding:8px; display:flex; flex-direction:column; gap:6px; }
  .bot .chip { min-height:52px; font-size:16px; padding:4px 10px 0; }
  .bot canvas { width:100%; height:170px; }

<script>

const TOON = '"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif';
const BODYF = 'Nunito,system-ui,sans-serif';

/* ---------- save ---------- */
const SAVE_KEY = 'scienceLab.v1';
const save = { stars:{}, unlocked:{ chem:true }, boss:{}, notes:{}, muted:false, seenGag:false };

/* ---------- sound (Web Audio, synthesized) ---------- */

  tap: () => tone(660, 0.06, 'triangle', 0.18),
  blip: () => tone(880, 0.08, 'square', 0.08),
  drop: () => { tone(420, 0.1, 'sine', 0.25, 0, 0.5); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.22, i * 0.09)),
  oops: () => { tone(330, 0.18, 'sawtooth', 0.08, 0, 0.6); },
  pop: () => { tone(240, 0.12, 'square', 0.15, 0, 2.2); noise(0.15, 0.25, 1200); },
  bang: () => { noise(0.5, 0.45, 200); tone(90, 0.4, 'sine', 0.4, 0, 0.4); },
  fizz: () => { noise(1.2, 0.08, 3500); for (let i = 0; i < 8; i++) tone(rand(900, 1800), 0.04, 'sine', 0.05, i * 0.12); },
  whoosh: () => noise(0.35, 0.12, 2000),
  clack: () => { tone(1400, 0.04, 'square', 0.12); noise(0.05, 0.2, 3000); },

/* ---------- Captain Pup ---------- */
// x,y = centre of the head; s = head radius. opts: goggles 0 (on forehead) .. 1 (over eyes), t (seconds), talk, blink, coat
function drawPup(ctx, x, y, s, o = {}) {
  const t = o.t || 0, gog = o.goggles ?? 1, lw = Math.max(2, s * 0.085);

    ell(ctx, x + s * 0.42, by + s * 0.82, s * 0.26, s * 0.17); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#f4fbff';
    ctx.beginPath();

    ctx.beginPath(); ctx.moveTo(x - s * 0.3, by - s * 0.45); ctx.lineTo(x, by + s * 0.15); ctx.lineTo(x + s * 0.3, by - s * 0.45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, by + s * 0.15); ctx.lineTo(x, by + s * 0.78); ctx.stroke();
    ctx.fillStyle = INK; for (const k of [0.32, 0.55]) { ell(ctx, x + s * 0.09, by + s * k, s * 0.035, s * 0.035); ctx.fill(); }
    ctx.lineWidth = lw * 0.7;
    ctx.fillStyle = C.accent; rr(ctx, x - s * 0.5, by - s * 0.02, s * 0.06, s * 0.22, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.blue; rr(ctx, x - s * 0.4, by - s * 0.06, s * 0.06, s * 0.26, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f4fbff'; rr(ctx, x - s * 0.6, by + s * 0.12, s * 0.32, s * 0.22, 4); ctx.fill(); ctx.stroke();
    ctx.lineWidth = lw;

      ctx.fillStyle = '#fff'; ell(ctx, 0, s * 0.68, s * 0.16, s * 0.14); ctx.fill(); ctx.stroke();

        ctx.beginPath(); ctx.moveTo(-s * 0.06, -s * 0.3); ctx.lineTo(-s * 0.06, -s * 0.1); ctx.lineTo(-s * 0.24, s * 0.2); ctx.lineTo(s * 0.24, s * 0.2); ctx.lineTo(s * 0.06, -s * 0.1); ctx.lineTo(s * 0.06, -s * 0.3); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.8)'; ell(ctx, -s * 0.05, s * 0.02 + Math.sin(t * 5) * s * 0.04, s * 0.04, s * 0.04); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.55)'; ell(ctx, x - s * 0.04, ny - s * 0.03, s * 0.04, s * 0.022); ctx.fill();
  const talk = o.talk ? Math.abs(Math.sin(t * 14)) : 0.4;
  ctx.fillStyle = '#5a1f2b';
  ctx.beginPath(); ctx.moveTo(x - s * 0.24, ny + s * 0.14); ctx.quadraticCurveTo(x, ny + s * (0.32 + talk * 0.22), x + s * 0.24, ny + s * 0.14);

    ctx.fillStyle = 'rgba(255,255,255,.85)'; ell(ctx, x + sd * s * 0.4 - s * 0.12, gy - s * 0.1, s * 0.07, s * 0.04, -0.6); ctx.fill();
  }

// a little animated pup on a canvas element
function pupCanvas(cv, cfg) {
  const st = { goggles: 0, gTarget: 1, talkUntil: 0, wave: false, flask: true, flaskColor: C.green, scale: cfg.scale || 0.3, cy: cfg.cy || 0.32 };
  function frame(now) {

/* ---------- feedback: comic burst + toast ---------- */
function burst(word = 'WOW!', color = C.yellow) {
  const pts = []; const n = 14;

  el.append(svg(`<polygon points="${pts.join(' ')}" fill="${color}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`, '-20 -10 140 120'));

function makeCanvas(wrap, draw, opts = {}) {
  const cv = h('canvas'); wrap.append(cv);
  const ctx = cv.getContext('2d'); let alive = true, last = performance.now(), W = 0, H = 0;
  const api = { cv, ctx, get w() { return W; }, get h() { return H; }, stop() { alive = false; } };
  function loop(now) {
    if (!alive) return;
    if (!cv.isConnected) { alive = false; return; }
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    if (W && H) {
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const dt = Math.min(0.05, (now - last) / 1000);
      draw(ctx, W, H, dt, now / 1000);
    }
    last = now; requestAnimationFrame(loop);

}

<script>

const TTS = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
function plain(html) {

  return d.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, '').replace(/₂/g, ' 2').replace(/\s+/g, ' ').trim();
}
function speak(html) {
  if (!TTS) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(html)); u.rate = 0.95; u.pitch = 1.15; u.lang = 'en-US'; speechSynthesis.speak(u); } catch (_) {}

  wrap.append(b, body); return wrap;
}
function confetti(n = 60) {
  const cols = [C.accent, C.yellow, C.green, C.blue, C.purple, C.orange];
  for (let i = 0; i < n; i++) {
    const p = h('i', { class: 'conf', style: { left: rand(0, 100) + 'vw', background: cols[i % cols.length], width: rand(8, 16) + 'px', height: rand(10, 20) + 'px',
      animationDuration: rand(1.4, 2.6) + 's', animationDelay: rand(0, 0.4) + 's', '--r': rand(-720, 720) + 'deg', '--x': rand(-120, 120) + 'px' } });

function wiggle(el) { if (!el) return; el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig'); }
// pointing-hand demo: moves from one element/point to another, with a "tap" at the end
let handEl = null, handAnim = null;
function centerOf(t) { if (!t) return null; if (t.getBoundingClientRect) { const r = t.getBoundingClientRect(); if (!r.width) return null; return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; } return t; }
function demoHand(steps, loops = 2) {
  stopHand();

  const kf = [], pts = steps.map(s => ({ a: centerOf(s.from || s.at), b: centerOf(s.to || s.at) }));
  if (pts.some(p => !p.a || !p.b)) { stopHand(); return; }

    kf.push({ offset: o + per * 0.7, transform: `translate(${p.b.x}px,${p.b.y}px) scale(.85)`, opacity: 1 });
    kf.push({ offset: o + per * 0.85, transform: `translate(${p.b.x}px,${p.b.y}px) scale(1.1)`, opacity: 1 });
    kf.push({ offset: Math.min(1, o + per * 0.99), transform: `translate(${p.b.x}px,${p.b.y}px) scale(1)`, opacity: 0 });
  });

}

const HAND_SVG = `<svg viewBox="0 0 64 64"><path d="M22 30V10a5 5 0 0 1 10 0v16l2-1a5 5 0 0 1 8 2l1-.5a5 5 0 0 1 7 3l1-.3a5 5 0 0 1 6 4V46c0 9-7 16-16 16h-6c-6 0-10-3-13-8L12 41a5 5 0 0 1 8-6z" fill="#fff" stroke="#1d1b26" stroke-width="4" stroke-linejoin="round"/><path d="M32 26v8M42 28v6M51 32v5" stroke="#1d1b26" stroke-width="3" stroke-linecap="round"/></svg>`;
</script>
<script>
'use strict';
/* ============================================================
   Mission engine: 5-step loop with tracker, clock and Next button
   ============================================================ */
const PHASES = [

  { id: 'discover', label: 'Discover', n: '2', time: 60 },
  { id: 'experiment', label: 'Experiment', n: '3', time: 120 },
  { id: 'boss', label: 'Boss', n: '4', time: 90 },
  { id: 'check', label: 'Check', n: '✔', time: 0 },

let M = null;          // current mission run
const pupS = pupCanvas($('#pupSmall'), { scale: 0.34, cy: 0.4, body: false });
pupS.flask = false;
const pupB = pupCanvas($('#pupBig'), { scale: 0.27, cy: 0.3 });
pupB.gTarget = 0; pupB.wave = true;

let lastSay = '';
$('#sayTTS').onclick = () => { sfx.tap(); speak(lastSay); };
function say(text, ms, quiet) {
  $('#say').innerHTML = text; lastSay = text;
  if (!quiet) speak(text);
  pupS.talkUntil = performance.now() + (ms || Math.min(2600, 600 + text.length * 25));
}
const ctlBase = {

  },
  cleanup(fn) { M.cleanups.push(fn); },
  win(word) { burst(word || 'YES!', C.yellow); sfx.win(); confetti(40); },
  oops(word) { burst(word || 'OOPS!', '#ff8fa3'); sfx.oops(); wiggle($('#stage').firstElementChild); },
  hand: (steps, loops) => setTimeout(() => demoHand(steps, loops), 600),
};

function startMission(stId) {
  const st = STATIONS.find(s => s.id === stId);
  M = { st, phase: -1, cleanups: [], bossWon: false, quizRight: 0, quizN: 0, timer: 0, left: 0, timesUp: false, data: {} };
  document.documentElement.style.setProperty('--st', st.color);
  $('#title').hidden = true; $('#mission').hidden = false;
  $('#mTitle').textContent = st.name;
  const steps = $('#steps'); steps.innerHTML = '';
  PHASES.forEach((p, i) => steps.append(h('span', { class: 'stp', 'data-i': i }, p.n + ' ', h('span', { class: 'lbl' }, p.label))));
  // safety goggles gag: Pup starts with goggles up on his forehead
  if (!M.st.gogglesDone) {
    pupS.gTarget = 0; pupS.goggles = 0;
    gotoPhase(0, true);
    say('🥽 WAIT! Safety first! Tap me for goggles!'); setTimeout(() => demoHand([{ at: $('#pupSmall') }], 3), 400);

  setTimeout(() => { if (M && M.phase === 0) M.st.phases.challenge.start(M.stage, ctl()); }, 400);

}
$('#pupSmall').addEventListener('click', () => {
  if (gogglesOn()) return;

  pupS.gTarget = 0; sfx.tap(); say(['Goggles stay ON! Eyes are precious.', 'Peek-a-boo! Goggles back on.', 'Safety first, science second!'][Math.floor(Math.random() * 3)]);
  setTimeout(() => { pupS.gTarget = 1; }, 900);

function ctl() { return Object.assign(Object.create(ctlBase), { data: M.data, st: M.st }); }

function clearStage() {

function gotoPhase(i, holdStart) {

/* ---------- Discover cards ---------- */
function runDiscover(cards, c) {

  c.setNext('Skip ▶', true, 'alt');

/* ---------- Quiz: picture tiles ---------- */

function runQuiz(qs, c) {

        b.classList.add('right'); opts.querySelectorAll('.qtile').forEach(x => { if (x !== b) x.classList.add('dim'); });

    box.className = 'res panel';
    let s = ''; for (let i = 0; i < 3; i++) s += `<span class="${i < stars ? 'star-on' : 'star-off'}" style="animation-delay:${i * .25}s">★</span>`;
    const nx = STATIONS[STATIONS.indexOf(st) + 1];
    box.append(h('h2', null, stars === 3 ? 'Super Scientist!' : stars === 2 ? 'Great work!' : 'Mission done!'),

  }

    const endX = x0 + BOSS_FLOOR * sc;
    ctx.fillStyle = '#4cc9f0'; ctx.fillRect(endX, gy + 14, w - endX, hh - gy); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(endX, gy + 14, w - endX + 4, hh);
    ctx.fillStyle = '#ffe8a3'; ctx.fillRect(0, gy, endX, hh - gy); ctx.strokeRect(-4, gy, endX + 4, hh);
    // green target zone
    if (B.round < 3) { const tx = x0 + targets[B.round] * sc; ctx.fillStyle = 'rgba(6,214,160,.45)'; ctx.fillRect(tx - 0.3 * sc, gy - 70, 0.6 * sc, 70); ctx.strokeStyle = '#059669'; ctx.setLineDash([6, 5]); ctx.strokeRect(tx - 0.3 * sc, gy - 70, 0.6 * sc, 70); ctx.setLineDash([]); }
    // metre marks
    ctx.fillStyle = INK; ctx.font = `13px ${BODYF}`; ctx.textAlign = 'center';
    for (let m = 0; m <= BOSS_FLOOR; m++) { ctx.fillRect(x0 + m * sc - 1, gy, 2, 10); ctx.fillText(m + ' m', x0 + m * sc, gy + 28); }

    ctx.fillStyle = '#c3b6f0'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(10, gy - rampH); ctx.lineTo(rampW, gy); ctx.lineTo(10, gy); ctx.closePath(); ctx.fill(); ctx.stroke();

    const R = B.run;
    let bx, by, cx = x0;
    if (R) {
      R.t += dt;
      const rampT = Math.sqrt(2 * Math.hypot(rampW - 10, rampH) / (Math.max(1, rampH) * 2)) * 0.9 + 0.15;  // visual roll-down time

        const i = Math.min(R.sim.path.length - 1, Math.floor((R.t - rampT) / 0.02));

    } else { bx = 20 + br * 0.3; by = gy - rampH - br; }
    crateDraw(ctx, cx + 0.4 * sc * 0, R && R.sim.off && R.done ? gy + 40 : gy, Math.min(56, 0.5 * sc + 10));

  });
  c.cleanup(() => cv.stop());
  function finish(R) {
    R.done = true;
    const d = R.sim.d, tgt = targets[B.round];
    if (R.sim.off) { burst('SPLASH!', C.blue); sfx.oops(); wiggle(wrap); c.say('SPLASH! Too much momentum. Lighter or lower!'); }
    else if (Math.abs(d - tgt) <= 0.3) {
      B.round++; showTask();
      if (B.round >= 3) { c.win('CHAMPION!'); bossWon(); c.say('Champion! Heavier or faster = bigger push!'); }
      else { burst('PARKED!', C.green); sfx.win(); c.say('Parked! The green zone moved...'); }
    } else {
      B.tries++;
      c.say(d < tgt ? '⬆ Not far enough! More momentum!' : '⬇ Too far! Less momentum!'); wiggle(wrap);
      sfx.oops();
    }
  }
  return B;
}

<script>
'use strict';
/* ============================================================
   STATION 3 — STATES OF MATTER: temperature + pressure
   ============================================================ */
note('states', 'solid', 'Solid: particles vibrate in place', 'In a solid like ice, particles are locked in a pattern. They wiggle but don\'t move around.');
note('states', 'liquid', 'Liquid: particles slide past each other', 'In a liquid, particles stay close but can slide around, so liquids flow and take the shape of their cup.');
note('states', 'gas', 'Gas: particles zoom everywhere', 'In a gas, particles are far apart and fly fast in every direction, filling the whole container.');
note('states', 'temps', 'Water: melts at 0°C, boils at 100°C', 'At sea level, ice melts at 0°C and water boils at 100°C.');
note('states', 'plateau', 'Temperature pauses during a change', 'While ice is melting (or water is boiling), the heat goes into changing the state, so the temperature stays put until it\'s done.');
note('states', 'mountain', 'Low pressure: boils cooler', 'High on a mountain, the air pressure is lower, so water boils below 100°C. On top of Mount Everest it boils at only about 70°C!');
note('states', 'cooker', 'High pressure: boils hotter', 'A pressure cooker squeezes the steam so water boils at about 120°C. Hotter water cooks food faster.');

// boiling point of water vs pressure (atm), Clausius–Clapeyron with L = 40.7 kJ/mol
function boilAt(P) { return 1 / (1 / 373.15 - 8.314 / 40660 * Math.log(P)) - 273.15; }
const MELT = 0;
const LAT_MELT = 26, LAT_BOIL = 55;     // game "energy" needed to melt / boil all of it (in °C-equivalents)

function matterSim(parent, c, cfg = {}) {
  const S = { setT: cfg.T ?? -20, P: cfg.P ?? 1, T: cfg.T0 ?? cfg.T ?? -20, melt: 0, boil: 0, lockP: !!cfg.lockP, ev: {}, hist: [] };
  // melt = fraction liquid-or-gas (0..1); boil = fraction gas (0..1)
  if (S.T > 0) S.melt = 1;
  if (S.T > boilAt(S.P)) { S.boil = 1; S.melt = 1; }
  const lay = h('div', { class: 'ph' }); parent.append(lay);
  const main = h('div', { class: 'main' }), side = h('div', { class: 'side' }); lay.append(main, side);
  if (cfg.taskEl) side.append(cfg.taskEl);
  const wrap = h('div', { class: 'cvwrap panel' }); main.append(wrap);
  // controls
  const tBox = h('div', { class: 'box panel' }, h('h4', null, '❄ ⟵ 🌡 ⟶ 🔥'));
  const tR = h('input', { type: 'range', class: 'rng', min: -40, max: 140, step: 1, value: S.setT, 'aria-label': 'Heater temperature', style: { '--trk': 'linear-gradient(90deg,#4cc9f0,#e9e2cf 22%,#ffb4a2 78%,#ff4d6d)' } });
  const tL = h('div', { class: 'ticks' }, h('span', null, '-40°C'), h('span', null, '0°C'), h('span', null, '50°C'), h('span', null, '100°C'), h('span', null, '140°C'));
  tBox.append(tR, tL);
  const pBox = h('div', { class: 'box panel' }, h('h4', null, '⬇ Squeeze (pressure)'));
  const pR = h('input', { type: 'range', class: 'rng', min: 0.3, max: 2, step: 0.05, value: S.P, 'aria-label': 'Pressure', style: { '--trk': 'linear-gradient(90deg,#c7f9e5,#e9e2cf 40%,#9b5de5)' } });
  const pL = h('div', { class: 'ticks' }, h('span', null, '⛰ low'), h('span', null, '🏖 normal'), h('span', null, 'high 🍲'));
  pBox.append(pR, pL);
  const pres = h('div', { class: 'chiprow' });
  for (const [lbl, p] of [['⛰ Mountain', 0.33], ['🏖 Beach', 1], ['🍲 Cooker', 2]]) pres.append(h('button', { class: 'chip', style: { fontSize: '15px' }, onclick: () => { if (S.lockP) return toast('🔒 Locked here!'); pR.value = p; S.P = p; sfx.whoosh(); } }, lbl));
  pBox.append(pres);
  if (S.lockP) { pR.disabled = true; pBox.append(h('div', { class: 'lbl-sm' }, '🔒 locked')); }
  const read = h('div', { class: 'box panel readout' }); side.append(tBox, pBox, read);
  tR.addEventListener('input', () => { S.setT = +tR.value; });
  pR.addEventListener('input', () => { S.P = +pR.value; });
  let lastBub = 0;
  S.setTemp = v => { tR.value = v; S.setT = v; }; S.setP = v => { pR.value = v; S.P = v; };

  // particles
  const NP = 64; const parts = [];
  for (let i = 0; i < NP; i++) parts.push({ x: Math.random(), y: Math.random(), vx: 0, vy: 0, ph: 'solid', i });
  const cv = makeCanvas(wrap, (ctx, w, hh, dt, t) => {
    // --- thermodynamics (game-scale) ---
    const Tb = boilAt(S.P);
    let rate = clamp((S.setT - S.T) * 1.0, -35, 35) * dt;   // heat flow
    const step = () => {
      if (rate > 0) {
        if (S.T < MELT && S.melt < 1) { const d = Math.min(rate, MELT - S.T); S.T += d; rate -= d; }
        if (S.T >= MELT - 1e-6 && S.melt < 1 && rate > 0) { const d = Math.min(rate, (1 - S.melt) * LAT_MELT); S.melt += d / LAT_MELT; rate -= d; }
        if (S.melt >= 1 && S.T < Tb && rate > 0) { const d = Math.min(rate, Tb - S.T); S.T += d; rate -= d; }
        if (S.melt >= 1 && S.T >= Tb - 1e-6 && S.boil < 1 && rate > 0) { const d = Math.min(rate, (1 - S.boil) * LAT_BOIL); S.boil += d / LAT_BOIL; rate -= d; }
        if (S.boil >= 1 && rate > 0) { S.T += rate; rate = 0; }
      } else if (rate < 0) {
        let q = -rate;
        if (S.boil > 0 && S.T > Tb) { const d = Math.min(q, S.T - Tb); S.T -= d; q -= d; }
        if (S.boil > 0 && q > 0) { const d = Math.min(q, S.boil * LAT_BOIL); S.boil -= d / LAT_BOIL; q -= d; }
        if (S.boil <= 0 && S.melt > 0 && S.T > MELT && q > 0) { const d = Math.min(q, S.T - MELT); S.T -= d; q -= d; }
        if (S.boil <= 0 && S.melt > 0 && q > 0) { const d = Math.min(q, S.melt * LAT_MELT); S.melt -= d / LAT_MELT; q -= d; }
        if (S.melt <= 0 && q > 0) { S.T -= q; q = 0; }
      }
    };
    step();
    // pressure change can make liquid boil (Tb drops below T) or condense (Tb rises above T)
    if (S.melt >= 1 && S.boil < 1 && S.T > Tb + 0.5) { S.T -= 0.5; S.boil = Math.min(1, S.boil + 0.5 / LAT_BOIL); }
    if (S.boil > 0 && S.boil < 1 && S.T < Tb - 0.5) { S.T += 0.5; S.boil = Math.max(0, S.boil - 0.5 / LAT_BOIL); }
    S.boil = clamp(S.boil, 0, 1); S.melt = clamp(S.melt, 0, 1);
    const state = S.boil >= 0.999 ? 'gas' : S.boil > 0.001 ? 'boiling' : S.melt >= 0.999 ? 'liquid' : S.melt > 0.001 ? 'melting' : 'solid';
    if (state !== S.state) { S.prev = S.state; S.state = state; onState(state); }
    // --- drawing ---
    gridBg(ctx, w, hh, '#fdf8ee');
    const cw = Math.min(w * 0.62, hh * 0.9), cx0 = (w - cw) / 2 - w * 0.08, base = hh - 46, ch = hh - 110;
    const cx1 = cx0 + cw;
    const pistonY = base - ch + (S.P - 0.3) / 1.7 * ch * 0.45;
    // burner glow
    const heat = clamp(S.setT / 140, -1, 1);
    ctx.fillStyle = heat > 0 ? `rgba(255,${Math.round(160 - heat * 100)},40,${0.25 + heat * 0.5})` : `rgba(76,201,240,${-heat * 0.6})`;
    rr(ctx, cx0 - 10, base + 8, cw + 20, 30, 10); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    if (heat > 0.05) for (let k = 0; k < 7; k++) { const fx = cx0 + cw * (k + 0.5) / 7, fh = 10 + heat * 16 + Math.sin(t * 13 + k) * 4;
      ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(fx - 7, base + 12); ctx.quadraticCurveTo(fx, base + 10 - fh * 2, fx + 7, base + 12); ctx.fill(); }
    // container
    const inL = cx0 + 6, inR = cx1 - 6, inT = pistonY + 16, inB = base - 4, iw = inR - inL, ih = inB - inT;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx0, base - ch, cw, ch);
    // particles
    const tempN = clamp((S.T + 40) / 180, 0.05, 1);
    const nGas = Math.round(S.boil * NP), nLiq = Math.round(S.melt * NP) - nGas;
    const rP = Math.max(4, Math.min(iw / 26, 11));
    const cols = Math.max(4, Math.floor(iw / (rP * 2.25))), latH = rP * 2.15;
    parts.forEach((p, i) => {
      const ph = i < nGas ? 'gas' : i < nGas + nLiq ? 'liquid' : 'solid';

      if (p.x < 0.02) { p.x = 0.02; p.vx = Math.abs(p.vx); } if (p.x > 0.98) { p.x = 0.98; p.vx = -Math.abs(p.vx); }
      if (p.y < 0.03) { p.y = 0.03; p.vy = Math.abs(p.vy); if (p.ph === 'gas' && Math.random() < 0.02) S.knock = 1; }
      if (p.y > floorY) { p.y = floorY; p.vy = -Math.abs(p.vy) * (p.ph === 'gas' ? 1 : 0.2); }
      p.px = inL + p.x * iw; p.py = inT + p.y * ih;
    }
    // liquid: soft repulsion so they pile up
    const liq = parts.filter(p => p.ph === 'liquid');
    for (let a = 0; a < liq.length; a++) for (let b = a + 1; b < liq.length; b++) {
      const A = liq[a], B = liq[b], dx = B.px - A.px, dy = B.py - A.py, d = Math.hypot(dx, dy), md = rP * 2.05;
      if (d < md && d > 0.01) { const push = (md - d) / 2 / d; A.x -= dx * push / iw; A.y -= dy * push / ih; B.x += dx * push / iw; B.y += dy * push / ih; }
    }
    // draw water body under liquid particles

    }

    ctx.fillStyle = '#c0c7d6'; rr(ctx, cx0 + 4, pistonY, cw - 8, 16, 4); ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#8d99ae'; ctx.fillRect(cx0 + cw / 2 - 8, base - ch - 40, 16, pistonY - (base - ch - 40)); ctx.strokeRect(cx0 + cw / 2 - 8, base - ch - 40, 16, pistonY - (base - ch - 40));

      ctx.fillStyle = col; ctx.font = `12px ${BODYF}`; ctx.textAlign = 'left'; ctx.fillText(lbl, thx + 20, y + 4); };

    ctx.font = `${Math.min(30, w / 16)}px ${TOON}`; ctx.fillStyle = { solid: '#0077b6', melting: '#0096c7', liquid: '#0096c7', boiling: '#c9184a', gas: '#7b2cbf' }[state];

/* ---------- detective bench: samples × tests table ---------- */
function detBench(parent, c, opt) {
  const D = { sel: opt.rows[0].key, cells: {}, used: 0 };
  const lay = h('div', { class: 'ph' }); parent.append(lay);
  const main = h('div', { class: 'main' }), side = h('div', { class: 'side' }); lay.append(main, side);
  if (opt.taskEl) side.append(opt.taskEl);
  // sample picker
  const sbox = h('div', { class: 'box panel' }, h('h4', null, '1️⃣ Pick a jar')); const samples = h('div', { class: 'samples' }); sbox.append(samples); side.append(sbox);
  const drawSamples = () => {
    samples.innerHTML = '';
    for (const r of opt.rows) {
      const b = h('button', { class: 'samp' + (D.sel === r.key ? ' on' : '') + (r.out ? ' out' : '') }); b.append(svg(subSVG(r.sub, r.mystery)), r.label);
      b.onclick = () => { D.sel = r.key; sfx.tap(); drawSamples(); }; samples.append(b);
    }
  };
  drawSamples();
  const tbox = h('div', { class: 'box panel' }, h('h4', null, '2️⃣ Test it')); const tgrid = h('div', { class: 'tests' }); tbox.append(tgrid); side.append(tbox);
  const tBtns = {};
  for (const t of opt.tests) { const b = h('button', { class: 'tbtn', 'aria-label': TESTS[t].name }); b.append(svg(TESTS[t].icon), TESTS[t].name); b.onclick = () => run(D.sel, t); tgrid.append(b); tBtns[t] = b; }
  // view + table
  const view = h('div', { class: 'panel', style: { display: 'flex', gap: '10px', alignItems: 'center', padding: '8px', minHeight: '170px' } });
  const art = h('div', { style: { width: '220px', height: '170px', flex: 'none' } }), desc = h('div', { class: 'fact', style: { fontSize: '20px' } }, opt.idle || '👆 Pick a jar ➡ tap a test!');
  view.append(art, desc); main.append(view);
  const tbl = h('div', { class: 'tbl' }); main.append(h('div', { class: 'lbl-sm' }, '📋 Results table (tap a box to test)'), tbl);
  function drawTable() {
    const myst = opt.rows.find(r => r.mystery);
    let html = '<table><tr><th>Sample</th>' + opt.tests.map(t => `<th>${TESTS[t].name}</th>`).join('') + '</tr>';
    for (const r of opt.rows) {
      html += `<tr><th>${r.label}</th>`;
      for (const t of opt.tests) {
        const v = D.cells[r.key + '|' + t];
        let cls = 'c' + (v ? ' f' : '');
        if (v && myst && !r.mystery) { const mv = D.cells[myst.key + '|' + t]; if (mv && mv === v) cls += ' hi'; }
        if (r.mystery) cls += ' mine';
        html += `<td class="${cls}" data-r="${r.key}" data-t="${t}">${v || '·'}</td>`;
      }
      html += '</tr>';
    }
    tbl.innerHTML = html + '</table>';
  }
  tbl.addEventListener('click', e => { const td = e.target.closest('td.c'); if (td) { D.sel = td.dataset.r; drawSamples(); run(td.dataset.r, td.dataset.t); } });
  function run(rk, t) {
    const row = opt.rows.find(r => r.key === rk); const key = rk + '|' + t;
    const [short, long] = result(t, row.sub);
    art.innerHTML = testArt(t, row.sub);
    desc.innerHTML = `<b>${row.label} + ${TESTS[t].name}:</b><br><span style="font-size:24px">${long}</span>`; speak(long);
    const fresh = !D.cells[key];
    D.cells[key] = short;
    if (fresh) { D.used++; if (TESTS[t].note && row.sub !== 'water' && short !== DEFAULTS[t]?.[0]) discover(TESTS[t].note); }
    const big = /!/.test(short);
    big ? (t === 'vinegar' || t === 'yeast' ? sfx.fizz() : sfx.pop()) : sfx.blip();
    drawTable();
    opt.onRun && opt.onRun(row, t, short, fresh);
  }
  drawTable();
  D.run = run; D.redraw = () => { drawTable(); drawSamples(); }; D.side = side; D.main = main;
  D.demo = () => setTimeout(() => demoHand([{ from: samples.firstChild, to: tgrid.children[Math.min(2, tgrid.children.length - 1)] }], 2), 600);
  return D;
}

/* ---------- yeast balloon fair-test ---------- */
function yeastLab(parent, c, onFair) {
  const Y = { A: { yeast: 1, sugar: 1, warm: 1 }, B: { yeast: 1, sugar: 0, warm: 1 }, t: -1, fairCount: 0 };
  const task = taskBox('⚖', 'Fair test: change <b>only ONE thing</b> in bottle B!');
  parent.append(task);
  const row = h('div', { class: 'bottles' }); parent.append(row);
  const cvs = {};
  for (const side of ['A', 'B']) {
    const b = h('div', { class: 'bot panel' }, h('h4', { class: 'toon', style: { margin: 0, fontSize: '22px' } }, 'Bottle ' + side));
    const chips = h('div', { class: 'chiprow' });
    const opts = [['yeast', '🦠 Yeast', 'No yeast'], ['sugar', '🍬 Sugar', 'No sugar'], ['warm', '🔥 Warm', '❄ Cold']];
    for (const [k, on, off] of opts) {
      const ch = h('button', { class: 'chip' }); const upd = () => { ch.textContent = Y[side][k] ? '✔ ' + on : '✘ ' + off; ch.classList.toggle('on', !!Y[side][k]); };
      ch.onclick = () => { Y[side][k] = Y[side][k] ? 0 : 1; Y.t = -1; upd(); sfx.tap(); }; upd(); chips.append(ch);
    }
    b.append(chips);
    const wrap = h('div', { class: 'mini', style: { position: 'relative', height: '180px', border: '3px solid #1d1b26', borderRadius: '14px', overflow: 'hidden' } }); b.append(wrap);
    cvs[side] = makeCanvas(wrap, (ctx, w, hh, dt) => {
      const S = Y[side]; ctx.fillStyle = S.warm ? '#fff1e6' : '#e6f4ff'; ctx.fillRect(0, 0, w, hh);
      const rate = S.yeast && S.sugar ? (S.warm ? 1 : 0.15) : 0;
      const g = Y.t < 0 ? 0 : clamp(Y.t / 6, 0, 1) * rate;
      const cx = w / 2, bb = hh - 10, bw = 56, bh = 70;
      // bottle
      ctx.fillStyle = S.warm ? '#ffd6a5' : '#bde0fe'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx - 12, bb - bh - 26); ctx.lineTo(cx - 12, bb - bh); ctx.lineTo(cx - bw / 2, bb - bh + 14); ctx.lineTo(cx - bw / 2, bb); ctx.lineTo(cx + bw / 2, bb); ctx.lineTo(cx + bw / 2, bb - bh + 14); ctx.lineTo(cx + 12, bb - bh); ctx.lineTo(cx + 12, bb - bh - 26); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (g > 0) for (let k = 0; k < 8 * g; k++) { ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5; ell(ctx, cx - 20 + (k * 13) % 40, bb - 10 - ((Y.t * 30 + k * 17) % (bh - 10)), 3, 3); ctx.fill(); ctx.stroke(); }
      // balloon
      const br = 10 + g * 38;
      ctx.fillStyle = side === 'A' ? '#ff4d6d' : '#9b5de5'; ctx.lineWidth = 4;
      ell(ctx, cx, bb - bh - 26 - br * 0.9, br * 0.85, br); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ell(ctx, cx - br * 0.35, bb - bh - 26 - br * 1.2, br * 0.15, br * 0.25, -0.4); ctx.fill();
      ctx.fillStyle = INK; ctx.font = `13px ${BODYF}`; ctx.textAlign = 'left';
      ctx.fillText(S.warm ? '🌡 warm' : '❄ cold', 6, 18);
    });
    c.cleanup(() => cvs[side].stop());
    row.append(b);
  }
  const msg = h('div', { class: 'box panel bigfact' }, '👆 Set up bottles ➡ ▶ Start');
  const go = h('button', { class: 'btn go', onclick: () => {
    Y.t = 0; sfx.whoosh();
    const diff = ['yeast', 'sugar', 'warm'].filter(k => Y.A[k] !== Y.B[k]);
    const names = { yeast: 'yeast', sugar: 'sugar', warm: 'water temperature' };
    setTimeout(() => {
      if (diff.length === 0) { msg.innerHTML = '🤔 Both the same! Change <b>one</b> thing in B.'; sfx.oops(); wiggle(row); speak(msg.textContent); }
      else if (diff.length > 1) { msg.innerHTML = `❌ Unfair! You changed <b>${diff.length} things</b>. Which one did it?`; c.oops('UNFAIR!'); speak(msg.textContent); }
      else {
        const d = diff[0];
        const big = side => Y[side].yeast && Y[side].sugar ? (Y[side].warm ? 2 : 1) : 0;
        const same = big('A') === big('B');
        msg.innerHTML = '✅ <b>Fair!</b> ' + (same ? 'Same balloons. That change didn\'t matter here.' :
           d === 'sugar' ? 'No sugar, no gas. Yeast eats sugar: it\'s <b>alive</b>!' :
           d === 'yeast' ? 'No yeast, no gas. Living yeast makes bubbles!' :
           'Cold slows the yeast down. Living things like warmth!');
        speak(msg.textContent);
        c.win('FAIR TEST!'); discover('fair'); if (d === 'sugar' || d === 'yeast') discover('yeast'); if (d === 'warm' && !same) discover('cold');
        Y.fairCount++; onFair && onFair(d, same);
      }
    }, 6200);
  } }, '▶ Start (wait 6 s)');
  setTimeout(() => { if (row.isConnected) demoHand([{ at: row.querySelectorAll('.chip')[4] }, { at: go }], 2); }, 700);
  parent.append(h('div', { class: 'ctrls' }, go), msg);
  const tick = setInterval(() => { if (Y.t >= 0) Y.t += 0.1; }, 100); c.cleanup(() => clearInterval(tick));
  Y.go = () => go.click();
  return Y;
}

        const plant = (x, sun, water, big) => {
          ctx.fillStyle = '#c97b3a'; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 24, hh - 50); ctx.lineTo(x + 24, hh - 50); ctx.lineTo(x + 18, hh - 14); ctx.lineTo(x - 18, hh - 14); ctx.closePath(); ctx.fill(); ctx.stroke();
          const ht = big ? 80 : 40; ctx.strokeStyle = '#2d6a4f'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, hh - 50); ctx.lineTo(x, hh - 50 - ht); ctx.stroke();
          ctx.fillStyle = '#06d6a0'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ell(ctx, x - 12, hh - 50 - ht * 0.6, 12, 6, -0.5); ctx.fill(); ctx.stroke(); ell(ctx, x + 12, hh - 50 - ht * 0.8, 12, 6, 0.5); ctx.fill(); ctx.stroke();
          ctx.font = `13px ${BODYF}`; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.fillText((sun ? '☀ sun' : '☁ dark') + ' · ' + (water ? '💧 water' : 'dry'), x, 18);
        };
        plant(w * 0.28, 1, 1, true); plant(w * 0.72, 0, s.u ? 0 : 1, false);
        ctx.font = `${Math.min(20, w / 14)}px ${TOON}`; ctx.fillStyle = s.u ? '#c9184a' : '#059669'; ctx.textAlign = 'center';
        ctx.fillText(s.u ? '❌ UNFAIR: 2 changes!' : '✅ FAIR: only sun changed', w / 2, 42); ctx.font = `13px ${BODYF}`; ctx.fillStyle = INK; ctx.fillText('👆 tap', w / 2, hh - 4);
      } },
    { title: 'Compare', emoji: '📋', tease: 'Match it!', note: 'known',
      fact: 'Test <b>known</b> jars. The mystery acts the <b>same</b> as its match!',
      more: 'Write every result in a table. Then test the mystery and look for the known sample with exactly the same results.',
      mini(ctx, w, hh, dt, t) {
        ctx.fillStyle = '#fdf8ee'; ctx.fillRect(0, 0, w, hh);
        const rows = [['Salt', 'no', 'no'], ['Baking soda', 'FIZZ', 'no'], ['Cornstarch', 'no', 'BLUE'], ['MYSTERY', 'no', 'BLUE']];
        const cw = Math.min(w / 3.4, 130), rh = Math.min(34, hh / 5.6), x0 = (w - cw * 3) / 2, y0 = 14;
        ctx.font = `${Math.min(14, w / 24)}px ${BODYF}`; ctx.textAlign = 'center'; ctx.lineWidth = 2; ctx.strokeStyle = INK;
        ['Sample', 'Vinegar', 'Iodine'].forEach((tx, i) => { ctx.fillStyle = '#f3ecdb'; ctx.fillRect(x0 + i * cw, y0, cw, rh); ctx.strokeRect(x0 + i * cw, y0, cw, rh); ctx.fillStyle = INK; ctx.fillText(tx, x0 + i * cw + cw / 2, y0 + rh * 0.65); });
        const pulse = (Math.sin(t * 4) + 1) / 2;
        rows.forEach((r, j) => r.forEach((tx, i) => {
          const y = y0 + (j + 1) * rh; const match = j === 2 || j === 3;
          ctx.fillStyle = match ? `rgba(255,210,63,${0.4 + pulse * 0.5})` : '#fff'; ctx.fillRect(x0 + i * cw, y, cw, rh); ctx.strokeRect(x0 + i * cw, y, cw, rh);
          ctx.fillStyle = j === 3 ? '#9b5de5' : INK; ctx.fillText(tx, x0 + i * cw + cw / 2, y + rh * 0.65);
        }));
        ctx.font = `${Math.min(18, w / 18)}px ${TOON}`; ctx.fillStyle = '#059669'; ctx.fillText('MATCH: Cornstarch!', w / 2, y0 + rh * 5 + 26);
      } },
    { title: 'Clue tests', emoji: '🔬', tease: 'Which test?', note: 'iodine',
      fact: 'Iodine ➡ starch · Vinegar ➡ soda · 🧲 ➡ iron · pH ➡ acid',
      more: 'Iodine turns blue-black with starch. Vinegar makes baking soda fizz. A magnet grabs iron. A pH strip spots acids (vinegar) and bases (baking soda).',
      tap(s) { s.i = ((s.i || 0) + 1) % 4; s.t0 = performance.now(); },
      mini(ctx, w, hh, dt, t, s) {
        const i = s.i || 0; ctx.fillStyle = '#fdf8ee'; ctx.fillRect(0, 0, w, hh);
        const pair = [['iodine', 'starch'], ['vinegar', 'soda'], ['magnet', 'iron'], ['ph', 'vinegar']][i];
        if (s.key !== i) { s.key = i; s.img = new Image(); s.img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(testArt(pair[0], pair[1]).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" ')); }
        const sz = Math.min(w * 0.7, (hh - 30) * 1.26);
        if (s.img.complete) ctx.drawImage(s.img, (w - sz) / 2, 26, sz, sz / 1.26);
        ctx.fillStyle = INK; ctx.font = `${Math.min(18, w / 18)}px ${TOON}`; ctx.textAlign = 'center';
        ctx.fillText(TESTS[pair[0]].name + ' + ' + SUBS[pair[1]].name + ' → ' + result(pair[0], pair[1])[0] + '  (👆)', w / 2, 20);
      } },
    { title: 'Alive?', emoji: '🦠', tease: 'Tiny life!', note: 'yeast',
      fact: '<b>Yeast</b> is alive! It eats sugar and makes gas bubbles.',
      more: 'Yeast is a tiny fungus bakers use to make bread rise. Give it sugar and warm water and it gives off carbon dioxide.',
      tap(s) { s.sugar = true; s.g = s.g || 0; },
      mini(ctx, w, hh, dt, t, s) {
        ctx.fillStyle = '#fff1e6'; ctx.fillRect(0, 0, w, hh);
        if (s.sugar) s.g = Math.min(1, s.g + dt * 0.25);
        const g = s.g || 0, cx = w / 2, bb = hh - 10;
        ctx.fillStyle = '#ffd6a5'; ctx.strokeStyle = INK; ctx.lineWidth = 4; rr(ctx, cx - 30, bb - 70, 60, 70, 10); ctx.fill(); ctx.stroke();
        ctx.fillRect(cx - 10, bb - 90, 20, 22); ctx.strokeRect(cx - 10, bb - 90, 20, 22);
        const br = 8 + g * 34; ctx.fillStyle = '#ff4d6d'; ell(ctx, cx, bb - 90 - br, br * 0.85, br); ctx.fill(); ctx.stroke();
        for (let k = 0; k < g * 10; k++) { ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5; ell(ctx, cx - 20 + (k * 11) % 40, bb - 8 - ((t * 40 + k * 13) % 56), 3, 3); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = INK; ctx.font = `${Math.min(17, w / 18)}px ${TOON}`; ctx.textAlign = 'center'; ctx.fillText(s.sugar ? 'Yum! Gas fills the 🎈' : '👆 Tap: add sugar!', cx, 22);
      } },
  ],
};

const ALL_SUBS = Object.keys(SUBS);
const ALL_TESTS = Object.keys(TESTS);

STATIONS.push({
  id: 'bio', name: 'Bio Detective', color: C.green,
  short: '🕵 Test jars. Solve the mystery!',
  blurb: 'Design an experiment to figure out an unknown substance.',
  icon: `<svg class="ico" viewBox="0 0 100 100"><circle cx="42" cy="42" r="26" fill="#c7f9e5" stroke="${INK}" stroke-width="7"/><path d="M61 61l26 26" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><text x="42" y="56" text-anchor="middle" font-family='${TOON}' font-size="38" fill="#9b5de5" stroke="${INK}" stroke-width="2" paint-order="stroke">?</text></svg>`,
  phases: {
    challenge: { start(stage, c) {
      const order = ['salt', 'sugar', 'starch'].sort(() => Math.random() - 0.5);
      const rows = order.map((s, i) => ({ key: 'J' + i, sub: s, label: 'Jar ' + 'ABC'[i] }));
      const task = taskBox('🟢', 'Find the <b>cornstarch</b> for slime!');
      const guess = h('div', { class: 'box panel' }, h('h4', null, '3️⃣ Which jar?'));
      const gr = h('div', { class: 'chiprow' }); guess.append(gr);
      c.say('Labels fell off! Which jar is cornstarch?');
      const D = detBench(stage, c, { rows, tests: ['look', 'water', 'iodine', 'heat'], taskEl: task, idle: '🤔 All white! Try a test.' });
      D.demo();
      D.side.append(guess);
      rows.forEach(r => gr.append(h('button', { class: 'chip', onclick: () => {
        if (r.sub === 'starch') { c.win('FOUND IT!'); c.say(D.used ? 'Yes! Your tests cracked it!' : 'Lucky guess! Scientists want proof. Let\'s TEST!'); c.setNext('Next ▶', true, 'go', true); }
        else { c.oops('NOPE!'); c.say('That was ' + SUBS[r.sub].name + '! Try iodine: a starch finder!'); r.out = true; D.redraw(); }
      } }, r.label)));
      M.data.D = D; M.data.rows = rows;
    } },
    discover: bioDiscover,
    experiment: { start(stage, c) {
      const tabs = h('div', { class: 'chiprow', style: { marginBottom: '8px' } }); stage.append(tabs);
      const area = h('div', { style: { height: 'calc(100% - 76px)', minHeight: '420px' } }); stage.append(area);
      const G = M.data.bioG = M.data.bioG || { cells: 0, fair: false };
      const status = h('div', { class: 'lbl-sm', style: { color: '#fff', opacity: 1, fontSize: '16px' } }); stage.insertBefore(status, area);
      const upd = () => { status.textContent = `📋 Tests: ${Math.min(G.cells, 12)}/12 ${G.cells >= 12 ? '✅' : ''} · 🎈 Fair test: ${G.fair ? '✅' : '⬜'}`; if (G.cells >= 12 && G.fair) c.setNext('Next ▶', true, 'go', true); };
      const show = i => {
        area.innerHTML = ''; tabs.querySelectorAll('.chip').forEach((b, k) => b.classList.toggle('on', k === i));
        if (i === 0) {
          c.say('Test the known jars! Fill 12 boxes.');
          const D = detBench(area, c, { idle: '👆 Pick a jar ➡ tap a test!', rows: ALL_SUBS.map(s => ({ key: s, sub: s, label: SUBS[s].name })), tests: ALL_TESTS, onRun: (r, t, sh, fresh) => { if (fresh) { G.cells++; if (G.cells === 4) discover('table'); upd(); } } });
          if (M.data.refCells) { Object.assign(D.cells, M.data.refCells); D.redraw(); }
          M.data.refCells = D.cells; M.data.D = D; D.demo();
        } else {
          c.say('Is yeast alive? Change ONE thing!');
          M.data.Y = yeastLab(area, c, () => { G.fair = true; upd(); });
        }
      };
      [['📋 Known samples', 0], ['🎈 Yeast balloons', 1]].forEach(([l, i]) => tabs.append(h('button', { class: 'chip', onclick: () => { sfx.tap(); show(i); } }, l)));
      c.setNext('Next ▶', true, 'alt'); upd(); show(0);
    } },
    boss: { start(stage, c) {
      const pool = ALL_SUBS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
      const B = { round: 0, tests: [], pool, eff: [] };
      M.data.bossB = B;
      const task = taskBox('🕵', '');
      const effEl = h('div', { class: 'lbl-sm' });
      const guess = h('div', { class: 'box panel' }, h('h4', null, '3️⃣ What is it?'));
      const gr = h('div', { class: 'chiprow' }); guess.append(gr);
      let D = null, wrong = 0;
      function setup() {
        stage.innerHTML = '';
        if (B.round >= 3) return;
        const myst = B.pool[B.round];
        task.set('🕵', `Mystery jar ${B.round + 1}/3: <b>fewest tests</b> = most ⭐!`);
        const rows = [{ key: 'M', sub: myst, label: 'MYSTERY', mystery: true }].concat(ALL_SUBS.map(s => ({ key: s, sub: s, label: SUBS[s].name })));
        D = detBench(stage, c, { rows, tests: ALL_TESTS, taskEl: task, idle: '🟣 Pick a smart test!',
          onRun(row, t, sh, fresh) {
            if (!row.mystery) return;
            // auto-fill the known samples for this test so the kid can compare
            for (const s of ALL_SUBS) D.cells[s + '|' + t] = result(t, s)[0];
            D.redraw();
            const n = B.tests[B.round] = (B.tests[B.round] || 0) + (fresh ? 1 : 0);
            const left = ALL_SUBS.filter(s => Object.keys(D.cells).filter(k => k.startsWith('M|')).every(k => result(k.slice(2), s)[0] === D.cells[k]));
            effEl.textContent = `🧪 ${n} tests · Could be: ${left.map(s => SUBS[s].name).join(', ')}`;
          } });
        // known rows start empty; table highlights matches
        D.sel = 'M'; D.redraw();
        D.side.insertBefore(effEl, D.side.children[1]); effEl.textContent = '🧪 0 tests';
        D.main.insertBefore(guess, D.main.children[1]);
        gr.innerHTML = ''; wrong = 0; B.tests[B.round] = 0;
        ALL_SUBS.forEach(s => gr.append(h('button', { class: 'chip', style: { fontSize: '15px' }, onclick: e => {
          if (s === myst) {
            const n = B.tests[B.round] + wrong; const st = n <= 2 ? 3 : n <= 3 ? 2 : 1; B.eff.push(st);
            burst(['', 'SOLVED!', 'NICE!', 'GENIUS!'][st], C.green); sfx.win();
            c.say(`${SUBS[s].name}! ${n} test${n === 1 ? '' : 's'} ➡ ${'★'.repeat(st)}${'☆'.repeat(3 - st)}`); confetti(30);
            B.round++;
            if (B.round >= 3) end(); else setTimeout(setup, 1200);
          } else { wrong++; e.target.classList.add('dim'); e.target.disabled = true; c.oops('NOT IT!'); c.say('Not ' + SUBS[s].name + '! Try again.'); wiggle(e.target); }
        } }, SUBS[s].name)));
      }
      function end() {
        const tot = B.eff.reduce((a, b) => a + b, 0);
        stage.innerHTML = '';
        const ok = tot >= 6;
        const box = h('div', { class: 'res panel' }, h('h2', null, ok ? 'Case closed!' : 'Solved... slowly!'),
          h('div', { class: 'bigstars', html: B.eff.map(e => starStr(e)).join('<br>'), style: { fontSize: '40px' } }),
          h('p', { class: 'bigfact' }, `⭐ ${tot} / 9 ` + (ok ? '— smart tests!' : '— need 6 to win. Tip: try pH or Dissolve first!')),
          ok ? null : h('button', { class: 'btn go', onclick: () => { sfx.tap(); B.round = 0; B.eff = []; B.tests = []; B.pool = ALL_SUBS.slice().sort(() => Math.random() - 0.5).slice(0, 3); setup(); } }, '↺ New mystery jars'));
        stage.append(box);
        if (ok) { c.win('DETECTIVE!'); bossWon(); c.say('Case closed! You\'re a science detective!'); }
      }
      c.say('Boss: 3 mystery jars! Fewer tests = more stars.');
      c.setNext('Next ▶', true, 'alt');
      setup();
    } },
    check: [
      { q: 'Does warmth help yeast? Which test is FAIR?', a: [['🔥🦠 ❄🦠', 'Only temp differs'], ['🔥🍬 ❄', 'Temp AND sugar differ'], ['🔥', 'Just one bottle']],
        why: 'Fair test: change only ONE thing. Keep the rest the same.' },
      { q: 'Iodine turns a powder blue-black. What is in it?', a: [['🌽', 'Starch'], ['🧂', 'Salt'], ['🔩', 'Iron']],
        why: 'Iodine is a starch finder: brown ➡ blue-black!' },
      { q: 'A white powder FIZZES with vinegar. What is it?', a: [['🧁', 'Baking soda'], ['🍬', 'Sugar'], ['🏖', 'Sand']],
        why: 'Baking soda + vinegar make carbon dioxide bubbles!' },
    ],
  },
});
</script>
<script>
'use strict';
/* ============================================================
   Title screen + boot
   ============================================================ */
const TITLE_LINES = [
  'Hi! I\'m Captain Pup. Pick a lab station!',
  'You are made of atoms. So am I! Woof!',
  'Scientists ask, test, and write it down!',
  'Lab rule #1: safety goggles ON! 🥽',
  'One drop of water has about a billion trillion molecules!',
];
let titleI = 0;
$('#pupBig').addEventListener('click', () => {
  titleI = (titleI + 1) % TITLE_LINES.length; $('#bigSay').textContent = TITLE_LINES[titleI]; speak(TITLE_LINES[titleI]);
  pupB.talkUntil = performance.now() + 1800; sfx.tap();
  pupB.gTarget = pupB.gTarget > 0.5 ? 0 : 1;
});
function renderTitle() {
  const box = $('#stations'); box.innerHTML = '';
  let tot = 0;
  STATIONS.forEach((st, i) => {
    const stars = save.stars[st.id] || 0; tot += stars;
    const open = true;   // every lab open from the start
    const el = h('div', { class: 'station panel' + (open ? '' : ' locked'), style: { '--c': st.color } });
    el.innerHTML = st.icon;
    el.append(h('h3', null, (i + 1) + '. ' + st.name), h('p', null, st.short), h('div', { class: 'stars', html: starStr(stars) }));
    const row = h('div', { class: 'row' });
    if (open) row.append(h('button', { class: 'btn ' + (stars ? 'alt' : 'go'), onclick: e => { e.stopPropagation(); sfx.tap(); startMission(st.id); } }, stars ? '↺ Play again' : '▶ Start'));
    else { el.append(h('div', { class: 'lock', html: ICON.lock })); row.append(h('button', { class: 'btn muted', onclick: e => { e.stopPropagation(); sfx.oops(); toast('👾 Beat the ' + STATIONS[i - 1].name + ' boss first!'); } }, '🔒')); }
    el.append(row);
    el.addEventListener('click', () => { if (open) { sfx.tap(); startMission(st.id); } else toast('👾 Beat the ' + STATIONS[i - 1].name + ' boss first!'); });
    box.append(el);
  });
  $('#totStars').textContent = tot;
}
setMuteIcons(); renderTitle();
$('#bigTTS').onclick = () => { sfx.tap(); speak($('#bigSay').textContent); };
if (!Object.keys(save.stars).length) setTimeout(() => { if (!$('#title').hidden) demoHand([{ at: document.querySelector('.station .btn.go') }], 3); }, 900);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#nb').hidden) $('#nb').hidden = true; else if (!$('#modal').hidden) $('#modal').hidden = true; else if (M) leaveMission(); }
  if ((e.key === 'Enter' || e.key === 'ArrowRight') && M && !$('#next').hidden && !$('#next').disabled && document.activeElement === document.body) $('#next').click();
});

/* ---------- test hook ---------- */
window.__game = {
  save, STATIONS, get M() { return M; }, startMission, gotoPhase: i => gotoPhase(i), leaveMission, bossWon, gogglesOn,
  rampSolves: (i) => rampSolves(RAMP_LEVELS[i], RAMP_LEVELS[i].sol.map(p => ({ cx: p[0], cy: p[1], len: p[2], ang: p[3] }))),
  rampSim, RAMP_LEVELS, crateSim, BOSS_ROUNDS, boilAt, unlockAll() { STATIONS.forEach(s => save.unlocked[s.id] = true); renderTitle(); },
  reset() { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} location.reload(); },
};
</script>
