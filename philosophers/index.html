<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Big Thinkers: Battle of Big Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  body { background:radial-gradient(circle at 20% 10%, #3d3b6b 0, transparent 40%), radial-gradient(circle at 85% 80%, #3a2f5c 0, transparent 45%), #2b2a4a; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .screen[hidden], [hidden] { display:none !important; }
  .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 40px; }
  .wrap { width:100%; max-width:1100px; margin:0 auto; }

  .btn { font-family:var(--toon); font-weight:400; font-size:24px; letter-spacing:1px; background:var(--accent); color:#fff;
    border:3px solid var(--ink); border-radius:999px; box-shadow:0 6px 0 var(--ink); padding:14px 26px 9px; min-height:60px;
    -webkit-text-stroke:1px var(--ink); paint-order:stroke; text-decoration:none; display:inline-flex; align-items:center;
    justify-content:center; gap:8px; margin:6px 4px; line-height:1; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.go { background:var(--green); } .btn.blue { background:var(--blue); } .btn.purple { background:var(--purple); }
  .btn.alt { background:#fff; color:var(--ink); -webkit-text-stroke:0; }
  .btn.sm { font-size:18px; padding:10px 16px 6px; }
  .btn.glow { animation:glow 1s infinite; }
  @keyframes glow { 50% { box-shadow:0 6px 0 var(--ink), 0 0 0 9px rgba(255,210,63,.75); } }
  .iconbtn { width:60px; height:60px; border-radius:50%; font-size:26px; background:#fff; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); flex:none; padding:0; }
  .iconbtn:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .corner { position:fixed; z-index:30; display:flex; gap:10px; }
  .corner.tl { top:12px; left:12px; } .corner.tr { top:12px; right:12px; }

  /* ---------- title ---------- */
  #title { align-items:center; justify-content:center; }
  #titleCv { position:absolute; inset:0; width:100%; height:100%; }
  .logo { position:relative; text-align:center; pointer-events:none; margin-top:-22vh; padding:18px 30px; border-radius:40px; background:radial-gradient(ellipse at center, rgba(29,27,38,.6) 0, rgba(29,27,38,.35) 55%, transparent 75%); }
  h1.big { font-family:var(--toon); font-weight:400; color:var(--yellow); -webkit-text-stroke:3px var(--ink); paint-order:stroke;
    text-shadow:6px 6px 0 var(--ink); font-size:clamp(50px,10vw,128px); margin:0; line-height:.92; transform:rotate(-3deg); letter-spacing:2px; }
  h2.sub { font-family:var(--toon); font-weight:400; color:var(--accent); -webkit-text-stroke:2px var(--ink); paint-order:stroke;
    text-shadow:4px 4px 0 var(--ink); font-size:clamp(28px,4.6vw,56px); margin:8px 0 0; letter-spacing:1px; transform:rotate(-2deg); }
  #bStart { white-space:nowrap; position:absolute; bottom:9vh; left:50%; transform:translateX(-50%); font-size:clamp(30px,4.5vw,52px); padding:20px 46px 14px;
    animation:startPulse 1.1s infinite; }
  @keyframes startPulse { 0%,100% { transform:translateX(-50%) scale(1); } 50% { transform:translateX(-50%) scale(1.08); } }
  #bStart:active { transform:translateX(-50%) translateY(4px); }

  /* ---------- game ---------- */
  #game canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #hud { position:absolute; inset:0; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  #hearts { position:absolute; top:12px; left:12px; font-size:28px; padding:6px 12px 4px; letter-spacing:2px; pointer-events:none; }
  #goal { position:absolute; top:12px; left:50%; transform:translateX(-50%); padding:6px 16px 3px; font-family:var(--toon); font-size:22px;
    letter-spacing:1px; white-space:nowrap; pointer-events:none; display:flex; align-items:center; gap:8px; }
  #goal .bar { width:120px; height:14px; border:3px solid var(--ink); border-radius:8px; background:#e9e2cf; overflow:hidden; }
  #goal .bar i { display:block; height:100%; width:0; background:var(--accent); }
  #sneak { position:absolute; top:70px; left:12px; padding:4px 12px 2px; font-family:var(--toon); font-size:18px; background:#c7f9e5; pointer-events:none; }
  #sneak.broken { background:#e7e0cf; text-decoration:line-through; opacity:.7; }
  #say { position:absolute; top:72px; left:50%; transform:translateX(-50%); padding:8px 16px 6px; font-size:21px; white-space:nowrap;
    background:#fff; pointer-events:none; transition:opacity .3s; display:flex; align-items:center; gap:8px; }
  #say.off { opacity:0; }
  #hudR { position:absolute; top:12px; right:12px; display:flex; gap:10px; }
  #weps { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:10px; }
  .wep { position:relative; width:74px; height:74px; border-radius:20px; background:#fff; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink);
    font-size:34px; padding:0; display:flex; align-items:center; justify-content:center; }
  .wep b { position:absolute; right:-8px; bottom:-8px; min-width:30px; height:30px; border-radius:15px; background:var(--yellow);
    border:3px solid var(--ink); font-size:15px; line-height:24px; padding:0 4px; font-family:var(--toon); font-weight:400; }
  .wep.on { background:var(--yellow); transform:translateY(-6px); }
  .wep.empty { opacity:.35; }
  .wep.pop { animation:wpop .5s; }
  @keyframes wpop { 40% { transform:scale(1.35) rotate(-8deg); } }
  #fire { position:absolute; right:22px; bottom:22px; width:118px; height:118px; border-radius:50%; background:var(--accent); color:#fff;
    border:4px solid var(--ink); box-shadow:0 7px 0 var(--ink); font-family:var(--toon); font-size:26px; letter-spacing:1px;
    -webkit-text-stroke:1px var(--ink); paint-order:stroke; touch-action:none; }
  #fire.down { transform:translateY(5px); box-shadow:0 2px 0 var(--ink); background:#ff7790; }
  #fire.peace { background:#9ad1ff; }

  /* overlays */
  .modal { position:fixed; inset:0; display:grid; place-items:center; background:rgba(30,20,60,.55); z-index:40; padding:12px; }
  .sheet { padding:18px 20px 20px; max-width:min(900px,96vw); width:100%; max-height:94vh; overflow:auto; text-align:center; border-radius:26px; box-shadow:6px 6px 0 var(--ink); }
  .line { font-size:24px; display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0; flex-wrap:wrap; }
  .line .spk { flex:none; }
  .ttl { font-family:var(--toon); font-weight:400; font-size:clamp(26px,4vw,40px); letter-spacing:1px; margin:0; color:var(--accent);
    -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); }
  .pic { font-size:clamp(56px,9vw,96px); line-height:1.05; animation:bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(-3deg); } }
  .meetTop { display:grid; grid-template-columns:minmax(120px,210px) 1fr; gap:16px; align-items:center; }
  .meetTop canvas { width:100%; aspect-ratio:1/1.05; border:3px solid var(--ink); border-radius:18px; }
  .chip { display:inline-block; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:5px 12px 2px; font-size:15px; }
  .ana { display:flex; align-items:center; justify-content:center; gap:12px; background:#c7f9e5; border:3px solid var(--ink); border-radius:18px; padding:8px 12px; margin-top:8px; font-size:20px; }
  .ana .em { font-size:46px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:12px; }
  .tile { background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); min-height:150px; padding:10px 8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:19px; line-height:1.15; }
  .tile .em { font-size:60px; line-height:1; animation:bob 2.2s ease-in-out infinite; }
  .tile:nth-child(2) .em { animation-delay:.35s; } .tile:nth-child(3) .em { animation-delay:.7s; }
  .tile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .tile.good { background:#c7f9e5; } .tile.bad { background:#ffe1e6; }
  .tile[disabled] { cursor:default; }
  .why { min-height:34px; font-size:21px; margin-top:12px; }
  .ammoBar { display:flex; justify-content:center; gap:10px; margin:6px 0 4px; }
  .ammoBar span { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:4px 10px 2px; font-size:24px; min-width:70px; }
  .ammoBar b { font-family:var(--toon); font-weight:400; font-size:20px; }
  .qdots { display:flex; justify-content:center; gap:8px; margin:4px 0; font-size:22px; }
  .stars { font-size:56px; color:#f4a100; letter-spacing:6px; -webkit-text-stroke:2px var(--ink); line-height:1; }
  .stars .off { color:#e7e0cf; }
  .bigIdea { background:#fff4c2; border:3px solid var(--ink); border-radius:18px; padding:10px 14px; font-size:22px; margin:10px 0; }
  .spk { flex:none; width:54px; height:54px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink); font-size:22px; padding:0; }
  .spk:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .fly { position:fixed; z-index:80; font-size:44px; pointer-events:none; }
  .helpGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:12px 0; }
  .helpGrid div { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:10px 6px; font-size:17px; }
  .helpGrid .em { font-size:46px; display:block; line-height:1.15; }

  /* map */
  .topbar { display:flex; align-items:center; gap:10px; padding:10px 14px; flex-wrap:wrap; }
  .topbar .grow { flex:1; }
  .topbar .lbl { color:#fff; font-family:var(--toon); font-size:clamp(22px,3vw,32px); letter-spacing:1px; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); }
  .pill { background:#fff; border:3px solid var(--ink); border-radius:999px; padding:7px 14px 4px; font-family:var(--toon); font-size:18px; letter-spacing:1px; }
  .wingRow { margin:0 0 18px; padding:12px 14px; }
  .wingRow h3 { margin:0 0 8px; font-family:var(--toon); font-weight:400; font-size:24px; letter-spacing:1px; }
  .path { display:flex; align-items:center; gap:0; flex-wrap:wrap; row-gap:12px; }
  .node { position:relative; width:104px; text-align:center; background:none; border:0; padding:0; }
  .node canvas { width:88px; height:88px; border-radius:50%; border:4px solid var(--ink); display:block; margin:0 auto; background:#fff; box-shadow:0 5px 0 var(--ink); }
  .node .nm { font-size:14px; margin-top:4px; line-height:1.05; }
  .node .st { color:#f4a100; font-size:16px; -webkit-text-stroke:1px var(--ink); }
  .node.locked canvas { filter:grayscale(1) brightness(.6); }
  .node.boss canvas { border-color:#c1121f; border-width:5px; }
  .node .here { position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:30px; animation:hop .8s infinite; }
  @keyframes hop { 50% { transform:translate(-50%,-8px); } }
  .dash { width:22px; border-top:5px dotted var(--ink); opacity:.5; margin-bottom:34px; }
  .album { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .tcard { border:3px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink); padding:10px; background:#fff; }
  .tcard canvas { width:100%; aspect-ratio:1/0.9; display:block; border:3px solid var(--ink); border-radius:12px; }
  .tcard .nm { font-family:var(--toon); font-size:22px; letter-spacing:1px; margin:6px 0 0; }
  .tcard .meta { font-size:13px; opacity:.75; }
  .tcard .row { display:flex; gap:8px; align-items:center; font-size:15px; margin-top:6px; line-height:1.2; }
  .tcard .row .em { font-size:26px; flex:none; }
  .tcard.locked { background:#d9d2c3; } .tcard.locked canvas { filter:brightness(0) opacity(.35); }
  .book { max-width:900px; margin:0 auto; padding:16px 20px; background:#fff8e1; }
  .lesson { display:grid; grid-template-columns:72px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:3px dashed #d8c99f; }
  .lesson canvas { width:72px; height:72px; border:3px solid var(--ink); border-radius:50%; }
  .lesson h4 { margin:0; font-family:var(--toon); font-weight:400; font-size:20px; letter-spacing:1px; }
  .lesson p { margin:2px 0; font-size:17px; line-height:1.3; }
  .empty { opacity:.5; }

  .pop { position:fixed; left:50%; top:34%; z-index:60; pointer-events:none; transform:translate(-50%,-50%); animation:pop .95s forwards; }
  .pop span { display:block; padding:30px 42px; font-family:var(--toon); font-size:40px; color:#fff; -webkit-text-stroke:2px var(--ink);
    paint-order:stroke; text-shadow:3px 3px 0 var(--ink); background:var(--c,#ffd23f); white-space:nowrap;
    clip-path:polygon(50% 0,61% 22%,85% 8%,78% 34%,100% 42%,80% 58%,94% 82%,66% 76%,54% 100%,42% 78%,16% 92%,22% 66%,0 54%,20% 40%,8% 14%,36% 22%); }
  @keyframes pop { 0% { transform:translate(-50%,-50%) scale(.2) rotate(-20deg); opacity:0; } 25% { transform:translate(-50%,-50%) scale(1.15) rotate(-6deg); opacity:1; }
    75% { transform:translate(-50%,-50%) scale(1) rotate(-4deg); opacity:1; } 100% { transform:translate(-50%,-60%) scale(.9); opacity:0; } }
  .confetti { position:fixed; top:0; z-index:65; pointer-events:none; }
  .demoHand { position:fixed; left:-120px; top:-120px; z-index:70; font-size:54px; pointer-events:none; transition:left .55s ease, top .55s ease; transform:translate(-20%,-10%); filter:drop-shadow(3px 3px 0 #1d1b26); }
  .demoHand.tap { transform:translate(-20%,-10%) scale(.8); }

  @media (max-width:760px) {
    .tiles { grid-template-columns:1fr; gap:9px; }
    .tile { flex-direction:row; min-height:76px; justify-content:flex-start; gap:14px; padding:8px 14px; text-align:left; }
    .tile .em { font-size:42px; }
    .meetTop { grid-template-columns:110px 1fr; gap:10px; }
    .line { font-size:20px; }
    .helpGrid { grid-template-columns:repeat(2,1fr); }
    #goal { font-size:17px; top:84px; } #goal .bar { width:70px; }
    #say { top:130px; font-size:17px; }
    #sneak { top:72px; font-size:15px; }
    .wep { width:60px; height:60px; font-size:28px; border-radius:16px; }
    #weps { gap:7px; left:12px; transform:none; bottom:16px; }
    #fire { width:100px; height:100px; right:12px; bottom:14px; font-size:22px; }
    #hearts { font-size:22px; }
    .node { width:84px; } .node canvas { width:70px; height:70px; } .dash { width:10px; }
    .album { grid-template-columns:1fr 1fr; gap:10px; }
  }
  @media (max-width:430px) { .wep { width:56px; height:56px; font-size:26px; } #weps { flex-direction:column-reverse; gap:8px; left:10px; bottom:14px; } #fire { width:96px; height:96px; } #bStart { font-size:28px; padding:16px 30px 11px; } .logo { margin-top:-30vh; } }
</style>
</head>
<body>

<!-- TITLE -->
<section id="title" class="screen">
  <canvas id="titleCv"></canvas>
  <div class="logo"><h1 class="big">BIG THINKERS</h1><h2 class="sub">Battle of Big Ideas</h2></div>
  <button class="btn go glow" id="bStart">▶ PRESS START</button>
  <div class="corner tl"><a class="btn alt sm" href="../" id="bGames">⬅ Games</a></div>
  <div class="corner tr"><button class="iconbtn mute" aria-label="Sound on or off">🔊</button><button class="iconbtn helpBtn" aria-label="How to play">?</button></div>
</section>

<!-- GAME -->
<section id="game" class="screen" hidden>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hearts" class="panel">❤❤❤❤❤</div>
    <div id="sneak" class="panel" hidden>🕊 SNEAK</div>
    <div id="goal" class="panel"><span id="goalTx">🎯</span><span class="bar" id="goalBar" hidden><i></i></span></div>
    <div id="say" class="panel off"></div>
    <div id="hudR"><button class="iconbtn mute" aria-label="Sound on or off">🔊</button><button class="iconbtn helpBtn" aria-label="How to play">?</button><button class="iconbtn" id="bPause" aria-label="Menu">⏸</button></div>
    <div id="weps"></div>
    <button id="fire" aria-label="Fire">FIRE</button>
  </div>
</section>

<!-- MAP -->
<section id="map" class="screen" hidden>
  <div class="topbar">
    <button class="btn alt sm" data-go="title">⬅</button>
    <span class="lbl grow">🗺 Quest Map</span>
    <span class="pill" id="mapStars">⭐ 0</span>
    <button class="iconbtn" data-go="album" aria-label="Cards">🃏</button>
    <button class="iconbtn" data-go="book" aria-label="Book of Wisdom">📖</button>
    <button class="iconbtn helpBtn" aria-label="How to play">?</button>
  </div>
  <div class="scroll"><div class="wrap" id="mapBody"></div></div>
</section>

<!-- ALBUM -->
<section id="album" class="screen" hidden>
  <div class="topbar"><button class="btn alt sm" data-go="map">⬅</button><span class="lbl grow">🃏 Thinker Cards</span><span class="pill" id="albumCount">0 / 14</span></div>
  <div class="scroll"><div class="wrap album" id="albumBody"></div></div>
</section>

<!-- BOOK -->
<section id="book" class="screen" hidden>
  <div class="topbar"><button class="btn alt sm" data-go="map">⬅</button><span class="lbl grow">📖 Book of Wisdom</span></div>
  <div class="scroll"><div class="book panel" id="bookBody"></div></div>
</section>

<div class="modal" id="ov" hidden><div class="sheet panel" id="ovBody"></div></div>
<script>
'use strict';
/* =====================================================================
   BIG THINKERS: BATTLE OF BIG IDEAS — content
   r codes: 2 = best, 1 = so-so, 0 = oops.  Card kinds: a = argument, e = evidence, q = question
   ===================================================================== */
const WINGS = [
  { id: 'greece', name: 'Ancient Greece', when: 'about 470–322 BCE', ids: ['socrates', 'plato', 'aristotle'] },
  { id: 'china', name: 'Ancient China', when: 'about 500s–400s BCE (traditional dates)', ids: ['confucius', 'laozi', 'suntzu'] },
  { id: 'empires', name: 'Rome, Alexandria & Persia', when: '121–1037 CE', ids: ['marcus', 'hypatia', 'ibnsina'] },
  { id: 'modern', name: 'Renaissance & Enlightenment', when: '1469–1831', ids: ['machiavelli', 'descartes', 'locke', 'wollstonecraft', 'clausewitz'] },
];
const ORDER = WINGS.flatMap(w => w.ids);

const STARTER_POWER = { n: "Pup's Curious Bark", ic: '🐾', line: 'Captain Pup\'s starter move: ask one honest, curious question.' };

const T = {};

T.socrates = {
  name: 'Socrates', era: 'about 470–399 BCE', place: 'Athens, Greece', bg: 'greek', badge: 'SOLDIER',
  famous: 'Asked question after question to test ideas (the Socratic method).',
  analogy: 'A great podcast interviewer, or a coach who keeps asking "why?" until you really understand.',
  quote: '"The unexamined life is not worth living."',
  power: { n: 'Question Storm', ic: '❓', line: 'Keep asking "why?" until a weak idea runs out of answers.' },
  big: 'Asking good questions, even about your OWN ideas, is how you get closer to the truth.',
  today: 'Heard a wild rumor at school? Ask "How do you know? What\'s the evidence?" before you believe it or pass it on.',
  war: 'Socrates showed two kinds of courage: standing firm as a soldier in battle, and standing firm for the truth with his questions.',
  challenge: { say: 'Hello, young pup! A quick question before we duel: what IS courage?', opts: [
    ['Never, ever running away!', 1, 'Hmm! But what if stepping back protects your friends? Is that cowardly? Let\'s keep thinking...'],
    ['Not being scared of anything!', 1, 'Is someone who isn\'t scared of a hot stove brave... or just not careful?'],
    ['I\'m not totally sure. Can we figure it out together?', 2, 'Ha! Now we\'re thinking! Socrates said his wisdom was knowing that he didn\'t know everything.'],
  ] },
  discover: [
    ['❓', 'The Question Game', 'In the busy marketplace of Athens, Socrates asked people questions like "What is justice?" Each answer led to another question, until weak ideas fell apart. This is called the Socratic method.'],
    ['📜', 'He wrote NOTHING!', 'Socrates never wrote a book. We know him mostly through his student Plato, who wrote conversations (dialogues) starring him.'],
    ['🛡', 'Soldier Socrates', 'He fought as a hoplite, an armored foot soldier with a big round shield, in battles like Potidaea and Delium. Friends said he stayed calm and brave, and could march through freezing cold.'],
    ['🎙', 'Today it\'s like...', 'A great podcast interviewer, or a coach who keeps asking "why?" until you REALLY understand the play.'],
  ],
  exp: [{ type: 'scen', title: 'Question the Know-It-All!', npc: '🦚', npcName: 'Know-It-All Peacock', steps: [

let lastTs = 0, titleT = 0;

  const raw = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;

    if (current === 'game' && G) {
      const [c, w, h] = fitCanvas(cv);
      if (G.state === 'play') update(raw);

        update(raw * G.timeScale); G.slow -= raw;
        if (G.slow <= 0) { G.state = 'won'; G.timeScale = 1; G.boss.gone = true; poofFx(G.boss.x, G.boss.y, 4); bossWin(); }
      } else { G.t += raw; for (const q of G.parts) { q.x += q.vx * raw; q.y += q.vy * raw; q.life -= raw; } G.parts = G.parts.filter(q => q.life > 0); }

}

function makeChaser() {

    sp: 255 * Math.min(0.86, (early ? 0.55 : 0.6) + 0.018 * i) * (G.peace ? 0.92 : 1), face: 1, near: 0 };
}
function chaserUpdate(dt) {

  }
