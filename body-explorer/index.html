<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inside the Body: The Great Food Voyage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --night:#3a1d4a;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#ffd6e0; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #top { background:var(--night); border-bottom:3px solid var(--ink); padding:8px 10px 6px; color:#fff;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; }
  #top[hidden] { display:none; }
  #top .ttl { font-family:var(--toon); font-size:24px; letter-spacing:1px; color:var(--yellow); -webkit-text-stroke:1.5px var(--ink);
    paint-order:stroke; text-shadow:2px 2px 0 var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 140px; }
  .tb { min-height:52px; min-width:52px; padding:6px 14px 2px; border-radius:999px; border:3px solid var(--ink); background:#fff;
    box-shadow:0 4px 0 var(--ink); font-family:var(--toon); font-size:20px; color:var(--ink); white-space:nowrap; }
  .tb:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #steps { display:flex; gap:6px; flex:10 1 auto; justify-content:center; flex-wrap:nowrap; order:5; }
  #steps[hidden] { display:none; }
  .step { font-family:var(--toon); font-size:16px; padding:5px 10px 1px; border-radius:999px; background:#5d3b70; color:#d8c6e8;
    border:2px solid var(--ink); white-space:nowrap; }
  .step.cur { background:var(--yellow); color:var(--ink); transform:scale(1.08); }
  .step.done { background:var(--green); color:var(--ink); }
  #timer { font-family:var(--toon); font-size:20px; padding:6px 12px 2px; border-radius:999px; background:#fff; color:var(--ink);
    border:3px solid var(--ink); min-width:76px; text-align:center; }
  #timer[hidden] { display:none; }
  #timer.low { background:#ffd6dc; }
  #goalRow { order:9; flex:1 1 100%; display:flex; align-items:center; gap:10px; background:var(--paper); color:var(--ink);
    border:3px solid var(--ink); border-radius:14px; padding:4px 10px; font-size:19px; line-height:1.25; font-weight:900; }
  #goalRow[hidden] { display:none; }
  #goalTxt { flex:1; }
  #goalTxt .tk { display:inline-block; margin:1px 6px 1px 0; padding:1px 8px; border-radius:10px; background:#efe6d2; }
  #goalTxt .tk.ok { background:#c7f9e5; }
  #goalBar { width:min(28%,220px); height:16px; border:3px solid var(--ink); border-radius:10px; background:#e9e2cf; overflow:hidden; flex:none; }
  #goalBar[hidden] { display:none; }
  #goalBar i { display:block; height:100%; width:0; background:var(--green); transition:width .2s; }

  #stageWrap { position:relative; flex:1; min-height:0; overflow:hidden; }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ctrls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; padding:10px 10px 14px;
    background:var(--night); border-top:3px solid var(--ink); }
  #ctrls:empty { display:none; }
  .ctl { min-height:62px; padding:10px 20px 4px; border-radius:999px; border:3px solid var(--ink); background:#fff;
    box-shadow:0 6px 0 var(--ink); font-family:var(--toon); font-size:22px; letter-spacing:.5px; color:var(--ink); white-space:nowrap; }
  .ctl.down, .ctl:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .ctl.on { background:var(--yellow); }
  .ctl.go { background:var(--green); }
  .ctl.pink { background:#ff8fab; } .ctl.blue { background:#9fe7f5; } .ctl.yel { background:var(--yellow); } .ctl.org { background:#ffc46b; }
  .ctl.pur { background:#cdb4f6; } .ctl.grn { background:#b9f3c4; }
  .ctl.sm { min-height:60px; font-size:18px; padding:8px 14px 3px; }
  .ctl:disabled { opacity:.45; }
  .ctl.pulse { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  .seg { display:flex; gap:6px; align-items:center; background:rgba(255,255,255,.12); padding:4px 8px; border-radius:20px; flex-wrap:wrap; justify-content:center; }
  .seg > b { color:#fff; font-size:15px; margin-right:2px; }
  .sl { display:flex; flex-direction:column; justify-content:center; background:var(--paper); border:3px solid var(--ink); border-radius:16px;
    padding:4px 14px 2px; min-width:200px; min-height:62px; font-size:15px; }
  .sl em { font-style:normal; color:#c9184a; }
  .sl input { width:100%; height:34px; accent-color:var(--accent); margin:0; touch-action:pan-x; }

  .overlay { position:absolute; inset:0; display:grid; place-items:center; background:rgba(40,15,50,.45); z-index:20; padding:12px; }
  .overlay[hidden] { display:none; }
  .card { padding:18px 26px 22px; text-align:center; max-width:min(760px,96vw); max-height:100%; overflow:auto; border-radius:24px;
    box-shadow:6px 6px 0 var(--ink); }
  .kick { display:inline-block; font-family:var(--toon); font-size:16px; letter-spacing:1px; background:var(--ink); color:var(--yellow);
    padding:4px 12px 0; border-radius:999px; }
  h1 { margin:6px 0 0; font-family:var(--toon); font-weight:400; font-size:68px; line-height:.95; color:var(--yellow); -webkit-text-stroke:3px var(--ink);
    paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:1px; }
  h1 span { color:var(--accent); display:block; font-size:.62em; }
  h2 { margin:6px 0 4px; font-family:var(--toon); font-weight:400; font-size:38px; line-height:1.05; color:var(--accent); -webkit-text-stroke:2px var(--ink);
    paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; }
  .card p, .ptext { margin:8px 0; font-size:19px; line-height:1.35; }
  .btn { background:var(--accent); color:#fff; font-family:var(--toon); font-size:26px; min-height:62px; padding:12px 30px 6px; border-radius:999px;
    border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); margin:10px 6px 0; letter-spacing:1px; text-decoration:none; display:inline-block; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn[hidden] { display:none; }
  canvas.art { display:block; width:100%; }
  #bArt { width:min(460px,84vw); height:min(190px,26vh); margin:6px auto 0; }
  #bArt[hidden] { display:none; }
  .bigstars { font-size:60px; color:#f4a100; letter-spacing:6px; line-height:1; -webkit-text-stroke:2px var(--ink); margin:6px 0; }
  .bigstars .off { color:#e7e0cf; }

  /* scrolling panels for Discover / Quiz (allow vertical scrolling) */
  #panel { position:absolute; inset:0; overflow-y:auto; padding:16px 16px 26px; z-index:10; touch-action:pan-y; }
  #panel[hidden] { display:none; }
  .phead { text-align:center; }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:12px auto; max-width:1300px; }
  .dcard { padding:10px 12px 12px; cursor:pointer; text-align:center; transition:transform .15s; position:relative; }
  .dcard:active { transform:scale(.98); }
  .dcard canvas { height:150px; border-radius:12px; background:#ffeef3; border:2px solid var(--ink); }
  .dcard h3 { font-family:var(--toon); font-weight:400; font-size:23px; margin:8px 0 2px; color:#c9184a; letter-spacing:.5px; }
  .dcard .front { font-size:17px; color:#7a6f86; padding:6px; }
  .dcard .back { display:none; font-size:17px; line-height:1.35; text-align:left; }
  .dcard.open .back { display:block; animation:pop .3s; }
  .dcard.open .front { display:none; }
  .dcard.open { background:#fff; }
  .dcard .num { position:absolute; top:-10px; left:-10px; width:34px; height:34px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink);
    font-family:var(--toon); font-size:18px; display:grid; place-items:center; padding-top:3px; }
  .dcard.open .num { background:var(--green); }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .pbtns { text-align:center; margin-top:6px; }
  .qbox { max-width:820px; margin:10px auto; padding:16px 18px; }
  .qbox h2 { font-size:30px; color:var(--ink); -webkit-text-stroke:0; text-shadow:none; font-family:Nunito,system-ui,sans-serif; font-weight:900; letter-spacing:0; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-top:12px; }
  .opt { min-height:64px; border:3px solid var(--ink); border-radius:16px; background:#fff; box-shadow:0 5px 0 var(--ink); font-size:20px; font-weight:900;
    padding:10px 14px; text-align:left; }
  .opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .opt.right { background:#b9f3c4; } .opt.wrong { background:#ffc2cc; } .opt.dim { opacity:.5; }
  .why { margin-top:12px; font-size:19px; line-height:1.35; padding:10px 14px; border-radius:14px; background:#fff3c4; border:3px solid var(--ink); }
  .why[hidden] { display:none; }

  #title { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto;
    background:radial-gradient(circle at 50% 40%, #ffe5ec 0, #ffb3c6 55%, #ff8fab 100%); }
  #title[hidden] { display:none; }
  #title .card { max-width:min(900px,96vw); }
  #heroArt { height:min(240px,30vh); max-width:520px; margin:0 auto; }
  .tsub { font-size:20px !important; }
  #atlas { position:fixed; inset:0; z-index:40; overflow-y:auto; padding:16px; background:#ffe5ec; touch-action:pan-y; }
  #atlas[hidden] { display:none; }
  .agrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; max-width:1300px; margin:12px auto; }
  .acard { padding:10px 14px 12px; }
  .acard canvas { height:140px; border-radius:12px; background:#fff3f6; border:2px solid var(--ink); }
  .acard h3 { font-family:var(--toon); font-weight:400; font-size:24px; margin:8px 0 4px; color:#c9184a; }
  .acard ul { margin:0; padding-left:20px; font-size:16px; line-height:1.35; }
  .acard.locked { background:#e7e0cf; color:#8d8577; }
  .acard.locked h3 { color:#8d8577; }
  .acard .star { color:#f4a100; }
  #toast { position:absolute; top:12px; left:50%; transform:translate(-50%,-14px) rotate(-1deg); padding:8px 18px 6px; font-size:23px; font-weight:900; opacity:0;
    transition:.25s; background:var(--yellow); z-index:15; pointer-events:none; max-width:92%; text-align:center; line-height:1.25; }
  #toast.show { opacity:1; transform:translate(-50%,0) rotate(-1deg); }
  #toast.bad { background:#ffb3c1; }

  /* ---- kid-friendly: speech bubbles, read-aloud, picture tiles, demo hints ---- */
  .say { display:flex; align-items:center; gap:10px; text-align:left; margin:10px auto 4px; max-width:640px; }
  .say canvas.pup { width:70px; height:70px; flex:none; }
  .bubble { position:relative; flex:1; background:#fff; border:3px solid var(--ink); border-radius:18px; padding:8px 14px; font-size:23px;
    line-height:1.25; font-weight:900; box-shadow:3px 3px 0 var(--ink); }
  .bubble:before { content:''; position:absolute; left:-14px; top:50%; margin-top:-9px; border:9px solid transparent; border-right:14px solid var(--ink); border-left:0; }
  .bubble:after { content:''; position:absolute; left:-9px; top:50%; margin-top:-6px; border:6px solid transparent; border-right:10px solid #fff; border-left:0; }
  .rd { flex:none; width:60px; height:60px; border-radius:50%; border:3px solid var(--ink); background:var(--yellow); box-shadow:0 4px 0 var(--ink);
    font-size:26px; display:grid; place-items:center; padding:0; }
  .rd:active, .rd.talk { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .rd.talk { animation:pulse .6s infinite; }
  details.more { margin:6px auto 0; max-width:640px; text-align:left; }
  details.more summary { list-style:none; display:inline-block; cursor:pointer; font-family:var(--toon); font-size:18px; background:#efe6d2;
    border:3px solid var(--ink); border-radius:999px; padding:10px 16px 6px; min-height:48px; }
  details.more summary::-webkit-details-marker { display:none; }
  details.more div { font-size:18px; line-height:1.35; margin-top:8px; padding:8px 12px; background:#fff; border-radius:12px; border:2px dashed #c9bda4; }
  .ctl { position:relative; }
  .ctl.hint::after { content:'👆'; position:absolute; left:50%; top:100%; font-size:38px; margin-left:-19px; margin-top:-14px; pointer-events:none;
    animation:tapHint 1s infinite; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35)); z-index:5; }
  @keyframes tapHint { 0%,100% { transform:translateY(8px); } 50% { transform:translateY(-6px); } }
  .wiggle { animation:wig .45s; }
  @keyframes wig { 20% { transform:rotate(-4deg); } 40% { transform:rotate(4deg); } 60% { transform:rotate(-3deg); } 80% { transform:rotate(2deg); } }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:12px; }
  .tile { min-height:140px; border:3px solid var(--ink); border-radius:20px; background:#fff; box-shadow:0 6px 0 var(--ink); padding:8px 8px 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-family:var(--toon); font-size:21px; letter-spacing:.5px; }
  .tile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .tile .ic { font-size:56px; line-height:1.1; }
  .tile canvas { width:100%; max-width:130px; height:80px; }
  .tile.right { background:#b9f3c4; animation:pop .35s; } .tile.wrong { background:#eee6d6; opacity:.55; } .tile.dim { opacity:.45; }
  .qhead { max-width:900px; margin:0 auto; }
  .qart { width:100%; height:150px; max-width:520px; margin:6px auto 0; display:block; }
  .dcard .cap { font-size:19px; font-weight:900; line-height:1.25; margin:6px 0 2px; }
  .dcard .row { display:flex; align-items:center; gap:8px; justify-content:center; margin-top:6px; }
  .dcard .rd { width:52px; height:52px; font-size:22px; }
  .dcard canvas { height:170px; }
  .dcard .tapme { font-family:var(--toon); font-size:22px; color:#c9184a; animation:pulse 1.2s infinite; display:inline-block; }
  .dcard.open .tapme { display:none; }
  .dcard .reveal { display:none; } .dcard.open .reveal { display:block; animation:pop .3s; }
  .acard .cap { font-size:17px; font-weight:900; margin:2px 0; }
  .etiles { display:flex; flex-wrap:wrap; gap:6px; }
  @media (max-width:760px) {
    h1 { font-size:46px; } h2 { font-size:30px; }
    .step .w { display:none; } .step.cur .w { display:inline; }
    #top .ttl { font-size:20px; }
    .ctl { font-size:19px; padding:10px 14px 4px; }
    .sl { min-width:150px; flex:1 1 150px; }
    .card p, .ptext { font-size:17px; }
    .btn { font-size:22px; padding:12px 22px 6px; }
    .qbox h2 { font-size:23px; }
    .opt { font-size:18px; }
    #goalRow { font-size:14px; }
    .bubble { font-size:19px; } .say canvas.pup { width:54px; height:54px; } .tiles { grid-template-columns:repeat(2,1fr); } .tile { min-height:120px; font-size:18px; } .tile .ic { font-size:46px; }
    .lg { display:none; }
    #ctrls { gap:8px; padding:8px 6px 10px; }
    .seg > b { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top" hidden>
    <button class="tb" id="backBtn" aria-label="Back">⬅</button>
    <div class="ttl" id="topTitle">Body Map</div>
    <div id="steps"></div>
    <div id="timer" hidden>⏱ 0:30</div>
    <span id="topExtra"></span>
    <button class="tb" id="muteBtn" aria-label="Toggle sound">🔊</button>
    <div id="goalRow" hidden><span id="goalTxt"></span><button class="rd" id="goalRead" hidden aria-label="Read aloud" style="width:48px;height:48px;font-size:20px">🔊</button><div id="goalBar"><i></i></div></div>
  </div>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="panel" hidden></div>
    <div id="toast" class="panel"></div>
    <div id="brief" class="overlay" hidden>
      <div class="card panel">
        <span class="kick" id="bKick"></span>
        <h2 id="bTitle"></h2>
        <canvas class="art" id="bArt" hidden></canvas>
        <div class="say" id="bSay"><canvas class="pup"></canvas><div class="bubble" id="bText"></div><button class="rd" id="bRead" aria-label="Read aloud">🔊</button></div>
        <div id="bExtra"></div>
        <details class="more" id="bMore"><summary>📖 More</summary><div id="bMoreTxt"></div></details>
        <div id="bBtns"></div>
      </div>
    </div>
  </div>
  <div id="ctrls"></div>
</div>

<div id="title">
  <div class="card panel">
    <h1>Inside the Body<span>The Great Food Voyage</span></h1>
    <canvas class="art" id="heroArt"></canvas>
    <div class="say"><canvas class="pup"></canvas><div class="bubble" id="tSay">Shrink down with me! Let's ride your food through the body!</div><button class="rd" id="tRead" aria-label="Read aloud">🔊</button></div>
    <div>
      <button class="btn go" id="startBtn">▶ Start Voyage</button>
      <button class="btn yel" id="atlasBtn">📖 Body Atlas</button>
    </div>
    <div>
      <a class="btn alt" href="../" id="gamesLink">⬅ Games</a>
      <button class="btn alt" id="muteBtn2">🔊 Sound</button>
    </div>
  </div>
</div>

<div id="atlas" hidden></div>
<script>
'use strict';
/* ================= utilities ================= */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, INK = '#1d1b26';
const TOON = '"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif';
const BODYF = 'Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ================= save data ================= */
const SKEY = 'bodyVoyage.v1';
let save = { stars: [], muted: false, seen: {} };
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SKEY)); if (s && Array.isArray(s.stars)) save = Object.assign(save, s); } catch (e) { /* storage blocked */ } }
function storeSave() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) { /* storage blocked */ } }
loadSave();

/* ================= sound (synthesized) ================= */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function tone(f, d = 0.12, type = 'square', vol = 0.07, slide = 0, delay = 0) {
  if (save.muted || !AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function noise(d = 0.2, vol = 0.07, freq = 800) {
  if (save.muted || !AC) return;
  try {
    const n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; gn.gain.value = vol;
    src.connect(f).connect(gn).connect(AC.destination); src.start();
  } catch (e) {}
}
const sfx = {
  tap: () => tone(520, 0.05, 'triangle', 0.06),
  blip: () => tone(760, 0.06, 'square', 0.04),

  } else if (id === 'kidneys') {

      c.bezierCurveTo(kx - sd * s * 0.35, y + s * 0.6, kx - sd * s * 0.1, y + s * 0.15, kx - sd * s * 0.25, y); c.bezierCurveTo(kx - sd * s * 0.1, y - s * 0.15, kx - sd * s * 0.35, y - s * 0.6, kx + sd * s * 0.1, y - s * 0.65);

    for (let i = 0; i <= bumps; i++) { const a = Math.PI + i / bumps * Math.PI, bx = x + Math.cos(a) * s, by = y + s * 0.1 + Math.sin(a) * s * 0.75; c.arc(bx, by, s * 0.25, a - 1.3, a + 1.3); }
    c.lineTo(x + s * 0.95, y + s * 0.35); c.quadraticCurveTo(x, y + s * 0.65, x - s * 0.95, y + s * 0.35); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(180,60,110,.5)'; c.lineWidth = Math.max(1.5, s * 0.05);

    if (showFace) face(c, x, y + s * 0.15, s * 0.2, t, mood);
  } else if (id === 'plate') {
    c.fillStyle = '#fff'; ell(c, x, y, s, s * 0.85); c.fill(); c.stroke();
    c.fillStyle = '#f1ebdc'; ell(c, x, y, s * 0.75, s * 0.62); c.fill();
    emoji(c, '🥦', x - s * 0.35, y - s * 0.18, s * 0.5); emoji(c, '🍎', x + s * 0.35, y - s * 0.2, s * 0.45);
    emoji(c, '🍚', x - s * 0.3, y + s * 0.28, s * 0.42); emoji(c, '🍗', x + s * 0.32, y + s * 0.26, s * 0.45);
  } else if (id === 'teeth') {

// food / molecule tokens
function foodBlob(c, x, y, r, color, t = 0, sides = 9, seed = 0) {
  c.beginPath();
  for (let i = 0; i <= sides; i++) { const a = i / sides * TAU, rr = r * (0.85 + 0.15 * Math.sin(i * 2.3 + seed + t)); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = color; c.fill(); c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = INK; c.stroke();
}
// nutrient building blocks
const NUT = {
  sugar: { col: '#ffd23f', label: 'sugar', shape: 'hex' },
  amino: { col: '#4cc9f0', label: 'amino acid', shape: 'circle' },
  fat: { col: '#ff9f1c', label: 'fat bit', shape: 'drop' },
  vit: { col: '#06d6a0', label: 'vitamin', shape: 'star' },
  fibre: { col: '#a47148', label: 'fibre', shape: 'stick' },
  water: { col: '#7ad3ff', label: 'water', shape: 'drop' },
  toxin: { col: '#9b5de5', label: 'toxin', shape: 'spiky' },
};
function drawNut(c, kind, x, y, r, t = 0) {
  const n = NUT[kind]; c.save(); c.fillStyle = n.col; c.strokeStyle = INK; c.lineWidth = Math.max(1.5, r * 0.18); c.lineJoin = 'round';
  c.beginPath();
  if (n.shape === 'hex') { for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); }
  else if (n.shape === 'circle') { c.arc(x, y, r, 0, TAU); }
  else if (n.shape === 'drop') { c.moveTo(x, y - r * 1.2); c.bezierCurveTo(x + r * 1.1, y, x + r * 0.8, y + r, x, y + r); c.bezierCurveTo(x - r * 0.8, y + r, x - r * 1.1, y, x, y - r * 1.2); }
  else if (n.shape === 'star') { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r * 1.1; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
  else if (n.shape === 'stick') { c.save(); c.translate(x, y); c.rotate(0.6 + Math.sin(t + x) * 0.2); rrect(c, -r * 1.3, -r * 0.4, r * 2.6, r * 0.8, r * 0.3); c.restore(); }
  else if (n.shape === 'spiky') { for (let i = 0; i < 16; i++) { const a = i / 16 * TAU + t, rr = i % 2 ? r * 0.7 : r * 1.1; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
  c.fill(); c.stroke();
  if (r > 9 && n.shape !== 'stick') { c.fillStyle = INK; for (const sd of [-1, 1]) { ell(c, x + sd * r * 0.3, y - r * 0.05, r * 0.11, r * 0.15); c.fill(); } }
  c.restore();
}

// title hero art
function drawHeroArt(c, w, h, t) {
  // squiggly pink tunnel background
  const gr = c.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w * 0.6); gr.addColorStop(0, '#ffe5ec'); gr.addColorStop(1, '#ff8fab');
  c.fillStyle = gr; rrect(c, 2, 2, w - 4, h - 4, 20); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
  c.save(); rrect(c, 2, 2, w - 4, h - 4, 20); c.clip();
  for (let i = 0; i < 6; i++) { const k = ((t * 0.25 + i / 6) % 1), rr = k * w * 0.8; c.strokeStyle = `rgba(255,77,109,${0.35 * (1 - k)})`; c.lineWidth = 8; ell(c, w / 2, h / 2, rr, rr * 0.55); c.stroke(); }
  const s = Math.min(w, h) * 0.2;
  drawOrgan(c, 'stomach', w * 0.14, h * 0.32, s * 0.55, t);
  drawOrgan(c, 'liver', w * 0.86, h * 0.3, s * 0.55, t);
  drawOrgan(c, 'heart', w * 0.13, h * 0.76, s * 0.45, t);
  drawOrgan(c, 'brain', w * 0.87, h * 0.75, s * 0.5, t);
  emoji(c, '🍎', w * 0.35 + Math.sin(t * 2) * 6, h * 0.25, s * 0.55);

}

/* ================= GAME FLOW: map, missions, phases ================= */
const PHASES = ['Challenge', 'Discover', 'Experiment', 'Boss', 'Check'];
const MISSIONS = [];   // filled by mission files
let M = null, mi = -1, phase = -1, phaseList = [], bossFails = 0, quizState = null, bossResult = null, expGoalsDone = false;

function totalStars() { return save.stars.reduce((a, b) => a + (b || 0), 0); }
function unlocked(i) { return i === 0 || (save.stars[i - 1] || 0) > 0; }

function renderSteps() {
  const st = $('steps'); st.innerHTML = '';

/* ---------- Body map ---------- */

function missionCard(i) {

function startMission(i) {
  mi = i; M = MISSIONS[i]; bossFails = 0; bossResult = null;
  phaseList = M.phases || PHASES.slice();
  $('title').hidden = true; $('atlas').hidden = true; $('top').hidden = false;

}

function runPhase(k) {
  phase = k; stopTimer(); goalHide(); hidePanel(); closeBrief(); ctrls([]); scene = null; renderSteps();
  const p = phaseList[k];
  if (!p) return;
  const go = (sc, after) => () => { after && after(); if (scene && scene.demo) scene.demo(); };
  if (p === 'Challenge') {
    const C = M.challenge;
    setScene(C.scene());
    brief({ kick: '1 · Challenge', title: C.title, say: C.say, art: C.art,
      buttons: [{ label: "▶ Let's try!", cls: 'go', fn: go(0, () => startTimer(C.time || 30, () => scene && scene.timeUp ? scene.timeUp() : challengeDone(false))) }] });
  } else if (p === 'Discover') runDiscover();
  else if (p === 'Experiment') {
    const E = M.experiment; expGoalsDone = false;
    setScene(E.scene());
    brief({ kick: '3 · Experiment', title: E.title, say: E.say, art: E.art,
      buttons: [{ label: '🧪 Play!', cls: 'go', fn: go(0, () => startTimer(E.time || 120, expTimeUp)) }] });
  } else if (p === 'Boss') {
    const Bs = M.boss; const easy = bossFails >= 2;
    setScene(Bs.scene(easy));
    brief({ kick: '4 · Boss' + (easy ? ' (easier)' : ''), title: Bs.title, say: Bs.say, art: Bs.art, more: Bs.more,
      buttons: [{ label: '⚡ Start!', cls: 'go', fn: go(0, () => startTimer((Bs.time || 75) + (easy ? 20 : 0), () => scene && scene.timeUp ? scene.timeUp() : bossDone({ win: false }))) }] });
  } else if (p === 'Check') runQuiz();
}
function nextPhase() { if (phase + 1 < phaseList.length) runPhase(phase + 1); }

function challengeDone(ok, msg) {

}

function tissueBG(c, w, h, t, top = '#ffb3c6', bot = '#ff8fab', dots = 'rgba(255,255,255,.28)') {
  const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(1, bot); c.fillStyle = gr; c.fillRect(0, 0, w, h);
  c.fillStyle = dots;
  for (let i = 0; i < 14; i++) { const x = (i * 211 + t * 12) % (w + 60) - 30, y = (i * 97 + Math.sin(t + i) * 10) % h, r = 6 + (i % 5) * 4; ell(c, x, y, r, r); c.fill(); }
}
const S = () => Math.min(W, H);
function hearts(c, x, y, n, max, size = 26) { for (let i = 0; i < max; i++) emoji(c, i < n ? '💖' : '🤍', x + i * size * 1.15, y, size); }
function scoreChip(c, x, y, s, size = 18) { return pillLabel(c, s, x, y, size); }

/* ---- Mouth art ---- */
const FOODCOL = { bread: '#f6c97a', carrot: '#ff9f1c', apple: '#ff6b6b' };
const FOODEMO = { bread: '🍞', carrot: '🥕', apple: '🍎' };
function drawMouthView(c, w, h, t, jaw = 0, hl = null) {
  c.fillStyle = '#7a1f3d'; c.fillRect(0, 0, w, h);
  const gr = c.createRadialGradient(w * 0.85, h * 0.45, 10, w * 0.85, h * 0.45, w * 0.5); gr.addColorStop(0, '#4a0f25'); gr.addColorStop(1, 'rgba(122,31,61,0)');
  c.fillStyle = gr; c.fillRect(0, 0, w, h);
  // throat
  c.fillStyle = '#3d0b1f'; ell(c, w * 0.88, h * 0.5, w * 0.07, h * 0.16); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
  c.fillStyle = '#ff8fab'; c.beginPath(); c.moveTo(w * 0.86, h * 0.13); c.quadraticCurveTo(w * 0.88, h * 0.3, w * 0.9, h * 0.13); c.fill(); c.stroke(); // uvula
  // tongue
  c.fillStyle = '#ff8fab'; ell(c, w * 0.48, h * 0.86, w * 0.42, h * 0.24); c.fill(); c.stroke();
  c.strokeStyle = '#e0607f'; c.lineWidth = 4; c.beginPath(); c.moveTo(w * 0.2, h * 0.8); c.quadraticCurveTo(w * 0.48, h * 0.72, w * 0.76, h * 0.8); c.stroke();
  // gums + teeth
  const th = h * 0.13, jy = jaw * h * 0.06, n = 9;
  for (const top of [true, false]) {
    const gy = top ? 0 : h;
    c.fillStyle = '#ff6b8b'; c.fillRect(0, top ? 0 : h - h * 0.07, w, h * 0.07);
    for (let i = 0; i < n; i++) {
      const x0 = w * 0.02 + i * (w * 0.78 / n), tw = w * 0.78 / n * 0.86, incisor = i < 3;
      const base = top ? h * 0.06 + jy : h - h * 0.06 - jy, dir = top ? 1 : -1;
      const lit = hl === 'cut' ? incisor : hl === 'grind' ? !incisor : false;
      c.fillStyle = lit ? '#fff3a0' : '#fff'; c.strokeStyle = INK; c.lineWidth = 2.5;
      c.beginPath();
      if (incisor) { c.moveTo(x0, base - dir * 4); c.lineTo(x0, base + dir * th); c.lineTo(x0 + tw, base + dir * th * 0.95); c.lineTo(x0 + tw, base - dir * 4); }
      else { c.moveTo(x0, base - dir * 4); c.lineTo(x0, base + dir * th * 0.7); c.quadraticCurveTo(x0 + tw * 0.25, base + dir * th * 0.95, x0 + tw * 0.5, base + dir * th * 0.72); c.quadraticCurveTo(x0 + tw * 0.75, base + dir * th * 0.95, x0 + tw, base + dir * th * 0.7); c.lineTo(x0 + tw, base - dir * 4); }
      c.closePath(); c.fill(); c.stroke();
    }
  }
  const nar = w < 640, fs = Math.max(11, S() * 0.022);
  pillLabel(c, nar ? 'INCISORS' : 'front teeth: INCISORS', w * (nar ? 0.16 : 0.15), h * 0.06 + th + fs * 1.5 + jy, fs, '#fffaf0');
  pillLabel(c, nar ? 'MOLARS' : 'back teeth: MOLARS', w * 0.6, h * 0.06 + th + fs * 1.5 + jy, fs, '#fffaf0');
  pillLabel(c, 'throat ➜', w * 0.88, h * 0.72, Math.max(11, S() * 0.022), '#fffaf0');
}

/* ================= MISSION 1: MOUTH ================= */
function m1Challenge() {
  let pieces, drag = null, tooBig = 0, swallowed = 0, flying = [];
  const TH = () => [W * 0.88, H * 0.5], thR = () => Math.min(W * 0.07, H * 0.16);
  return {
    init() {
      pieces = [{ x: 0.32, y: 0.55, r: 0.2, whole: true }];
      goal('🍎 ➜ 🕳️ Drag food into the throat! Swallow 3 times.', 0);
    },
    update(dt) {
      for (let i = flying.length - 1; i >= 0; i--) { const f = flying[i]; f.t += dt * 2.5; if (f.t >= 1) flying.splice(i, 1); }
    },
    draw(c, w, h, t) {
      drawMouthView(c, w, h, t);
      for (const p of pieces) {
        const x = p.x * w, y = p.y * h, r = p.r * S();
        if (p.whole) emoji(c, '🍎', x, y, r * 2); else foodBlob(c, x, y, r, '#ff6b6b', 0, 9, p.x * 30);
      }
      for (const f of flying) { const [tx, ty] = TH(); c.globalAlpha = 1 - f.t; foodBlob(c, lerp(f.x * w, tx, f.t), lerp(f.y * h, ty, f.t), f.r * S() * (1 - f.t * 0.7), '#ff6b6b'); c.globalAlpha = 1; }
    },
    down(x, y, id) {
      for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i]; if (dist(x, y, p.x * W, p.y * H) < p.r * S() * 1.1 + 12) { drag = { p, id, sx: x, sy: y, ox: p.x * W - x, oy: p.y * H - y, moved: false }; return; } }
    },
    move(x, y, id) {
      if (!drag || drag.id !== id) return;
      if (dist(x, y, drag.sx, drag.sy) > 12) drag.moved = true;
      drag.p.x = clamp((x + drag.ox) / W, 0.05, 0.95); drag.p.y = clamp((y + drag.oy) / H, 0.1, 0.92);
    },
    up(x, y, id) {
      if (!drag || drag.id !== id) return;
      const p = drag.p, moved = drag.moved; drag = null;
      if (!moved) { // a tap = a bite!
        if (p.r > 0.05) { sfx.chomp(); const i = pieces.indexOf(p); pieces.splice(i, 1, { x: p.x - 0.04, y: p.y, r: p.r * 0.68 }, { x: p.x + 0.04, y: p.y + 0.03, r: p.r * 0.68 }); burst(p.x * W, p.y * H - 60, 'CHOMP!', '#ffd23f', 0.7); }
        return;
      }
      const [tx, ty] = TH();
      if (dist(p.x * W, p.y * H, tx, ty) < thR() * 1.4) {
        if (p.r * S() > thR() * 0.75) {
          tooBig++; sfx.bad(); burst(tx - 60, ty, 'TOO BIG!', '#ff9f1c', 0.8); p.x = 0.55; p.y = 0.55;
          if (tooBig === 2) toast('💡 Teeth bite! <b>Tap</b> the food! 👆'); showDemo(() => pieces.slice(0, 1).map(p => [p.x * W, p.y * H]), true, 5);
        } else {
          sfx.slurp(); swallowed++; flying.push({ x: p.x, y: p.y, r: p.r, t: 0 }); pieces.splice(pieces.indexOf(p), 1);
          goal('🍎 ➜ 🕳️ Drag food into the throat! Swallow 3 times.', swallowed / 3);
          if (swallowed >= 3 || !pieces.length) challengeDone(true, 'You bit it smaller! Chewing does even more.');
        }
      }
    },
    demo() { showDemo(() => [[pieces[0] ? pieces[0].x * W : W * 0.3, pieces[0] ? pieces[0].y * H : H * 0.5], TH()], false, 6); },
    timeUp() { challengeDone(false, 'A whole apple is too big to swallow!'); }
  };
}

function m1Exp() {
  let food = 'bread', pieces, wet, sugar, jaw = 0, hl = null, hlT = 0, drops = [], bolus = null, warnedMolar = false;
  const G = { cut: false, grind: false, sugar: false, swallow: false };
  const reset = f => { food = f || food; pieces = [{ x: 0.45, y: 0.66, r: 0.15 }]; wet = 0; sugar = 0; bolus = null; };
  const maxR = () => pieces.reduce((m, p) => Math.max(m, p.r), 0);
  const ready = () => pieces.length && maxR() < 0.035 && wet >= 0.6;
  const upd = () => expGoals([{ t: '🔪 Cut', ok: G.cut }, { t: '🦷 Grind', ok: G.grind }, { t: '🍞➜🍬 Sugar', ok: G.sugar }, { t: '👅 Swallow', ok: G.swallow }]);
  return {
    init() {
      reset('bread');
      ctrls([
        { seg: 'Food', items: [{ label: '🍞', id: 'fb', cls: 'on sm', onTap: () => { reset('bread'); setOn(['fb', 'fc', 'fa'], 'fb'); } }, { label: '🥕', id: 'fc', cls: 'sm', onTap: () => { reset('carrot'); setOn(['fb', 'fc', 'fa'], 'fc'); } }, { label: '🍎', id: 'fa', cls: 'sm', onTap: () => { reset('apple'); setOn(['fb', 'fc', 'fa'], 'fa'); } }] },
        { label: '🔪 <span class="lg">Incisors: </span>CUT', id: 'cu', cls: 'yel', hint: true, key: '1', onTap: () => this.cut() },
        { label: '🦷 <span class="lg">Molars: </span>GRIND', id: 'gr', cls: 'blue', key: '2', onTap: () => this.grind() },
        { label: '💧 Saliva', id: 'sa', cls: 'grn', key: '3', onTap: () => this.saliva() },
        { label: '👅 Swallow', id: 'sw', cls: 'pink', key: '4', onTap: () => this.swallow() },
        bossBtn()
      ]);
      upd();
    },
    cut() {
      jaw = 1; hl = 'cut'; hlT = 0.4; sfx.chomp();
      const big = pieces.filter(p => p.r > 0.055);
      if (!big.length) { toast('Already small! Now 🦷 <b>GRIND</b>'); hintCtl('gr'); return; }
      pieces = pieces.flatMap(p => p.r > 0.055 ? [{ x: p.x - 0.03, y: p.y + rand(-0.03, 0.03), r: p.r * 0.7 }, { x: p.x + 0.03, y: p.y + rand(-0.03, 0.03), r: p.r * 0.7 }] : [p]);
      G.cut = true; upd();
    },
    grind() {
      jaw = 1; hl = 'grind'; hlT = 0.4; sfx.chomp();
      const out = []; let tooBig = false;
      for (const p of pieces) {
        if (p.r > 0.075) { tooBig = true; out.push(Object.assign(p, { r: p.r * 0.96 })); }
        else if (p.r > 0.016 && pieces.length + out.length < 70) { for (let k = 0; k < 3; k++) out.push({ x: p.x + rand(-0.04, 0.04), y: p.y + rand(-0.04, 0.04), r: p.r * 0.6 }); G.grind = true; }
        else out.push(Object.assign(p, { r: Math.max(0.012, p.r * 0.8) }));
      }
      pieces = out;
      if (tooBig && !warnedMolar) { warnedMolar = true; toast('Too big! 🔪 <b>CUT</b> first'); hintCtl('cu'); }
      upd();
    },
    saliva() {
      sfx.squish(); wet = Math.min(1, wet + 0.22);
      for (let k = 0; k < 8; k++) drops.push({ x: rand(0.2, 0.7), y: 0.15, vy: rand(0.3, 0.6), t: 0 });
      if (food !== 'bread' && !save.seen.lowStarch) { save.seen.lowStarch = 1; toast('Little starch here. Try 🍞 bread!'); hintCtl('fb'); }
    },
    swallow() {
      if (!pieces.length) return;
      if (!ready()) { sfx.bad(); toast(maxR() >= 0.035 ? 'Too lumpy! 🦷 Grind more' : 'Too dry! 💧 Add saliva', true); hintCtl(maxR() >= 0.035 ? 'gr' : 'sa'); return; }
      sfx.slurp(); bolus = { t: 0 }; G.swallow = true; upd(); burst(W * 0.8, H * 0.35, 'GULP!', '#06d6a0', 0.8);
    },
    update(dt) {
      jaw = Math.max(0, jaw - dt * 4); hlT -= dt; if (hlT <= 0) hl = null;
      for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.t += dt; d.y += d.vy * dt; if (d.y > 0.6) drops.splice(i, 1); }
      if (food === 'bread' && wet > 0.15 && sugar < 1) {
        const surf = clamp(pieces.length / 25, 0.15, 1.6);
        sugar = Math.min(1, sugar + dt * 0.09 * wet * surf);
        if (sugar >= 0.5 && !G.sugar) { G.sugar = true; upd(); burst(W * 0.45, H * 0.35, 'SWEET!', '#ffd23f', 0.8); toast('🍞 starch ➜ 🍬 sugar! Saliva at work!'); }
      }
      wet = Math.max(0, wet - dt * 0.01);
      if (bolus) { bolus.t += dt; if (bolus.t > 1.4) reset(); }
      for (const p of pieces) { p.x = clamp(p.x, 0.2, 0.74); p.y = clamp(p.y, 0.58, 0.8); }
      if (UI.c.sw) UI.c.sw.classList.toggle('pulse', ready() && !bolus);
    },
    draw(c, w, h, t) {
      drawMouthView(c, w, h, t, jaw, hl);
      const col = FOODCOL[food];
      if (bolus) {
        const k = Math.min(1, bolus.t / 1.2);
        foodBlob(c, lerp(w * 0.45, w * 0.88, k), lerp(h * 0.6, h * 0.5, k), S() * 0.07 * (1 - k * 0.5), col, t);
      } else for (const p of pieces) {
        const x = p.x * w, y = p.y * h, r = p.r * S();
        if (p.r >= 0.16) emoji(c, FOODEMO[food], x, y, r * 2); else foodBlob(c, x, y, r, col, 0, 8, p.x * 50 + p.y * 20);
        if (wet > 0.3 && r > 4) { c.fillStyle = `rgba(200,240,255,${wet * 0.45})`; ell(c, x - r * 0.3, y - r * 0.35, r * 0.3, r * 0.18); c.fill(); }
      }
      for (const d of drops) { c.fillStyle = 'rgba(160,225,255,.9)'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); const x = d.x * w, y = d.y * h; c.moveTo(x, y - 9); c.quadraticCurveTo(x + 7, y + 3, x, y + 6); c.quadraticCurveTo(x - 7, y + 3, x, y - 9); c.fill(); c.stroke(); }
      // meters
      const mh = clamp(S() * 0.022, 11, 18), gap = mh * 2.7, mw = Math.min(260, w * 0.42), mx = w * 0.42 - mw / 2, my = h * 0.19 + mh * 5.6;
      c.fillStyle = 'rgba(255,250,240,.92)'; rrect(c, mx - 12, my - mh * 2.2, mw + 24, gap * 3 + mh, 14); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
      meter(c, mx, my, mw, mh, 1 - clamp((maxR() - 0.02) / 0.15, 0, 1), '#4cc9f0', '🦷 Tiny bits');
      meter(c, mx, my + gap, mw, mh, wet, '#7ad3ff', '💧 Slippery');
      meter(c, mx, my + gap * 2, mw, mh, food === 'bread' ? sugar : 0.05, '#ffd23f', food === 'bread' ? '🍞➜🍬 Sugar' : '🍞 Little starch');
    }
  };
}

function m1Boss(easy) {
  const N = easy ? 16 : 22, gap0 = easy ? 1.7 : 1.35, travel = easy ? 3.0 : 2.6, HIT = 0.8;
  let notes = [], spawned = 0, nextT = 0.6, hits = 0, perfect = 0, done = false, jaw = 0, combo = 0, flash = null;
  const kinds = ['cut', 'grind', 'spit'], label = { cut: 'CUT', grind: 'GRIND', spit: 'SALIVA' };
  const press = kind => {
    if (done) return;
    jaw = 1;
    let best = null, bd = 1;
    for (const n of notes) if (!n.judged) { const d = Math.abs(n.y - HIT); if (d < bd) { bd = d; best = n; } }
    if (!best || bd > 0.09) { sfx.blip(); return; }
    best.judged = true;
    if (best.kind === kind) {
      hits++; combo++; if (bd < 0.04) perfect++; sfx.chomp();
      floatTxt(W / 2, HIT * H - 40, bd < 0.04 ? 'PERFECT!' : 'GOOD', bd < 0.04 ? '#ffd23f' : '#fff', 26); best.hit = true;
      if (combo % 5 === 0) burst(W / 2 + rand(-120, 120), H * 0.4, combo + ' COMBO!', '#06d6a0', 0.8);
    } else {
      combo = 0; sfx.bad(); best.miss = true;
      floatTxt(W / 2, HIT * H - 40, best.kind === 'cut' ? '🍎 → 🔪!' : best.kind === 'grind' ? '🟠 → 🦷!' : '🟫 → 💧!', '#ff8fab', 26);
    }
    flash = { kind, t: 0.25 };
  };
  const finish = () => {
    if (done) return; done = true;
    const acc = hits / N;
    bossDone({ win: acc >= 0.7, great: acc >= 0.9, msg: `You got ${hits} of ${N} right (${Math.round(acc * 100)}%).` });
  };
  return {
    init() {
      ctrls([
        { label: '🔪 CUT', cls: 'yel', hint: true, key: ['1', 'a', 'ArrowLeft'], onTap: () => press('cut') },
        { label: '🦷 GRIND', cls: 'blue', key: ['2', 's', 'ArrowDown'], onTap: () => press('grind') },
        { label: '💧 SALIVA', cls: 'grn', key: ['3', 'd', 'ArrowRight'], onTap: () => press('spit') },
      ]);
    },
    update(dt) {
      if (done) return;
      jaw = Math.max(0, jaw - dt * 5); if (flash) { flash.t -= dt; if (flash.t <= 0) flash = null; }
      nextT -= dt;
      if (nextT <= 0 && spawned < N) {
        const kind = spawned < 3 ? kinds[spawned] : pick(kinds);
        notes.push({ kind, y: -0.08, food: pick(['bread', 'carrot', 'apple']), judged: false });
        spawned++; nextT = gap0 * (1 - 0.25 * spawned / N);
      }
      for (const n of notes) { n.y += dt * (HIT + 0.08) / travel; if (!n.judged && n.y > HIT + 0.09) { n.judged = true; n.miss = true; combo = 0; floatTxt(W / 2, HIT * H, 'MISSED', '#ff8fab', 22); } }
      notes = notes.filter(n => n.y < 1.15 && !(n.hit && n.y > HIT + 0.05));
      goal(`🎵 🍎→🔪 · 🟠→🦷 · 🟫→💧 &nbsp; ✅ ${hits}/${N}`, spawned / N);
      if (spawned >= N && notes.every(n => n.judged)) finish();
    },
    draw(c, w, h, t) {
      drawMouthView(c, w, h, t, jaw, flash && flash.kind !== 'spit' ? flash.kind : null);
      c.fillStyle = 'rgba(29,27,38,.35)'; const lw = Math.min(260, w * 0.5); rrect(c, w / 2 - lw / 2, 0, lw, h, 0); c.fill();
      // hit zone
      c.fillStyle = 'rgba(255,210,63,.35)'; c.fillRect(w / 2 - lw / 2, HIT * h - h * 0.07, lw, h * 0.14);
      c.strokeStyle = '#ffd23f'; c.lineWidth = 4; c.setLineDash([12, 8]); c.beginPath(); c.moveTo(w / 2 - lw / 2, HIT * h); c.lineTo(w / 2 + lw / 2, HIT * h); c.stroke(); c.setLineDash([]);
      const r = Math.min(lw * 0.22, h * 0.07);
      for (const n of notes) {
        if (n.hit) continue;
        const x = w / 2, y = n.y * h;
        c.globalAlpha = n.miss ? 0.35 : 1;
        if (n.kind === 'cut') emoji(c, FOODEMO[n.food], x, y, r * 1.9);
        else if (n.kind === 'grind') { foodBlob(c, x - r * 0.35, y, r * 0.62, FOODCOL[n.food], 0, 7, 1); foodBlob(c, x + r * 0.4, y + r * 0.1, r * 0.5, FOODCOL[n.food], 0, 7, 4); }
        else { for (let k = 0; k < 7; k++) foodBlob(c, x + Math.cos(k * 2.4) * r * 0.6, y + Math.sin(k * 2.4) * r * 0.35, r * 0.18, '#d9c08c', 0, 6, k); txt(c, 'DRY', x, y - r * 0.8, r * 0.45, '#fff3c4'); }
        c.globalAlpha = 1;
      }
      txt(c, `✅ ${hits}`, w / 2 + lw / 2 + 50, HIT * h, 30, '#06d6a0');
      if (combo > 1) txt(c, combo + 'x', w / 2 - lw / 2 - 40, HIT * h, 28, '#ffd23f');
    },
    timeUp() { finish(); }
  };
}

// geometry: mouth/throat at top, junction, windpipe branches left, esophagus goes down to stomach
function esoGeo(w, h) {
  const tw = clamp(w * 0.11, 46, 110);
  return { x: w * 0.55, y0: h * 0.24, y1: h * 0.84, tw, jx: w * 0.55, jy: h * 0.15, wx: w * 0.3, wy: h * 0.5 };
}
function drawEsoScene(c, w, h, t, st) {

  c.lineJoin = 'round'; c.lineCap = 'round';

  c.strokeStyle = INK; c.lineWidth = G.tw * 0.75 + 6;
  c.beginPath(); c.moveTo(G.jx - G.tw * 0.25, G.jy + 8); c.quadraticCurveTo(G.wx, G.jy + h * 0.05, G.wx, G.wy); c.stroke();
  c.strokeStyle = '#bde7f5'; c.lineWidth = G.tw * 0.75;
  c.beginPath(); c.moveTo(G.jx - G.tw * 0.25, G.jy + 8); c.quadraticCurveTo(G.wx, G.jy + h * 0.05, G.wx, G.wy); c.stroke();
  c.strokeStyle = 'rgba(70,140,170,.6)'; c.lineWidth = 3;
  for (let k = 0; k < 6; k++) { const yy = G.jy + h * 0.1 + k * (G.wy - G.jy - h * 0.1) / 6; c.beginPath(); c.moveTo(G.wx - G.tw * 0.36, yy); c.lineTo(G.wx + G.tw * 0.36, yy); c.stroke(); }
  drawOrgan(c, 'lungs', G.wx, G.wy + h * 0.12, Math.min(w, h) * 0.09, t);
  pillLabel(c, '💨 windpipe', G.wx, G.wy - h * 0.06, clamp(S() * 0.022, 11, 17), '#e8f8ff');
  // esophagus tube with squeeze bulges
  const N = 60, pts = [];
  for (let i = 0; i <= N; i++) {
    const p = i / N, y = lerp(G.y0, G.y1, p);
    let sq = 0; for (const s of st.squeezes || []) sq = Math.max(sq, Math.exp(-Math.pow((p - s.p) / 0.035, 2)) * s.a);
    let bul = 0; for (const b of st.balls || []) if (b.p >= 0) bul = Math.max(bul, Math.exp(-Math.pow((p - b.p) / 0.05, 2)));
    const r = G.tw / 2 * (1 - sq * 0.55 + bul * 0.35);
    pts.push([y, r]);
  }
  c.fillStyle = '#ff9eb1'; c.strokeStyle = INK; c.lineWidth = 4;
  c.beginPath(); c.moveTo(G.jx - G.tw / 2, G.jy); pts.forEach(([y, r]) => c.lineTo(G.x - r, y));
  for (let i = pts.length - 1; i >= 0; i--) c.lineTo(G.x + pts[i][1], pts[i][0]);
  c.lineTo(G.jx + G.tw / 2, G.jy); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(200,60,100,.4)'; c.lineWidth = 2.5;
  for (let i = 2; i < N; i += 4) { const [y, r] = pts[i]; c.beginPath(); c.moveTo(G.x - r + 4, y); c.quadraticCurveTo(G.x, y + 5, G.x + r - 4, y); c.stroke(); }
  // squeeze rings
  for (const s of st.squeezes || []) { const y = lerp(G.y0, G.y1, s.p); c.strokeStyle = `rgba(155,93,229,${0.8 * s.a})`; c.lineWidth = 6; c.beginPath(); c.moveTo(G.x - G.tw * 0.7, y); c.lineTo(G.x - G.tw * 0.35, y); c.moveTo(G.x + G.tw * 0.35, y); c.lineTo(G.x + G.tw * 0.7, y); c.stroke(); }
  pillLabel(c, 'esophagus', G.x + G.tw * 1.2 + 30, lerp(G.y0, G.y1, 0.3), clamp(S() * 0.024, 12, 18));
  // stomach at bottom
  drawOrgan(c, 'stomach', G.x + G.tw * 0.5, G.y1 + h * 0.08, Math.min(w, h) * 0.11, t, { mood: st.happy ? 'wow' : 'happy' });
  // throat + flap (epiglottis)
  c.fillStyle = '#ff6b8b'; c.strokeStyle = INK; c.lineWidth = 4;

  // balls

    c.fillStyle = '#fffaf0'; ell(c, bx, by, r * 1.35, r * 1.35); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    c.save(); c.translate(bx, by); if (st.orient === 'down') c.rotate(Math.PI); if (st.orient === 'space') c.rotate(Math.sin(t) * 0.8);
    drawPupHead(c, 0, 0, r * 0.75, t, { goggles: false }); c.restore();

// physics shared by all M2 phases
function esoStep(st, dt) {
  // waves travel down; a wave just behind a ball carries it along
  for (const s of st.squeezes) {
    if (s.wave) s.p += dt * s.speed;
    s.life -= dt; s.a = clamp(s.life / 0.4, 0, 1);
  }
  st.squeezes = st.squeezes.filter(s => s.life > 0 && s.p < 1.05);
  for (const b of st.balls) {
    if (b.p < 0 || b.done) continue;
    let push = 0;
    for (const s of st.squeezes) {
      const d = b.p - s.p; // positive = ball is below (ahead of) squeeze
      if (s.wave ? (d > 0 && d < 0.1) : (d > -0.015 && d < 0.14)) push = Math.max(push, s.wave ? (s.p + 0.07 - b.p) * 6 : 0.9 * s.a);
      if (!s.wave && d <= -0.015 && d > -0.08) push = Math.min(push, -0.35 * s.a);
    }
    const grav = st.orient === 'up' ? 0.025 : st.orient === 'down' ? -0.035 : 0;
    b.p = clamp(b.p + (push + grav) * dt, 0, 1);
    if (b.p >= 0.985) { b.done = true; st.onArrive && st.onArrive(b); }
  }
  st.balls = st.balls.filter(b => !b.done);
}
function esoTap(st, x, y) {
  const G = esoGeo(W, H);
  if (Math.abs(x - G.x) > G.tw * 1.4 || y < G.y0 - 10 || y > G.y1 + 10) return false;
  const p = clamp((y - G.y0) / (G.y1 - G.y0), 0, 1);
  st.squeezes.push({ p, a: 1, life: 0.5, wave: false });
  sfx.squish();
  return true;
}

function m2Boss(easy) {

  const st = { orient: 'down', flap: 'closed', squeezes: [], balls: [] };

  const finish = win => { if (done) return; done = true; bossDone({ win, great: win && mistakes === 0, msg: `Delivered ${delivered}/${NEED} food balls with ${mistakes} oops${mistakes === 1 ? '' : 'es'}.` }); };
  const act = kind => {
    if (done || !queue.length) return;
    const it = queue[0];
    if (it.y < H * 0.04) return;
    queue.shift();
    st.flap = kind === 'breathe' ? 'open' : 'closed';
    if (kind === 'swallow' && !it.air) { sfx.slurp(); st.balls.push({ p: 0.06 }); }
    else if (kind === 'breathe' && it.air) { sfx.whoosh(); breath = Math.min(1, breath + 0.35); floatTxt(W * 0.3, H * 0.35, 'Ahh, air!', '#4cc9f0'); }

    else { mistakes++; sfx.bad(); burst(W * 0.6, H * 0.2, 'BURP!', '#ff9f1c', 0.8); flash = 'Air? 🌬️ BREATHE!'; }
    if (flash) { toast(flash, true); flash = null; }
  };
  return {
    init() {
      ctrls([
        { label: '🍔 SWALLOW', cls: 'pink', key: ['1', 's'], onTap: () => act('swallow') },
        { label: '🌬️ BREATHE', cls: 'blue', key: ['2', 'b'], onTap: () => act('breathe') },
      ]);
    },
    update(dt) {
      if (done) return;
      esoStep(st, dt);
      nextIn -= dt;
      if (nextIn <= 0 && queue.length < 2) { const air = queue.length ? !queue[queue.length - 1].air && Math.random() < 0.6 : Math.random() < 0.4; queue.push({ air, y: -40 }); nextIn = easy ? 2.6 : 2.0; }
      const G = esoGeo(W, H);

      if (breath < 0.25 && !this.bw) { this.bw = true; toast('Need air! 🌬️ BREATHE on 💨'); }
      if (breath > 0.4) this.bw = false;

    },
    draw(c, w, h, t) {

      drawEsoScene(c, w, h, t, Object.assign({}, st, { balls: st.balls.concat(queue.map(q => ({ p: -1, x: G.jx, y: q.y, air: q.air }))) }));
      vmeter(c, 18, h * 0.3, 30, h * 0.4, breath, breath < 0.25 ? '#ff8fab' : '#4cc9f0', 'air', null);

    down(x, y) { esoTap(st, x, y); },
    demo() { showDemo(() => { const G = esoGeo(W, H); return [[G.x, lerp(G.y0, G.y1, 0.12)]]; }, true, 4); },
    timeUp() { finish(false); }
  };
}

/* ================= MISSION 3: STOMACH ================= */
// a shared stomach simulation
function stomachSim(opts = {}) {
  const S3 = {
    acid: opts.acid ?? 0.1, pepsin: 0, mucus: opts.mucus ?? 0.8, lining: 1, chyme: 0, released: 0, chunks: [], churnT: 0, valveT: 0,
    tools: opts.tools || { acid: true, pepsin: true, mucus: true },
    add(type, size = 1) { S3.chunks.push({ type, size, x: rand(-0.3, 0.3), y: rand(-0.35, -0.1), vx: 0, vy: 0, rot: rand(0, 6) }); },
    churn() {
      S3.churnT = 0.45; sfx.squish(); let changed = false;
      for (const ch of S3.chunks) {
        ch.vx += rand(-0.6, 0.6); ch.vy += rand(-0.6, 0.2);
        const floor = ch.type === 'protein' ? 0.45 : 0.12;
        if (ch.size > floor) { ch.size = Math.max(floor, ch.size * 0.86); changed = true; }
        if (ch.size <= 0.14) { S3.chyme += ch.size * 0.5; ch.size = 0; }
      }
      S3.chunks = S3.chunks.filter(c => c.size > 0);
      if (!changed && S3.chunks.some(c => c.type === 'protein')) S3.stuck = (S3.stuck || 0) + 1;
      return changed;
    },
    step(dt) {
      S3.churnT = Math.max(0, S3.churnT - dt); S3.valveT = Math.max(0, S3.valveT - dt);
      S3.acid = Math.max(0, S3.acid - dt * 0.02); S3.pepsin = Math.max(0, S3.pepsin - dt * 0.03);
      S3.mucus = Math.max(0, S3.mucus - dt * (0.012 + S3.acid * 0.03));
      const active = S3.pepsin * clamp((S3.acid - 0.2) / 0.4, 0, 1); // pepsin needs acid
      S3.active = active;
      for (const ch of S3.chunks) {
        if (ch.type === 'protein' && active > 0) { const d = dt * 0.12 * active * (1.4 - ch.size); ch.size -= d; S3.chyme += d * 0.5; }
        ch.x += ch.vx * dt * 0.4; ch.y += ch.vy * dt * 0.4 + dt * 0.05; ch.vx *= 0.96; ch.vy *= 0.96; ch.rot += ch.vx * dt;
        const rr = Math.hypot(ch.x / 0.6, (ch.y - 0.05) / 0.48); if (rr > 0.8) { ch.x *= 0.8 / rr; ch.y = 0.05 + (ch.y - 0.05) * 0.8 / rr; ch.vx *= -0.5; ch.vy *= -0.5; }
      }
      for (const ch of S3.chunks) if (ch.size < 0.13) { S3.chyme += ch.size * 0.5; ch.size = 0; }
      S3.chunks = S3.chunks.filter(c => c.size > 0);
      const harm = Math.max(0, S3.acid - S3.mucus - 0.05);
      S3.lining = clamp(S3.lining - harm * dt * 0.5 + (harm === 0 ? dt * 0.03 : 0), 0, 1);
    },
    soupy() { const big = S3.chunks.reduce((m, c) => Math.max(m, c.size), 0); return big < 0.3 && S3.chyme > 0.08; },
    valve() {
      S3.valveT = 0.8;
      if (S3.chyme < 0.05) return S3.chunks.length ? 'chunky' : 'empty';
      const r = Math.min(S3.chyme, 0.25); S3.chyme -= r; S3.released += r; return 'ok';
    }
  };
  return S3;
}
function stomachGeo(w, h) { const s = Math.min(w * 0.42, h * 0.62); return { cx: w * 0.47, cy: h * 0.53, s }; }
function drawStomachScene(c, w, h, t, S3, extra = {}) {
  tissueBG(c, w, h, t, '#ffe5ec', '#ffc2d1');
  const { cx, cy, s } = stomachGeo(w, h);
  const squish = 1 + Math.sin(t * 20) * 0.03 * (S3.churnT > 0 ? 1 : 0);

  c.fillStyle = '#ff9eb1'; c.strokeStyle = INK; c.lineWidth = 4; rrect(c, cx - s * 0.35, -10, s * 0.26, cy - s * 0.55, 14); c.fill(); c.stroke();

  c.fillStyle = '#ffb4a2'; rrect(c, cx + s * 0.62, cy + s * 0.18, w - (cx + s * 0.62) + 10, s * 0.2, s * 0.1); c.fill(); c.stroke();
  pillLabel(c, '➜ small intestine', Math.min(w - 90, cx + s * 0.95), cy + s * 0.53, clamp(S() * 0.02, 11, 15));
  // stomach wall (thick, lining shows mucus)
  c.save(); c.translate(cx, cy); c.scale(squish, 1 / squish);
  c.fillStyle = '#ff8fab';
  c.beginPath(); c.ellipse(0, s * 0.05, s * 0.72, s * 0.58, 0.15, 0, TAU); c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
  // inner cavity
  const lin = S3.lining;
  c.fillStyle = lin > 0.6 ? '#ffd6e0' : lin > 0.3 ? '#ffc9b9' : '#ffb3a7';
  c.beginPath(); c.ellipse(0, s * 0.05, s * 0.62, s * 0.48, 0.15, 0, TAU); c.fill();
  // mucus layer
  c.strokeStyle = `rgba(160,230,200,${0.25 + S3.mucus * 0.7})`; c.lineWidth = 4 + S3.mucus * 12;
  c.beginPath(); c.ellipse(0, s * 0.05, s * 0.6, s * 0.46, 0.15, 0, TAU); c.stroke();
  // soup (chyme + acid tint)
  c.save(); c.beginPath(); c.ellipse(0, s * 0.05, s * 0.58, s * 0.44, 0.15, 0, TAU); c.clip();
  const lvl = s * (0.45 - clamp(0.15 + S3.chyme * 0.8 + S3.chunks.length * 0.02, 0, 0.85));
  c.fillStyle = `rgba(${Math.round(lerp(255, 200, S3.acid))},${Math.round(lerp(220, 235, S3.acid))},${Math.round(lerp(150, 90, S3.acid))},.75)`;
  c.beginPath(); c.moveTo(-s, lvl); for (let i = 0; i <= 20; i++) c.lineTo(-s + i * s / 10, lvl + Math.sin(i + t * (S3.churnT > 0 ? 12 : 2)) * s * 0.015); c.lineTo(s, s); c.lineTo(-s, s); c.closePath(); c.fill();
  // acid bubbles
  for (let i = 0; i < Math.round(S3.acid * 14); i++) { const bx = Math.sin(i * 7.1) * s * 0.45, by = s * 0.35 - ((t * 0.2 + i * 0.13) % 1) * s * 0.6; if (by > lvl) { c.strokeStyle = 'rgba(80,140,40,.6)'; c.lineWidth = 2; ell(c, bx, by, 4, 4); c.stroke(); } }
  // pepsin critters (scissors)
  for (let i = 0; i < Math.round(S3.pepsin * 8); i++) { const a = t * 0.8 + i * 1.3, px = Math.cos(a) * s * 0.35, py = s * 0.12 + Math.sin(a * 1.3) * s * 0.2; emoji(c, '✂️', px, py, s * 0.07); if (S3.acid < 0.2) txt(c, 'z', px + 10, py - 12, 12, '#fff'); }
  c.restore();
  // chunks
  for (const ch of S3.chunks) {
    const x = ch.x * s, y = ch.y * s, r = s * 0.13 * ch.size;
    if (ch.type === 'protein') { c.save(); c.translate(x, y); c.rotate(ch.rot); foodBlob(c, 0, 0, r, '#d4a373', 0, 10, 3); c.strokeStyle = 'rgba(120,70,30,.5)'; c.lineWidth = 2; for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(-r * 0.6, k * r * 0.3); c.lineTo(r * 0.6, k * r * 0.3); c.stroke(); } c.restore(); }
    else if (ch.type === 'starch') foodBlob(c, x, y, r, '#f6c97a', 0, 8, 5);
    else foodBlob(c, x, y, r, '#90be6d', 0, 7, 9);
  }
  // pyloric valve
  const vx = s * 0.6, vy = s * 0.28, open = S3.valveT > 0;
  c.fillStyle = open ? '#06d6a0' : '#ff4d6d'; c.strokeStyle = INK; c.lineWidth = 3;
  ell(c, vx, vy, s * 0.05, s * (open ? 0.1 : 0.04)); c.fill(); c.stroke();
  face(c, s * 0.05, -s * 0.05 + s * 0.42 - s * 0.1, s * 0.07, t, S3.lining < 0.4 ? 'sad' : S3.churnT > 0 ? 'wow' : 'happy');
  c.restore();
  // meters panel
  const mw = Math.min(220, w * 0.26), mx = w - mw - 14, my = h * 0.12, mh = clamp(S() * 0.022, 11, 18), gap = mh * 2.9;
  if (w > 600) {
    c.fillStyle = 'rgba(255,250,240,.93)'; rrect(c, mx - 10, my - mh * 2.2, mw + 20, gap * (extra.rows || 4) + mh, 14); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    meter(c, mx, my, mw, mh, S3.acid, '#a7c957', '🧪 Acid', [0.35, 0.75]);
    meter(c, mx, my + gap, mw, mh, S3.mucus, '#95d5b2', '🛡️ Mucus');
    meter(c, mx, my + gap * 2, mw, mh, S3.lining, S3.lining < 0.4 ? '#ff4d6d' : '#06d6a0', '😊 Comfy');
    meter(c, mx, my + gap * 3, mw, mh, clamp(S3.chyme, 0, 1), '#ffd166', '🍲 Chyme');
    if (extra.rows > 4) meter(c, mx, my + gap * 4, mw, mh, extra.prog, '#4cc9f0', extra.progLabel);

      .forEach((m, i) => vmeter(c, 10 + i * (vw + 22), y0, vw, vh, m[0], m[1], m[2], m[3]));
    if (extra.rows > 4) meter(c, w * 0.5, 14, w * 0.45, 14, extra.prog, '#4cc9f0', extra.progLabel);

function stomachToolCtrls(S3, extraItems = [], log = () => {}) {
  const items = [{ label: '🌀 Churn', id: 'ch', hint: true, cls: 'pur', key: ['1', 'c'], onTap: () => { S3.churn(); log('churn'); } }];
  if (S3.tools.acid) items.push({ label: '🧪 Acid', id: 'ac', cls: 'grn', key: ['2', 'a'], onTap: () => { S3.acid = Math.min(1, S3.acid + 0.15); sfx.blip(); log('acid'); } });
  if (S3.tools.pepsin) items.push({ label: '✂️ Pepsin', cls: 'yel', key: ['3', 'p'], onTap: () => { S3.pepsin = Math.min(1, S3.pepsin + 0.3); sfx.blip(); log('pepsin'); } });
  if (S3.tools.mucus) items.push({ label: '🛡️ Mucus', id: 'mu', cls: 'blue', key: ['4', 'm'], onTap: () => { S3.mucus = Math.min(1, S3.mucus + 0.2); sfx.squish(); log('mucus'); } });
  items.push({ label: '🚪 Valve', cls: 'org', key: ['5', 'v'], onTap: () => { const r = S3.valve(); log('valve:' + r);
    if (r === 'ok') { sfx.slurp(); floatTxt(W * 0.75, H * 0.6, 'squirt!', '#ffd166'); } else if (r === 'chunky') { sfx.bad(); toast('Chunks stay in! Only 🍲 soup goes out', true); } else toast('No soup yet! 🌀'); } });
  ctrls(items.concat(extraItems));
}

function m3Challenge() {
  const S3 = stomachSim({ acid: 0.05, tools: { acid: false, pepsin: false, mucus: false } });
  let churns = 0;
  return {
    init() {
      S3.add('protein', 1); S3.add('protein', 0.9); S3.add('starch', 0.8);
      stomachToolCtrls(S3, [], k => { if (k === 'churn') churns++; if (k === 'valve:ok' && S3.chunks.length === 0) challengeDone(true, 'All soupy! Nice churning!'); });
    },
    update(dt) {
      S3.step(dt);
      const total = S3.chunks.reduce((a, c) => a + c.size, 0);
      goal('🥪 ➜ 🍲 Churn it into soup! 🌀', 1 - total / 2.7);
      if ((S3.stuck || 0) >= 4 && !this.h) { this.h = true; toast('🍗 Chicken won\'t get smaller… 🤔'); }
    },
    draw(c, w, h, t) { drawStomachScene(c, w, h, t, S3); },
    down() { S3.churn(); churns++; },
    demo() { showDemo(() => { const g2 = stomachGeo(W, H); return [[g2.cx, g2.cy]]; }, true, 4); },

}

function m3Exp() {
  const S3 = stomachSim({ acid: 0.1, mucus: 0.6 });
  const Gs = { noacid: false, protein: false, mucus: false, valve: false, chunky: false };
  const upd = () => expGoals([{ t: '✂️ no 🧪', ok: Gs.noacid }, { t: '🧪+✂️ ➜ 🍗', ok: Gs.protein }, { t: '🛡️ safe', ok: Gs.mucus }, { t: '🚪 too soon', ok: Gs.chunky }, { t: '🍲 ➜ 🚪', ok: Gs.valve }]);
  let protein0 = 0;
  return {
    init() {
      const refill = () => { S3.add('protein', 1); S3.add('starch', 0.8); S3.add('veg', 0.7); protein0 = 1; };
      refill();
      stomachToolCtrls(S3, [{ label: '🍗 Add food', cls: 'sm', onTap: () => { if (S3.chunks.length < 8) { refill(); sfx.squish(); } } }, bossBtn()], k => {
        if (k === 'pepsin' && S3.acid < 0.2) { Gs.noacid = true; upd(); toast('✂️ Pepsin is sleepy 💤 Needs 🧪 acid!'); hintCtl('ac'); }
        if (k === 'valve:chunky') { Gs.chunky = true; upd(); }
        if (k === 'valve:ok') { Gs.valve = true; upd(); }
      });
      upd();
    },
    update(dt) {
      const pBefore = S3.chunks.filter(c => c.type === 'protein').length;
      S3.step(dt);
      const pAfter = S3.chunks.filter(c => c.type === 'protein').length;
      if (pAfter < pBefore && S3.active > 0) { Gs.protein = true; upd(); burst(W * 0.47, H * 0.4, 'PROTEIN SNIP!', '#ffd23f', 0.7); }
      if (S3.acid > 0.5 && S3.mucus > S3.acid - 0.05 && S3.lining > 0.8) { if (!Gs.mucus) { this.safe = (this.safe || 0) + dt; if (this.safe > 3) { Gs.mucus = true; upd(); toast('🧪 + 🛡️ = 😊 Happy stomach!'); } } }
      if (S3.lining < 0.5 && !this.ouch) { this.ouch = true; toast('Ouch! Add 🛡️ Mucus!', true); hintCtl('mu'); }
      if (S3.lining > 0.8) this.ouch = false;
    },
    draw(c, w, h, t) { drawStomachScene(c, w, h, t, S3); },
    down() { S3.churn(); }
  };
}

function m3Boss(easy) {
  const S3 = stomachSim({ acid: 0.2, mucus: 0.6 });
  const NEED = easy ? 1.2 : 1.9;
  let meals = 0, nextMeal = 0, done = false, minLining = 1;
  const finish = win => { if (done) return; done = true; bossDone({ win, great: win && minLining > 0.6, msg: `Sent ${Math.round(Math.min(1, S3.released / NEED) * 100)}% of the chyme. Lowest lining comfort: ${Math.round(minLining * 100)}%.` }); };
  return {
    init() { stomachToolCtrls(S3, [], () => {}); },
    update(dt) {
      if (done) return;
      S3.step(dt);
      nextMeal -= dt;
      if (nextMeal <= 0 && meals < 4) { meals++; nextMeal = easy ? 16 : 12; S3.add('protein', 1); S3.add(pick(['starch', 'veg']), 0.8); if (!easy) S3.add('protein', 0.8); toast(`🍽️ Meal ${meals}!`); sfx.whoosh(); }
      minLining = Math.min(minLining, S3.lining);
      if (S3.lining <= 0) { toast('Ouch! Keep 🛡️ up!', true); finish(false); }
      goal(`🧪 green · 🛡️ up · 🌀 ➜ 🍲 ➜ 🚪 &nbsp; ${Math.round(Math.min(1, S3.released / NEED) * 100)}%`, S3.released / NEED);
      if (S3.released >= NEED) finish(true);
    },
    draw(c, w, h, t) { drawStomachScene(c, w, h, t, S3, { rows: 5, prog: S3.released / NEED, progLabel: '🚪 Sent' }); },
    down() { S3.churn(); },
    timeUp() { finish(false); }

function drawVillus(c, x, base, wd, hgt, t, lit, i) {

  c.beginPath(); c.moveTo(x - wd / 2, base); c.lineTo(x - wd / 2 + sway * 0.5, base - hgt + wd / 2); c.arc(x + sway, base - hgt + wd / 2, wd / 2, Math.PI, 0); c.lineTo(x + wd / 2, base); c.fill(); c.stroke();

  c.strokeStyle = '#ff4d6d'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - wd * 0.15, base); c.lineTo(x - wd * 0.15 + sway * 0.6, base - hgt * 0.7); c.quadraticCurveTo(x + sway, base - hgt * 0.95, x + wd * 0.15 + sway * 0.6, base - hgt * 0.7); c.lineTo(x + wd * 0.15, base); c.stroke();
}

}

/* ================= MISSION 5: LIVER, GALLBLADDER & PANCREAS ================= */
// Liver "Filter Factory": a conveyor of blood items from the gut. Swipe/tap-sort each into a bin:
//  🔋 STORE (sugar → glycogen, vitamins), 📦 SEND ON (amino acids, some sugar to the body),
//  🧹 CLEAN (toxins → made harmless), plus 🟢 BILE button to make bile for fat drops.
const BINS = [
  { id: 'store', ic: '🔋', name: 'STORE', col: '#ffd23f', takes: ['sugar', 'vit'] },
  { id: 'send', ic: '📦', name: 'SEND', col: '#4cc9f0', takes: ['amino', 'sugar'] },
  { id: 'clean', ic: '🧹', name: 'CLEAN', col: '#9b5de5', takes: ['toxin'] },
];
function factoryGeo(w, h) { const beltY = h * 0.34, binY = h * 0.78, bw = Math.min(200, w * 0.27); return { beltY, binY, bw, xs: [w * 0.2, w * 0.5, w * 0.8] }; }
function drawFactory(c, w, h, t, st) {
  tissueBG(c, w, h, t, '#ffe1d6', '#f7b9a4', 'rgba(255,255,255,.2)');
  const F = factoryGeo(w, h);
  // big friendly liver backdrop
  c.globalAlpha = 0.9; drawOrgan(c, 'liver', w * 0.5, h * 0.56, Math.min(w * 0.42, h * 0.4), t, { mood: st.mood || 'happy' }); c.globalAlpha = 1;
  // blood belt
  c.fillStyle = '#ff6b8b'; c.strokeStyle = INK; c.lineWidth = 4; rrect(c, -10, F.beltY - 28, w + 20, 56, 28); c.fill(); c.stroke();
  for (let i = 0; i < 12; i++) { const x = ((i * 120 + t * 60) % (w + 120)) - 60; c.fillStyle = 'rgba(255,255,255,.35)'; ell(c, x, F.beltY, 16, 6); c.fill(); }
  pillLabel(c, '🩸 from the intestine', Math.min(150, w * 0.25), F.beltY - 44, clamp(S() * 0.02, 11, 15));
  // bins
  BINS.forEach((b, i) => {
    const x = F.xs[i], y = F.binY, lit = st.lit === i;
    c.fillStyle = lit ? '#fff' : b.col; rrect(c, x - F.bw / 2, y - 46, F.bw, 92, 22); c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
    emoji(c, b.ic, x - F.bw * 0.22, y, 42); txt(c, b.name, x + F.bw * 0.14, y + 2, clamp(F.bw * 0.15, 16, 28), '#fff');
    if (st.counts) txt(c, String(st.counts[b.id] || 0), x + F.bw / 2 - 6, y - 46, 20, '#ffd23f');
  });
  // glycogen battery
  if (st.glyco != null) { vmeter(c, w - 44, h * 0.42, 28, h * 0.22, st.glyco, '#ffd23f', '🔋'); }
  // items
  for (const it of st.items) { drawNut(c, it.k, it.x, it.y, it.r, t); if (it.k === 'toxin') txt(c, '!', it.x, it.y - it.r - 10, 16, '#fff'); }
  // fat drop + bile
  if (st.fat) { const f = st.fat; c.fillStyle = '#ffc46b'; c.strokeStyle = INK; c.lineWidth = 3; if (f.split < 1) { ell(c, f.x, f.y, f.r * (1 - f.split * 0.6), f.r * (1 - f.split * 0.6)); c.fill(); c.stroke(); } for (let k = 0; k < 8 * f.split; k++) { ell(c, f.x + Math.cos(k * 0.8) * f.r * f.split, f.y + Math.sin(k * 0.8) * f.r * f.split * 0.7, f.r * 0.22, f.r * 0.22); c.fill(); c.stroke(); } }
}
function factorySim(o) {
  const st = { items: [], lit: -1, drag: null, counts: {}, right: 0, wrong: 0, missed: 0, glyco: 0.3 };
  st.spawn = k => { const F = factoryGeo(W, H); st.items.push({ k, x: -20, y: F.beltY, r: S() * 0.03, vx: o.speed || 70 }); };
  st.sortTo = (it, i) => {
    const b = BINS[i]; it.gone = true;
    if (b.takes.includes(it.k)) {
      st.right++; st.counts[b.id] = (st.counts[b.id] || 0) + 1; sfx.good();
      if (b.id === 'store' && it.k === 'sugar') { st.glyco = Math.min(1, st.glyco + 0.08); floatTxt(factoryGeo(W, H).xs[i], factoryGeo(W, H).binY - 60, '🍬➜🔋 glycogen', '#ffd23f', 20); }
      else if (b.id === 'clean') floatTxt(factoryGeo(W, H).xs[i], factoryGeo(W, H).binY - 60, '✨ made safe!', '#fff', 20);
      else floatTxt(factoryGeo(W, H).xs[i], factoryGeo(W, H).binY - 60, '+1', '#06d6a0', 22);
      o.onRight && o.onRight(it, b);
    } else { st.wrong++; sfx.bad(); st.mood = 'sad'; setTimeout(() => st.mood = 'happy', 700); toast(it.k === 'toxin' ? '☠️ ➜ 🧹 CLEAN it!' : it.k === 'vit' ? '🌟 ➜ 🔋 STORE' : it.k === 'amino' ? '🔵 ➜ 📦 SEND' : '🍬 ➜ 🔋 or 📦', true); o.onWrong && o.onWrong(it, b); }
    st.items = st.items.filter(z => !z.gone);
  };
  st.step = dt => {
    for (const it of st.items) { if (st.drag && st.drag.it === it) continue; it.x += it.vx * dt; }
    for (const it of st.items) if (it.x > W + 20) { it.gone = true; if (it.k === 'toxin') { st.missed++; sfx.bad(); toast('☠️ A toxin slipped by! 🧹', true); } }
    st.items = st.items.filter(z => !z.gone);
  };
  const binAt = (x, y) => { const F = factoryGeo(W, H); for (let i = 0; i < 3; i++) if (Math.abs(x - F.xs[i]) < F.bw / 2 + 10 && Math.abs(y - F.binY) < 70) return i; return -1; };
  st.down = (x, y) => { for (let i = st.items.length - 1; i >= 0; i--) { const it = st.items[i]; if (dist(x, y, it.x, it.y) < it.r + 28) { st.drag = { it, sx: x, sy: y }; sfx.blip(); return true; } } return false; };
  st.move = (x, y) => { if (!st.drag) return; st.drag.it.x = x; st.drag.it.y = y; st.lit = binAt(x, y); };
  st.up = (x, y) => { if (!st.drag) return; const it = st.drag.it; st.drag = null; const i = binAt(x, y); st.lit = -1;
    if (i >= 0) st.sortTo(it, i); else { it.y = factoryGeo(W, H).beltY; } };
  return st;
}

function m5Challenge() {
  const st = factorySim({ speed: 120 });
  let n = 0, spawnT = 0;
  return {
    init() { goal('🩸 Sort the blood stuff into the bins! 👆 Drag', 0); },
    update(dt) {
      spawnT -= dt; if (spawnT <= 0 && n < 16) { n++; spawnT = 0.7; st.spawn(pick(['sugar', 'amino', 'vit', 'toxin', 'toxin'])); }
      st.step(dt); goal('🩸 Sort the blood stuff into the bins! 👆 Drag', n / 16);
      if (n >= 16 && !st.items.length) this.timeUp();
    },
    draw(c, w, h, t) { drawFactory(c, w, h, t, st); },
    down: (x, y) => st.down(x, y), move: (x, y) => st.move(x, y), up: (x, y) => st.up(x, y),
    demo() { showDemo(() => { const F = factoryGeo(W, H); return [[W * 0.3, F.beltY], [F.xs[2], F.binY]]; }, false, 5); },
    timeUp() { challengeDone(st.right >= 10, st.right >= 10 ? `${st.right} sorted! You worked like a liver!` : `${st.right} sorted. Too fast! What goes where?`); }
  };
}

function m5Exp() {
  const G5 = { store: false, send: false, clean: false, bile: false, grow: false };
  let spawnT = 0, bileT = 0, liverSize = 1, regrow = null;
  const upd = () => expGoals([{ t: '🔋 store', ok: G5.store }, { t: '📦 send', ok: G5.send }, { t: '🧹 clean', ok: G5.clean }, { t: '🟢 bile ➜ 🧈', ok: G5.bile }, { t: '🌱 regrow', ok: G5.grow }]);
  const st = factorySim({ speed: 55, onRight: (it, b) => { G5[b.id] = true; upd(); } }); st.glyco = 0.2;
  return {
    init() {
      ctrls([
        { label: '🍬', cls: 'yel sm', onTap: () => st.spawn('sugar') }, { label: '🔵', cls: 'blue sm', onTap: () => st.spawn('amino') },
        { label: '🌟', cls: 'grn sm', onTap: () => st.spawn('vit') }, { label: '☠️', cls: 'pur sm', onTap: () => st.spawn('toxin') },
        { label: '🧈 Fat + 🟢 Bile', id: 'bile', cls: 'org', onTap: () => { st.fat = { x: W * 0.5, y: H * 0.56, r: S() * 0.08, split: 0 }; bileT = 1.6; sfx.squish(); } },
        { label: '🌱 Regrow test', cls: 'grn', onTap: () => { regrow = { t: 0 }; liverSize = 0.65; sfx.blip(); } },
        bossBtn()
      ]);
      upd();
    },
    update(dt) {
      spawnT -= dt; if (spawnT <= 0) { spawnT = 2.2; st.spawn(pick(['sugar', 'amino', 'vit', 'toxin'])); }
      st.step(dt);
      if (st.fat) { if (bileT > 0) { bileT -= dt; st.fat.split = Math.min(1, st.fat.split + dt * 0.8); if (st.fat.split >= 1 && !G5.bile) { G5.bile = true; upd(); burst(W / 2, H * 0.45, 'DROPLETS!', '#80ed99', 0.8); toast('🟢 Bile breaks 🧈 fat into tiny drops!'); } } else { st.fat.t = (st.fat.t || 0) + dt; if (st.fat.t > 1.5) st.fat = null; } }
      if (regrow) { regrow.t += dt; liverSize = Math.min(1, 0.65 + regrow.t * 0.08); if (liverSize >= 1) { regrow = null; G5.grow = true; upd(); burst(W / 2, H * 0.5, 'REGROWN!', '#06d6a0', 0.9); toast('🌱 The liver can regrow lost parts!'); } }

      if (st.fat && bileT > 0) { drawOrgan(c, 'gallbladder', w * 0.32, h * 0.55, S() * 0.06, t, { mood: 'wow' }); for (let k = 0; k < 5; k++) { const q = (t * 1.5 + k / 5) % 1; c.fillStyle = '#80ed99'; ell(c, lerp(w * 0.34, w * 0.48, q), h * 0.56, 6, 6); c.fill(); c.lineWidth = 2; c.stroke(); } }
    },
    down: (x, y) => st.down(x, y), move: (x, y) => st.move(x, y), up: (x, y) => st.up(x, y),
    demo() { showDemo(() => { const F = factoryGeo(W, H), it = st.items[0]; return [[it ? it.x + 30 : W * 0.3, F.beltY], [F.xs[0], F.binY]]; }, false, 6); }
  };
}

function m5Boss(easy) {
  // Liver + helpers boss: sort the blood stream; when a FAT MEAL arrives, squeeze the gallbladder (bile);
  // when the SUGAR meter rises too high, press the pancreas (insulin) so sugar can be stored.
  const NEED = easy ? 16 : 22;
  const st = factorySim({ speed: easy ? 60 : 80 });
  let spawnT = 0.5, blood = 0.5, fatT = 8, done = false, fatOpen = false, insulinCD = 0, highT = 0;
  st.glyco = 0.2;
  const finish = win => { if (done) return; done = true; bossDone({ win, great: win && st.wrong <= 1 && st.missed === 0, msg: `✅ ${st.right} · ❌ ${st.wrong} · ☠️ missed ${st.missed}` }); };
  return {
    init() {
      ctrls([
        { label: '🟢 Gallbladder: BILE', id: 'bile', cls: 'grn', key: ['1', 'b'], onTap: () => { if (st.fat) { st.fat.bile = true; sfx.squish(); } else { sfx.blip(); toast('No fat yet! 🧈'); } } },
        { label: '💛 Pancreas: INSULIN', id: 'ins', cls: 'yel', key: ['2', 'i'], onTap: () => { if (insulinCD > 0) return; insulinCD = 2; sfx.good(); blood = Math.max(0.35, blood - 0.3); st.glyco = Math.min(1, st.glyco + 0.1); floatTxt(W * 0.5, H * 0.2, '💛 insulin: 🍬 ➜ cells & 🔋', '#ffd23f', 20); } },
      ]);
    },
    update(dt) {
      if (done) return;
      spawnT -= dt; insulinCD = Math.max(0, insulinCD - dt);
      if (spawnT <= 0) { spawnT = easy ? 1.25 : 0.95; const k = pick(['sugar', 'sugar', 'amino', 'vit', 'toxin', 'toxin']); st.spawn(k); if (k === 'sugar') blood = Math.min(1, blood + 0.05); }
      st.step(dt);
      blood = Math.max(0.2, blood - dt * 0.006);
      if (blood > 0.8) { highT += dt; if (highT > 1 && !this.bw) { this.bw = true; toast('🍬 Blood sugar high! 💛 INSULIN'); hintCtl('ins'); } } else { highT = 0; this.bw = false; }
      fatT -= dt;
      if (fatT <= 0 && !st.fat) { fatT = easy ? 16 : 12; st.fat = { x: W * 0.5, y: H * 0.56, r: S() * 0.08, split: 0, life: 6 }; toast('🧈 Fatty meal! 🟢 BILE!'); hintCtl('bile'); sfx.whoosh(); }
      if (st.fat) { st.fat.life -= dt; if (st.fat.bile) st.fat.split = Math.min(1, st.fat.split + dt); if (st.fat.split >= 1) { st.right += 2; burst(W / 2, H * 0.5, 'DROPLETS!', '#80ed99', 0.8); st.fat = null; } else if (st.fat.life <= 0) { st.wrong++; toast('🧈 Fat stayed in a big blob!', true); st.fat = null; } }
      if (blood >= 1 && !this.over) { this.over = true; st.wrong++; blood = 0.7; toast('Too much sugar! 💛 Use insulin!', true); } if (blood < 0.9) this.over = false;
      goal(`👆 Sort · 🧈→🟢 · 🍬 high→💛 &nbsp; ✅ ${st.right}/${NEED}`, st.right / NEED);
      if (st.right >= NEED) finish(true);
    },
    draw(c, w, h, t) {
      drawFactory(c, w, h, t, st);
      vmeter(c, 16, h * 0.42, 28, h * 0.22, blood, blood > 0.8 ? '#ff4d6d' : '#ffd23f', '🍬🩸', [0.3, 0.75]);
      if (st.fat && st.fat.bile) { drawOrgan(c, 'gallbladder', w * 0.32, h * 0.55, S() * 0.06, t, { mood: 'wow' }); }
      drawOrgan(c, 'pancreas', w * 0.12, h * 0.25, S() * 0.05, t, { mood: insulinCD > 1 ? 'wow' : 'happy' });
    },
    down: (x, y) => st.down(x, y), move: (x, y) => st.move(x, y), up: (x, y) => st.up(x, y),
    timeUp() { finish(false); }
  };
}

function colonGeo(w, h) {

  st.down = (x, y) => { for (const f of st.tray) if (dist(x, y, f.x, f.y) < 40) { st.drag = { f, x, y }; sfx.blip(); return; }
    for (let i = st.placed.length - 1; i >= 0; i--) { const f = st.placed[i]; const P = plateGeo(W, H); const fx = f.cup ? P.cup[0] : f.x, fy = f.cup ? P.cup[1] : f.y; if (dist(x, y, fx, fy) < 36) { st.placed.splice(i, 1); st.tray.push(f); st.layoutTray(); st.recalc(); sfx.blip(); o.onChange && o.onChange(); return; } } };

}

    onKill: (A, e) => { if (e.big) return; A.score++; if (e.kind === 'sugarCloud') floatTxt(e.x, e.y - 20, '🔋 glycogen!', '#ffd23f', 20); else if (e.kind === 'toxin') floatTxt(e.x, e.y - 20, '✨ made safe!', '#fff', 20); else floatTxt(e.x, e.y - 20, '🫧 droplets!', '#80ed99', 20); },
