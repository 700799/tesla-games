    boss: A => A.add('toxin', { x: W / 2, y: H * 0.2, vx: 120, vy: 30, r: Math.min(W, H) * 0.15, hp: easy ? 20 : 28, maxHp: easy ? 20 : 28, weak: ['clean'], weakIc: '🧹' }),
  }),
});

/* M6 — Germ Guard: white-cell shots poof bad germs (don't hit friendly bacteria!), soak ray dries watery blobs. */
MISSIONS[5].boss = Object.assign(MISSIONS[5].boss, {
  title: 'Germ Guard', time: 95, say: 'Blast bad germs! Save the green friends! Soak watery blobs!',
  art: bossArt([['⚪', (c, x, y, r, t) => drawGerm(c, x, y, r * 0.5, t)], ['💧', mini('wetblob')], ['💚', mini('friend')]]),
  more: 'White blood cells fight germs. Friendly gut bacteria (green) help you — don\'t shoot them!',
  tip: '⚪ → purple germs · 💧 → watery blobs · 💚 = friends!', win: 'Gut guarded! Water saved, friends happy!',
  scene: easy => arena({ dir: -1, need: easy ? 12 : 16, hearts: easy ? 4 : 3, weapons: [WP.wbc, WP.soak], read: 'White cells blast bad germs. Soak watery blobs. Green friends are good!',
    bg: bgTube('#efe0ff', '#c9a6ff'),
    goal: A => A.boss ? '👑 GERM KING! ⚪⚪⚪' : `⚪→🦠 💧→💦 · 💚 friends! &nbsp; ✅ ${A.score}/${A.need}`,
    update: arenaUpd(A => { every(A, 'g', easy ? 2.2 : 1.7, () => A.add('germ', { col: pick(['#9b5de5', '#7b2cbf']), weak: ['wbc'], weakIc: '⚪', hp: 1, vx: rand(-90, 90) })); every(A, 'w', easy ? 3.2 : 2.7, () => A.add('wetblob', { water: 1, weak: ['soak'], hp: 99, harm: false }));
      every(A, 'fr', 3.6, () => A.add('friend', { friend: true, col: '#06d6a0', vx: rand(-70, 70), harm: false })); }),
    canHit: (A, e, s) => { if (e.kind === 'wetblob') { if (s.w !== 'soak') return '💧'; e.water -= 0.2; e.hitT = 0.1; sfx.slurp(); if (e.water < 0.66) { e.dead = true; A.score++; sparks(e.x, e.y, '#7ad3ff', 12); floatTxt(e.x, e.y - 20, '✅ just right!', '#06d6a0', 20); } return 'done'; } return e.weak.includes(s.w); },
    onKill: (A, e) => { if (!e.big && e.kind === 'germ') { A.score++; floatTxt(e.x, e.y - 20, 'POOF!', '#fff', 22); } },
    boss: A => A.add('germ', { x: W / 2, y: H * 0.2, vx: 130, vy: 40, col: '#7b2cbf', r: Math.min(W, H) * 0.14, hp: easy ? 22 : 30, maxHp: easy ? 22 : 30, weak: ['wbc'], weakIc: '⚪' }),
  }),
});

/* M7 — Fuel Blaster: hungry body-part bubbles need the right food. Dodge candy asteroids. */
const NEEDS = [{ ic: '⚡', w: 'carb', why: 'energy' }, { ic: '💪', w: 'prot', why: 'build & repair' }, { ic: '🌟', w: 'veg', why: 'vitamins' }, { ic: '💧', w: 'water', why: 'thirsty' }];
MISSIONS[6].boss = Object.assign(MISSIONS[6].boss, {
  title: 'Fuel Blaster', time: 95, say: 'Feed each bubble what it needs! Dodge the candy!',
  art: bossArt([['🍝', '⚡'], ['🍗', '💪'], ['🥦', '🌟'], ['💧', '💧']]),
  more: '⚡ energy → carbs 🍝 · 💪 build & repair → protein 🍗 · 🌟 vitamins → veggies & fruit 🥦 · 💧 thirsty → water.',
  tip: '⚡🍝 · 💪🍗 · 🌟🥦 · 💧💧', win: 'Five-star fuel! Every body part powered up!',
  scene: easy => arena({ dir: -1, need: easy ? 12 : 16, hearts: easy ? 4 : 3, weapons: [WP.carb, WP.prot, WP.veg, WP.water], read: 'Energy, carbs. Build, protein. Vitamins, veggies. Thirsty, water!',
    bg: (c, w, h, t) => { c.fillStyle = '#fff1d0'; c.fillRect(0, 0, w, h); c.fillStyle = '#ffd6a5'; for (let i = 0; i < w; i += 60) for (let j = -60; j < h; j += 60) if (((i + j) / 60) % 2 === 0) c.fillRect(i, j + (t * 30 % 120), 60, 60); },
    goal: A => A.boss ? '🤖 HUNGRY ROBOT! match its bubble!' : `⚡🍝 💪🍗 🌟🥦 💧💧 &nbsp; 🍽️ ${A.score}/${A.need}`,
    update: arenaUpd(A => { every(A, 'n', easy ? 2.1 : 1.6, () => { const n = pick(NEEDS); A.add('need', { ic: n.ic, weak: [n.w], hp: 1, harm: false, vx: rand(-70, 70) }); }); every(A, 'c', easy ? 3.5 : 2.6, () => { const e = A.add('apple', { vy: rand(140, 200), hp: 99 }); e.kind = 'need'; e.ic = pick(['🍭', '🍩', '🥤']); e.harm = true; e.candy = true; e.weak = []; });
      if (A.boss && !A.boss.dead) { A.boss.cycle = (A.boss.cycle || 0) - A._dt; if (A.boss.cycle <= 0) { const n = pick(NEEDS); A.boss.cycle = easy ? 3.2 : 2.4; A.boss.need = n; A.boss.weak = [n.w]; A.boss.weakIc = n.ic; } } }),
    canHit: (A, e, s) => e.candy ? '🙅' : e.weak.includes(s.w) ? true : WP[e.weak[0]].ic,
    onKill: (A, e) => { if (!e.big) { A.score++; const n = NEEDS.find(n => n.w === e.weak[0]); floatTxt(e.x, e.y - 20, n ? n.ic + ' ' + n.why + '!' : 'YUM!', '#06d6a0', 20); } },
    boss: A => { const b = A.add('need', { x: W / 2, y: H * 0.22, vx: 120, vy: 30, ic: '🤖', r: Math.min(W, H) * 0.14, hp: easy ? 16 : 24, maxHp: easy ? 16 : 24, weak: ['carb'], weakIc: '⚡', harm: true }); return b; },
  }),
});

/* M8 — Body Defense: white cells vs cold germs, oxygen for tired cells. */
MISSIONS[7].boss = Object.assign(MISSIONS[7].boss, {
  title: 'Body Defense', time: 90, say: 'White cells blast germs! Oxygen for sleepy cells!',
  art: bossArt([['⚪', (c, x, y, r, t) => drawGerm(c, x, y, r * 0.5, t, '#4cc9f0')], ['🫁', '😴']]),
  more: 'Blood carries white blood cells that fight germs, and oxygen from your lungs to every cell.',
  tip: '⚪ → germs · 🫁 → 😴 cells', win: 'Body boss! Every organ working together!',
  scene: easy => arena({ dir: -1, need: easy ? 12 : 16, hearts: easy ? 4 : 3, weapons: [WP.wbc, WP.oxy], read: 'White cells blast germs. Oxygen for sleepy cells!',
    bg: (c, w, h, t) => { bgTube('#ffd6e0', '#ff8fab', 120)(c, w, h, t); for (let i = 0; i < 10; i++) { c.fillStyle = 'rgba(255,77,109,.5)'; ell(c, (i * 173) % w, (i * 97 + t * 150) % h, 14, 8); c.fill(); } },
    goal: A => A.boss ? '🤧 SNEEZE KING! ⚪⚪⚪' : `⚪→🦠 🫁→😴 &nbsp; ✅ ${A.score}/${A.need}`,
    update: arenaUpd(A => { every(A, 'g', easy ? 2.1 : 1.6, () => A.add('germ', { col: pick(['#4cc9f0', '#9b5de5']), weak: ['wbc'], weakIc: '⚪', hp: 1, vx: rand(-90, 90) })); every(A, 'o', easy ? 2.8 : 2.4, () => A.add('need', { ic: '😴', weak: ['oxy'], weakIc: '🫁', hp: 1, harm: false })); every(A, 'h', 15, () => A.add('heart', { pickup: 'heart', vy: 60 })); }),
    onKill: (A, e) => { if (e.big) return; A.score++; floatTxt(e.x, e.y - 20, e.kind === 'germ' ? 'POOF!' : '😃 O₂!', '#fff', 22); },
    boss: A => A.add('germ', { x: W / 2, y: H * 0.2, vx: 130, vy: 40, col: '#4cc9f0', r: Math.min(W, H) * 0.14, hp: easy ? 20 : 28, maxHp: easy ? 20 : 28, weak: ['wbc'], weakIc: '⚪' }),
  }),
});

/* ================= BODY ATLAS ================= */
const ATLAS = {
  mouth: { name: 'Mouth & Teeth', organ: 'mouth', icons: '🔪 🦷 💧 👅', from: 'Mouth', facts: ['Incisors cut, molars grind.', 'Saliva (amylase): starch ➜ sugar.', 'Tongue rolls a food ball.'] },
  esophagus: { name: 'Esophagus', organ: 'esophagus', icons: '💪 〰️ 🙃', from: 'Esophagus', facts: ['Muscle tube: throat ➜ stomach.', 'Squeeze waves = peristalsis.', 'Epiglottis flap guards the windpipe.'] },
  stomach: { name: 'Stomach', organ: 'stomach', icons: '🌀 🧪 ✂️ 🛡️', from: 'Stomach', facts: ['Churns food for a few hours.', 'Acid + pepsin start on protein.', 'Mucus shield; makes chyme.'] },
  smallInt: { name: 'Small Intestine', organ: 'smallInt', icons: '📏 🖐️ 🩸', from: 'Small Intestine', facts: ['About 6 m (20 ft) in adults.', 'Most digestion & absorption.', 'Villi push nutrients into blood.'] },
  liver: { name: 'Liver ⭐', organ: 'liver', icons: '🟢 🔋 🧹 🌱', from: 'Liver & Helpers', facts: ['Largest internal organ.', 'Makes bile for fat.', 'Stores glycogen & vitamins; cleans blood.', 'Can regrow parts of itself!'] },
  gallbladder: { name: 'Gallbladder', organ: 'gallbladder', icons: '🟢 📦', from: 'Liver & Helpers', facts: ['Stores bile.', 'Squeezes it out for fatty meals.'] },
  pancreas: { name: 'Pancreas', organ: 'pancreas', icons: '✂️ 💛', from: 'Liver & Helpers', facts: ['Sends digestive enzymes.', 'Makes insulin for blood sugar.'] },
  largeInt: { name: 'Large Intestine', organ: 'largeInt', icons: '💧 🦠 🌾 🚽', from: 'Large Intestine', facts: ['Soaks up water.', 'Home to helpful bacteria.', 'Fibre keeps waste moving.'] },
  plate: { name: 'Healthy Plate', organ: 'plate', icons: '⚡ 🧱 🔋 🌟 🌾 💧', from: 'Healthy Plate', facts: ['Carbs = energy; protein = build.', 'Fats = stored energy.', 'Vitamins, minerals, fibre, water!'] },
  heart: { name: 'Heart', organ: 'heart', icons: '💓 🩸', from: 'Bonus Tour', facts: ['Muscle that pumps blood.', 'Blood carries oxygen & food.'] },
  lungs: { name: 'Lungs', organ: 'lungs', icons: '🌬️ O₂ CO₂', from: 'Bonus Tour', facts: ['Oxygen in.', 'Carbon dioxide out.'] },
  kidneys: { name: 'Kidneys', organ: 'kidneys', icons: '🫘 🚰', from: 'Bonus Tour', facts: ['Filter the blood.', 'Make urine (pee).'] },
  brain: { name: 'Brain', organ: 'brain', icons: '🧠 ⚡', from: 'Bonus Tour', facts: ['Control center.', 'Thinking, moving, feeling.'] },
};

/* ================= start ================= */
setMuted(save.muted);
window.__game = {
  get scene() { return scene; }, get phase() { return phase; }, get mission() { return mi; }, get paused() { return paused; },
  save: () => save, missions: MISSIONS,
  start: i => startMission(i), run: k => runPhase(k), map: goMap, unlockAll: () => { for (let i = 0; i < MISSIONS.length; i++) save.stars[i] = Math.max(save.stars[i] || 0, 1); storeSave(); },
  bossDone, challengeDone, finish: finishMission, atlas: openAtlas,
};
requestAnimationFrame(frame);
</script>
