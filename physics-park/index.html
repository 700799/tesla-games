<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style><script id="nozoom-js">/* Block browser page zoom (iOS ignores user-scalable=no); in-game zoom uses pointer events and still works. */(function(){var p=function(e){e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,p,{passive:false})});})();</script>
<title>Physics Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  html,body { margin:0; height:100%; overflow:hidden; background:#86d6f7; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; cursor:pointer; border:0; color:inherit; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:flex; }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:60px; box-sizing:border-box;
    background:var(--accent); color:#fff; font-family:var(--toon); font-weight:400; font-size:26px; padding:10px 26px 4px;
    border-radius:999px; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); margin:6px 4px 8px; letter-spacing:1px;
    text-decoration:none; line-height:1; white-space:nowrap; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn.blue { background:var(--blue); color:var(--ink); }
  .btn.sm { font-size:20px; padding:8px 16px 2px; }
  .btn.round { width:60px; padding:0; font-family:inherit; font-size:26px; }
  .btn[disabled] { opacity:.45; pointer-events:none; }
  .btn.held { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); filter:brightness(1.1); }

  h1.big { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(46px,8vw,96px); line-height:1; color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1.big span { color:var(--accent); }
  h2.big { margin:0 0 6px; font-family:var(--toon); font-weight:400; font-size:clamp(30px,5vw,46px); color:var(--accent);
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; line-height:1.05; }

  /* title */
  #title { align-items:center; justify-content:center; }
  #title canvas.bg, #map canvas.bg { position:absolute; inset:0; width:100%; height:100%; }
  #titleCard { position:relative; padding:24px 34px 18px; text-align:center; max-width:min(780px,92vw); max-height:94vh; overflow:auto; box-sizing:border-box; }
  #titleCard p { font-size:clamp(16px,2.2vw,21px); margin:10px 0; }
  #titlePup { width:min(230px,40vw); height:min(230px,40vw); display:block; margin:6px auto 0; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(2deg); } }

  /* map */
  #map { flex-direction:column; }
  #mapTop { position:relative; z-index:2; display:flex; gap:8px; align-items:center; padding:8px 12px; flex-wrap:wrap; }
  #mapTop .ttl { font-family:var(--toon); font-size:clamp(24px,3.4vw,40px); color:var(--yellow); -webkit-text-stroke:2px var(--ink);
    paint-order:stroke; text-shadow:3px 3px 0 var(--ink); flex:1; text-align:center; min-width:160px; }
  .starTotal { padding:8px 14px 4px; font-family:var(--toon); font-size:22px; }
  #rides { position:relative; flex:1; z-index:1; }
  .ride { position:absolute; transform:translate(-50%,-50%); width:136px; padding:6px 6px 8px; text-align:center;
    background:var(--paper); border:3px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); }
  .ride:active { transform:translate(-50%,calc(-50% + 4px)); box-shadow:0 2px 0 var(--ink); }
  .ride canvas { width:84px; height:84px; display:block; margin:0 auto; }
  .ride b { display:block; font-family:var(--toon); font-weight:400; font-size:18px; line-height:1.05; margin-top:2px; }
  .ride .st { font-size:18px; color:#f4a100; letter-spacing:1px; -webkit-text-stroke:1px var(--ink); }
  .ride .st .off { color:#e7e0cf; }
  .ride .num { position:absolute; top:-14px; left:-14px; width:38px; height:38px; border-radius:50%; background:var(--yellow);
    border:3px solid var(--ink); font-family:var(--toon); font-size:22px; line-height:40px; }
  .ride.locked { background:#e4dccb; color:#8d8577; }
  .ride.locked canvas { opacity:.35; }
  .ride.locked .num { background:#cfc6b2; }
  .ride .lock { position:absolute; top:28px; left:50%; transform:translateX(-50%); font-size:34px; }
  .ride.next { animation:wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { rotate:0deg; } 25% { rotate:-3deg; } 75% { rotate:3deg; } }
  @media (max-width:700px), (max-height:560px) { .ride { width:112px; } .ride canvas { width:64px; height:64px; } .ride b { font-size:15px; } }

  /* mission */
  #mission { flex-direction:column; background:#ffe3a8;
    background-image:radial-gradient(#f7cf7d 2px, transparent 2.5px); background-size:26px 26px; }
  #topbar { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--paper); border-bottom:3px solid var(--ink); }
  #mTitle { font-family:var(--toon); font-size:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:26vw; padding-top:4px; }
  #steps { display:flex; gap:6px; flex:1; justify-content:center; min-width:0; }
  .step { min-height:44px; padding:6px 12px 2px; border:3px solid var(--ink); border-radius:999px; font-family:var(--toon); font-size:17px;
    background:#fff; color:#8d8577; border-color:#b9b09c; white-space:nowrap; }
  .step.on { background:var(--yellow); color:var(--ink); border-color:var(--ink); box-shadow:0 3px 0 var(--ink); }
  .step.done { background:var(--green); color:var(--ink); border-color:var(--ink); }
  .step.can { cursor:pointer; }
  #chip { padding:6px 12px 2px; font-family:var(--toon); font-size:19px; white-space:nowrap; border-radius:999px; min-width:76px; text-align:center; }
  #chip.low { background:#ffd6dc; }
  #chip[hidden] { display:none; }
  #body { flex:1; display:flex; gap:12px; padding:12px; min-height:0; }
  #stageWrap { flex:1; position:relative; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; }
  #stage { border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); background:#fff; touch-action:none; display:block; }
  #cards, #quiz { position:absolute; inset:0; overflow:auto; display:none; padding:4px 8px 12px 4px; box-sizing:border-box; }
  .ph-discover #stage, .ph-quiz #stage { display:none; }
  .ph-discover #cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:14px; align-content:start; }
  .ph-quiz #quiz { display:block; }
  #panel { width:min(410px,36vw); overflow:auto; padding:12px 14px; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; }
  #phTitle { margin:0; font-family:var(--toon); font-weight:400; font-size:28px; color:var(--accent); -webkit-text-stroke:1.5px var(--ink);
    paint-order:stroke; text-shadow:2px 2px 0 var(--ink); line-height:1.05; letter-spacing:1px; }
  #pupBox { display:flex; gap:8px; align-items:flex-start; }
  #pupMini { width:72px; height:72px; flex:none; animation:bob 2.4s ease-in-out infinite; }
  #bubble { position:relative; flex:1; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px 12px; font-size:17px; line-height:1.3; }
  #bubble:before { content:""; position:absolute; left:-12px; top:18px; border:8px solid transparent; border-right:10px solid var(--ink); }
  #bubble b { color:#d62d55; }
  .ctlrow { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; justify-content:center; }
  .sl { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:6px 12px 4px; }
  .sl .top { display:flex; justify-content:space-between; font-size:17px; gap:8px; }
  .sl .top b { font-family:var(--toon); font-weight:400; font-size:20px; color:#d62d55; white-space:nowrap; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:0; touch-action:pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height:12px; background:#e9e2cf; border:3px solid var(--ink); border-radius:10px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:38px; height:38px; margin-top:-16px; border-radius:50%;
    background:var(--yellow); border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  input[type=range]::-moz-range-track { height:8px; background:#e9e2cf; border:3px solid var(--ink); border-radius:10px; }
  input[type=range]::-moz-range-thumb { width:32px; height:32px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); }
  .seg { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .seg button { min-height:56px; padding:6px 14px 2px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-size:17px;
    box-shadow:0 4px 0 var(--ink); }
  .seg button.on { background:var(--ink); color:#fff; }
  .seg button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .read { background:#fff; border:3px dashed #b9b09c; border-radius:14px; padding:8px 12px; font-size:16px; line-height:1.4; }
  .read b { color:#d62d55; }
  .formula { display:inline-block; font-family:var(--toon); font-weight:400; font-size:21px; background:var(--yellow); border:3px solid var(--ink);
    border-radius:10px; padding:4px 10px 0; margin:2px 0; letter-spacing:1px; }
  .note { font-size:14px; opacity:.75; text-align:center; }
  #result { border:3px solid var(--ink); border-radius:16px; padding:10px 12px; font-size:17px; line-height:1.35; text-align:center; }
  #result.ok { background:#c7f9e5; } #result.bad { background:#ffe0e6; }
  #result[hidden], #timeup[hidden] { display:none; }
  #timeup { background:#fff3c4; border:3px solid var(--ink); border-radius:16px; padding:8px 10px; text-align:center; font-size:17px; }
  #tasks:empty { display:none; }
  #tasks { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:6px 12px; font-size:16px; }
  #tasks .tt { font-family:var(--toon); font-size:17px; color:#6c4ad8; }
  #tasks div.t { padding:3px 0; } #tasks div.t.ok { color:#0a8f6b; } #tasks div.t.ok:before { content:"✅ "; } #tasks div.t:not(.ok):before { content:"⬜ "; }
  #navRow { display:flex; flex-wrap:wrap; justify-content:center; margin-top:auto; }

  /* discover cards */
  .dcard { padding:10px 12px 12px; cursor:pointer; position:relative; display:flex; flex-direction:column; }
  .dcard h4 { margin:0 0 6px; font-family:var(--toon); font-weight:400; font-size:23px; letter-spacing:1px; color:#6c4ad8; }
  .dcard canvas { width:100%; aspect-ratio:400/220; border:3px solid var(--ink); border-radius:12px; background:#fff; display:block; }
  .dcard .tapme { margin-top:8px; text-align:center; font-family:var(--toon); font-size:18px; background:var(--yellow); border:3px solid var(--ink);
    border-radius:999px; padding:8px 10px 3px; min-height:30px; }
  .dcard .ctext { margin:8px 0 0; font-size:17px; line-height:1.35; display:none; }
  .dcard.seen .ctext { display:block; }
  .dcard.seen .tapme { background:#c7f9e5; }
  .dcard.seen:after { content:"✔"; position:absolute; top:-12px; right:-10px; width:36px; height:36px; border-radius:50%; background:var(--green);
    border:3px solid var(--ink); text-align:center; line-height:36px; font-size:20px; }

  /* quiz */
  .qbox { max-width:760px; margin:0 auto; padding:16px 18px; }
  .qbox .qn { font-family:var(--toon); color:#6c4ad8; font-size:20px; }
  .qbox .qq { font-size:clamp(19px,2.3vw,24px); margin:6px 0 12px; line-height:1.3; }
  .opt { display:block; width:100%; text-align:left; min-height:60px; margin:8px 0; padding:10px 16px; font-size:clamp(17px,2vw,20px);
    background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); line-height:1.25; }
  .opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .opt.right { background:#c7f9e5; } .opt.wrong { background:#ffd6dc; }
  .opt[disabled] { pointer-events:none; }
  .expl { margin-top:10px; padding:10px 14px; border-radius:14px; border:3px solid var(--ink); background:#fff3c4; font-size:18px; line-height:1.35; }

  /* overlays */
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(30,20,60,.5); z-index:20; }
  .overlay[hidden] { display:none; }
  .card { padding:20px 26px 20px; text-align:center; max-width:min(860px,94vw); max-height:92vh; overflow:auto; box-sizing:border-box; border-radius:26px; box-shadow:6px 6px 0 var(--ink); }
  .card p { font-size:18px; margin:8px 0; }
  #resStars { font-size:64px; color:#f4a100; letter-spacing:6px; line-height:1; -webkit-text-stroke:2px var(--ink); }
  #resStars .off { color:#e7e0cf; }
  #nbCard { width:min(880px,94vw); text-align:left; }
  .nbm { border-top:3px dashed #d8d0bd; padding:8px 0; }
  .nbm h3 { margin:4px 0; font-family:var(--toon); font-weight:400; font-size:24px; color:#6c4ad8; letter-spacing:1px; }
  .nbm.lockd h3 { color:#b0a894; }
  .nbe { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin:6px 0; font-size:17px; line-height:1.35; }
  .nbe .formula { font-size:19px; }

  /* burst */
  #burst { position:absolute; left:50%; top:42%; width:260px; height:180px; margin:-90px 0 0 -130px; pointer-events:none; opacity:0; z-index:5; }
  #burst.show { animation:pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { opacity:0; transform:scale(.3) rotate(-12deg); } 18% { opacity:1; transform:scale(1.12) rotate(4deg); }
    30% { transform:scale(1) rotate(-3deg); } 80% { opacity:1; } 100% { opacity:0; transform:scale(1.05) rotate(-3deg); } }

  @media (orientation:portrait), (max-aspect-ratio:1/1) {
    #body { flex-direction:column; padding:8px; gap:8px; }
    #stageWrap { flex:none; height:calc((100vw - 16px) * 0.56 + 6px); }
    #panel { width:auto; flex:1; min-height:0; }
    .ph-discover #stageWrap, .ph-quiz #stageWrap { flex:1; height:auto; }
    .ph-discover #panel, .ph-quiz #panel { flex:none; max-height:34vh; }
    .steplbl { display:none; }
    .step { padding:4px 0 0; min-width:38px; min-height:40px; font-size:16px; }
    #steps { gap:4px; }
    #topbar { gap:5px; padding:5px 6px; }
    #topbar .btn.sm, #topbar .btn.round { min-height:48px; padding:6px 12px 2px; font-size:18px; }
    #topbar .btn.round { width:48px; padding:0; }
    #chip { font-size:15px; min-width:0; padding:5px 8px 1px; }
    #mTitle { display:none; }
    #pupMini { width:52px; height:52px; }
    #bubble { font-size:15px; padding:6px 10px; }
    #phTitle { font-size:22px; }
    #panel { padding:8px 10px; gap:6px; }
  }
  @media (max-width:1100px) and (orientation:landscape) { .steplbl { display:none; } }
  @media (max-height:520px) { #topbar { padding:3px 8px; } #pupMini { width:52px; height:52px; } #bubble { font-size:15px; } #phTitle { font-size:22px; } }

  /* ---- kid-friendly visual layer ---- */
  .spk { flex:none; width:52px; height:52px; border-radius:50%; background:var(--blue); border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink);
    font-size:24px; line-height:1; display:inline-grid; place-items:center; padding:0; }
  .spk:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .spk.talking { animation:talk .5s ease-in-out infinite; background:var(--yellow); }
  @keyframes talk { 50% { transform:scale(1.12); } }
  #bubble { display:flex; gap:8px; align-items:center; font-size:19px; }
  #bubble .btxt { flex:1; }
  .eq { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; margin:4px 0; }
  .eqt { display:inline-flex; flex-direction:column; align-items:center; min-width:58px; padding:6px 8px 4px; background:var(--c,#ffd23f);
    border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); }
  .eqt b { font-family:var(--toon); font-weight:400; font-size:26px; line-height:1.05; letter-spacing:1px; }
  .eqt i { font-style:normal; font-size:13px; line-height:1.1; opacity:.85; white-space:nowrap; }
  .eqop { font-family:var(--toon); font-size:32px; color:var(--ink); }
  .eq.pop .eqt, .eq.pop .eqop { animation:popIn .45s cubic-bezier(.3,1.6,.5,1) backwards; }
  @keyframes popIn { from { transform:scale(0) rotate(-20deg); opacity:0; } }
  .dcard .ctext { font-size:20px; }
  .dcard .cap { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .dcard .cap span { flex:1; font-size:20px; line-height:1.25; }
  .dcard .cbody { display:none; }
  .dcard.seen .cbody { display:block; }
  .moreBtn { display:inline-block; margin-top:6px; min-height:44px; padding:6px 14px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-size:16px; box-shadow:0 3px 0 var(--ink); }
  .moreTxt { display:none; margin-top:8px; padding:8px 10px; background:#fff; border:2px dashed #b9b09c; border-radius:12px; font-size:16px; line-height:1.35; }
  .moreTxt.open { display:block; }
  .qhead { display:flex; gap:10px; align-items:center; }
  .qhead .qq { flex:1; margin:4px 0; }
  .qpic { text-align:center; font-size:44px; line-height:1.2; margin:6px 0 10px; }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:118px; padding:10px 8px;
    background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); text-align:center; }
  .tile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .tile .ti { font-size:46px; line-height:1.05; }
  .tile .ti svg { width:110px; height:64px; display:block; }
  .tile .tl { font-family:var(--toon); font-size:21px; line-height:1.1; letter-spacing:.5px; }
  .tile.right { background:#c7f9e5; animation:bounceY .6s; }
  .tile.wrong { background:#ffe6eb; animation:wig .5s; }
  .tile[disabled] { pointer-events:none; }
  .tile.dim { opacity:.55; }
  @keyframes bounceY { 30% { transform:translateY(-12px) scale(1.05); } 60% { transform:translateY(0); } }
  @keyframes wig { 20% { transform:rotate(-4deg); } 40% { transform:rotate(4deg); } 60% { transform:rotate(-3deg); } 80% { transform:rotate(2deg); } }
  .wiggle { animation:wig .5s; }
  .expl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:20px; }
  .expl .et { flex:1; min-width:180px; }
  .expl .moreTxt { flex-basis:100%; }
  #result { display:flex; gap:8px; align-items:center; text-align:left; font-size:18px; }
  #result[hidden] { display:none; }
  #result .rt { flex:1; }
  #result .remo { font-size:38px; line-height:1; }
  #result.bad { background:#fff3c4; }
  #tasks div.t { font-size:18px; padding:4px 0; }
  #tasks div.t:not(.ok):before { content:"⭐ "; filter:grayscale(1); opacity:.5; }
  #tasks div.t.ok:before { content:"⭐ "; }
  #hand { position:fixed; left:0; top:0; z-index:30; pointer-events:none; font-size:58px; line-height:1; display:none;
    filter:drop-shadow(3px 3px 0 rgba(29,27,38,.5)); }
  #confetti { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:50; }
  .nbe .spk { width:40px; height:40px; font-size:18px; }

  /* ---- UPDATE 3: guided flow ---- */
  .corner { position:absolute; top:10px; z-index:3; margin:0; }
  #title #titleCard { position:relative; text-align:center; padding:0; background:none; border:0; box-shadow:none; }
  #title h1.big { font-size:clamp(54px,10vw,120px); }

<script>

/* ================= save ================= */

let save = { unlocked: 1, stars: {}, done: {}, notes: {}, muted: false };

/* ================= sound ================= */

function setMute(m) { sfx.muted = m; save.muted = m; persist(); for (const id of ['muteMap', 'muteM', 'muteT']) $(id).textContent = m ? '🔇' : '🔊'; if (m) toneGen.stop(); }

  osc: null, gain: null,

  get on() { return !!this.osc; }
};

/* ================= Captain Pup ================= */
function drawHardHat(c, x, y, r) {
  // y = brim line
  c.lineWidth = Math.max(2, r * 0.08); c.strokeStyle = INK; c.lineJoin = 'round';
  c.fillStyle = COL.yellow;
  c.beginPath(); c.ellipse(x, y, r * 0.82, r * 0.62, 0, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#ffe27a'; c.beginPath(); c.ellipse(x - r * 0.2, y - r * 0.38, r * 0.2, r * 0.1, -0.4, 0, Math.PI * 2); c.fill();
  c.strokeStyle = INK; c.beginPath(); c.moveTo(x, y - r * 0.62); c.lineTo(x, y); c.stroke();
  c.fillStyle = COL.yellow; rr(c, x - r * 1.0, y - r * 0.06, r * 2.0, r * 0.2, r * 0.1); c.fill(); c.stroke();

function drawPupHead(c, x, y, r, o = {}) {
  const lw = Math.max(2, r * 0.085);
  c.save(); c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round';
  const flop = Math.sin((o.t || 0) * 3) * 0.08;
  c.fillStyle = '#1f1d22';
  for (const sd of [-1, 1]) { ell(c, x + sd * r * 0.92, y + r * 0.18, r * 0.36, r * 0.7, sd * (0.32 + flop)); c.fill(); c.stroke(); }

  // black eye patches (white blaze in the middle)
  c.fillStyle = '#1f1d22';
  for (const sd of [-1, 1]) { ell(c, x + sd * r * 0.45, y - r * 0.12, r * 0.33, r * 0.4, sd * 0.55); c.fill(); }

    c.fillStyle = '#fff'; ell(c, ex + er * 0.32, ey - er * 0.34, er * 0.27, er * 0.27); c.fill(); ell(c, ex - er * 0.25, ey + er * 0.3, er * 0.1, er * 0.1); c.fill();

  c.fillStyle = '#2b2426'; ell(c, x, y + r * 0.22, r * 0.13, r * 0.09); c.fill();

function drawPup(c, x, y, s, o = {}) {

  c.restore();

/* ================= burst ================= */
(function () { const pts = []; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, r = i % 2 ? 58 : 92; pts.push((130 + Math.cos(a) * r * 1.35).toFixed(1) + ',' + (90 + Math.sin(a) * r * 0.92).toFixed(1)); } $('burstPoly').setAttribute('points', pts.join(' ')); })();

/* ================= kid-friendly helpers: speech, visual equations, demo hand, confetti ================= */
function plain(html) {

/* =====================================================================
   MISSION 2 — ROLLER COASTER (energy)
   track model: control points (x m, h m), cosine-smoothed between them.
   physics along the track: a = -g·sinθ − μ·g·cosθ·sign(v)  (rolling friction)
   friction work = μ·m·g·Δx  → "friction steals μ·Δx metres of height"

  const pts = [[0, h0], [10, h0]]; let x = 10; const sp = opts.spacing || 40;
  for (const hh of hills) { pts.push([x + sp / 2, 2]); pts.push([x + sp, hh]); x += sp; }
  pts.push([x + sp / 2, 2]); pts.push([x + sp, 2]); pts.push([x + sp + 30, 2]);

// graph panel. o: {x,y,w,h,tmax,dmax,dmin,ylabel,xlabel}
function graphFrame(c, g) {
  c.fillStyle = '#fff'; c.strokeStyle = INK; c.lineWidth = 3; rr(c, g.x - 54, g.y - 30, g.w + 74, g.h + 76, 14); c.fill(); c.stroke();

function drawWeightBlock(c, x, y, lbl, col = '#9aa0a6', w = 44, hh = 34) {
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x - w / 2 + 6, y - hh); c.lineTo(x + w / 2 - 6, y - hh); c.lineTo(x + w / 2, y); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = INK; c.font = '900 13px ' + BODYF; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(lbl, x, y - hh / 2 + 1);
}
// lever: plank length 10 units, pivot at f (0..10), load at 0. returns endpoints. ang>0 => right end down
function drawLever(c, cx0, gy, unit, f, ang, o = {}) {
  const px = cx0 + f * unit, py = gy - 70;
  // fulcrum
  c.fillStyle = COL.purple; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(px, py); c.lineTo(px - 34, gy); c.lineTo(px + 34, gy); c.closePath(); c.fill(); c.stroke();
  const P = d => [px + (d - f) * unit * Math.cos(ang), py + (d - f) * unit * Math.sin(ang)];
  c.save(); c.translate(px, py); c.rotate(ang);
  c.fillStyle = '#e0a458'; rr(c, -f * unit - 6, -16, 10 * unit + 12, 16, 6); c.fill(); c.stroke();
  c.strokeStyle = '#a86d2c'; c.lineWidth = 2; for (let d = 0; d <= 10; d++) { c.beginPath(); c.moveTo((d - f) * unit, -14); c.lineTo((d - f) * unit, -4); c.stroke(); }
  if (o.marks) { c.fillStyle = INK; c.font = '800 12px ' + BODYF; c.textAlign = 'center'; for (let d = 0; d <= 10; d++) c.fillText(d, (d - f) * unit, 12); }
  c.restore();
  return P;
}

  boss: {
    name: 'Balance the Prize', hint: 'Effort side: each 50 N block × its distance from the fulcrum. Load side: prize × fulcrum distance. Put the fulcrum as close to the prize as it can go, and hang blocks at the far end!',
    say: 'Lift the giant prize using the <b>least effort</b>! Set the fulcrum, then <b>tap the plank</b> to hang 50&nbsp;N blocks (tap a block to remove it). Make it balance <b>exactly</b> with the lightest total.',

      const S = { f: 5, blocks: {}, ang: 0, tAng: 0, launch: null };
      // fewest 50 N blocks (max 4 per hook) whose moments exactly balance, over all fulcrum spots
      const minTotal = (() => { let best = 1e9; for (const f of [2, 3, 4, 5]) { const M = LOAD * f / 50; let dp = new Array(M + 1).fill(1e9); dp[0] = 0;
          for (let d = 1; d <= 10 - f; d++) { const nd = dp.slice(); for (let m = 0; m <= M; m++) if (dp[m] < 1e9) for (let k = 1; k <= 4 && m + k * d <= M; k++) nd[m + k * d] = Math.min(nd[m + k * d], dp[m] + k); dp = nd; }
          best = Math.min(best, dp[M] * 50); } return best; })();

/* ---------- particle / juice engine (capped at 300 particles) ---------- */
function makeFX() {
  return {
    parts: [], pops: [], sh: 0, shT: 0, flT: 0, flD: 1, fl: '#fff', smT: 0, smS: 1,
    clear() { this.parts = []; this.pops = []; this.sh = this.shT = this.flT = this.smT = 0; },
    add(p) { if (this.parts.length >= 300) this.parts.shift(); this.parts.push(p); },
    burst(x, y, o = {}) {
      const n = o.n || 30, cols = o.colors || [COL.yellow, COL.orange, COL.accent, '#fff', COL.purple], sp = o.speed || 420, sz = o.size || 1;
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), v = rand(0.3, 1) * sp;
        this.add({ type: o.types ? pick(o.types) : pick(['dot', 'dot', 'star', 'spark']), x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.up || 0),
          g: o.g != null ? o.g : 700, r: rand(4, 10) * sz, life: 0, max: rand(0.5, 1) * (o.life || 1), c: pick(cols), rot: rand(0, 6), vr: rand(-8, 8) });
      }
      if (o.smoke !== false) for (let i = 0; i < (o.smokeN || 8); i++) { const a = rand(0, 6.28), v = rand(30, 140) * sz;
        this.add({ type: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, g: -30, r: rand(14, 26) * sz, life: 0, max: rand(0.7, 1.2), c: '#e2dee9', rot: 0, vr: 0 }); }

    if (S.solved || (S.cool > 0 && !force)) return;
    let a = Math.atan2(y - S.cy, x - S.cx); a = clamp(a, -Math.PI + 0.12, -0.12); S.aim = a;
    S.shots.push({ x: S.cx + Math.cos(a) * 90, y: S.cy + Math.sin(a) * 90, vx: Math.cos(a) * 1300, vy: Math.sin(a) * 1300, trail: [] });
    S.cool = 0.28; sfx.pew();
  }
  function hit(tg, sh) {
    if (tg.k === q.a) {
      tg.dead = true; S.solved = true;
      const first = !S.missed; if (first) { cur.quiz.right++; cur.quiz.combo++; } else cur.quiz.combo = 0;
      FX.boom(tg.x, tg.y, 1.3); FX.slowmo(0.45, 0.3); FX.popup(tg.x, tg.y - 70, 'BOOM!', COL.yellow, 46);
      if (cur.quiz.combo > 1) FX.popup(tg.x, tg.y + 10, '🔥 x' + cur.quiz.combo, COL.orange, 34);
      burst(first ? pick(['BOOM!', 'BULLSEYE!', 'GENIUS!']) : 'GOT IT!'); party(70); sfx.good();
      api.result(q.ex, first);
      const res = $('result'); res.hidden = false;
      if (q.more) { const [mb, mt] = moreToggle(q.more); res.append(mb); res.after(mt); }
      if (q.eq) res.insertAdjacentHTML('beforeend', eqHTML(q.eq, true));
      const last = cur.quiz.i === cur.m.quiz.length - 1;
      const nb = navBtn(last ? 'My stars ★' : 'Next ▶', 'go', () => { cur.quiz.i++; if (last) finishMission(); else startQ(); });
      nav([nb, navBtn('📓 Notebook', 'yel sm', openNotebook)]);
    } else {
      if (!tg.wrong) { tg.wrong = true; S.missed = true; cur.quiz.combo = 0; sfx.thud(); sfx.bad();
        FX.burst(tg.x, tg.y, { n: 10, colors: ['#bbb', '#fff'], types: ['dot'], speed: 200, smokeN: 4 }); FX.popup(tg.x, tg.y - 70, 'Try again!', '#fff', 28); FX.shake(5, 0.2); }
      tg.off.vx += sh.vx * 0.35; tg.off.vy += sh.vy * 0.35;
    }
  }
  return {
    targets, q, S,
    shoot(k) { const tg = targets[k]; fire(tg.x, tg.y, true); },
    update(dt) {
      S.cool -= dt;
      if (S.hold && S.cool <= 0) fire(S.hold.x, S.hold.y);
      for (const tg of targets) {
        tg.x = tg.bx + Math.sin(this.t * 0.9 + tg.ph) * 35; tg.y = tg.by + Math.sin(this.t * 1.4 + tg.ph * 2) * 16;
        const o = tg.off; o.vx += (-70 * o.x - 7 * o.vx) * dt; o.vy += (-70 * o.y - 7 * o.vy) * dt; o.x += o.vx * dt; o.y += o.vy * dt;
        if (S.solved && !tg.dead) { tg.by -= 260 * dt; tg.alpha = Math.max(0, tg.alpha - dt * 0.8); }
      }
      for (const sh of S.shots) {
        sh.trail.push([sh.x, sh.y]); if (sh.trail.length > 6) sh.trail.shift();
        sh.x += sh.vx * dt; sh.y += sh.vy * dt;
        for (const tg of targets) { if (tg.dead || tg.alpha < 0.5 || sh.done) continue;
          const tx = tg.x + tg.off.x, ty = tg.y + tg.off.y;
          if (Math.hypot(sh.x - tx, sh.y - ty) < tg.r + 12) { sh.done = true; FX.splash(sh.x, sh.y, 0.4); hit(tg, sh); } }
        if (sh.x < -40 || sh.x > SW + 40 || sh.y < -40) sh.done = true;
      }
      S.shots = S.shots.filter(s => !s.done);
    },
    draw(c, W, H, t) {
      // carnival booth
      c.fillStyle = '#ffe9c7'; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 10; i++) { c.fillStyle = i % 2 ? '#f3d9a4' : '#efcf92'; c.fillRect(i * W / 10, 0, W / 10, H); }
      for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? '#fff' : COL.accent; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(i * W / 12, 0); c.lineTo((i + 1) * W / 12, 0); c.lineTo((i + 1) * W / 12, 46); c.arc((i + 0.5) * W / 12, 46, W / 24, 0, Math.PI); c.closePath(); c.fill(); c.stroke(); }
      for (let i = 0; i < 20; i++) { c.fillStyle = [COL.yellow, COL.blue, COL.green, COL.accent][i % 4]; ell(c, 25 + i * 50, 96, 6, 6); c.fill(); c.lineWidth = 2; c.stroke(); }
      for (const tg of targets) if (!tg.dead && tg.alpha > 0) drawBalloon(c, tg, t);
      c.fillStyle = '#b5651d'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-5, 468, W + 10, 100); c.strokeRect(-5, 468, W + 10, 100);
      c.fillStyle = '#8a4a14'; c.fillRect(-5, 468, W + 10, 14);
      // shots
      for (const sh of S.shots) { sh.trail.forEach(([x, y], i) => { c.fillStyle = `rgba(76,201,240,${i / 8})`; ell(c, x, y, 4 + i, 4 + i); c.fill(); });
        c.fillStyle = '#4cc9f0'; c.strokeStyle = INK; c.lineWidth = 3; ell(c, sh.x, sh.y, 13, 13); c.fill(); c.stroke(); c.fillStyle = '#fff'; ell(c, sh.x - 4, sh.y - 4, 4, 4); c.fill(); }
      // Captain Pup + water cannon
      drawPupHead(c, S.cx - 130, 508, 42, { t, mouth: 0.7, look: Math.cos(S.aim) });
      c.save(); c.translate(S.cx, S.cy); c.rotate(S.aim);
      c.fillStyle = COL.blue; c.strokeStyle = INK; c.lineWidth = 4; rr(c, 0, -18, 92, 36, 10); c.fill(); c.stroke();
      c.fillStyle = COL.yellow; rr(c, 80, -24, 22, 48, 8); c.fill(); c.stroke(); c.restore();
      c.fillStyle = COL.purple; c.strokeStyle = INK; c.lineWidth = 4; ell(c, S.cx, S.cy, 40, 40); c.fill(); c.stroke();
      c.fillStyle = '#a8e6ff'; rr(c, S.cx + 60, S.cy + 4, 70, 50, 12); c.fill(); c.stroke(); txt(c, '💧', S.cx + 95, S.cy + 30, 26, INK, 'center', { stroke: false });
      label(c, '❓ ' + (cur.quiz.i + 1) + ' / ' + cur.m.quiz.length, W - 80, 136, '#fff', 20);
      if (cur.quiz.combo > 0) label(c, '🔥 x' + cur.quiz.combo, 80, 136, COL.yellow, 20);
    },
    pointer(type, x, y) {
      if (type === 'down') { S.hold = { x, y }; fire(x, y); }
      else if (type === 'drag' && S.hold) { S.hold = { x, y }; S.aim = clamp(Math.atan2(y - S.cy, x - S.cx), -Math.PI + 0.12, -0.12); }
      else if (type === 'move') S.aim = clamp(Math.atan2(y - S.cy, x - S.cx), -Math.PI + 0.12, -0.12);
      else if (type === 'up') S.hold = null;
    },
    key(e) {
      if (e.key === 'ArrowLeft') { S.aim = clamp(S.aim - 0.08, -Math.PI + 0.12, -0.12); e.preventDefault(); }
      if (e.key === 'ArrowRight') { S.aim = clamp(S.aim + 0.08, -Math.PI + 0.12, -0.12); e.preventDefault(); }
      if (e.key === ' ' || e.key === 'Enter') { fire(S.cx + Math.cos(S.aim) * 400, S.cy + Math.sin(S.aim) * 400); e.preventDefault(); }
    }
  };
}

/* =====================================================================
   UPDATE 3: guided flow — help sheet, idle hints, glowing next step
   ===================================================================== */
let lastInput = performance.now(), lastHint = 0;
addEventListener('pointerdown', () => lastInput = performance.now(), { capture: true });
addEventListener('keydown', e => { lastInput = performance.now();
  if (cur.screen === 'title' && $('helpOv').hidden && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('playBtn').click(); } }, { capture: true });
function openHelp() { sfx.tap(); $('helpOv').hidden = false; }
function closeHelp() { sfx.tap(); $('helpOv').hidden = true; if (!save.seenHelp) { save.seenHelp = 1; persist(); } }
$('helpBtn').addEventListener('click', openHelp);
$('helpClose').addEventListener('click', closeHelp);
$('helpOv').addEventListener('click', e => { if (e.target.id === 'helpOv') closeHelp(); });
{ const sh = show; show = function (id) { sh(id); if (id === 'map' && !save.seenHelp) setTimeout(() => { if (cur.screen === 'map') $('helpOv').hidden = false; }, 400); }; }
function nextReady() {
  if (cur.screen !== 'mission') return false;
  if (cur.phase === 1) return !!(cur.discoverSeen && cur.m && cur.discoverSeen.size === cur.m.discover.length);
  const S = cur.scene; if (!S) return false;
  if (cur.phase === 4) return !!(S.S && S.S.solved);
  return !!(S.api && S.api.won);
}
setInterval(() => {
  const ready = nextReady();
  for (const b of $('navRow').querySelectorAll('.btn')) b.classList.toggle('glow', ready && !b.disabled && (b.classList.contains('go') || b.classList.contains('blue')));
  const rb = $('resBtns').querySelector('.btn'); if (rb) rb.classList.add('glow');
  const now = performance.now();
  if (now - lastInput > 7000 && now - lastHint > 7000 && $('helpOv').hidden && $('nbOv').hidden) {
    lastHint = now;
    if (cur.screen === 'mission' && !ready && cur.demo) demoHand(cur.demo, 0);
    if (cur.screen === 'map') MW.moved = false;
  }
}, 250);
bootUI();
Object.assign(window.__game, { FX, map: MW, startQ });
</script>
