<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style><script id="nozoom-js">/* Block browser page zoom (iOS ignores user-scalable=no); in-game zoom uses pointer events and still works. */(function(){var p=function(e){e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,p,{passive:false})});})();</script>
<title>Time Travel Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    background:radial-gradient(circle at 20% 10%, #3d3b6b 0, transparent 40%), radial-gradient(circle at 85% 80%, #3a2f5c 0, transparent 45%) #2b2a4a;
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; cursor:pointer; color:inherit; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:flex; }

  /* ---------- buttons ---------- */
  .btn { background:var(--accent); color:#fff; font-family:var(--toon); font-weight:400; font-size:22px; letter-spacing:1px;
    min-height:60px; padding:12px 22px 8px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink);
    margin:4px 0 8px; line-height:1.1; -webkit-text-stroke:0; text-shadow:2px 2px 0 rgba(29,27,38,.55); transition:transform .06s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); text-shadow:none; }
  .btn.go { background:var(--green); }
  .btn.blue { background:var(--blue); }
  .btn.yel { background:var(--yellow); color:var(--ink); text-shadow:none; }
  .btn.pur { background:var(--purple); }
  .btn.on { background:var(--ink); color:var(--yellow); }
  .btn:disabled { opacity:.45; transform:none; box-shadow:0 6px 0 var(--ink); cursor:default; }
  .btn.pulse { animation:pulseBtn 1s infinite; }
  @keyframes pulseBtn { 50% { transform:scale(1.05); } }
  .round { width:60px; height:60px; padding:0; border-radius:50%; font-size:26px; display:inline-grid; place-items:center; flex:none; }

  /* ---------- title / timeline hub ---------- */
  #title { display:none; }
  #title.on { display:block; }
  #hub { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hubTop { position:absolute; left:0; right:0; top:0; padding:10px 12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  #hubTop > * { pointer-events:auto; }
  #hubTop a { text-decoration:none; }
  #hubTitle { font-family:var(--toon); font-size:clamp(26px,4.4vw,58px); color:var(--yellow); letter-spacing:2px; -webkit-text-stroke:3px var(--ink); paint-order:stroke;
    text-shadow:4px 4px 0 var(--ink); transform:rotate(-2deg); text-align:center; line-height:1; pointer-events:none !important; margin-top:4px; }
  #hubTitle span { color:var(--accent); }
  #hubHint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); padding:8px 18px 6px; font-size:19px; white-space:nowrap; pointer-events:none; }
  @media (max-width:640px) { #hubTitle { position:absolute; left:0; right:0; top:84px; } #hubHint { font-size:16px; } }
  #topRow { width:100%; max-width:1200px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #topRow a { text-decoration:none; }
  h1 { font-family:var(--toon); font-weight:400; margin:6px 0 0; font-size:clamp(42px,7vw,86px); line-height:1; color:var(--yellow); letter-spacing:2px;
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); text-align:center; }
  h1 span { color:var(--accent); }
  .sub { color:#fff; font-size:clamp(16px,2vw,21px); margin:12px 0 4px; text-align:center; max-width:760px; opacity:.95; }
  #hero { width:min(560px,92vw); height:min(250px,46vw); display:block; }
  #timeline { position:relative; width:100%; max-width:1200px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin:8px 0 6px; }
  #timeline::before { content:''; position:absolute; left:6%; right:6%; top:44px; border-top:8px dashed rgba(255,210,63,.55); z-index:0; }
  .era { position:relative; z-index:1; text-align:center; padding:12px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    transition:transform .12s; border-radius:22px; }
  .era:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .era .when { background:var(--yellow); border:3px solid var(--ink); border-radius:999px; padding:3px 12px 1px; font-size:14px; letter-spacing:.5px; }
  .era canvas { width:100px; height:100px; }
  .era h3 { font-family:var(--toon); font-weight:400; font-size:28px; margin:0; color:var(--accent); letter-spacing:1px; line-height:1; }
  .era p { margin:0; font-size:15px; line-height:1.25; min-height:38px; }
  .era .st { font-size:28px; letter-spacing:3px; color:#f4a100; -webkit-text-stroke:1.5px var(--ink); line-height:1; }
  .era .st .off { color:#e7e0cf; }
  .era .go { margin-top:4px; }
  .era.locked { background:#e7e0cf; color:#8d8577; border-color:#8d8577; box-shadow:4px 4px 0 #8d8577; }
  .era.locked h3 { color:#8d8577; }
  .era.next { animation:wob 2.4s infinite; }
  @keyframes wob { 0%,100% { transform:rotate(-1deg); } 50% { transform:rotate(1deg) translateY(-3px); } }
  #hubBtns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .foot { color:#fff; opacity:.7; font-size:14px; margin-top:12px; text-align:center; }

  /* ---------- game screen ---------- */
  #game { flex-direction:column; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 10px 6px; }
  #eraName { color:#fff; font-family:var(--toon); font-size:24px; letter-spacing:1px; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke;
    text-shadow:2px 2px 0 var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0; }
  #steps { display:flex; gap:6px; margin-left:auto; flex:none; }
  .step { background:#fff; border:3px solid var(--ink); border-radius:999px; padding:6px 12px 3px; font-family:var(--toon); font-size:16px;
    white-space:nowrap; min-height:38px; display:flex; align-items:center; gap:4px; }
  .step.on { background:var(--yellow); transform:rotate(-2deg) scale(1.08); }
  .step.done { background:var(--green); }
  #body { flex:1; display:flex; gap:12px; padding:2px 12px 12px; min-height:0; }
  #stage { flex:1; min-width:0; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
  #cv { display:block; background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); touch-action:none; }
  #timer { position:absolute; top:10px; right:12px; z-index:3; padding:6px 14px 2px; font-family:var(--toon); font-size:22px; pointer-events:none;
    background:var(--paper); border:3px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink); }
  #timer.low { background:#ffd6dc; }
  #timer[hidden] { display:none; }
  #side { width:370px; flex:none; overflow-y:auto; padding:14px 16px 10px; touch-action:pan-y; display:flex; flex-direction:column; }
  #pTitle { font-family:var(--toon); font-weight:400; font-size:28px; color:var(--accent); margin:0 0 6px; line-height:1.05; letter-spacing:1px;
    -webkit-text-stroke:1px var(--ink); paint-order:stroke; }
  #pText { font-size:18px; line-height:1.35; }
  #pText p { margin:0 0 8px; }
  #pText b { color:#c9184a; }
  #pStat { font-size:17px; line-height:1.4; margin:4px 0 6px; }
  #pStat:empty { display:none; }
  .bars { display:grid; gap:6px; }
  .meter { height:16px; border:3px solid var(--ink); border-radius:10px; background:#e9e2cf; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--green); transition:width .15s; }
  #pCtl { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  #pCtl .btn { flex:1 1 auto; }
  #pCtl .full { flex-basis:100%; }
  #pMsg { margin-top:8px; padding:8px 10px; border:3px solid var(--ink); border-radius:14px; background:#fff3c4; font-size:19px; line-height:1.3; display:flex; gap:8px; align-items:center; }
  #pMsg:empty { display:none; }
  #pMsg.good { background:#c7f9e5; }
  #pMsg.bad { background:#fff3c4; animation:wiggle .5s; }
  #pNext { margin-top:auto; padding-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  #pNext .btn { flex:1 1 auto; }
  .fact { background:#e0f7ff; border:3px dashed var(--ink); border-radius:14px; padding:10px 12px; margin-top:6px; font-size:17px; line-height:1.35; }
  .tap { color:#7b2cbf; font-size:18px; margin:6px 0; animation:wob 1.6s infinite; display:inline-block; }
  .dots { display:flex; gap:6px; margin:0 0 6px; }
  .dots i { width:16px; height:16px; border-radius:50%; border:3px solid var(--ink); background:#fff; }
  .dots i.on { background:var(--yellow); } .dots i.seen { background:var(--green); }
  .tabs { display:flex; gap:6px; margin:4px 0 8px; flex-wrap:wrap; }
  .tabs .btn { font-size:18px; padding:10px 14px 6px; flex:1 1 auto; }

  /* ---------- modal ---------- */
  #modal { position:fixed; inset:0; z-index:40; display:none; place-items:center; background:rgba(30,20,60,.5); padding:12px; }
  #modal.on { display:grid; }
  #mCard { padding:20px 26px 22px; text-align:center; max-width:min(760px,96vw); max-height:94vh; overflow:auto; border-radius:26px;
    box-shadow:6px 6px 0 var(--ink); touch-action:pan-y; animation:popIn .3s ease-out; }
  @keyframes popIn { from { transform:scale(.7) rotate(-3deg); opacity:0; } }
  #mCard h2 { font-family:var(--toon); font-weight:400; margin:0 0 6px; font-size:clamp(30px,5vw,44px); color:var(--yellow); letter-spacing:1px;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); line-height:1.05; }
  #mCard h3 { margin:8px 0; font-size:22px; line-height:1.3; }
  #mCard p { font-size:18px; line-height:1.4; margin:8px 0; }
  #mCard .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .opts { display:grid; gap:10px; margin:12px 0 6px; }
  .opt { background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink); min-height:62px; padding:10px 16px;
    font-size:19px; text-align:left; line-height:1.25; }
  .opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .opt.right { background:#c7f9e5; } .opt.wrong { background:#ffd6dc; } .opt.dim { opacity:.55; }
  .expl { border:3px solid var(--ink); border-radius:14px; padding:10px 14px; font-size:18px; text-align:left; line-height:1.4; }
  .expl.good { background:#c7f9e5; } .expl.bad { background:#fff3c4; }
  .bigstars { font-size:64px; color:#f4a100; letter-spacing:6px; -webkit-text-stroke:2px var(--ink); line-height:1; }
  .bigstars .off { color:#e7e0cf; }
  .lesson { background:#fff3c4; border:3px solid var(--ink); border-radius:18px; padding:12px 16px; text-align:left; margin:10px 0; }
  .lesson .big { font-size:22px; line-height:1.3; margin:4px 0; }
  .lesson .lbl { font-family:var(--toon); font-size:18px; color:#7b2cbf; letter-spacing:1px; }
  .lesson .today { background:#fff; border:3px dashed var(--ink); border-radius:14px; padding:8px 12px; margin-top:8px; font-size:18px; line-height:1.35; }
  .lesson .nb { font-size:16px; line-height:1.35; margin-top:8px; opacity:.85; }
  .lesson.locked { background:#e7e0cf; color:#8d8577; border-color:#8d8577; }
  .shelf { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0; padding:12px 10px 0;
    background:linear-gradient(transparent 76%, #b5835a 76%, #8a5a3a 88%, transparent 88%); }
  .shelf div { font-size:15px; line-height:1.2; }
  .shelf canvas { width:110px; height:110px; max-width:100%; }

  /* ---------- comic burst + warp ---------- */
  .burstW { position:fixed; z-index:60; pointer-events:none; transform:translate(-50%,-50%);
    filter:drop-shadow(3px 0 0 #1d1b26) drop-shadow(-3px 0 0 #1d1b26) drop-shadow(0 3px 0 #1d1b26) drop-shadow(0 -3px 0 #1d1b26) drop-shadow(5px 5px 0 #1d1b26); }
  .burst { padding:46px 56px; font-family:var(--toon); font-size:44px; color:#fff; -webkit-text-stroke:2px var(--ink); paint-order:stroke;
    background:var(--yellow); animation:burst .95s ease-out forwards; white-space:nowrap; letter-spacing:1px; }
  @keyframes burst { 0% { transform:scale(.2) rotate(-20deg); opacity:0; } 18% { transform:scale(1.15) rotate(4deg); opacity:1; }
    30% { transform:scale(1) rotate(-3deg); } 80% { opacity:1; } 100% { transform:scale(1.1) rotate(-3deg); opacity:0; } }
  #warp { position:fixed; inset:0; z-index:70; pointer-events:none; display:none;
    background:repeating-conic-gradient(from 0deg, #9b5de5 0 15deg, #4cc9f0 15deg 30deg, #ffd23f 30deg 45deg, #ff4d6d 45deg 60deg); }
  #warp.on { display:block; animation:warp 1.1s ease-in-out forwards; }
  @keyframes warp { 0% { opacity:0; transform:scale(.2) rotate(0); border-radius:50%; } 40% { opacity:1; transform:scale(2.4) rotate(220deg); border-radius:50%; }
    100% { opacity:0; transform:scale(3.4) rotate(540deg); border-radius:50%; } }

  /* ---------- kid-friendly: read-aloud, more, tiles, hints, confetti ---------- */
  .say { display:flex; gap:10px; align-items:flex-start; margin:2px 0 6px; }
  .say .big { font-size:22px; line-height:1.3; flex:1; }
  .spk { flex:none; width:52px; height:52px; border-radius:50%; border:3px solid var(--ink); background:var(--yellow); box-shadow:0 4px 0 var(--ink);
    font-size:22px; display:inline-grid; place-items:center; padding:0; cursor:pointer; }
  .spk:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .spk.sm { width:44px; height:44px; font-size:19px; }
  .spk.talk { animation:pulseBtn .45s 4; }
  .nospeak .spk { display:none; }
  details.more { margin:6px 0; border:3px dashed #d8d0bd; border-radius:14px; padding:4px 12px; font-size:16px; line-height:1.4; text-align:left; }
  details.more summary { font-family:var(--toon); font-size:19px; color:#7b2cbf; cursor:pointer; min-height:44px; display:flex; align-items:center; gap:8px; list-style:none; }
  details.more summary::-webkit-details-marker { display:none; }
  details.more p { margin:4px 0 8px; }
  .btn { position:relative; }
  .btn.hint::after { content:'👆'; position:absolute; right:10px; bottom:-30px; font-size:38px; animation:pointy .9s infinite; text-shadow:none; pointer-events:none; z-index:2; }
  @keyframes pointy { 50% { transform:translateY(-12px); } }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:12px 0 8px; }
  .tile { background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); padding:12px 8px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; font-size:19px; line-height:1.15; min-height:140px; text-align:center; }
  .tile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .tile .ic { font-size:56px; line-height:1; }
  .tile.right { background:#c7f9e5; animation:boing .5s; } .tile.wrong { background:#fff3c4; animation:wiggle .5s; } .tile.dim { opacity:.45; }
  @keyframes wiggle { 20% { transform:rotate(-4deg); } 40% { transform:rotate(4deg); } 60% { transform:rotate(-3deg); } 80% { transform:rotate(2deg); } }
  @keyframes boing { 40% { transform:scale(1.1); } }
  .qhead { display:flex; gap:10px; align-items:center; justify-content:center; }
  .qhead h3 { margin:6px 0 !important; }
  .expl { display:flex; gap:10px; align-items:center; }
  .confetti { position:fixed; top:-24px; width:12px; height:18px; z-index:65; pointer-events:none; border:2px solid var(--ink); border-radius:3px;
    animation:fall var(--d,1.8s) cubic-bezier(.3,.1,.7,1) forwards; }
  @keyframes fall { to { transform:translate(var(--dx),112vh) rotate(var(--r)); } }
  .lesson .row2 { display:flex; gap:12px; align-items:center; }
  .lesson .lic { font-size:54px; line-height:1; }
  @media (max-width:520px) { .tile .ic { font-size:40px; } .tile { min-height:112px; font-size:15px; padding:8px 4px; } .tiles { gap:8px; }
    .say .big { font-size:19px; } .lesson .lic { font-size:40px; } }

  @media (max-width:1100px) { #side { width:330px; } .step .lb { display:none; } }
  @media (max-width:820px) { #timeline { grid-template-columns:repeat(2,1fr); } #timeline::before { display:none; } }
  @media (orientation:portrait), (max-aspect-ratio:5/4) {
    #body { flex-direction:column; }
    #stage { flex:0 0 auto; }
    #side { width:auto; flex:1 1 0; min-height:150px; }
    #timer { top:6px; right:6px; font-size:16px; padding:4px 10px 1px; }
  }
  @media (max-width:520px) {
    #eraName { display:none; }
    #steps { margin-left:auto; gap:4px; } .step { padding:6px 9px 3px; font-size:15px; }
    #bar { gap:6px; }
    .era h3 { font-size:22px; } .era p { font-size:13px; } .era canvas { width:76px; height:76px; }
    #timeline { gap:10px; } .btn { font-size:19px; padding:12px 16px 8px; }
    #pTitle { font-size:24px; } #pText { font-size:16px; }
    .shelf { grid-template-columns:repeat(2,1fr); background:none; }
  }
  @media (max-height:520px) and (orientation:landscape) { #side { width:300px; } #pTitle { font-size:22px; } #pText { font-size:15px; }
    .btn { min-height:54px; font-size:18px; padding:10px 14px 6px; } .round { width:54px; height:54px; } }
</style>
</head>
<body>
<section id="title" class="screen on">
  <canvas id="hub"></canvas>
  <div id="hubTop">
    <a class="btn alt" href="../">⬅ Games</a>
    <div id="hubTitle">TIME TRAVEL <span>QUEST</span></div>
    <div style="display:flex;gap:8px">
      <button class="btn yel round" id="shelfBtn" aria-label="Trophy shelf">🏆</button>
      <button class="btn pur round" id="bookBtn" aria-label="Book of Wisdom">📖</button>
      <button class="btn alt round mute" aria-label="Sound on/off">🔊</button>
    </div>
  </div>
  <div id="hubHint" class="panel">👆 Drag to fly! Crash into a portal 🌀</div>
</section>

<section id="game" class="screen">
  <div id="bar">
    <button class="btn alt round" id="quit" aria-label="Back to the time map">✖</button>
    <div id="eraName"></div>
    <div id="steps"></div>
    <button class="btn alt round mute" aria-label="Sound on/off">🔊</button>
  </div>
  <div id="body">
    <div id="stage"><div id="timer" hidden>⏱ 0:30</div><canvas id="cv"></canvas></div>
    <div id="side" class="panel">
      <div id="pTitle"></div>
      <div id="pText"></div>
      <div id="pStat"></div>
      <div id="pCtl"></div>
      <div id="pMsg"></div>
      <div id="pNext"></div>
    </div>
  </div>
</section>

<div id="modal"><div id="mCard" class="panel"></div></div>
<div id="warp"></div>
<script>
'use strict';
/* ================= Time Travel Quest — core ================= */
const $ = s => document.querySelector(s);
const INK = '#1d1b26', PAPER = '#fffaf0', YEL = '#ffd23f', ACC = '#ff4d6d', GRN = '#06d6a0', BLU = '#4cc9f0', PUR = '#9b5de5', ORA = '#ff9f1c';
const TOON = '"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif';
const BODY = 'Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const W = 1000, H = 625;

/* ---------- save (never required) ---------- */
const SKEY = 'timeTravelQuest.v1';
let save = { stars: [0, 0, 0, 0], played: [0, 0, 0, 0] };
try { const s = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (s && Array.isArray(s.stars)) save = Object.assign(save, s); } catch (e) { }
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) { } }
const unlocked = i => true;   // every time portal open from the start

/* ---------- sound (synthesized) ---------- */

function makeDiscover(cards) {
  let i = 0, seen = new Set(), st = {};
  function showCard() {
    const cd = cards[i]; st = { t0: performance.now() / 1000, n: 0, at: -9 }; seen.add(i);
    P.title(cd.title);
    const dots = '<div class="dots">' + cards.map((_, k) => `<i class="${k === i ? 'on' : seen.has(k) ? 'seen' : ''}"></i>`).join('') + '</div>';
    P.text(cd.text, (cd.more || '') + (cd.fact ? `<div class="fact">💡 ${cd.fact}</div>` : ''), dots);
    P.msg(''); stopSpeak();
    P.ctl([{ label: cd.act, cls: 'yel hint', on: () => { st.n++; st.at = performance.now() / 1000; SFX.blip(); cd.action && cd.action(st); } }]);
    const all = seen.size === cards.length;
    P.next([
      i > 0 ? { label: '◀', cls: 'alt round', on: () => { i--; showCard(); } } : null,
      i < cards.length - 1 ? { label: 'Next card ▶', cls: 'blue', id: all ? '' : 'nextBtn', on: () => { i++; showCard(); } } : null,
      (all || save.played[ei]) ? { label: all ? 'Experiment ▶' : 'Skip ▶', cls: all ? 'go pulse' : 'alt', id: all ? 'nextBtn' : '', on: nextPhase } : null,
    ]);
  }
  return {
    enter() { i = 0; seen = new Set(); showCard(); },
    draw(c, t) { cards[i].draw(c, t, st, t - st.at); },
    down(p) { if (cards[i].tap) { st.n++; st.at = performance.now() / 1000; cards[i].tap(p, st); SFX.blip(); } },
  };
}

      if (Math.hypot(f.x - cx, f.y - cy) > R - 40) { const a = Math.atan2(f.y - cy, f.x - cx); f.vx = -Math.cos(a) * Math.abs(f.vx || 60) - Math.sin(a) * 30; f.vy = -Math.sin(a) * Math.abs(f.vy || 60); f.x = cx + Math.cos(a) * (R - 41); f.y = cy + Math.sin(a) * (R - 41); }
      const s = hitCircle(b.shots, f.x, f.y, f.r);
      if (s) { f.hp--; f.hit = 1; f.vx += s.vx * .15; f.vy += s.vy * .15; SFX.thud(); sparks(s.x, s.y, '#fff', 8);
        if (f.hp <= 0) { f.dead = true; boom(f.x, f.y, { cols: ['#c8c3d8', '#fff', YEL, '#a9a3c0'], size: 1.2, smokeCol: '#8e88aa' }); shake(10); SFX.boom(); popup(f.x, f.y - 30, 'POOF!', '#fff', 28); } }
      if (!f.dead) for (let k = 0; k < 5; k++) { ell(c, f.x + Math.cos(k * 1.3) * 28, f.y + Math.sin(k * 1.3) * 16, 32, 26); fs(c, f.hit ? '#fff' : '#8e88aa', 3); }
      if (!f.dead) { c.fillStyle = INK; ell(c, f.x - 14, f.y - 2, 5, 3); c.fill(); ell(c, f.x + 14, f.y - 2, 5, 3); c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.arc(f.x, f.y + 16, 9, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
    }
    b.fogs = b.fogs.filter(f => !f.dead);
    c.restore();
    c.lineWidth = 16; c.strokeStyle = '#c9a227'; c.beginPath(); c.arc(cx, cy, R + 8, 0, TAU); c.stroke(); c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.arc(cx, cy, R + 16, 0, TAU); c.stroke();
    drawShots(c, b.shots);
    label(c, `🌙 Night ${b.night + 1} / 3`, cx, 26, YEL, 20);
    // notebook of moons found
    rr(c, 640, 60, 330, 260, 16); fs(c, PAPER, 4); txt(c, 'MOONS FOUND', 805, 92, 24, ACC);
    const tot = new Set([...b.found].map(k => k % 10)).size;
    for (let i = 0; i < 4; i++) { ell(c, 700 + i * 70, 160, 22, 22); fs(c, [...b.found].some(k => k % 10 === i) ? '#fff' : '#e7e0cf', 3); txt(c, 'IIIIV'.slice(0, 0) + ['I', 'II', 'III', 'IV'][i], 700 + i * 70, 205, 18, INK, 'center', false); }
    txt(c, b.fogs.length ? `☁ fog left: ${b.fogs.length}` : '👆 Tap the moons!', 805, 260, 22, b.fogs.length ? '#8e88aa' : GRN, 'center', false);
    // press-cannon
    drawBlaster(c, 820, 520, b.aim.x, b.aim.y, t, 0);
    label(c, '🖨 Book blaster', 820, 600, YEL, 16);
    drawPup(c, 120, 520, 44, { hat: 'renaissance', t, look: 1 }); drawSay(c, t, 150, 470, 170, 350, 300);
    if (!touched) demoHand(c, t, b.fogs[0] ? b.fogs[0].x : 400, b.fogs[0] ? b.fogs[0].y : 250);
    // night complete when fog cleared and all visible moons tapped
    if (!b.over && !b.fogs.length && this.moons.every(m => b.found.has(night * 10 + m.i)) && !b.wait) {
      b.wait = true;
      if (b.night < 2) setTimeout(() => { b.night++; b.wait = false; this.spawnFog(); SFX.whoosh(); say(b.night === 1 ? 'Next night: the moons moved!' : 'Last night! They moved again!', 4); }, 900);
      else bossWin('EUREKA!', '🌕 4 moons circle Jupiter! Not everything circles Earth! 🌍', b);
    }
    P.stat(`🌕 Moons: <b>${tot}</b> / 4 · ☁ ${b.fogs.length}`);
  },
  down(p) {
    const b = this.b; if (b.over) return; touched = true;
    if (!b.fogs.length) { const night = [2, 0, 3][b.night]; const m = (this.moons || []).filter(m => !b.found.has(night * 10 + m.i) && Math.hypot(m.x - p.x, m.y - p.y) < 40).sort((a, c) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(c.x - p.x, c.y - p.y))[0];
      if (m) { b.found.add(night * 10 + m.i); SFX.pop(); sparks(m.x, m.y, YEL, 14); popup(m.x, m.y - 30, '🌕!', YEL, 30); const all = new Set([...b.found].map(k => k % 10)).size; if (all === 4 && b.night === 2 && this.moons.every(mm => b.found.has(night * 10 + mm.i))) FX.slow = 1; }
      return; }
    b.aim = p; fire(b.shots, 790, 500, p.x, p.y, 'book', 900);
  },
  move(p, d) { if (d) this.b.aim = p; },
};
</script>
<script>
'use strict';
ERAS = [EGYPT, ROME, MONGOL, RENAISSANCE];
window.__game = {
  get state() { return { screen: document.querySelector('.screen.on').id, era: ei, phase: pi, save: JSON.parse(JSON.stringify(save)) }; },
  open: openEra, phase: i => startPhase(i), get ph() { return ph; }, get era() { return era; }, eg: () => eg, fx: FX, hub, setTime: s => { tLeft = s; },
  unlockAll() { save.stars = save.stars.map(s => s || 1); persist(); buildTitle(); },
  reset() { save = { stars: [0, 0, 0, 0], played: [0, 0, 0, 0] }; persist(); buildTitle(); },
};
buildTitle();
requestAnimationFrame(loop);
</script>
