<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capitol Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --leg:#4cc9f0; --exe:#ff9f1c; --jud:#c39bff;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2b2a4a; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800; font-size:18px;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px; background:var(--accent); color:#fff;
    font-family:var(--toon); font-weight:400; font-size:24px; padding:10px 26px 4px; border-radius:999px; border:3px solid var(--ink);
    box-shadow:0 6px 0 var(--ink); letter-spacing:1px; text-decoration:none; transition:transform .08s; white-space:nowrap; position:relative; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); } .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); } .btn.blu { background:var(--blue); color:var(--ink); }
  .btn:disabled { opacity:.4; filter:grayscale(.7); pointer-events:none; }
  .btn.sm { font-size:19px; padding:8px 16px 3px; }
  .round { width:60px; height:60px; flex:none; border-radius:50%; border:3px solid var(--ink); background:#fff; box-shadow:0 5px 0 var(--ink);
    font-size:26px; display:grid; place-items:center; padding:0; text-decoration:none; color:var(--ink); }
  .round:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .round.help { background:var(--yellow); font-family:var(--toon); font-size:30px; padding-top:4px; }
  .sayb { width:52px; height:52px; flex:none; border-radius:50%; border:3px solid var(--ink); background:var(--blue); box-shadow:0 4px 0 var(--ink);
    font-size:22px; display:inline-grid; place-items:center; padding:0; }
  .sayb:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  /* guided play: glow + bouncing arrow on the next thing to do */
  .guide { animation:glow .9s ease-in-out infinite alternate; z-index:2; }
  .guide::after { content:"⬇"; position:absolute; left:50%; top:-50px; margin-left:-16px; font-size:36px; line-height:1; color:var(--yellow);
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; animation:arrowb .55s ease-in-out infinite alternate; pointer-events:none; font-family:system-ui; }
  @keyframes glow { from { filter:drop-shadow(0 0 0 #ffd23f); } to { filter:drop-shadow(0 0 12px #ffd23f) brightness(1.08); } }
  @keyframes arrowb { to { transform:translateY(10px); } }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  h1.big { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(54px,9vw,120px); line-height:.95; color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1.big span { color:var(--accent); }
  h2.big { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(28px,3.6vw,42px); color:var(--accent); line-height:1;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(2deg); } }
  @keyframes wiggle { 25% { transform:rotate(-1.5deg); } 75% { transform:rotate(1.5deg); } }
  @keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
  @keyframes popIn { 0% { transform:scale(.6); opacity:0; } 70% { transform:scale(1.05); opacity:1; } 100% { transform:scale(1); } }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  .shake { animation:shake .45s; }

  /* title */
  #title { background:linear-gradient(#7fd3ff 0%, #bfeaff 55%, #fff1c9 100%); }
  .tbar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; }
  .tbar .gap { flex:1; }
  .tmain { flex:1; display:flex; align-items:center; justify-content:center; gap:4vw; padding:0 16px; flex-wrap:wrap; min-height:0; }
  .tleft { text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .tsub { display:inline-block; padding:8px 18px 4px; font-family:var(--toon); font-size:clamp(20px,2.6vw,32px); background:#fff; transform:rotate(1.5deg); }
  .tpup { width:clamp(170px,26vw,360px); animation:bob 2.4s ease-in-out infinite; }
  .start { font-size:clamp(30px,3.6vw,44px); padding:16px 44px 8px; animation:pulse 1s ease-in-out infinite; }
  .skyline { height:clamp(90px,20vh,220px); flex:none; background:linear-gradient(transparent 84%,#1d1b26 84%,#1d1b26 85.4%,#06d6a0 85.4%); }
  .skyline svg { width:100%; height:100%; display:block; }

  /* map */
  #map { background:#8fdc8a; }
  .mbar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper); border-bottom:3px solid var(--ink); }
  .mbar .grow { flex:1; min-width:0; }
  .mbar h2 { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(22px,3vw,34px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .starcount { font-family:var(--toon); font-size:22px; padding:8px 14px 3px; background:var(--yellow); border:3px solid var(--ink); border-radius:999px; white-space:nowrap; }
  .mapbox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; }
  .mapfoot { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--paper); border-top:3px solid var(--ink); }
  .mapfoot .badges { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .mapfoot .bdg { width:40px; height:40px; border-radius:50%; border:3px solid var(--ink); background:#fff; display:grid; place-items:center; font-size:20px; }
  .mapfoot .bdg.off { background:#d7d2c4; filter:grayscale(1); opacity:.45; }

  /* canvas games */
  .cwrap { position:relative; margin:0 auto; }
  canvas.gcv { display:block; width:100%; height:100%; touch-action:none; border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); background:#bfeaff; cursor:crosshair; }
  .qline { display:flex; align-items:center; justify-content:center; gap:10px; max-width:1000px; margin:0 auto 10px; font-size:clamp(20px,2.4vw,30px); line-height:1.1; text-align:center; }
  .qline .qi { font-size:clamp(34px,4vw,48px); line-height:1; }
  .bfoot { min-height:56px; display:flex; align-items:center; justify-content:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .why { display:flex; align-items:center; gap:10px; padding:6px 14px 6px 6px; border:3px solid var(--ink); border-radius:999px; font-size:20px; animation:popIn .25s; background:#d9fff0; }
  .why.bad { background:#fff3c4; }
  .stagehead { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; font-size:clamp(20px,2.4vw,28px); }
  .stagehead .qi { font-size:clamp(34px,4vw,46px); }
  .dots { display:flex; gap:6px; } .dots i { width:16px; height:16px; border-radius:50%; border:3px solid var(--ink); background:#fff; }
  .dots i.on { background:var(--green); }

  /* mission */
  #mission { background:#ffe9b8 radial-gradient(#f6d58f 1.5px, transparent 2px) 0 0/22px 22px; }
  .mhead { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper); border-bottom:3px solid var(--ink); flex-wrap:wrap; }
  .mtitle { flex:1; min-width:120px; line-height:1.05; }
  .mtitle b { display:block; font-family:var(--toon); font-weight:400; font-size:22px; color:var(--accent); }
  .steps { display:flex; gap:6px; list-style:none; margin:0; padding:0; flex-wrap:nowrap; }
  .steps li { padding:6px 12px 4px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-size:15px; white-space:nowrap; }
  .steps li.on { background:var(--yellow); transform:scale(1.08); }
  .steps li.done { background:var(--green); }
  .chip { padding:8px 14px 6px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-size:17px; white-space:nowrap; }
  .chip.out { background:#d9fff0; }
  .chip[hidden] { display:none; }
  #stage { flex:1; overflow:auto; padding:12px 16px 20px; -webkit-overflow-scrolling:touch; }
  .phead { display:flex; align-items:center; justify-content:center; gap:12px; margin:2px 0 12px; flex-wrap:wrap; }
  .ptag { display:inline-block; font-size:15px; letter-spacing:2px; text-transform:uppercase; background:var(--ink); color:#fff; padding:5px 12px 4px; border-radius:999px; }
  .pbody { max-width:1250px; margin:0 auto; }
  .prompt { text-align:center; font-size:22px; margin:0 0 12px; }
  .mfoot { display:flex; align-items:center; gap:12px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--paper); border-top:3px solid var(--ink); }
  .pupmini { width:70px; height:70px; flex:none; }
  .pupmini svg { width:100%; height:100%; }
  .bubble { flex:1; min-width:0; position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px 14px; font-size:20px; line-height:1.2; min-height:52px; display:flex; align-items:center; }
  .bubble::before { content:""; position:absolute; left:-14px; top:50%; margin-top:-10px; border:10px solid transparent; border-right:12px solid var(--ink); border-left:0; }
  .bubble.good { background:#d9fff0; } .bubble.bad { background:#fff3c4; }
  .bubble.say { animation:popIn .25s; }
  .fbtns { display:flex; gap:10px; flex:none; }
  .fbtns [hidden] { display:none; }

  /* comic burst */
  #fx { position:fixed; inset:0; pointer-events:none; z-index:200; }
  .burst { position:fixed; width:170px; height:150px; margin:-75px 0 0 -85px; animation:burst .95s ease-out forwards; }
  .burst svg { position:absolute; inset:0; width:100%; height:100%; }
  .burst b { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--toon); font-weight:400; font-size:28px; color:#fff; text-align:center;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:2px 2px 0 var(--ink); transform:rotate(-8deg); }
  @keyframes burst { 0% { transform:scale(.2) rotate(-20deg); opacity:0; } 25% { transform:scale(1.12) rotate(4deg); opacity:1; }
    70% { transform:scale(1); opacity:1; } 100% { transform:scale(1.1) translateY(-24px); opacity:0; } }
  .fly { position:fixed; font-size:40px; z-index:210; transition:transform .7s cubic-bezier(.3,1.4,.5,1); pointer-events:none; margin:-24px 0 0 -24px; }
  .confetti { position:fixed; top:-20px; width:14px; height:20px; border:2px solid var(--ink); z-index:220; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .hand { position:fixed; left:0; top:0; margin:-6px 0 0 -22px; font-size:58px; z-index:260; pointer-events:none; filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35)); }

  /* sorter */
  .tray { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:76px; padding:12px; border:3px dashed #b9ad8f; border-radius:18px; background:rgba(255,255,255,.55); }
  .tray:empty::after { content:"✔"; font-family:var(--toon); font-size:30px; color:#0a8f6c; align-self:center; }
  .chip-item { position:relative; min-height:60px; padding:10px 16px; background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink);
    font-size:20px; display:flex; align-items:center; cursor:grab; touch-action:none; transition:transform .1s, background .1s; line-height:1.15; }
  .chip-item.sel { background:var(--yellow); transform:translateY(-4px) rotate(-2deg); }
  .chip-item.ghost { position:fixed; z-index:150; pointer-events:none; transform:rotate(-3deg) scale(1.06); box-shadow:6px 8px 0 rgba(0,0,0,.25); margin:0; }
  .chip-item.ghost::after { display:none; }
  .chip-item.dragging { opacity:.3; }
  .chip-item.placed { cursor:default; font-size:15px; min-height:0; padding:6px 10px; box-shadow:0 2px 0 var(--ink); background:#eafff6; animation:popIn .3s; }
  .bins[style="--n:1"] { max-width:520px; margin-left:auto; margin-right:auto; }
  .bins { display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:12px; margin-top:16px; }
  .bin { border:3px solid var(--ink); border-radius:18px; background:rgba(255,255,255,.75); min-height:160px; box-shadow:4px 4px 0 var(--ink);
    display:flex; flex-direction:column; cursor:pointer; transition:transform .12s, background .12s; }
  .binhead { background:var(--c); padding:8px 8px 4px; border-bottom:3px solid var(--ink); border-radius:14px 14px 0 0; font-family:var(--toon);
    font-weight:400; font-size:21px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.05; }
  .binhead .bi { font-size:36px; line-height:1; }
  .binbody { flex:1; display:flex; flex-wrap:wrap; gap:6px; padding:8px; align-content:flex-start; justify-content:center; }
  .bins.armed .bin { animation:wiggle .7s infinite; }
  .bin.over { transform:scale(1.04); background:#fff3c4; }

  /* picture tiles */
  .qcard { max-width:860px; margin:0 auto; padding:14px 18px 18px; animation:popIn .3s; }
  .mprog { font-size:15px; opacity:.7; letter-spacing:1px; text-align:center; }
  .ptiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .ptile { position:relative; min-height:124px; border:3px solid var(--ink); border-radius:18px; background:#fff; box-shadow:0 6px 0 var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:10px 8px; line-height:1.1; }
  .ptile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .ptile .pi { font-size:54px; line-height:1; }
  .ptile .pt { font-size:20px; }
  .ptile.right { background:var(--green); animation:popIn .3s; }
  .ptile.wrong { opacity:.45; animation:shake .4s; }
  .ptile:disabled { cursor:default; }

  /* discover */
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  .dcard { position:relative; min-height:200px; padding:14px; text-align:center; cursor:pointer; background:var(--c); }
  .dcard .front { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:100%; min-height:170px; }
  .dcard .dicon { font-size:76px; line-height:1; animation:bob 2s ease-in-out infinite; }
  .dcard .front b { font-size:26px; }
  .dcard.open { background:#fff; cursor:default; animation:popIn .3s; }
  .dcard .dtop { display:flex; align-items:center; justify-content:center; gap:10px; }
  .dcard .dtop b { font-size:24px; }
  .dcard .vis { font-size:44px; line-height:1.2; margin:8px 0 2px; letter-spacing:4px; }
  .dcard p { font-size:21px; line-height:1.25; margin:8px 0; }
  .morebtn { border:3px solid var(--ink); border-radius:999px; background:var(--yellow); padding:6px 14px; font-size:16px; min-height:44px; }
  .moretxt { margin-top:8px; padding:10px; border:3px dashed #b9ad8f; border-radius:14px; background:#fffaf0; font-size:16px; line-height:1.35; text-align:left; display:flex; gap:8px; align-items:flex-start; }
  .mini { margin-top:10px; padding:10px; border:3px dashed #b9ad8f; border-radius:14px; background:#fffaf0; }
  input[type=range] { width:100%; height:44px; accent-color:var(--accent); }
  .seats { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; justify-content:center; }
  .seats i { width:12px; height:12px; border-radius:50%; background:var(--leg); border:2px solid var(--ink); }
  .seats i.sen { background:var(--accent); }
  .ladder { display:flex; flex-direction:column; gap:6px; }
  .rung { display:flex; align-items:center; gap:8px; padding:6px 10px; border:3px solid var(--ink); border-radius:12px; background:#fff; font-size:17px; }
  .rung.on { background:var(--yellow); }
  .rung .fold { margin-left:auto; font-size:26px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .two > div { border:3px solid var(--ink); border-radius:12px; padding:6px; font-size:16px; line-height:1.25; }
  .two big { display:block; font-family:var(--toon); font-size:30px; }

  /* sequence */
  .seqline { display:flex; flex-direction:column; gap:8px; max-width:560px; margin:0 auto 14px; }
  .seqdone { padding:8px 14px; border:3px solid var(--ink); border-radius:14px; background:var(--green); font-size:21px; animation:popIn .3s; }
  .seqslot { padding:8px 14px; border:3px dashed #b9ad8f; border-radius:14px; font-size:19px; opacity:.7; }
  .seqpool { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .seqcard { min-height:64px; padding:8px 16px; border:3px solid var(--ink); border-radius:14px; background:#fff; box-shadow:0 5px 0 var(--ink); font-size:21px; }

  /* board game */
  .board { display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:8px; max-width:1150px; margin:0 auto; }
  .sq { position:relative; min-height:88px; border:3px solid var(--ink); border-radius:14px; background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:14px; text-align:center; padding:6px 4px; line-height:1.05; box-shadow:0 3px 0 var(--ink); }
  .sq .si { font-size:32px; line-height:1.1; }
  .sq.gate { background:var(--yellow); } .sq.cleared { background:var(--green); } .sq.end { background:var(--accent); color:#fff; }
  .sq.here { outline:4px solid var(--accent); outline-offset:2px; }
  .sq .tok { position:absolute; top:-18px; right:-8px; width:54px; height:54px; animation:bob 1.2s ease-in-out infinite; z-index:2; }
  .bgctl { display:flex; gap:16px; align-items:flex-start; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .die { width:84px; height:84px; flex:none; border:3px solid var(--ink); border-radius:16px; background:#fff; box-shadow:4px 4px 0 var(--ink);
    display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:10px; }
  .die i { width:14px; height:14px; border-radius:50%; background:var(--ink); place-self:center; visibility:hidden; }
  .die i.on { visibility:visible; }
  .die.roll { animation:shake .3s infinite; }
  .evt { flex:1; min-width:260px; max-width:780px; padding:14px 16px; text-align:center; }
  .evt .ptiles { margin-top:8px; }
  .desk { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:12px; flex-wrap:wrap; }
  .billdoc { position:relative; width:170px; height:200px; background:#fffdf3; border:3px solid var(--ink); border-radius:8px; box-shadow:4px 4px 0 var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:46px; transform:rotate(-2deg); }
  .billdoc b { font-family:var(--toon); font-weight:400; font-size:26px; }
  .stamp { position:relative; width:130px; height:130px; border:3px solid var(--ink); border-radius:24px; box-shadow:0 7px 0 var(--ink); font-size:52px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .stamp b { font-family:var(--toon); font-weight:400; font-size:26px; margin-top:6px; }
  .stamp.sign { background:var(--green); } .stamp.veto { background:#ff8fa3; }
  .stamp:active { transform:translateY(4px); box-shadow:0 3px 0 var(--ink); }
  .smark { position:absolute; inset:auto; font-family:var(--toon); font-size:40px; padding:4px 12px 0; border:5px solid; border-radius:10px; transform:rotate(-14deg);
    background:rgba(255,255,255,.8); animation:smash .35s cubic-bezier(.2,1.6,.5,1); }
  .smark.sign { color:#0a8f6c; } .smark.veto { color:#e5383b; }
  @keyframes smash { 0% { transform:scale(3) rotate(-14deg); opacity:0; } 100% { transform:scale(1) rotate(-14deg); opacity:1; } }
  .pads { display:flex; gap:28px; justify-content:center; align-items:flex-end; margin-top:10px; }
  .lcol { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .lcol .lab { font-family:var(--toon); font-size:22px; }
  .vmeter { position:relative; width:74px; height:190px; border:3px solid var(--ink); border-radius:14px; background:#fff; overflow:hidden; }
  .vmeter i { position:absolute; left:0; right:0; bottom:0; height:40%; background:var(--green); transition:height .3s; }
  .vmeter u { position:absolute; left:-2px; right:-2px; bottom:66.7%; border-top:4px dashed var(--accent); }
  .vmeter s { position:absolute; right:3px; bottom:67%; font-size:13px; text-decoration:none; font-weight:900; }

<script>

const KEYS = {};

// ---------- drag + tap ----------
function makeDraggable(el, onDrop, onTap) {
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('placed') || (e.button && e.button !== 0)) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, id = e.pointerId; let ghost = null, over = null;
    const move = ev => {
      if (ev.pointerId !== id) return;
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 9) {
        const r = el.getBoundingClientRect();
        ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        ghost.style.width = r.width + 'px'; ghost._ox = sx - r.left; ghost._oy = sy - r.top;
        document.body.append(ghost); el.classList.add('dragging');
      }
      if (ghost) {
        ghost.style.left = (ev.clientX - ghost._ox) + 'px'; ghost.style.top = (ev.clientY - ghost._oy) + 'px';
        const t = document.elementFromPoint(ev.clientX, ev.clientY), b = t && t.closest('[data-bin]');
        if (b !== over) { if (over) over.classList.remove('over'); over = b; if (over) over.classList.add('over'); }
      }
    };
    const up = ev => {
      if (ev.pointerId !== id) return;
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (over) over.classList.remove('over');
      if (ghost) { ghost.remove(); el.classList.remove('dragging'); if (ev.type === 'pointerup') onDrop(document.elementFromPoint(ev.clientX, ev.clientY)); }
      else if (ev.type === 'pointerup') onTap();
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); } });
}

// Canvas sized to fit the space left in the stage. Picks a landscape or portrait world.
function gameCanvas(el, o = {}) {
  const wrap = h('div', { class: 'cwrap' }); el.append(wrap);
  const availW = Math.max(200, el.clientWidth || innerWidth - 32);

  const portrait = availW < availH * 1.05;
  const [W, H] = portrait ? (o.port || [600, 780]) : (o.land || [1000, 560]);
  const cssW = Math.min(availW, availH * W / H), cssH = cssW * H / W;
