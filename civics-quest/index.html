<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capitol Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --leg:#4cc9f0; --exe:#ff9f1c; --jud:#c39bff;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2b2a4a; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800; font-size:18px;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px; background:var(--accent); color:#fff;
    font-family:var(--toon); font-weight:400; font-size:24px; padding:10px 26px 4px; border-radius:999px; border:3px solid var(--ink);
    box-shadow:0 6px 0 var(--ink); letter-spacing:1px; text-decoration:none; transition:transform .08s; white-space:nowrap; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); } .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); } .btn.blu { background:var(--blue); color:var(--ink); }
  .btn:disabled { opacity:.4; filter:grayscale(.7); pointer-events:none; }
  .btn.sm { font-size:19px; padding:8px 16px 3px; }
  .btn.pulse { animation:pulseBtn 1s infinite; }
  @keyframes pulseBtn { 50% { transform:scale(1.07); } }
  .round { width:60px; height:60px; flex:none; border-radius:50%; border:3px solid var(--ink); background:#fff; box-shadow:0 5px 0 var(--ink);
    font-size:26px; display:grid; place-items:center; padding:0; }
  .round:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  h1.big { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(46px,8vw,104px); line-height:.95; color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1.big span { color:var(--accent); }
  h2.big { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(30px,4.5vw,48px); color:var(--accent); line-height:1;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(2deg); } }
  @keyframes wiggle { 25% { transform:rotate(-1.5deg); } 75% { transform:rotate(1.5deg); } }
  @keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
  @keyframes popIn { 0% { transform:scale(.6); opacity:0; } 70% { transform:scale(1.05); opacity:1; } 100% { transform:scale(1); } }
  .shake { animation:shake .45s; }

  /* ---------- title ---------- */
  #title { background:linear-gradient(#7fd3ff 0%, #bfeaff 55%, #fff1c9 100%); overflow:auto; }
  #title .tbar { display:flex; justify-content:space-between; padding:14px 16px; }
  #title .tmain { flex:1; display:flex; align-items:center; justify-content:center; gap:3vw; padding:0 16px 12px; flex-wrap:wrap; }
  #title .tleft { text-align:center; max-width:640px; }
  #title .sub { display:inline-block; margin:18px 0 8px; padding:8px 18px 4px; font-family:var(--toon); font-size:clamp(20px,2.6vw,32px);
    background:#fff; transform:rotate(1.5deg); }
  #title p.lead { font-size:clamp(17px,1.8vw,22px); margin:14px auto 18px; max-width:520px; }
  #title .tpup { width:clamp(190px,26vw,360px); animation:bob 2.4s ease-in-out infinite; }
  #title .skyline { height:clamp(110px,22vh,230px); flex:none; background:linear-gradient(transparent 84%,#1d1b26 84%,#1d1b26 85.4%,#06d6a0 85.4%); }
  #title .skyline svg { width:100%; height:100%; display:block; }
  .tbtns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* ---------- map ---------- */
  #map { background:#8fdc8a radial-gradient(circle at 20% 30%, #a6e8a0 0 8%, transparent 9%) 0 0/160px 160px; }
  .mbar { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--paper); border-bottom:3px solid var(--ink); flex-wrap:wrap; }
  .mbar .grow { flex:1; min-width:120px; }
  .mbar h2 { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(24px,3vw,36px); }
  .starcount { font-family:var(--toon); font-size:24px; padding:8px 14px 3px; background:var(--yellow); border:3px solid var(--ink); border-radius:999px; white-space:nowrap; }
  .mapscroll { flex:1; overflow:auto; padding:16px; -webkit-overflow-scrolling:touch; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:0 auto 14px; max-width:1300px; padding:8px 12px; }
  .badges .bdg { width:52px; height:52px; border-radius:50%; border:3px solid var(--ink); background:#fff; display:grid; place-items:center; font-size:26px; }
  .badges .bdg.off { background:#d7d2c4; filter:grayscale(1); opacity:.5; }
  .badges .lbl { align-self:center; font-family:var(--toon); font-size:18px; margin-right:4px; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; max-width:1300px; margin:0 auto; }
  .tile { position:relative; text-align:center; padding:10px 10px 12px; cursor:pointer; background:var(--paper); border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 6px 0 var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .tile .art { width:100%; aspect-ratio:16/11; border-radius:12px; border:3px solid var(--ink); background:var(--c); display:grid; place-items:center; overflow:hidden; }
  .tile .art svg { width:92%; height:92%; }
  .tile .num { position:absolute; top:-12px; left:-10px; width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff;
    border:3px solid var(--ink); display:grid; place-items:center; font-family:var(--toon); font-size:24px; padding-top:4px; }
  .tile b { font-family:var(--toon); font-weight:400; font-size:22px; line-height:1.05; margin-top:4px; }
  .tile small { font-size:15px; opacity:.75; }
  .tile .st { font-size:22px; color:#f4a100; letter-spacing:3px; -webkit-text-stroke:1px var(--ink); }
  .tile .st .off { color:#e2dccb; }
  .tile.locked { background:#e4ddcc; color:#857c6e; }
  .tile.locked .art { filter:grayscale(1) opacity(.55); }
  .tile.locked .num { background:#a49b8b; }
  .tile .lock { position:absolute; inset:0; display:grid; place-items:center; font-size:52px; pointer-events:none; }
  .tile.next { animation:wiggle 1.4s infinite; }
  .tile.side .num { background:var(--green); }

  /* ---------- mission ---------- */
  #mission { background:#ffe9b8 radial-gradient(#f6d58f 1.5px, transparent 2px) 0 0/22px 22px; }
  .mhead { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper); border-bottom:3px solid var(--ink); flex-wrap:wrap; }
  .mtitle { flex:1; min-width:150px; line-height:1.05; }
  .mtitle b { display:block; font-family:var(--toon); font-weight:400; font-size:22px; color:var(--accent); }
  .mtitle span { font-size:15px; opacity:.75; }
  .steps { display:flex; gap:6px; list-style:none; margin:0; padding:0; flex-wrap:nowrap; }
  .steps li { padding:6px 12px 4px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-size:15px; white-space:nowrap; }
  .steps li.on { background:var(--yellow); transform:scale(1.08); }
  .steps li.done { background:var(--green); }
  .chip { padding:8px 14px 6px; border:3px solid var(--ink); border-radius:999px; background:#fff; font-size:17px; white-space:nowrap; }
  .chip.out { background:#d9fff0; }
  .chip[hidden] { display:none; }
  #stage { flex:1; overflow:auto; padding:16px 16px 24px; -webkit-overflow-scrolling:touch; }
  .phead { text-align:center; margin:2px 0 14px; }
  .ptag { display:inline-block; font-size:15px; letter-spacing:2px; text-transform:uppercase; background:var(--ink); color:#fff; padding:4px 12px 3px; border-radius:999px; }
  .phead h2 { margin:8px 0 0; }
  .pbody { max-width:1250px; margin:0 auto; }
  .prompt { text-align:center; font-size:20px; margin:0 0 12px; }
  .mfoot { display:flex; align-items:center; gap:12px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--paper); border-top:3px solid var(--ink); }
  .pupmini { width:70px; height:70px; flex:none; }
  .pupmini svg { width:100%; height:100%; }
  .bubble { flex:1; position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px 14px; font-size:18px; line-height:1.25; min-height:52px; display:flex; align-items:center; }
  .bubble::before { content:""; position:absolute; left:-14px; top:50%; margin-top:-10px; border:10px solid transparent; border-right:12px solid var(--ink); border-left:0; }
  .bubble.good { background:#d9fff0; } .bubble.bad { background:#ffe8ec; }
  .bubble.say { animation:popIn .25s; }
  .fbtns { display:flex; gap:10px; flex:none; }
  .fbtns [hidden] { display:none; }

  /* comic burst */
  #fx { position:fixed; inset:0; pointer-events:none; z-index:200; }
  .burst { position:fixed; width:170px; height:150px; margin:-75px 0 0 -85px; animation:burst .95s ease-out forwards; }
  .burst svg { position:absolute; inset:0; width:100%; height:100%; }
  .burst b { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--toon); font-weight:400; font-size:30px; color:#fff;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:2px 2px 0 var(--ink); transform:rotate(-8deg); }
  @keyframes burst { 0% { transform:scale(.2) rotate(-20deg); opacity:0; } 25% { transform:scale(1.12) rotate(4deg); opacity:1; }
    70% { transform:scale(1); opacity:1; } 100% { transform:scale(1.1) translateY(-24px); opacity:0; } }
  .fly { position:fixed; font-size:40px; z-index:210; transition:transform .7s cubic-bezier(.3,1.4,.5,1); pointer-events:none; margin:-24px 0 0 -24px; }
  .confetti { position:fixed; top:-20px; width:14px; height:20px; border:2px solid var(--ink); z-index:220; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

  /* sorter */
  .tray { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:76px; padding:12px; border:3px dashed #b9ad8f; border-radius:18px; background:rgba(255,255,255,.55); }
  .tray:empty::after { content:"All sorted! ✔"; font-family:var(--toon); font-size:22px; color:#0a8f6c; align-self:center; }
  .chip-item { min-height:56px; padding:10px 16px; background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink);
    font-size:18px; display:flex; align-items:center; cursor:grab; touch-action:none; transition:transform .1s, background .1s; line-height:1.15; }
  .chip-item.sel { background:var(--yellow); transform:translateY(-4px) rotate(-2deg); }
  .chip-item.ghost { position:fixed; z-index:150; pointer-events:none; transform:rotate(-3deg) scale(1.06); box-shadow:6px 8px 0 rgba(0,0,0,.25); margin:0; }
  .chip-item.dragging { opacity:.3; }
  .chip-item.placed { cursor:default; font-size:15px; min-height:0; padding:6px 10px; box-shadow:0 2px 0 var(--ink); background:#eafff6; animation:popIn .3s; }
  .bins[style="--n:1"] { max-width:520px; margin-left:auto; margin-right:auto; }
  .bins { display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:12px; margin-top:16px; }
  .bin { border:3px solid var(--ink); border-radius:18px; background:rgba(255,255,255,.75); min-height:160px; box-shadow:4px 4px 0 var(--ink);
    display:flex; flex-direction:column; cursor:pointer; transition:transform .12s, background .12s; }
  .binhead { background:var(--c); padding:8px 8px 4px; border-bottom:3px solid var(--ink); border-radius:14px 14px 0 0; font-family:var(--toon);
    font-weight:400; font-size:21px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.05; }
  .binhead .bi { font-size:30px; line-height:1; }
  .binhead .bart { width:120px; height:86px; } .binhead .bart svg { width:100%; height:100%; }
  .binbody { flex:1; display:flex; flex-wrap:wrap; gap:6px; padding:8px; align-content:flex-start; justify-content:center; }
  .bins.armed .bin { animation:wiggle .7s infinite; }
  .bin.over { transform:scale(1.04); background:#fff3c4; }

  /* questions */
  .qcard { max-width:820px; margin:0 auto; padding:18px 20px 20px; animation:popIn .3s; }
  .mprog { font-size:15px; opacity:.7; letter-spacing:1px; text-transform:uppercase; }
  .qhead { display:inline-block; margin:6px 0 2px; padding:4px 12px 2px; background:var(--yellow); border:3px solid var(--ink); border-radius:10px; font-family:var(--toon); font-size:20px; }
  .q { font-size:clamp(20px,2.3vw,26px); margin:10px 0 14px; line-height:1.25; }
  .qicon { font-size:56px; line-height:1; margin-top:6px; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .opt { min-height:64px; border:3px solid var(--ink); border-radius:16px; background:#fff; box-shadow:0 5px 0 var(--ink); font-size:19px; padding:10px 14px; line-height:1.2; }
  .opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .opt.right { background:var(--green); } .opt.wrong { background:#ffb3c1; text-decoration:line-through; }
  .opt:disabled { cursor:default; }
  .explain { margin-top:14px; padding:10px 14px; border:3px solid var(--ink); border-radius:14px; font-size:19px; line-height:1.3; animation:popIn .25s; }
  .explain.good { background:#d9fff0; } .explain.bad { background:#fff3c4; }
  .cright { text-align:right; margin-top:12px; }

  /* discover */
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
  .dcard { position:relative; min-height:210px; padding:16px; text-align:center; cursor:pointer; background:var(--c); }
  .dcard .front { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:100%; min-height:170px; }
  .dcard .dicon { font-size:66px; line-height:1; animation:bob 2s ease-in-out infinite; }
  .dcard .front b { font-size:26px; }
  .dcard small { font-size:15px; opacity:.75; }
  .dcard.open { background:#fff; text-align:left; cursor:default; animation:popIn .3s; }
  .dcard .dtop { display:flex; align-items:center; gap:10px; }
  .dcard .dtop .dicon { font-size:40px; animation:none; }
  .dcard .dtop b { font-size:24px; }
  .dcard p { font-size:18px; line-height:1.35; margin:10px 0 4px; }
  .mini { margin-top:10px; padding:10px; border:3px dashed #b9ad8f; border-radius:14px; background:#fffaf0; }
  input[type=range] { width:100%; height:44px; accent-color:var(--accent); }
  .seats { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
  .seats i { width:12px; height:12px; border-radius:50%; background:var(--leg); border:2px solid var(--ink); }
  .seats i.sen { background:var(--accent); }
  .ladder { display:flex; flex-direction:column; gap:6px; }
  .rung { display:flex; align-items:center; gap:8px; padding:6px 10px; border:3px solid var(--ink); border-radius:12px; background:#fff; font-size:16px; }
  .rung.on { background:var(--yellow); }
  .rung .fold { margin-left:auto; font-size:26px; }

  /* sequence */
  .seqline { display:flex; flex-direction:column; gap:8px; max-width:640px; margin:0 auto 14px; }
  .seqdone { padding:10px 14px; border:3px solid var(--ink); border-radius:14px; background:var(--green); font-size:19px; animation:popIn .3s; }
  .seqslot { padding:10px 14px; border:3px dashed #b9ad8f; border-radius:14px; font-size:17px; opacity:.7; }
  .seqpool { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .seqcard { min-height:60px; padding:8px 16px; border:3px solid var(--ink); border-radius:14px; background:#fff; box-shadow:0 5px 0 var(--ink); font-size:19px; }

  /* board game */
  .board { display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:8px; max-width:1150px; margin:0 auto; }
  .sq { position:relative; min-height:92px; border:3px solid var(--ink); border-radius:14px; background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:14px; text-align:center; padding:6px 4px; line-height:1.05; box-shadow:0 3px 0 var(--ink); }
  .sq .si { font-size:30px; line-height:1.1; }
  .sq.gate { background:var(--yellow); } .sq.cleared { background:var(--green); } .sq.end { background:var(--accent); color:#fff; }
  .sq.here { outline:4px solid var(--accent); outline-offset:2px; }
  .sq .tok { position:absolute; top:-18px; right:-8px; width:54px; height:54px; animation:bob 1.2s ease-in-out infinite; z-index:2; }
  .sq .arrow { position:absolute; font-size:14px; opacity:.5; }
  .bgctl { display:flex; gap:16px; align-items:flex-start; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .die { width:84px; height:84px; flex:none; border:3px solid var(--ink); border-radius:16px; background:#fff; box-shadow:4px 4px 0 var(--ink);
    display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:10px; }
  .die i { width:14px; height:14px; border-radius:50%; background:var(--ink); place-self:center; visibility:hidden; }
  .die i.on { visibility:visible; }
  .die.roll { animation:shake .3s infinite; }
  .evt { flex:1; min-width:260px; max-width:760px; padding:14px 16px; }
  .evt .opts { margin-top:8px; }
  .wheel { width:180px; height:180px; position:relative; margin:0 auto; }
  .wheel svg { width:100%; height:100%; transition:transform 2.2s cubic-bezier(.15,.8,.2,1); }
  .wheel .ptr { position:absolute; left:50%; top:-14px; margin-left:-14px; font-size:30px; }
  .meters { display:grid; gap:10px; margin:10px 0; }
  .mrow { display:flex; align-items:center; gap:10px; font-size:17px; }
  .mrow b { width:80px; }
  .mbarx { flex:1; height:30px; border:3px solid var(--ink); border-radius:14px; background:#fff; position:relative; overflow:hidden; }
  .mbarx i { position:absolute; inset:0 auto 0 0; width:0; background:var(--green); transition:width 1.6s ease-out; }
  .mbarx u { position:absolute; top:-2px; bottom:-2px; left:66.7%; border-left:4px dashed var(--accent); }

  /* scale + triangle */
  .scalewrap { max-width:560px; margin:0 auto 10px; }
  .scalewrap svg { width:100%; display:block; }
  #beam, .pan { transition:transform .9s cubic-bezier(.3,1.5,.5,1); transform-box:view-box; }
  #beam { transform-origin:200px 70px; }
  .tri { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px; align-items:start; }
  .tri svg { width:100%; max-height:58vh; display:block; }
  .tri .node { cursor:pointer; }
  .tri .info { padding:14px 16px; min-height:200px; }
  .tri .info ul { margin:8px 0 0; padding-left:22px; font-size:18px; line-height:1.35; }
  .explored { font-family:var(--toon); font-size:20px; text-align:center; margin-bottom:8px; }

  /* dispatch */
  .callcard { max-width:900px; margin:0 auto 10px; padding:10px 16px; display:flex; gap:12px; align-items:center; }
  .callcard .ph { font-size:42px; animation:wiggle .5s infinite; }
  .callcard p { margin:0; font-size:clamp(18px,2.1vw,24px); line-height:1.2; }
  .scene { max-width:900px; margin:0 auto; border:3px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:4px 4px 0 var(--ink); background:#9fe3ff; }
  .scene svg { width:100%; display:block; max-height:42vh; }
  .pinring { animation:ring 1.2s infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes ring { from { transform:scale(.6); opacity:1; } to { transform:scale(1.8); opacity:0; } }
  .forces { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; max-width:1000px; margin:12px auto 0; }
  .force { min-height:84px; border:3px solid var(--ink); border-radius:16px; background:var(--c); box-shadow:0 5px 0 var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:4px; touch-action:none; line-height:1.05; }
  .force .fi { font-size:30px; } .force b { font-size:14px; }
  .force:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }

  /* modal */
  .overlay { position:fixed; inset:0; z-index:120; display:grid; place-items:center; background:rgba(30,20,60,.5); padding:14px; }

function runPhase(p) {

function phaseDone(p, res, body) {

  save.stars[mi] = Math.max(save.stars[mi] || 0, stars); persist();

    h('p', null, `You got ${res.right} of ${res.total} right on the quick check.`),
    h('div', { class: 'badgebig' }, h('i', null, cur.m.badge.i), 'Badge: ' + cur.m.badge.n),
    last ? h('p', null, 'You toured all of Capitol City and learned how the whole government works together. Great reporting, Captain Pup!') : null,
    h('div', { class: 'tbtns' },

// Checks triangle explorer (Mission 5 experiment)
function checksTriangle(el, api) {
  const N = { L: { x: 200, y: 62, e: '🏛️', n: 'Legislative', c: '#4cc9f0' }, E: { x: 70, y: 250, e: '🖊️', n: 'Executive', c: '#ff9f1c' }, J: { x: 330, y: 250, e: '⚖️', n: 'Judicial', c: '#c39bff' } };
  const CH = {
    'L>E': ['Override a veto with a two-thirds vote', 'Impeach and remove the President', 'Senate approves treaties and confirms appointments', 'Decides how much money agencies get'],
    'E>L': ['Veto bills', 'Call Congress into a special session'],
    'E>J': ['Appoint federal judges (Senate confirms)', 'Grant pardons'],
    'J>E': ['Rule that actions of the President or agencies are unconstitutional'],
    'J>L': ['Rule that laws are unconstitutional (judicial review)'],
    'L>J': ['Senate confirms or rejects judges', 'Impeach and remove judges', 'Create lower federal courts', 'Propose amendments to the Constitution'],
  };
  const seen = new Set(); let from = null;
  const wrap = h('div', { class: 'tri' }); const svgBox = h('div', { class: 'panel', style: 'padding:6px;background:#fff' });
  const info = h('div', { class: 'panel info' }, h('div', { class: 'explored' }, 'Explored: 0 / 6'), h('p', null, 'Tap a branch to start. 👆'));
  wrap.append(svgBox, info); el.append(wrap);
  const line = (a, b, key) => {
    const A = N[a], B = N[b], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d, nx = -uy * 9, ny = ux * 9;
    const st = seen.has(key) ? '#06d6a0' : '#b9ad8f';
    return `<line x1="${A.x + ux * 52 + nx}" y1="${A.y + uy * 52 + ny}" x2="${B.x - ux * 60 + nx}" y2="${B.y - uy * 60 + ny}" stroke="${st}" stroke-width="7" stroke-linecap="round" marker-end="url(#ah${seen.has(key) ? 'g' : ''})"/>`;
  };
  const draw = () => {
    let s = `<svg viewBox="0 -22 400 352"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b9ad8f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#06d6a0"/></marker></defs>`;
    for (const k of Object.keys(CH)) { const [a, b] = k.split('>'); s += line(a, b, k); }
    for (const [k, n] of Object.entries(N)) s += `<g class="node" data-n="${k}"><circle cx="${n.x}" cy="${n.y}" r="${from === k ? 50 : 44}" fill="${n.c}" stroke="${INK}" stroke-width="${from === k ? 6 : 4}"/><text x="${n.x}" y="${n.y + 6}" text-anchor="middle" font-size="34">${n.e}</text><text x="${n.x}" y="${n.y + (k === 'L' ? -54 : 64)}" text-anchor="middle" font-size="17" font-family="Luckiest Guy,Comic Sans MS,sans-serif" fill="${INK}">${n.n}</text></g>`;
    svgBox.innerHTML = s + '</svg>';
    svgBox.querySelectorAll('.node').forEach(g => g.addEventListener('click', () => tapNode(g.dataset.n)));
  };
  const tapNode = k => {
    if (!from || from === k) { from = from === k ? null : k; sfx.tap(); draw(); if (from) { api.say(`Now tap the branch that ${N[from].n} checks.`); info.querySelector('p') && (info.lastChild.textContent = `${N[from].e} ${N[from].n} selected. Now tap another branch!`); } return; }
    const key = from + '>' + k, A = N[from], B = N[k]; seen.add(key); from = null; sfx.good(); draw();
    info.innerHTML = ''; info.append(h('div', { class: 'explored' }, `Explored: ${seen.size} / 6`), h('b', { class: 'toon', style: 'font-size:21px' }, `${A.e} ${A.n} can check ${B.e} ${B.n}:`), h('ul', null, CH[key].map(t => h('li', null, t))));
    api.say(`${A.n} → ${B.n}: ${CH[key][0]}!`, 'good');
    if (seen.size >= 4 && !cur.ready) { api.done(); setTimeout(() => api.say('Nice exploring! Find all 6, or tap Next ▶.', 'good'), 1600); }
    if (seen.size === 6) burst('ALL 6!', null, null, '#06d6a0');
  };
  draw();
}

// Bill board game (Mission 2 boss)
function billGame(el, api) {
  api.say('BOSS: Roll the die 🎲 to move the bill! Answer at each yellow checkpoint.');
  const SQ = [
    { i: '💡', t: 'Idea' }, { i: '✉️', t: 'Letter', f: 'A kid writes to their representative: “Every park should have a water fountain!”' },
    { i: '📄', t: 'Introduced', g: 1 }, { i: '🔢', t: 'Gets a number', f: 'Bills get numbers. Bills from the House start with “H.R.”' },
    { i: '🧐', t: 'Committee', g: 1 }, { i: '🎤', t: 'Hearing', f: 'Committees can hold hearings where experts share facts.' },
    { i: '✏️', t: 'Changes', f: 'Committees can change a bill\'s words before the big vote.' },
    { i: '🏠', t: 'House vote', g: 1 }, { i: '🚶', t: 'To the Senate', f: 'Now the other chamber gets its turn!' },
    { i: '🏛️', t: 'Senate vote', g: 1 }, { i: '🤝', t: 'Same words', f: 'Both chambers must pass the exact same bill.' },
    { i: '🖊️', t: 'President', g: 2 }, { i: '🎉', t: 'LAW!', end: 1 },
  ];
  const Q = {
    2: { q: 'Who can introduce a bill in Congress?', o: ['A member of Congress', 'Any kid at school', 'A Supreme Court justice'], a: 'A member of Congress', why: 'Anyone can suggest an idea, but only a member of Congress can introduce a bill.' },
    4: { q: 'What does a committee do with a bill?', o: ['Studies it and decides whether to send it on', 'Signs it into law', 'Decides if it breaks the Constitution'], a: 'Studies it and decides whether to send it on', why: 'Committees are small groups of members who study bills closely and can change them.' },
    7: { q: 'To pass the House, a bill needs…', o: ['More than half of the members voting', 'Every single member to agree', 'Just one vote'], a: 'More than half of the members voting', why: 'A majority — more than half of those voting — passes a bill.' },
    9: { q: 'The House and Senate passed the same bill. Where does it go next?', o: ['To the President', 'To the Supreme Court', 'Back to the idea box'], a: 'To the President', why: 'Bills can start in either chamber. Once both pass it, it goes to the President.' },
  };
  const cols = ($('#stage').clientWidth || innerWidth) > 760 ? 7 : 4;
  let pos = 0, busy = false, miss = 0; const cleared = new Set();
  const board = h('div', { class: 'board', style: `--cols:${cols}` });
  const sqEls = SQ.map((s, i) => {
    const row = Math.floor(i / cols), c = row % 2 ? cols - 1 - (i % cols) : i % cols;
    return h('div', { class: 'sq' + (s.g ? ' gate' : '') + (s.end ? ' end' : ''), style: `grid-row:${row + 1};grid-column:${c + 1}` }, h('span', { class: 'si' }, s.i), h('span', null, s.t));
  });
  board.append(...sqEls);
  const tok = h('div', { class: 'tok', html: pupSVG() });
  const die = h('div', { class: 'die' }, Array.from({ length: 9 }, () => h('i')));
  const rollBtn = h('button', { class: 'btn yel' }, '🎲 Roll');
  const evt = h('div', { class: 'panel evt' }, 'Roll the die to start the bill\'s journey!');
  el.append(board, h('div', { class: 'bgctl' }, h('div', { style: 'display:flex;flex-direction:column;align-items:center;gap:12px' }, die, rollBtn), evt));
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const face = n => [...die.children].forEach((p, k) => p.classList.toggle('on', PIPS[n].includes(k)));
  face(1);
  const place = () => { sqEls.forEach(s => s.classList.remove('here')); sqEls[pos].append(tok); sqEls[pos].classList.add('here'); };
  place();
  rollBtn.onclick = async () => {
    if (busy) return; busy = true; rollBtn.disabled = true; sfx.dice(); die.classList.add('roll');
    let n = 1; for (let k = 0; k < 8; k++) { n = 1 + (Math.random() * 6 | 0); face(n); await wait(70); }
    die.classList.remove('roll');
    for (let s = 0; s < n; s++) {
      if (SQ[pos].g && !cleared.has(pos)) break;
      if (pos >= SQ.length - 1) break;
      pos++; place(); sfx.pop(); await wait(260);
      if (SQ[pos].g) break;
    }
    land();
  };
  const land = () => {
    const s = SQ[pos];
    if (s.g === 1 && !cleared.has(pos)) return ask(pos);
    if (s.g === 2) return president();
    evt.innerHTML = ''; evt.append(h('b', null, `${s.i} ${s.t}: `), s.f || 'Keep rolling!');
    api.say(s.f || 'Keep rolling!'); busy = false; rollBtn.disabled = false;
  };
  const ask = p => {
    const q = Q[p]; evt.innerHTML = '';
    evt.append(h('div', { class: 'qhead' }, `🚧 Checkpoint: ${SQ[p].t}`), h('p', { class: 'q' }, q.q));
    const opts = h('div', { class: 'opts' });
    for (const o of shuffle(q.o)) {
      const b = h('button', { class: 'opt' }, o); b._ok = o === q.a;
      b.onclick = () => {
        if (b.disabled) return;
        if (o === q.a) {
          cleared.add(p); sqEls[p].classList.add('cleared'); b.classList.add('right'); opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
          burstAt(b, 'PASSED!', '#06d6a0'); sfx.good(); api.say('✅ ' + q.why + ' Roll again!', 'good');
          evt.append(h('div', { class: 'explain good' }, q.why));
          busy = false; rollBtn.disabled = false;
        } else { miss++; b.classList.add('wrong'); b.disabled = true; burstAt(b, 'OOPS!', '#ff8fa3'); sfx.bad(); api.say('💡 The bill is stuck! Try another answer.', 'bad'); }
      };
      opts.append(b);
    }
    evt.append(opts); api.say('Checkpoint! Answer to move the bill forward.'); evt.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  const president = () => {
    evt.innerHTML = '';
    const wheel = h('div', { class: 'wheel', html: `<span class="ptr">🔻</span><svg viewBox="-100 -100 200 200"><g stroke="${INK}" stroke-width="5"><path d="M0 -94 A94 94 0 0 1 0 94 Z" fill="#06d6a0"/><path d="M0 94 A94 94 0 0 1 0 -94 Z" fill="#ff8fa3"/><circle r="14" fill="#fff"/></g><text x="46" y="10" font-size="26" text-anchor="middle" font-family="Luckiest Guy,Comic Sans MS,sans-serif">SIGN</text><text x="-46" y="10" font-size="26" text-anchor="middle" font-family="Luckiest Guy,Comic Sans MS,sans-serif">VETO</text></svg>` });
    const spin = h('button', { class: 'btn yel' }, '🖊️ Spin the pen!');
    evt.append(h('div', { class: 'qhead' }, '🖊️ The President\'s Desk'), h('p', null, 'The President can SIGN the bill or VETO (reject) it. Spin to see what happens!'), wheel, h('div', { style: 'text-align:center;margin-top:12px' }, spin));
    api.say('The bill reached the President! Spin the pen.'); evt.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    spin.onclick = async () => {
      spin.disabled = true; sfx.dice();
      const veto = Math.random() < .5;
      const R = 1440 + (veto ? 20 + Math.random() * 140 : 200 + Math.random() * 140);
      wheel.querySelector('svg').style.transform = `rotate(${R}deg)`;
      await wait(2300);
      if (!veto) { burst('SIGNED!', null, null, '#06d6a0'); sfx.good(); evt.append(h('div', { class: 'explain good' }, 'The President signed it! (If it had been vetoed, Congress could still override with a two-thirds vote in both chambers.)')); await wait(1200); return win(); }
      burst('VETO!', null, null, '#ff8fa3'); sfx.bad();
      evt.innerHTML = ''; evt.append(h('div', { class: 'qhead' }, '✋ Vetoed!'));
      api.say('Vetoed! But Congress has a way to fight back…');
      matchup(evt, { say: api.say, auto: 900, cards: [{ q: 'How can Congress still make the bill a law?', o: ['Override: a two-thirds vote in BOTH the House and Senate', 'Ask the Supreme Court to sign it', 'A majority vote in the House only'], a: 'Override: a two-thirds vote in BOTH the House and Senate', why: 'That\'s a veto override — a check on the President!' }],
        onDone: async res => {
          if (!res.right) miss++;
          evt.innerHTML = ''; const mh = h('i'), ms = h('i');
          evt.append(h('div', { class: 'qhead' }, '🗳️ Override vote!'), h('div', { class: 'meters' },
            h('div', { class: 'mrow' }, h('b', null, 'House'), h('div', { class: 'mbarx' }, mh, h('u'))), h('div', { class: 'mrow' }, h('b', null, 'Senate'), h('div', { class: 'mbarx' }, ms, h('u')))),
            h('small', null, 'The dashed line is two-thirds. Both bars must pass it!'));
          await wait(80); mh.style.width = '74%'; ms.style.width = '71%'; sfx.whoosh(); await wait(1800);
          burst('OVERRIDE!', null, null, '#06d6a0'); await wait(700); win();
        } });
    };
  };
  const win = () => {
    pos = SQ.length - 1; place(); sfx.win(); burst('LAW!', null, null, '#ffd23f');
    evt.innerHTML = ''; evt.append(h('b', { class: 'toon', style: 'font-size:28px' }, '🎉 It\'s a law!'), h('p', null, `Every park gets a water fountain! You guided the bill all the way${miss ? ` (with ${miss} oops${miss > 1 ? 'es' : ''})` : ' with no mistakes'}.`));
    api.done({ pass: true });
  };
}

// test hook
window.__game = {
  get save() { return save; }, get cur() { return cur; }, startMission, runPhase, renderMap, renderTitle,
  unlockAll() { save.done = [0, 1, 2, 3, 4, 5]; persist(); renderMap(); },
};
renderTitle();
