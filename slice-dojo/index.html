<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style><script id="nozoom-js">/* Block browser page zoom (iOS ignores user-scalable=no); in-game zoom uses pointer events and still works. */(function(){var p=function(e){e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,p,{passive:false})});})();</script>
<title>Slice Dojo: Measure Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#5a2e1c; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; cursor:pointer; color:inherit; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  [hidden] { display:none !important; }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #topbar { display:flex; align-items:center; gap:8px; padding:8px 10px 6px; flex-wrap:wrap; }
  #tracker { display:flex; gap:6px; flex:1 1 auto; flex-wrap:wrap; align-items:center; }
  .stp { font-family:var(--toon); font-size:18px; padding:7px 12px 3px; border-radius:999px; background:var(--paper);
    border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); white-space:nowrap; opacity:.75; line-height:1.2; }
  .stp.on { background:var(--yellow); opacity:1; transform:rotate(-2deg) scale(1.06); }
  .stp.done { background:var(--green); opacity:1; }
  .chip2, #timerChip { font-family:var(--toon); font-size:20px; padding:7px 14px 3px; border-radius:999px; background:var(--paper);
    border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); white-space:nowrap; line-height:1.2; }
  #lives { color:var(--accent); letter-spacing:2px; }
  #timerChip { background:var(--blue); }
  #timerChip.relax { background:#ffe8a3; }
  .round { width:60px; height:60px; border-radius:50%; border:3px solid var(--ink); background:var(--paper);
    box-shadow:0 4px 0 var(--ink); font-size:24px; display:grid; place-items:center; padding:0; flex:none; }
  .round:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #stage { position:relative; flex:1 1 auto; min-height:0; margin:0 8px 8px; border:3px solid var(--ink); border-radius:18px;
    overflow:hidden; box-shadow:4px 4px 0 var(--ink); background:#ffe2b5; }
  body.full #stage { margin:0; border:0; border-radius:0; box-shadow:none; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:absolute; pointer-events:none; opacity:.95; }
  #orderCard { left:10px; top:10px; max-width:min(520px,48%); padding:8px 14px 10px; }
  #orderCard.pop { animation:pop .45s ease-out; }
  #orderCard.qmode { left:50%; transform:translateX(-50%); width:max-content; max-width:min(560px,calc(100% - 20px)); animation:none; }
  @media (max-width:760px) { #orderCard.qmode { width:calc(100% - 20px); } }
  @keyframes pop { 0% { transform:scale(.6) rotate(-4deg); } 60% { transform:scale(1.08) rotate(1deg); } 100% { transform:none; } }
  #orderText { font-family:var(--toon); font-size:28px; line-height:1.05; letter-spacing:.5px; }
  #orderSub { font-size:15px; line-height:1.25; margin-top:3px; color:#4a4458; }
  #meter { right:10px; top:10px; width:min(380px,44%); padding:8px 12px 10px; font-size:15px; }
  #meter .mt { font-family:var(--toon); font-size:19px; letter-spacing:.5px; display:flex; justify-content:space-between; gap:8px; }
  #meter .row { margin:4px 0 2px; }
  #meter .rl { display:flex; justify-content:space-between; gap:6px; font-size:14px; }
  #meter .rl b { font-family:var(--toon); font-weight:400; font-size:16px; letter-spacing:.3px; }
  .bar { position:relative; height:20px; border:3px solid var(--ink); border-radius:10px; background:#eee6d3; overflow:hidden; margin-top:3px; }
  .bar .zone { position:absolute; top:0; bottom:0; background:rgba(6,214,160,.35); }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; background:var(--blue); transition:width .25s; }
  .bar .fill.ok { background:var(--green); } .bar .fill.over { background:var(--orange); }
  .bar .line { position:absolute; top:-2px; bottom:-2px; width:3px; background:var(--ink); }
  .tag { display:inline-block; background:var(--yellow); border:2px solid var(--ink); border-radius:999px; font-size:13px; padding:3px 12px 1px; letter-spacing:1.5px; font-family:var(--toon); }
  .tag.boss { background:var(--accent); color:#fff; }
  #cheatBtn { position:absolute; right:10px; bottom:10px; z-index:2; }
  #cheat { position:absolute; left:10px; top:130px; width:min(300px,70%); padding:8px 12px 10px; z-index:2; background:#fff3cf;
    pointer-events:none; transform:rotate(-1deg); }
  #cheat h4 { margin:0 0 4px; font-family:var(--toon); font-weight:400; font-size:20px; color:var(--accent); letter-spacing:1px; }
  #cheat div { font-size:15px; line-height:1.35; }
  /* Captain Pup speech bubble (in-game tips) */
  #toast { position:absolute; left:max(70px,9%); bottom:max(120px,17%); transform:translateY(10px) scale(.9); transform-origin:0 100%; padding:8px 16px 6px;
    font-family:var(--toon); font-size:21px; letter-spacing:.5px; background:#fff; opacity:0; transition:.22s; pointer-events:none; text-align:left;
    max-width:min(520px,70%); z-index:3; line-height:1.2; border-radius:22px; }
  #toast::after { content:""; position:absolute; left:18px; bottom:-17px; width:22px; height:18px; background:#fff; border:3px solid var(--ink); border-top:0; border-right:0;
    transform:skewX(-30deg); border-bottom-left-radius:6px; }
  #toast.show { opacity:1; transform:none; }
  #mapHud { position:absolute; left:8px; right:8px; top:8px; display:flex; gap:8px; align-items:center; z-index:2; }
  #mapHud .btn { font-size:20px; min-height:54px; padding:8px 16px 3px; }
  .mapTitle { flex:1; text-align:center; font-size:clamp(28px,4.4vw,54px); color:var(--yellow); -webkit-text-stroke:2.5px var(--ink); paint-order:stroke;
    text-shadow:3px 3px 0 var(--ink); transform:rotate(-2deg); line-height:1; white-space:nowrap; }
  .mapTitle span { color:var(--accent); }
  @media (max-width:500px) { #mapHud .btn { font-size:16px; padding:6px 10px 2px; min-height:50px; } .mapTitle { font-size:26px; } #mapSay { display:none; } }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20; }
  .say { width:48px; height:48px; border-radius:50%; border:3px solid var(--ink); background:var(--blue); box-shadow:0 3px 0 var(--ink); font-size:22px;
    display:inline-grid; place-items:center; padding:0; flex:none; vertical-align:middle; }
  .say:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .say.talking { animation:pulse .6s infinite; background:var(--yellow); }
  .more { background:none; border:0; font-size:15px; text-decoration:underline; padding:6px 4px; min-height:40px; color:#4a4458; }
  .moreTxt { font-size:15px; line-height:1.3; color:#4a4458; }
  .bubbleTalk { position:relative; background:#fff; border:3px solid var(--ink); border-radius:22px; padding:10px 16px 8px; font-size:19px; line-height:1.25;
    box-shadow:3px 3px 0 var(--ink); text-align:left; }
  .bubbleTalk::before { content:""; position:absolute; left:-16px; top:50%; width:18px; height:20px; background:#fff; border:3px solid var(--ink); border-right:0; border-top:0;
    transform:translateY(-50%) skewY(-30deg); border-bottom-left-radius:6px; }
  @keyframes wiggle { 0%,100% { transform:rotate(0); } 20% { transform:rotate(-5deg); } 40% { transform:rotate(5deg); } 60% { transform:rotate(-4deg); } 80% { transform:rotate(3deg); } }
  .wiggle { animation:wiggle .45s; }
  #midPanel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 18px 16px; text-align:center; width:min(560px,92%); z-index:4; max-height:92%; overflow:auto; }
  #midPanel p { margin:6px 0 10px; font-size:18px; line-height:1.3; }
  .stars { font-size:46px; color:#f4a100; letter-spacing:6px; -webkit-text-stroke:2px var(--ink); line-height:1; margin:4px 0; }
  .off { color:#e7e0cf; }

  .btn { background:var(--accent); color:#fff; font-family:var(--toon); font-size:24px; min-height:60px; padding:10px 24px 4px; border-radius:999px;
    border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); letter-spacing:1px; line-height:1.1; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn.blu { background:var(--blue); color:var(--ink); }
  .btn.pulse { animation:pulse 1.1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  .btn small { font-family:Nunito,system-ui,sans-serif; font-size:14px; font-weight:900; }
  .titleRow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }

  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(40,18,10,.45); padding:10px; z-index:5; }
  .card { padding:18px 22px 20px; text-align:center; width:min(980px,96vw); max-height:calc(100% - 4px); overflow:auto;
    border-radius:26px; box-shadow:6px 6px 0 var(--ink); touch-action:pan-y; }
  h1 { font-family:var(--toon); font-weight:400; margin:0; font-size:clamp(48px,9vw,90px); line-height:1; color:var(--yellow); -webkit-text-stroke:3px var(--ink);
    paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1 span { color:var(--accent); }
  .subt { font-size:clamp(22px,3.4vw,32px); color:#fff; -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink);
    background:var(--purple); display:inline-block; padding:6px 18px 2px; border:3px solid var(--ink); border-radius:999px; margin:10px 0 4px; transform:rotate(1.5deg); }
  h2 { font-family:var(--toon); font-weight:400; margin:0 0 6px; font-size:clamp(28px,5vw,42px); color:var(--accent); -webkit-text-stroke:2px var(--ink);
    paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; line-height:1.05; }
  .card p { margin:8px 0; font-size:18px; line-height:1.3; }
  .hint { font-size:15px !important; opacity:.75; }
  #titleCv { width:100%; height:200px; display:block; }
  #levelGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0 6px; }
  .lvl { text-align:left; background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 12px 8px; min-height:96px;
    display:flex; gap:10px; align-items:center; }
  .lvl:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .lvl .ico { font-size:34px; flex:none; width:52px; height:52px; display:grid; place-items:center; border:3px solid var(--ink); border-radius:50%; background:var(--yellow); }
  .lvl .nm { font-family:var(--toon); font-size:19px; letter-spacing:.5px; line-height:1.1; display:block; }
  .lvl .ds { font-size:13px; line-height:1.2; display:block; color:#4a4458; margin-top:2px; }
  .lvl .st { font-size:20px; color:#f4a100; -webkit-text-stroke:1px var(--ink); letter-spacing:2px; display:block; margin-top:2px; }
  .lvl.locked { background:#ece5d3; opacity:.8; cursor:default; }
  .lvl.locked .ico { background:#cfc8b6; }
  .lvl.boss .ico { background:var(--accent); }

  #tip .card { width:min(1100px,97vw); }
  .tipHead { display:flex; gap:14px; align-items:center; justify-content:center; text-align:left; }
  .tipHead canvas { width:120px; height:130px; flex:none; }
  .dgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:10px 0 12px; }
  .dgrid.four { grid-template-columns:repeat(4,1fr); }
  .dcard { text-align:left; padding:10px 12px 12px; background:#fff; display:flex; flex-direction:column; }
  .dcard h4 { font-family:Nunito,system-ui,sans-serif; font-weight:900; font-size:20px; margin:0 0 6px; display:flex; gap:8px; align-items:center; line-height:1.1; }
  .dcard canvas { width:100%; height:150px; display:block; border:3px solid var(--ink); border-radius:12px; background:#fffdf6; }
  .dcard p { font-size:16px !important; margin:6px 0 8px !important; flex:1; }
  .dcard .btn { font-size:20px; padding:8px 18px 3px; align-self:flex-start; }
  .dcard.seen { background:#effcf6; }
  .bigfact { background:var(--yellow); border:3px solid var(--ink); border-radius:14px; padding:4px 10px 2px; display:inline-block; font-family:var(--toon); font-size:19px; letter-spacing:.5px; transform:rotate(-1deg); }

  .opts { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:14px 0; }
  .opts.n3 { grid-template-columns:repeat(3,1fr); }
  .opt { min-height:120px; background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); padding:10px 8px 8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .opt .oi { font-size:44px; line-height:1; }
  .opt .ot { font-family:var(--toon); font-size:24px; letter-spacing:.5px; line-height:1.05; }
  .opt:disabled { opacity:.55; }
  .opt.right:disabled { opacity:1; }
  .opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .opt.right { background:var(--green); } .opt.wrong { background:#ff8fa3; }
  #qExplain { text-align:left; padding:10px 14px; background:#fff7d6; border-radius:14px; border:3px dashed var(--ink); font-size:18px; line-height:1.3; }
  .burst { display:inline-block; font-family:var(--toon); font-size:32px; padding:18px 26px 10px; margin:0 0 6px;
    clip-path:polygon(50% 0,61% 22%,85% 8%,78% 33%,100% 40%,80% 56%,96% 80%,70% 74%,62% 100%,48% 80%,30% 98%,28% 74%,3% 82%,18% 58%,0 40%,22% 33%,14% 8%,38% 22%);
    background:var(--yellow); color:var(--ink); }
  .burst.bad { background:#ff8fa3; }
  .qnum { font-size:15px; opacity:.7; }

  #scroll .card { background:#fff3cf; }
  .facts { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0; text-align:left; }
  .fact { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:8px 12px; }
  .fact b { font-family:var(--toon); font-weight:400; font-size:21px; letter-spacing:.5px; display:block; color:#b02a48; }
  .fact span { font-size:15px; }
  .fact.locked { background:#ece5d3; color:#8d8577; }
  .fact.locked b { color:#8d8577; }

  @media (max-width:760px) {
    .stp { font-size:15px; padding:6px 9px 2px; }
    .stp:not(.on) .t { display:none; }
    .chip2, #timerChip { font-size:15px; padding:5px 8px 2px; }
    .round { width:50px; height:50px; font-size:20px; }
    #orderCard { right:10px; max-width:none; padding:6px 10px 8px; }
    #orderText { font-size:22px; } #orderIcon { font-size:26px !important; } #orderCard .say { width:42px; height:42px; font-size:18px; }
    #orderSub { font-size:13px; }
    #meter { left:10px; right:10px; width:auto; top:96px; padding:6px 10px 8px; }
    #topbar { gap:5px; padding:6px 6px 4px; } #tracker { flex-basis:100%; }
    #cheat { right:10px; top:200px; width:auto; left:10px; }
    #levelGrid { grid-template-columns:1fr; }
    .dgrid, .dgrid.four { grid-template-columns:1fr; }
    .facts { grid-template-columns:1fr; }
    .opts, .opts.n3 { grid-template-columns:repeat(2,1fr); }
    .opt { min-height:100px; } .opt .oi { font-size:36px; } .opt .ot { font-size:20px; }
    #toast { font-size:17px; left:60px; bottom:150px; max-width:calc(100% - 80px); }
    .card { padding:14px 12px 16px; }
    .card p { font-size:16px; }
    .btn { font-size:21px; padding:10px 18px 4px; }
    .tipHead canvas { width:80px; height:90px; }
    #titleCv { height:150px; }
  }
  @media (min-width:761px) and (max-width:1100px) { #levelGrid { grid-template-columns:repeat(2,1fr); } .dgrid.four { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div id="app">
  <header id="topbar" hidden>
    <div id="tracker">
      <span class="stp" data-p="challenge"><span class="n">1</span> <span class="t">Challenge</span></span>
      <span class="stp" data-p="discover"><span class="n">2</span> <span class="t">Discover</span></span>
      <span class="stp" data-p="experiment"><span class="n">3</span> <span class="t">Experiment</span></span>
      <span class="stp" data-p="boss"><span class="n">4</span> <span class="t">Boss</span></span>
      <span class="stp" data-p="check"><span class="n">✔</span> <span class="t">Check</span></span>
    </div>
    <span class="chip2" id="lives">❤❤❤</span>
    <span class="chip2" id="scoreChip">⭐ 0</span>
    <span id="timerChip">⏱ 0:30</span>
    <button class="round" id="homeBtn" aria-label="Menu">🏠</button>
    <button class="round" id="muteBtn" aria-label="Sound on/off">🔊</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="orderCard" class="panel hud" hidden><span class="tag" id="orderTag">ORDER 1/3</span>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px"><button class="say" id="orderSay" aria-label="Read aloud" style="pointer-events:auto">🔊</button>
      <span id="orderIcon" style="font-size:34px;line-height:1"></span><div id="orderText"></div></div><div id="orderSub"></div></div>
    <div id="meter" class="panel hud" hidden></div>
    <button class="round" id="cheatBtn" aria-label="Cheat scroll" hidden>📜</button>
    <div id="cheat" class="panel" hidden><h4>📜 Cheat Scroll</h4><div id="cheatList"></div></div>
    <div id="toast" class="panel"></div>
    <div id="mapHud" hidden><a class="btn alt" href="../">⬅ Games</a><div class="mapTitle toon">Slice <span>Dojo</span></div>
      <button class="say" id="mapSay" aria-label="Read aloud">🔊</button><button class="round" id="mapMute" aria-label="Sound on/off">🔊</button></div>
    <div id="midPanel" class="panel" hidden><h2 id="midTitle"></h2><div id="midStars" class="stars"></div><p id="midText"></p><div class="titleRow" id="midBtns"></div></div>
  </div>
</div>

<!-- ============ SENSEI TIP (Discover) ============ -->
<div class="overlay" id="tip" hidden>
  <div class="card panel">
    <div class="tipHead">
      <canvas id="tipPup"></canvas>
      <div><span class="tag" id="tipTag">SENSEI TIP</span><h2 id="tipTitle"></h2>
        <div class="bubbleTalk"><button class="say" id="tipSay" aria-label="Read aloud">🔊</button> <span id="tipIntro"></span></div></div>
    </div>
    <div class="dgrid" id="tipCards"></div>
    <div class="titleRow">
      <button class="btn yel" id="tipNext">Got it! Experiment ▶</button>
      <button class="btn alt" id="tipSkip">Skip ▶</button>
    </div>
  </div>
</div>

<!-- ============ RESULTS ============ -->
<div class="overlay" id="results" hidden>
  <div class="card panel" style="width:min(720px,96vw)">
    <h2 id="resTitle">Level Complete!</h2>
    <div class="stars" id="resStars" style="font-size:64px"></div>
    <p id="resText"></p>
    <p id="resFacts" class="hint"></p>
    <div class="titleRow">
      <button class="btn go" id="resNext">Next Level ▶</button>
      <button class="btn alt" id="resReplay">↻ Replay</button>
      <button class="btn yel" id="resMenu">🏠 Menu</button>
    </div>
  </div>
</div>

<!-- ============ ARCADE OVER ============ -->
<div class="overlay" id="arcOver" hidden>
  <div class="card panel" style="width:min(640px,96vw)">
    <h2>KA-POOF! Game Over</h2>
    <p id="arcText"></p>
    <div class="titleRow">
      <button class="btn go" id="arcAgain">↻ Play Again</button>
      <button class="btn yel" id="arcMenu">🏠 Menu</button>
    </div>
  </div>
</div>

<!-- ============ CONVERSION SCROLL ============ -->
<div class="overlay" id="scroll" hidden>
  <div class="card panel" style="width:min(860px,96vw)">
    <h2>📜 Conversion Scroll</h2>
    <p>Learn tips → fill your scroll!</p>
    <div class="facts" id="factList"></div>
    <div class="titleRow"><button class="btn yel" id="scrollClose">Close</button></div>
  </div>
</div>

<canvas id="fx"></canvas>
<script>
'use strict';
/* =====================================================================
   Slice Dojo: Measure Master — an original fruit-slicing arcade game that

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;

/* ---------------- units (exact factors; kids see rounded values) ---------------- */
const UNIT = { g: { dim: 'mass', f: 1 }, kg: { dim: 'mass', f: 1000 }, oz: { dim: 'mass', f: 28.35 }, lb: { dim: 'mass', f: 453.6 },
  mL: { dim: 'vol', f: 1 }, L: { dim: 'vol', f: 1000 }, tbsp: { dim: 'vol', f: 15 }, cup: { dim: 'vol', f: 240 }, cups: { dim: 'vol', f: 240 } };
function parseLabel(s) {
  const [v, u] = s.split(' ');
  const n = v === '½' ? 0.5 : v === '¼' ? 0.25 : parseFloat(v);
  return { n, u, txt: s, base: n * UNIT[u].f, dim: UNIT[u].dim };
}
function nf(n, d = 0) { return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('en-US', { maximumFractionDigits: d }); }
function fmtIn(base, u) {
  const v = base / UNIT[u].f;
  const d = (u === 'g' || u === 'mL') ? 0 : (v < 10 ? 1 : 0);
  return nf(v, d) + ' ' + (u === 'cup' && Math.abs(v - 1) > 0.05 ? 'cups' : u);
}
const fmtMass = g => g < 1000 ? nf(g) + ' g' : nf(g / 1000, 1) + ' kg';

/* =====================================================================
   AUDIO — tiny Web Audio synth
   ===================================================================== */
let AC = null, master = null, noiseBuf = null, muted = false;
try { muted = localStorage.getItem(SKEY + '.mute') === '1'; } catch (e) { }
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();

      draw: (c, w, h, p) => { iCup(c, w / 2, h - 10, 80, h * 0.75, 0.15 + 0.6 * p, [[0.75, '1 cup'], [0.375, '½ cup']]); if (p > 0.8) iPill(c, '240 mL', w / 2 + 95, h * 0.3, 0.75); } },
    { h: '1 liter = 1,000 mL', q: 'How many mL are in a 1-liter bottle?', big: '1 L = 1,000 mL', a: '“Milli” means one thousandth. 1 L is a bit more than 4 cups.',
      draw: (c, w, h, p) => { iBottle(c, w * 0.25, h * 0.55, 1.5); for (let i = 0; i < 4; i++) iCup(c, w * 0.48 + i * w * 0.14, h - 14, w * 0.11, h * 0.4, p > i * 0.25 ? 0.85 : 0.05, []); if (p > 0.9) iPill(c, '1,000 mL', w * 0.68, h * 0.25, 0.75); } },
    { h: 'Tablespoons', q: 'How many tablespoons fill 1 cup?', big: '16 tbsp = 1 cup', a: '1 tbsp ≈ 15 mL, and 16 × 15 = 240 mL.',
      draw: (c, w, h, p) => { iCup(c, w * 0.62, h - 10, 80, h * 0.75, 0.75 * p, [[0.75, '1 cup']]);
        c.lineWidth = 3; c.strokeStyle = INK; c.fillStyle = '#c9ccd6'; c.save(); c.translate(w * 0.25, h * 0.35); c.rotate(0.5); E(c, 0, 0, 22, 14); c.fill(); c.stroke(); c.fillRect(18, -4, 50, 8); c.strokeRect(18, -4, 50, 8); c.restore();
        iPill(c, Math.round(16 * p) + ' tbsp', w * 0.25, h * 0.75, 0.8, '#fff'); } } ],
];

/* ---------------- quiz ---------------- */
let quiz = null;
/* quiz pictures (s = solved → show the answer visually) */
const QPICS = {
  lbq: (c, w, h, p, s) => iBalance(c, Math.min(w, 420), h, s ? 0 : 0.25, (c, x, y) => iBlock(c, x, y, 44, 30, '1 lb'), (c, x, y) => { iCubes(c, x, y, s ? 16 : 4, 9, '#ffd23f', 6); iPill(c, s ? '16 oz' : '? oz', x, y - 44, 0.65); }),
  kgq: (c, w, h, p, s) => iBalance(c, Math.min(w, 420), h, s ? 0 : 0.25, (c, x, y) => iBlock(c, x, y, 46, 32, '1 kg', '#6b6488'), (c, x, y) => iPill(c, s ? '1,000 g' : '? g', x, y - 20, 0.75)),
  'apple+mango': (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; c.save(); c.translate(x - 90, h * 0.42); drawSprite(c, 'apple', 30); c.restore(); c.save(); c.translate(x + 10, h * 0.42); drawSprite(c, 'mango', 32); c.restore();
    iPill(c, '6 oz', x - 90, h * 0.86, 0.75, '#fff'); iPill(c, '10 oz', x + 10, h * 0.86, 0.75, '#fff'); inkText(c, '+', x - 40, h * 0.42, 30); inkText(c, '=', x + 62, h * 0.42, 30); iPill(c, s ? '16 oz = 1 lb' : '?', x + 130, h * 0.42, 0.8); },
  'kg-vs-lb': (c, w, h, p, s) => iBalance(c, Math.min(w, 420), h, 0.22, (c, x, y) => iBlock(c, x, y, 46, 32, '1 kg', '#6b6488'), (c, x, y) => { iBlock(c, x, y, 34, 24, '1 lb'); if (s) iPill(c, '1 kg ≈ 2.2 lb', x, y - 50, 0.6); }),
  ozq: (c, w, h, p, s) => iBalance(c, Math.min(w, 420), h, s ? 0 : 0.25, (c, x, y) => iBlock(c, x, y, 40, 28, '1 oz'), (c, x, y) => { iCubes(c, x, y, s ? 28 : 6, 6, '#ffd23f', 7); iPill(c, s ? '28 g' : '? g', x, y - 42, 0.65); }),
  banana: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; c.save(); c.translate(x - 60, h * 0.45); drawSprite(c, 'banana', 38); c.restore(); iPill(c, '4 oz', x - 60, h * 0.86, 0.8, '#fff'); inkText(c, s ? '≈ 113 g > 100 g' : '> 100 g ?', x + 80, h * 0.45, 22, s ? '#06d6a0' : '#fff'); },
  melon2: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; frPieces(c, 'melon', x, h * 0.5, 36, 2, s ? 1 : 0.3, '16 oz'); iPill(c, '2 lb', x, h * 0.92, 0.7, '#fff'); },
  melon4: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; frPieces(c, 'melon', x, h * 0.48, 32, 4, s ? 1 : 0.3, '250 g'); iPill(c, '1 kg', x, h * 0.93, 0.7, '#fff'); },
  cuts: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; frPieces(c, 'orange', x, h * 0.5, 36, 4, 0.2, ''); c.strokeStyle = '#ff4d6d'; c.lineWidth = 5; c.setLineDash([8, 6]);
    c.beginPath(); c.moveTo(x, h * 0.05); c.lineTo(x, h * 0.95); c.stroke(); if (s) { c.beginPath(); c.moveTo(x - 75, h * 0.5); c.lineTo(x - 5, h * 0.5); c.moveTo(x + 5, h * 0.5); c.lineTo(x + 75, h * 0.5); c.stroke(); } c.setLineDash([]);
    inkText(c, s ? '1 + 2 = 3' : '🔪 ?', x + 140, h * 0.5, 24, '#ffd23f'); },
  bananas: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; const n = s ? 2 : 1; for (let i = 0; i < n; i++) { c.save(); c.translate(x - 110 + i * 70, h * 0.45); drawSprite(c, 'banana', 30); c.restore(); }
    iPill(c, '4 oz each', x - 75, h * 0.88, 0.7, '#fff'); inkText(c, s ? '= 8 oz = ½ lb' : '= ½ lb ?', x + 100, h * 0.45, 22, '#ffd23f'); },
  halflb: (c, w, h, p, s) => iBalance(c, Math.min(w, 420), h, s ? 0 : 0.25, (c, x, y) => iBlock(c, x, y, 40, 26, '½ lb'), (c, x, y) => iPill(c, s ? '≈ 227 g' : '? g', x, y - 20, 0.75)),
  dial200: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2, y = h * 0.5, r = h * 0.38; c.lineWidth = 3; c.strokeStyle = INK; c.fillStyle = '#4cc9f0'; rr(c, x - r * 1.1, y - r * 1.05, r * 2.2, r * 2.1, 16); c.fill(); c.stroke();
    c.fillStyle = '#fff'; E(c, x, y, r * 0.8, r * 0.8); c.fill(); c.stroke(); const a = -Math.PI * 0.3; c.strokeStyle = '#ff4d6d'; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * r * 0.65, y + Math.sin(a) * r * 0.65); c.stroke();
    iPill(c, '200 g', x - r * 1.8, y, 0.8, '#fff'); iPill(c, s ? '≈ 7 oz' : '? oz', x + r * 1.8, y, 0.8); },
  bottle: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; iBottle(c, x - 40, h * 0.55, 1.4); if (s) iPill(c, curOrder() && curOrder().q && curOrder().q.q.includes('mL') ? '1,000 mL' : '≈ 1 kg', x + 70, h * 0.5, 0.8); else inkText(c, '?', x + 70, h * 0.5, 40, '#ffd23f'); },
  cup: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; iCup(c, x - 30, h - 6, 74, h * 0.8, s ? 0.75 : 0.4, [[0.75, '1 cup']]); if (s) iPill(c, curOrder() && curOrder().q && curOrder().q.q.includes('Table') ? '16 tbsp' : '≈ 240 mL', x + 90, h * 0.4, 0.8); },
  watermelon: (c, w, h, p, s) => { const x = Math.min(w, 420) / 2; c.save(); c.translate(x - 40, h * 0.5); drawSprite(c, 'watermelon', 48); c.restore(); inkText(c, s ? '≈ 4–9 kg' : '?', x + 90, h * 0.5, 30, '#ffd23f'); },
};
function finishLevel() {
  const st = G.levelStats; st.quiz = quiz.right; quiz.qs = { length: quiz.total || 3 };
  const stars = st.bossDone ? 1 + (st.bossAcc >= 0.8 ? 1 : 0) + (st.quiz >= 2 ? 1 : 0) : 0;
  const i = G.lv;
  if (stars > save.stars[i]) save.stars[i] = stars;
  if (G.score > (save.best[i] || 0)) save.best[i] = G.score;
  if (st.bossDone && save.unlocked < i + 2) save.unlocked = Math.min(LEVELS.length, i + 2);
  persist();
  G.phase = 'done'; updateTracker();
  document.querySelectorAll('.stp').forEach(el => el.classList.add('done'));
  showOverlay('results'); sfx.win();
  $('resTitle').textContent = st.bossDone ? `Level ${i + 1} Complete!` : 'Almost there!';
  $('resStars').innerHTML = starsHTML(stars);
  $('resText').innerHTML = st.bossDone
    ? `👹 <b>${Math.round(st.bossAcc * 100)}%</b> · ✔ <b>${st.quiz}/${quiz.qs.length}</b> · ⭐ <b>${G.score}</b>${G.score >= save.best[i] ? ' 🏆' : ''}`
    : `✔ <b>${st.quiz}/${quiz.qs.length}</b> · Beat the 👹 Boss for your stars!`;
  if (stars) confettiBurst(stars * 50);
  const fs = FACTS.filter(f => f.lv === i).map(f => f.big).join(' · ');
  $('resFacts').textContent = '📜 ' + fs;
  const hasNext = i + 1 < LEVELS.length;
  $('resNext').hidden = !hasNext && st.bossDone;
  $('resNext').textContent = st.bossDone ? 'Next Level ▶' : '↻ Retry Boss';
}
$('resNext').onclick = () => { sfx.click(); if (G.levelStats.bossDone) { MAP.last = G.lv + 1; startLevel(G.lv + 1); } else { G.mode = 'play'; enterPhase('boss'); } };
$('resReplay').onclick = () => { sfx.click(); startLevel(G.lv); };
$('resMenu').onclick = () => { sfx.click(); MAP.last = G.lv; goTitle(); };

/* ---------------- arcade ---------------- */
function startArcade() {
  $('mapHud').hidden = true; MAP.last = 6;
  G.lv = -1; G.phase = 'arcade'; G.score = 0; showOverlay(null); updateTracker();
  startRound({ arcade: true, time: Infinity, bomb: 0.1, rotten: 0.05, interval: 1.35 });
  setTimer(Infinity);
  toast('Slice everything! Dodge 💣!', 2.5); R.demoT = 2.6;
}
function arcadeOver() {
  G.paused = true; const best = G.score > save.arcadeBest;
  if (best) { save.arcadeBest = G.score; persist(); }
  showOverlay('arcOver');
  $('arcText').innerHTML = `⭐ <b>${G.score}</b>${best ? ' 🏆 NEW BEST!' : ` · 🏆 ${save.arcadeBest}`}<br>🔪 <b>${fmtMass(R.massTotal)}</b> ≈ <b>${fmtIn(R.massTotal, 'lb')}</b> of fruit!`;
  if (best) confettiBurst(100);
}
$('arcAgain').onclick = () => { sfx.click(); startArcade(); };
$('arcMenu').onclick = () => { sfx.click(); MAP.last = 6; goTitle(); };

/* ---------------- title / level select / scroll ---------------- */
$('scrollClose').onclick = () => { sfx.click(); MAP.last = 7; goTitle(); };
function renderScroll() {
  $('factList').innerHTML = FACTS.map(f => save.facts[f.id]
    ? `<div class="fact"><b>${f.big}</b><span>${f.txt}</span></div>`
    : `<div class="fact locked"><b>???</b><span>Learn it in Level ${f.lv + 1}: ${LEVELS[f.lv].name}</span></div>`).join('');
}
$('homeBtn').onclick = () => { sfx.click(); goTitle(); };
$('muteBtn').onclick = $('mapMute').onclick = () => { initAudio(); setMute(!muted); };
setMute(muted);
/* ---------------- main loop ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - lastT) / 1000); lastT = now;
  const cpu0 = performance.now();
  try {
    if (!$('tip').hidden) { G.t += dt; drawTips(dt); }
    else update(dt);
    drawConfetti(dt);
    draw();
  } catch (e) { console.error(e); throw e; }
  G.cpuMs = G.cpuMs * 0.95 + (performance.now() - cpu0) * 0.05;
  requestAnimationFrame(frame);
}
resize(); goTitle();
requestAnimationFrame(frame);

/* ---------------- test hook ---------------- */
window.__game = {
  G, get R() { return R; }, objs, save, LEVELS, FACTS,
  startLevel, enterPhase, startArcade, goTitle,
  unlockAll() { save.unlocked = LEVELS.length; persist(); },
  MAP, fireStar, autoAim, shots, spawnBot() { spawnBot(3); }, get bot() { return R && R.bot; }, botHit,
  answer(ok) { const o = objs.find(x => x.kind === 'ans' && x.ok === ok && !x.tried && !x.dead && x.delay <= 0); if (o) doSlice(o, 0.3, null); return !!o; },
  // slice every on-screen object matching fn (through the normal slice path)
  sliceWhere(fn) { for (const o of objs.slice()) if (sliceable(o) && fn(o)) doSlice(o, Math.random() * 3, null); },
  completeOrder() { const o = curOrder(); if (o) completeOrder(1, 'TEST', ''); },
  finishRound() { while (R && R.oi < R.orders.length) completeOrder(1, 'TEST', ''); },
};
</script>
