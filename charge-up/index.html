<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Charge Up! Energy, Batteries &amp; Electric Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  body { background:#8fd9f5;
    background-image:radial-gradient(circle at 20px 20px, rgba(255,255,255,.35) 3px, transparent 4px);
    background-size:44px 44px; }
  button { font:inherit; cursor:pointer; color:inherit; }
  a { color:inherit; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .screen[hidden] { display:none; }
  .scroll { overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px;
    background:var(--accent); color:#fff; font-family:var(--toon); font-weight:400; font-size:26px; letter-spacing:1px;
    padding:10px 28px 6px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink);
    text-decoration:none; margin:6px 5px 10px; line-height:1; }
  .btn:active, .btn.down { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.blue { background:var(--blue); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn.sm { font-size:20px; min-height:60px; padding:8px 18px 4px; }
  .btn[disabled] { opacity:.45; pointer-events:none; }
  .btn svg { flex:none; }
  .tile { background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink);
    min-height:64px; padding:8px 12px; font-size:18px; display:flex; align-items:center; gap:8px; justify-content:center; line-height:1.15; }
  .tile:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .tile.on { background:var(--yellow); }
  .tile.good { background:#c7f9e5; }
  .tile.bad { background:#ffd6dc; }
  .tile.dim { opacity:.45; }
  .row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; }
  .ic { display:inline-block; vertical-align:middle; flex:none; }

  h1 { margin:0; font-family:var(--toon); font-weight:400; font-size:82px; line-height:1; color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1 span { color:var(--accent); }
  h2 { margin:0 0 6px; font-family:var(--toon); font-weight:400; font-size:40px; line-height:1.05; color:var(--accent);
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; }
  h3 { margin:4px 0; font-family:var(--toon); font-weight:400; font-size:24px; letter-spacing:1px; }

  /* title screen */
  #title .wrap { width:min(1200px,100%); margin:0 auto; padding:16px 16px 30px; }
  .tHead { display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; margin:6px 0 14px; text-align:center; }
  .tHead img { width:150px; height:150px; animation:bob 2.4s ease-in-out infinite; }
  .sub { font-family:var(--toon); font-size:26px; margin:14px 0 0; letter-spacing:1px; color:#fff;
    -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); }
  .mapPanel { padding:8px; overflow:hidden; }
  #map { display:block; width:100%; height:auto; }
  #map .stop { cursor:pointer; }
  #map .stop:active { transform:translateY(3px); }
  #map text { font-family:var(--toon); }
  .tBtns { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-top:16px; }
  .intro { text-align:center; font-size:19px; margin:10px auto 0; max-width:820px; }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(2deg); } }

  /* mission screen */
  .mbar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--paper); border-bottom:3px solid var(--ink); flex-wrap:wrap; }
  #mTitle { font-size:26px; flex:1 1 auto; min-width:150px; line-height:1.05; }
  #steps { display:flex; gap:6px; list-style:none; margin:0; padding:0; flex-wrap:wrap; }
  #steps li { border:3px solid var(--ink); border-radius:999px; padding:5px 12px 2px; font-family:var(--toon); font-size:17px; background:#fff; color:#8d8577; border-color:#bdb39f; }
  #steps li.done { background:#c7f9e5; color:var(--ink); border-color:var(--ink); }
  #steps li.now { background:var(--yellow); color:var(--ink); border-color:var(--ink); transform:rotate(-2deg) scale(1.08); }
  .chip { display:inline-flex; align-items:center; gap:6px; border:3px solid var(--ink); border-radius:999px; padding:6px 14px 3px; background:#fff; font-family:var(--toon); font-size:20px; min-width:92px; justify-content:center; }
  .chip.low { background:#ffe8a3; }
  .chip[hidden] { display:none; }
  .roundBtn { font-size:30px; color:var(--ink); width:60px; height:60px; border-radius:50%; border:3px solid var(--ink); background:#fff; box-shadow:0 5px 0 var(--ink); display:grid; place-items:center; padding:0; flex:none; }
  .roundBtn:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  #stage { flex:1; padding:14px 14px 40px; }
  .phase { width:min(1180px,100%); margin:0 auto; }
  .talk { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .talk img { width:96px; height:96px; flex:none; animation:bob 2.6s ease-in-out infinite; }
  .bubble { position:relative; padding:12px 18px; font-size:21px; line-height:1.3; flex:1; }
  .bubble::before { content:""; position:absolute; left:-15px; top:calc(50% - 10px); border:10px solid transparent; border-right:14px solid var(--ink); border-left:0; }
  .bubble b { color:#d6204a; }
  .play { margin:0 auto; }
  .nav { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .nav .next { animation:wig 1.2s ease-in-out infinite; }
  @keyframes wig { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2deg) scale(1.05); } }
  canvas.sim { display:block; margin:0 auto; width:100%; border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); background:#bde8fb; touch-action:none; }
  .note { font-size:17px; background:#fff4c2; border:3px dashed var(--ink); border-radius:16px; padding:10px 14px; margin:12px auto 0; max-width:900px; line-height:1.3; }
  .note:empty { display:none; }
  .readout { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0; }
  .readout .rd { padding:8px 14px; min-width:130px; text-align:center; }
  .rd small { display:block; font-size:14px; opacity:.7; }
  .rd b { font-family:var(--toon); font-weight:400; font-size:28px; display:block; line-height:1.1; }
  .goals { list-style:none; padding:0; margin:10px auto; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .goals li { border:3px solid var(--ink); border-radius:12px; padding:6px 12px; background:#fff; font-size:16px; }
  .goals li.ok { background:#c7f9e5; }
  .goals li.ok::before { content:"\2714  "; color:#078a63; }
  .lbl { font-size:15px; opacity:.75; margin:8px 0 4px; text-align:center; }
  input[type=range] { width:min(520px,90%); height:44px; accent-color:var(--accent); }
  .shake { animation:shake .4s; }
  @keyframes shake { 20% { transform:translateX(-8px); } 40% { transform:translateX(8px); } 60% { transform:translateX(-5px); } 80% { transform:translateX(5px); } }
  .pop { animation:popin .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes popin { from { transform:scale(.6); opacity:0; } }

  /* discover cards */
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .dcard { padding:12px 14px 14px; cursor:pointer; text-align:center; min-height:250px; display:flex; flex-direction:column; align-items:center; transition:transform .15s; }
  .dcard:active { transform:scale(.98); }
  .dcard .art { min-height:84px; display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; }
  .dcard .q { font-size:19px; margin:6px 0; }
  .dcard .a { font-size:17px; line-height:1.3; margin:6px 0 0; text-align:left; display:none; }
  .dcard .tap { margin-top:auto; font-family:var(--toon); font-size:18px; color:#fff; background:var(--blue); border:3px solid var(--ink); border-radius:999px; padding:6px 16px 2px; }
  .dcard.open { background:#fff; }
  .dcard.open .a { display:block; animation:popin .3s; }
  .dcard.open .tap { display:none; }
  .arrow { font-family:var(--toon); font-size:26px; color:var(--ink); }

  /* chain builder */
  .chain { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; }
  .slot { width:132px; min-height:118px; border:3px dashed var(--ink); border-radius:16px; background:rgba(255,255,255,.6);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; font-size:15px; text-align:center; cursor:pointer; line-height:1.1; }
  .slot.full { border-style:solid; background:#fff; box-shadow:0 4px 0 var(--ink); }
  .slot.good { background:#c7f9e5; }
  .slot.bad { background:#ffd6dc; }
  .slot.fixed { background:var(--yellow); border-style:solid; cursor:default; }
  .link { font-size:13px; max-width:92px; text-align:center; line-height:1.1; display:flex; flex-direction:column; align-items:center; }
  .link b { font-family:var(--toon); font-weight:400; font-size:28px; line-height:1; }
  .pool { margin-top:14px; }
  .pool .tile { min-width:120px; flex-direction:column; gap:2px; font-size:15px; }
  .pool .tile.used { visibility:hidden; }

  /* quiz */
  #qWrap { max-width:820px; margin:0 auto; text-align:center; }
  .qTopic { display:inline-block; background:var(--blue); border:3px solid var(--ink); border-radius:999px; padding:4px 14px 0;
    font-family:var(--toon); font-size:18px; letter-spacing:1px; color:#fff; -webkit-text-stroke:1px var(--ink); paint-order:stroke; }
  .qText { font-size:26px; margin:14px 0; line-height:1.25; }
  .qAns { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .qAns button { background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); font-size:20px; padding:12px 10px; min-height:70px; }
  .qAns button:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .qAns button.right { background:#c7f9e5; }
  .qAns button.wrong { background:#ffd6dc; }
  .qWhy { font-size:19px; line-height:1.3; margin:14px auto 0; max-width:720px; }

  /* overlays */
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(30,20,60,.5); z-index:20; padding:12px; }
  .overlay[hidden] { display:none; }
  .card { padding:20px 26px 22px; text-align:center; max-width:min(860px,96vw); max-height:94vh; overflow:auto; border-radius:26px; box-shadow:6px 6px 0 var(--ink); }
  .card p { font-size:19px; margin:8px 0; }
  .stars { font-size:60px; color:#f4a100; letter-spacing:6px; line-height:1; -webkit-text-stroke:2px var(--ink); }
  .stars .off { color:#e7e0cf; }
  .badges { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:12px 0; }
  .badge { display:flex; flex-direction:column; align-items:center; font-size:16px; }
  .badge.locked { opacity:.45; filter:grayscale(1); }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:25; padding:12px 16px; text-align:center; font-size:19px; }
  #toast[hidden] { display:none; }

  /* comic bursts */
  #bursts { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; }
  .burst { position:absolute; width:250px; height:170px; margin:-85px 0 0 -125px; display:grid; place-items:center; animation:burst 1s ease-out forwards; }
  .burst svg { position:absolute; inset:0; }
  .burst span { position:relative; font-family:var(--toon); font-size:40px; color:#fff; -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); transform:rotate(-6deg); white-space:nowrap; }
  @keyframes burst { 0% { transform:scale(.2) rotate(-15deg); opacity:0; } 18% { transform:scale(1.15) rotate(3deg); opacity:1; } 30% { transform:scale(1); } 80% { opacity:1; } 100% { transform:scale(1.05) translateY(-30px); opacity:0; } }

  /* sims shared */
  .ctrls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; margin-top:12px; }
  .seg { display:inline-flex; border:3px solid var(--ink); border-radius:999px; overflow:hidden; box-shadow:0 4px 0 var(--ink); background:#fff; }
  .seg button { border:0; background:#fff; min-height:56px; padding:6px 16px; font-size:17px; border-right:3px solid var(--ink); }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--yellow); }
  .bigpedal { min-width:160px; min-height:90px; font-size:30px; touch-action:none; }
  .meter { height:22px; border:3px solid var(--ink); border-radius:12px; background:#e9e2cf; overflow:hidden; position:relative; }
  .meter i { position:absolute; left:0; top:0; bottom:0; background:var(--green); }
  .tf { min-width:170px; font-size:28px; }

  @media (max-width:760px) {
    h1 { font-size:56px; } .sub { font-size:20px; }
    .tHead img { width:110px; height:110px; }
    .qAns { grid-template-columns:1fr; } .qText { font-size:21px; }
    .bubble { font-size:18px; padding:10px 12px; } .talk img { width:70px; height:70px; }
    .mbar { gap:6px; padding:6px 8px; }
    #toMap { order:1; font-size:18px; padding:6px 12px 2px; }
    #mTitle { order:2; font-size:17px; flex:1 1 0; min-width:0; }
    #clock { order:3; min-width:0; font-size:17px; padding:4px 8px 1px; }
    .mbar .muteBtn { order:4; width:52px; height:52px; }
    #steps { order:5; width:100%; justify-content:center; flex-wrap:nowrap; }
    #steps li { font-size:14px; padding:4px 9px 1px; }
    #steps li span { display:none; } #steps li.now span { display:inline; }
    #stage { padding:10px 10px 40px; }
    .btn { font-size:22px; padding:10px 20px 6px; }
    .slot { width:104px; min-height:100px; font-size:13px; }
    .badges { grid-template-columns:repeat(2,1fr); }
    .cards { grid-template-columns:1fr; } .dcard { min-height:0; }
    .card { padding:16px 14px; }
  }
  /* ---- kid-friendly layer ---- */
  .bubble { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:24px; }
  .bubble .say { flex:1 1 220px; }
  .say b { color:#d6204a; }
  .readBtn { flex:none; width:60px; height:60px; border-radius:50%; border:3px solid var(--ink); background:var(--yellow); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; padding:0; }
  .readBtn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .readBtn.talking { animation:wig .3s 2; }
  .moreBtn { flex:none; display:inline-flex; align-items:center; gap:4px; min-height:48px; border:3px solid var(--ink); border-radius:999px; background:#fff; padding:4px 14px; font-size:16px; box-shadow:0 3px 0 var(--ink); }
  .moreBtn.on { background:#c7f9e5; }
  .moreTxt { flex:1 1 100%; font-size:17px; line-height:1.35; background:#fff; border:3px dashed var(--ink); border-radius:14px; padding:8px 12px; text-align:left; animation:popin .25s; }
  .dcard .q { font-size:26px; color:var(--accent); -webkit-text-stroke:1px var(--ink); paint-order:stroke; }
  .dcard .a { font-size:20px; text-align:center; }
  .dcard .a .say { margin-bottom:8px; }
  .dcard .a .readBtn, .dcard .a .moreBtn { display:inline-grid; vertical-align:middle; margin:0 4px; }
  .dcard .a .moreBtn { display:inline-flex; }
  .dcard .art { min-height:110px; }
  .dcard .tap { display:inline-flex; align-items:center; gap:6px; font-size:22px; padding:6px 18px 2px; animation:wig 1.4s infinite; }
  .qHead { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
  .qHead .qText { margin:10px 0; }
  .qArt { flex:none; }
  .qAns.pics { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .qAns.pics button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:130px; font-size:19px; line-height:1.15; }
  .qWhy { font-size:21px; }
  .qWhy .say { display:inline; }
  .qWhy .readBtn, .qWhy .moreBtn { display:inline-grid; vertical-align:middle; margin:6px 4px 0; }
  .qWhy .moreBtn { display:inline-flex; }
  .qTopic { font-size:24px; letter-spacing:4px; color:var(--yellow); }
  .hand { position:fixed; width:64px; height:64px; margin:-6px 0 0 -18px; z-index:31; pointer-events:none; animation:handTap 1.1s ease-in-out infinite; filter:drop-shadow(3px 3px 0 rgba(29,27,38,.35)); }
  .hand .ripple { position:absolute; left:4px; top:-2px; width:28px; height:28px; border:4px solid var(--accent); border-radius:50%; animation:ripple 1.1s ease-out infinite; }
  @keyframes handTap { 0%,100% { transform:translate(14px,22px); } 45% { transform:translate(0,0) scale(.92); } 60% { transform:translate(0,0) scale(.92); } }
  @keyframes ripple { 0%,40% { transform:scale(.2); opacity:0; } 50% { opacity:1; } 100% { transform:scale(1.8); opacity:0; } }
  .conf { position:absolute; width:12px; height:16px; border:2px solid var(--ink); border-radius:3px; animation:conf 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
  @keyframes conf { from { transform:translate(0,0) rotate(0); opacity:1; } to { transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0; } }
  .flow { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px; }
  .fnode { display:flex; flex-direction:column; align-items:center; font-size:13px; animation:bob 2.4s ease-in-out infinite; }
  .fnode:nth-child(4n+3) { animation-delay:-.6s; }
  .pipe { position:relative; width:30px; height:10px; border-radius:6px; background:#3c3a55; border:2px solid var(--ink); overflow:hidden; }
  .pipe i { position:absolute; top:0; width:8px; height:6px; border-radius:50%; background:var(--yellow); box-shadow:0 0 6px 2px #ffe066; animation:spark 1.2s linear infinite; }
  .pipe i:nth-child(2) { animation-delay:-.4s; } .pipe i:nth-child(3) { animation-delay:-.8s; }
  @keyframes spark { from { left:-8px; } to { left:30px; } }
  .minibars { display:flex; flex-direction:column; gap:6px; width:100%; max-width:260px; }
  .mb { display:grid; grid-template-columns:36px 1fr 52px; align-items:center; gap:6px; font-size:15px; }
  .mb .meter { height:20px; }
  .mb .meter i { animation:grow 1.4s ease-out; }
  @keyframes grow { from { width:0; } }
  .bigTiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .bigTiles .tile { flex-direction:column; min-height:120px; font-size:18px; }
  .legBox { display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin:6px 0 10px; }
  .badgeWin { animation:spinIn .9s cubic-bezier(.3,1.5,.5,1); }
  @keyframes spinIn { from { transform:scale(.2) rotate(-200deg); } }
  .say small { font-size:.8em; opacity:.8; }
  .tile.wrongWig { animation:shake .4s; background:#ffe8a3; }
  @media (max-width:760px) {
    .bubble { font-size:19px; } .readBtn { width:52px; height:52px; }
    .qAns.pics { grid-template-columns:1fr 1fr; } .qAns.pics button { min-height:116px; font-size:16px; }
    .dcard .q { font-size:22px; } .dcard .a { font-size:18px; }
  }
</style>
</head>
<body>
<section id="title" class="screen scroll">
  <div class="wrap">
    <header class="tHead">
      <img id="tPup" alt="Captain Pup">
      <div><h1>Charge <span>Up!</span></h1><p class="sub">Energy, Batteries &amp; Electric Cars</p></div>
    </header>
    <div class="panel mapPanel"><svg id="map" role="img" aria-label="Road trip map"></svg></div>
    <p class="intro panel" style="padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap" id="introP"><span>Road trip with <b>Captain Pup</b>! Tap a stop &#10140; win <b>Battery Badges</b>!</span></p>
    <div class="tBtns">
      <a class="btn alt" href="../" id="gamesLink">&#11013; Games</a>
      <button class="btn yel" id="badgesBtn"></button>

/* ================= basics ================= */

  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
document.addEventListener('pointerdown', initAudio);
document.addEventListener('keydown', initAudio);
function tone(f, dur, type = 'square', vol = .07, when = 0, slide = 0) {
  if (!AC || save.mute) return;
  try {
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

}

function icon(name, size = 48, extra = '') {

}

/* ================= canvas drawing: Captain Pup & cars ================= */
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function rr(g, x, y, w, hh, r) { r = Math.min(r, w / 2, hh / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + hh, r); g.arcTo(x + w, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// Captain Pup's head: Japanese-Chin-style pup with an engineer cap. r = head radius
function drawPupHead(g, x, y, r, o = {}) {
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = INK;
  const lw = Math.max(1.5, r * 0.085); g.lineWidth = lw;
  // floppy black ears
  g.fillStyle = '#1f1d22';
  for (const sd of [-1, 1]) { ell(g, x + sd * r * 0.9, y + r * 0.08, r * 0.34, r * 0.62, sd * 0.32); g.fill(); g.stroke(); }
  // fluffy white head
  g.fillStyle = '#fff'; ell(g, x, y, r, r * 0.92); g.fill(); g.stroke();
  // black eye patches with the white blaze between them
  g.fillStyle = '#1f1d22';
  for (const sd of [-1, 1]) { ell(g, x + sd * r * 0.43, y - r * 0.1, r * 0.33, r * 0.4, sd * 0.45); g.fill(); }
  // big round brown eyes
  for (const sd of [-1, 1]) {
    const ex = x + sd * r * 0.41, ey = y - r * 0.08, er = r * 0.2;
    if (o.blink) { g.strokeStyle = '#fff'; g.lineWidth = lw * 0.8; g.beginPath(); g.moveTo(ex - er, ey); g.quadraticCurveTo(ex, ey + er * 0.7, ex + er, ey); g.stroke(); g.strokeStyle = INK; g.lineWidth = lw; continue; }
    g.fillStyle = '#7a4526'; ell(g, ex, ey, er, er); g.fill();
    g.fillStyle = '#120a08'; ell(g, ex + sd * er * 0.05, ey + er * 0.08, er * 0.58, er * 0.58); g.fill();
    g.fillStyle = '#fff'; ell(g, ex + er * 0.32, ey - er * 0.34, er * 0.24, er * 0.24); g.fill();
    ell(g, ex - er * 0.3, ey + er * 0.3, er * 0.1, er * 0.1); g.fill();
  }
  // button nose
  g.fillStyle = '#2b2426'; ell(g, x, y + r * 0.23, r * 0.13, r * 0.09); g.fill();
  g.fillStyle = 'rgba(255,255,255,.6)'; ell(g, x - r * 0.04, y + r * 0.2, r * 0.04, r * 0.025); g.fill();
  // happy open mouth + pink tongue
  g.lineWidth = lw * 0.8;
  g.beginPath(); g.moveTo(x, y + r * 0.3); g.lineTo(x, y + r * 0.38); g.stroke();
  g.fillStyle = '#5a1a2a';
  g.beginPath(); g.moveTo(x - r * 0.25, y + r * 0.38); g.quadraticCurveTo(x, y + r * 0.78, x + r * 0.25, y + r * 0.38); g.quadraticCurveTo(x, y + r * 0.46, x - r * 0.25, y + r * 0.38); g.fill(); g.stroke();
  g.fillStyle = '#ff8fb1';
  g.beginPath(); g.moveTo(x - r * 0.12, y + r * 0.5); g.lineTo(x - r * 0.12, y + r * 0.68); g.quadraticCurveTo(x, y + r * 0.86, x + r * 0.12, y + r * 0.68); g.lineTo(x + r * 0.12, y + r * 0.5); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#e0607f'; g.lineWidth = lw * 0.4; g.beginPath(); g.moveTo(x, y + r * 0.55); g.lineTo(x, y + r * 0.72); g.stroke();
  // whiskers
  g.strokeStyle = 'rgba(40,30,30,.5)'; g.lineWidth = Math.max(1, r * 0.025); g.beginPath();
  for (const sd of [-1, 1]) for (const k of [-1, 1]) { g.moveTo(x + sd * r * 0.22, y + r * 0.3 + k * r * 0.04); g.lineTo(x + sd * r * 0.7, y + r * 0.26 + k * r * 0.13); }
  g.stroke();
  g.strokeStyle = INK; g.lineWidth = lw;
  // engineer cap with a lightning bolt badge
  if (o.hat !== false) {
    g.fillStyle = '#2f80ed';
    g.beginPath(); g.ellipse(x - r * 0.05, y - r * 0.55, r * 0.78, r * 0.52, -0.08, Math.PI * 1.02, Math.PI * 1.98 + 0.02); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#1b5fbf';
    g.beginPath(); g.ellipse(x + r * 0.42, y - r * 0.56, r * 0.5, r * 0.12, -0.12, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = C.yellow; g.lineWidth = lw * 0.6;
    const bx = x - r * 0.08, by = y - r * 0.82, s = r * 0.22;
    g.beginPath(); g.moveTo(bx + s * 0.2, by - s); g.lineTo(bx - s * 0.5, by + s * 0.15); g.lineTo(bx, by + s * 0.15); g.lineTo(bx - s * 0.2, by + s); g.lineTo(bx + s * 0.55, by - s * 0.2); g.lineTo(bx + s * 0.05, by - s * 0.2); g.closePath(); g.fill(); g.stroke();
  }
  g.restore();
}

function drawPupFull(g, x, y, r, o = {}) {
  g.save(); g.lineJoin = 'round'; g.strokeStyle = INK; g.lineWidth = Math.max(1.5, r * 0.085);
  // body
  g.fillStyle = '#fff'; ell(g, x, y + r * 1.25, r * 0.85, r * 0.75); g.fill(); g.stroke();
  // orange safety vest with reflective stripe
  g.fillStyle = C.orange;
  g.beginPath(); g.moveTo(x - r * 0.72, y + r * 0.85); g.quadraticCurveTo(x - r * 0.95, y + r * 1.6, x - r * 0.55, y + r * 1.9);
  g.lineTo(x + r * 0.55, y + r * 1.9); g.quadraticCurveTo(x + r * 0.95, y + r * 1.6, x + r * 0.72, y + r * 0.85);

// original generic cartoon car (side view). x = centre, y = ground. s = scale (car is ~200*s long)

    g.fillStyle = C.yellow; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-76, -48); g.lineTo(-82, -41); g.lineTo(-78, -41); g.lineTo(-80, -36); g.lineTo(-74, -43); g.lineTo(-78, -43); g.closePath(); g.fill(); g.stroke();
    g.lineWidth = 4.5;

  for (const [tx, ty] of turb) scen += `<g transform="translate(${tx - 28} ${ty - 40})">${icon('wind', 56)}</g>`;
  let stops = '';
  const nextId = (MISSIONS.find(m => unlocked(m.id) && !save.done[m.id]) || {}).id;
  MISSIONS.forEach((m, i) => {

      <circle cx="${x - r + 8}" cy="${y - r + 8}" r="17" fill="${m.color}" stroke="${INK}" stroke-width="3.5"/>
      <text x="${x - r + 8}" y="${y - r + 16}" text-anchor="middle" font-size="22" fill="${INK}">${m.id === 6 ? '&#9733;' : m.id}</text>
      <g transform="translate(${x} ${y + r + 26})">

        <text y="2" text-anchor="middle" font-size="19" fill="${INK}">${m.stop}</text>
        ${done ? `<text y="25" text-anchor="middle" font-size="20" fill="#f4a100" stroke="${INK}" stroke-width="1">${'&#9733;'.repeat(st)}<tspan fill="#d8d0bd">${'&#9733;'.repeat(3 - st)}</tspan></text>` : ''}

  let car = '';
  if (nextId) { const [x, y] = P[nextId - 1]; car = `<image pointer-events="none" href="${CAR_URL}" x="${x - (narrow ? -40 : 140)}" y="${y - (narrow ? 70 : 108)}" width="130" height="65"><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" repeatCount="indefinite"/></image>`; }
  svg.innerHTML = `${scen}<path d="${road}" fill="none" stroke="${INK}" stroke-width="40" stroke-linecap="round"/><path d="${road}" fill="none" stroke="#5c5a6b" stroke-width="32" stroke-linecap="round"/><path d="${road}" fill="none" stroke="${C.yellow}" stroke-width="4" stroke-dasharray="16 14"/>${ring}${stops}${car}`;
  $$('.stop', svg).forEach(s => {
    const go = e => {
      const id = +s.dataset.id;
      if (!unlocked(id)) { sfx.bad(); toast(`${icon('lock', 26)} Finish <b>${MISSIONS[id - 2].name}</b> first to unlock this stop!`); s.classList.add('shake'); setTimeout(() => s.classList.remove('shake'), 400); return; }

  });

/* ================= mission runner ================= */
const PHASES = ['challenge', 'discover', 'experiment', 'boss', 'quiz'];
const PHASE_TIME = [30, 60, 120, 90, 0];
let cur = null;
function showScreen(id) { $('#title').hidden = id !== 'title'; $('#mission').hidden = id !== 'mission'; }
function openMission(id) {
  hideOverlay(); hideToast();
  cur = { m: MISSIONS[id - 1], phase: -1, bossWon: false, quizFirst: 0, cleanups: [] };
  $('#mTitle').innerHTML = `${cur.m.id === 6 ? 'Bonus' : 'Mission ' + cur.m.id}: ${cur.m.name}`;
  showScreen('mission');
  runPhase(0);
}
function cleanupPhase() {
  if (!cur) return;
  for (const f of cur.cleanups.splice(0)) { try { f(); } catch (e) {} }
  hideToast(); stopSpeak();
}
function backToMap() { stopSpeak(); cleanupPhase(); cur = null; hideOverlay(); showScreen('title'); renderTitle(); }
function runPhase(i) {
  cleanupPhase();
  cur.phase = i;
  $$('#steps li').forEach((li, k) => { li.className = k < i ? 'done' : k === i ? 'now' : ''; });
  const stage = $('#stage'); stage.innerHTML = ''; stage.scrollTop = 0;
  const box = el(`<div class="phase pop"><div class="talk"><img alt="Captain Pup" src="${PUP_URL}"><div class="bubble panel"></div></div><div class="play"></div><div class="nav"></div></div>`);
  stage.append(box);
  const P = makeP(box, i);
  const m = cur.m;
  if (i === 1) runDiscover(P, m.discover);
  else if (i === 4) runQuiz(P, m.quiz);
  else m[PHASES[i]](P);
  if (PHASE_TIME[i] && !P._chipSet) P.chip(PHASE_TIME[i]);
  else if (!PHASE_TIME[i] && !P._chipSet) P.chip(0);
}
function makeP(box, idx) {
  const talk = $('.bubble', box), area = $('.play', box), nav = $('.nav', box);
  const pupImg = $('.talk img', box);
  let blinkT = setInterval(() => { pupImg.src = PUP_BLINK_URL; setTimeout(() => { pupImg.src = PUP_URL; }, 140); }, 3600);
  cur.cleanups.push(() => clearInterval(blinkT));
  const P = {
    area, idx, _chipSet: false,
    talk(html, more) { stopSpeak(); talk.innerHTML = `<div class="say">${html}</div>${readBtn(html)}${moreHTML(more)}`; talk.classList.remove('pop'); void talk.offsetWidth; talk.classList.add('pop'); },
    demo(target, fx, fy, ms) { demoTap(target, fx, fy, ms); },
    add(html) { const e = el(html); area.append(e); return e; },
    clearNav() { nav.innerHTML = ''; },
    button(label, cls, fn) { const b = el(`<button class="btn ${cls || ''}">${label}</button>`); b.onclick = e => { sfx.tap(); fn(e); }; nav.append(b); return b; },
    next(label) {
      if ($('.next', nav)) return;
      const labels = ['Discover &#9654;', 'Experiment &#9654;', 'Boss &#9654;', 'Quiz &#9654;'];
      const b = P.button(label || labels[idx] || 'Next &#9654;', 'go next', () => runPhase(idx + 1));
      b.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' });
      return b;
    },
    later(fn, ms) { const t = setTimeout(fn, ms); cur.cleanups.push(() => clearTimeout(t)); return t; },
    every(fn, ms) { const t = setInterval(fn, ms); cur.cleanups.push(() => clearInterval(t)); return t; },
    on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); cur.cleanups.push(() => target.removeEventListener(ev, fn, opt)); },
    loop(fn) {
      let alive = true, last = performance.now();
      const step = now => { if (!alive) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; try { fn(dt, now); } catch (e) { alive = false; throw e; } requestAnimationFrame(step); };
      requestAnimationFrame(step); cur.cleanups.push(() => { alive = false; });
    },
    canvas(W, H, maxVh) { return makeSim(area, W, H, maxVh, P); },
    chip(sec, onEnd) {
      P._chipSet = true;
      const chip = $('#clock');
      if (!sec) { chip.hidden = true; return; }
      chip.hidden = false; chip.classList.remove('low');
      let left = sec, paused = false;
      const draw = () => { chip.innerHTML = `${icon('clock', 24)} ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`; };
      draw();
      const t = setInterval(() => {
        if (paused || !$('#ov').hidden) return;
        left = Math.max(0, left - 1); draw(); chip.classList.toggle('low', left <= 10);
        if (left <= 0) {
          paused = true;
          if (onEnd) { onEnd(); return; }
          const tt = toast(`${icon('clock', 30)} <b>Time's up!</b> No worries. <div class="row" style="margin-top:6px"><button class="btn sm go" id="tKeep">Keep going</button><button class="btn sm alt" id="tMove">Move on &#9654;</button></div>`, 0);
          $('#tKeep', tt).onclick = () => { sfx.tap(); hideToast(); left = 60; paused = false; draw(); chip.classList.remove('low'); };
          $('#tMove', tt).onclick = () => { sfx.tap(); hideToast(); runPhase(Math.min(4, idx + 1)); };
        }
      }, 1000);
      P.stopChip = () => { clearInterval(t); chip.classList.remove('low'); };
      P.addTime = s => { left += s; paused = false; draw(); };
      cur.cleanups.push(() => clearInterval(t));
    },
    stopChip() {},
    bossWin(msg, more) {
      if (cur.bossWon && P._won) return; P._won = true;
      cur.bossWon = true; P.stopChip(); sfx.win(); burst('BOSS BEATEN!', C.green); confetti(60);
      P.talk(msg || 'You did it! Road open!', more);
      P.clearNav(); P.next('Quiz &#9654;');
    },
    bossLose(msg, more, retry) {
      if (typeof more === 'function') { retry = more; more = ''; }
      sfx.bad(); burst('TRY AGAIN!', C.orange);
      P.talk(msg + ' <b>You\'ve got this!</b>', more);
      P.clearNav();
      P.button('&#8635; Retry', 'yel', retry || (() => runPhase(idx)));
      P.button('Skip to Check &#9654;', 'alt', () => runPhase(4));
    },
  };
  if (idx === 1) P.button('Skip &#9654;', 'alt', () => runPhase(2));
  return P;
}

// canvas helper: fixed logical size W x H, scaled crisp to the element width
function makeSim(parent, W, H, maxVh = 0.62, P) {
  const cv = el(`<canvas class="sim"></canvas>`);
  parent.append(cv);
  const g = cv.getContext('2d');
  const S = { cv, g, W, H, k: 1 };
  const fit = () => {
    const maxH = Math.max(220, innerHeight * maxVh);
    cv.style.maxWidth = Math.floor(maxH * W / H) + 'px';
    const cw = cv.clientWidth || parent.clientWidth || 600;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(cw * dpr * H / W);
    S.k = cv.width / W; g.setTransform(S.k, 0, 0, S.k, 0, 0);
  };
  S.fit = fit;
  S.pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  S.clear = (col = '#bde8fb') => { g.setTransform(S.k, 0, 0, S.k, 0, 0); g.fillStyle = col; g.fillRect(0, 0, W, H); };
  requestAnimationFrame(fit); fit();
  if (P) P.on(window, 'resize', fit);
  return S;
}

}

}

// order puzzle: fixed first/last, fill slots from a pool. items: {id,name,icon,sub}
function orderPuzzle(P, { first, last, answer, pool, onWin, onWrong, checkLabel = 'Check it!' }) {
  const wrap = P.add(`<div class="panel" style="padding:12px"><div class="chain"></div><div class="lbl">${icon('hand', 26)} Tap pieces in order &#10140;</div><div class="row pool"></div><div class="row" style="margin-top:6px"><button class="btn go" disabled>${checkLabel}</button></div></div>`);
  const chainEl = $('.chain', wrap), poolEl = $('.pool', wrap), checkBtn = $('.btn', wrap);
  const slots = answer.map(() => null);
  const byId = Object.fromEntries(pool.map(p => [p.id, p]));
  const tileHTML = it => `${icon(it.icon, 44)}<span>${it.name}</span>${it.sub ? `<small style="opacity:.7">${it.sub}</small>` : ''}`;
  const render = () => {
    let h = `<div class="slot fixed">${tileHTML(first)}</div>`;
    slots.forEach((s, k) => { h += `<div class="arrow">&#10140;</div><div class="slot ${s ? 'full' : ''}" data-k="${k}">${s ? tileHTML(byId[s]) : `<span class="toon" style="opacity:.5;font-size:34px">?</span>`}</div>`; });
    h += `<div class="arrow">&#10140;</div><div class="slot fixed">${tileHTML(last)}</div>`;
    chainEl.innerHTML = h;
    $$('.slot[data-k]', chainEl).forEach(s => s.onclick = () => { const k = +s.dataset.k; if (slots[k]) { slots[k] = null; sfx.blip(); render(); } });
    $$('.tile', poolEl).forEach(t => t.classList.toggle('used', slots.includes(t.dataset.id)));
    checkBtn.disabled = slots.includes(null);
  };
  poolEl.innerHTML = shuffle(pool).map(p => `<button class="tile" data-id="${p.id}">${tileHTML(p)}</button>`).join('');
  $$('.tile', poolEl).forEach(t => t.onclick = () => { const k = slots.indexOf(null); if (k < 0 || slots.includes(t.dataset.id)) return; slots[k] = t.dataset.id; sfx.blip(); render(); });
  checkBtn.onclick = e => {
    const wrong = slots.map((s, k) => s !== answer[k]);
    $$('.slot[data-k]', chainEl).forEach((s, k) => s.classList.add(wrong[k] ? 'bad' : 'good'));
    if (wrong.some(Boolean)) {
      sfx.bad(); oops(e);
      const n = wrong.filter(Boolean).length;
      onWrong && onWrong(n, slots.slice());
      setTimeout(() => { wrong.forEach((w, k) => { if (w) slots[k] = null; }); render(); }, 1300);
    } else { sfx.good(); yay(e); onWin && onWin(); checkBtn.disabled = true; }
  };
  render();
  demoTap($('.tile', poolEl), 0.5, 0.6);
  return { wrap };
}

function demoTap(target, fx = 0.5, fy = 0.5, ms = 3600) {
  if (!target || !cur) return;
  const h = el(`<div class="hand">${icon('hand', 64)}<span class="ripple"></span></div>`);
  const place = () => {
    const r = target.getBoundingClientRect();

    h.style.left = (r.left + r.width * fx) + 'px'; h.style.top = (r.top + r.height * fy) + 'px';
  };
  const t0 = setTimeout(() => { place(); $('#bursts').append(h); }, 450);
  const t1 = setTimeout(() => h.remove(), 450 + ms);
  const kill = () => { clearTimeout(t0); clearTimeout(t1); h.remove(); };

  $('#stage').addEventListener('scroll', place, { passive: true });
  cur.cleanups.push(() => { kill(); $('#stage').removeEventListener('scroll', place); });

  ctext(g, title, x + w / 2, y - 18, 20, INK);

    cx += p.w;
  }
}

    $$('[data-w]', ui).forEach(b => b.onclick = () => { wx = +b.dataset.w; $$('[data-w]', ui).forEach(x => x.classList.toggle('on', x === b)); sfx.blip(); });
    const solarKW = h => Math.max(0, 6.5 * Math.sin(Math.PI * (h - 6.5) / 13));
    P.loop(() => {
      const h = +tIn.value, kw = +(solarKW(h) * wx).toFixed(1);
      $('.tv', ui).textContent = `${(Math.floor(h) + 11) % 12 + 1}:${String(Math.round((h % 1) * 60)).padStart(2, '0')} ${h % 24 < 12 ? 'AM' : 'PM'}`;
      goals.forEach((gl, i) => { if (!done.has(i) && gl.f(h, kw)) { done.add(i); sfx.good(); yay(); $('.goals', ui).innerHTML = goals.map((x, j) => `<li class="${done.has(j) ? 'ok' : ''}">${x.t}</li>`).join(''); if (done.size >= 2) P.next(); } });
      const g = S.g, sun = solarKW(h) > 0;
      const sky = sun ? (wx > .5 ? '#8fd9f5' : wx > .2 ? '#a9c2d6' : '#6f7d8f') : '#22204a';
      S.clear(sky);
      if (sun) { const a = Math.PI * (h - 6.5) / 13; const sx = 410 - Math.cos(a) * 340, sy = 250 - Math.sin(a) * 210; g.fillStyle = C.yellow; g.strokeStyle = INK; g.lineWidth = 3; ell(g, sx, sy, 28, 28); g.fill(); g.stroke(); }
      if (wx < 1) { g.fillStyle = wx < .2 ? '#5b6270' : '#e7eef5'; g.strokeStyle = INK; g.lineWidth = 3; for (const [cx, cy] of [[200, 70], [330, 50], [480, 80], [620, 60]]) { ell(g, cx, cy, 60, 26); g.fill(); g.stroke(); } }
      g.fillStyle = '#7bd389'; g.fillRect(0, 250, 820, 50);
      drawHouseC(g, 410, 250, 2.6, !sun);
      cpanel(g, 20, 20, 210, 74);
      btext(g, 'Solar power', 125, 40, 15); ctext(g, kw.toFixed(1) + ' kW', 125, 70, 30, kw > 0 ? '#078a63' : C.accent);
      if (!$('.goals', ui).innerHTML) $('.goals', ui).innerHTML = goals.map((x, j) => `<li class="${done.has(j) ? 'ok' : ''}">${x.t}</li>`).join('');
    });
  },
  boss(P) {
    P.talk('<b>BOSS!</b> Car to <b>70%</b>. Do chores. Avoid <b>peak</b> grid power!', 'By 7 AM tomorrow: fill the car to at least 70% and run the washer and dishwasher. Buy as little grid power as you can during the peak (4 to 9 PM). Tip: chores while sunny, save the home battery for evening, charge the car with sunshine or after 9 PM.');
    P.chip(110);
    const S = P.canvas(900, 360, .42);
    const ui = P.add(`<div class="panel" style="padding:10px 12px;margin-top:12px">
      <div class="ctrls" style="margin-top:0">
        <div style="text-align:center"><div class="lbl" style="margin-top:0">${icon('lvl2', 30)} Car</div><div class="seg evm"><button data-e="off" class="on">Off</button><button data-e="sun">${icon('sun', 26)} Sunny</button><button data-e="on">${icon('bolt', 26)} Now</button></div></div>
        <div style="text-align:center"><div class="lbl" style="margin-top:0">${icon('homebatt', 30)} Battery</div><div class="seg hb"><button data-h="auto" class="on">${icon('moon', 26)} Save</button><button data-h="now">Use now</button></div></div>
      </div>
      <div class="row apps" style="margin-top:8px"></div>
      <div class="row" style="margin-top:6px"><button class="btn sm go startB">Start the day &#9654;</button><button class="btn sm alt ffB" hidden>${icon('moon', 26)} &#9193;</button></div></div>`);
    const APPS = [{ id: 'wash', n: 'Washer', ic: 'washer', kw: 2, hrs: 1.5 }, { id: 'dish', n: 'Dishwasher', ic: 'dish', kw: 1.5, hrs: 1.5 }];
    const st = { h: 6, run: false, over: false, ev: 'off', hb: 'auto', car: 0.3, hbE: 4, hbCap: 13.5, peakBuy: 0, buy: 0, solarUsed: 0, apps: {}, ff: false, hist: [] };
    if (window.__game) window.__game.home = st;
    APPS.forEach(a => st.apps[a.id] = { left: 0, done: false });
    const appsEl = $('.apps', ui);
    const renderApps = () => {
      appsEl.innerHTML = APPS.map(a => { const s = st.apps[a.id]; return `<button class="tile ${s.left > 0 ? 'on' : s.done ? 'good' : ''}" data-a="${a.id}">${icon(a.ic, 44)} ${a.n} ${s.left > 0 ? '&#8635;' : s.done ? '&#10004;' : '&#9654;'}</button>`; }).join('');
      $$('[data-a]', appsEl).forEach(b => b.onclick = () => { const s = st.apps[b.dataset.a]; if (!st.run || s.left > 0 || s.done) return; s.left = APPS.find(x => x.id === b.dataset.a).hrs; sfx.zap(); renderApps(); });
    };
    renderApps();
    $$('[data-e]', ui).forEach(b => b.onclick = () => { st.ev = b.dataset.e; $$('[data-e]', ui).forEach(x => x.classList.toggle('on', x === b)); sfx.blip(); });
    $$('[data-h]', ui).forEach(b => b.onclick = () => { st.hb = b.dataset.h; $$('[data-h]', ui).forEach(x => x.classList.toggle('on', x === b)); sfx.blip(); });
    const startB = $('.startB', ui), ffB = $('.ffB', ui);
    startB.onclick = () => { st.run = true; startB.remove(); sfx.whoosh(); };
    ffB.onclick = () => { st.ff = true; sfx.whoosh(); };
    const solarKW = h => { const hh = h % 24; return Math.max(0, 7 * Math.sin(Math.PI * (hh - 6.5) / 13)) * (hh > 13 && hh < 14.5 ? 0.4 : 1); };
    const base = h => { const hh = h % 24; return 0.5 + (hh > 6.5 && hh < 8.5 ? 1 : 0) + (hh > 17 && hh < 22 ? 2.2 : 0); };
    const peak = h => { const hh = h % 24; return hh >= 16 && hh < 21; };
    const clockStr = h => { const hh = Math.floor(h % 24), mm = Math.floor((h % 1) * 4) * 15; return `${(hh + 11) % 12 + 1}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`; };
    let flow = { sol: 0, load: 0, ev: 0, hb: 0, grid: 0 };
    P.loop((dt, now) => {
      if (st.run && !st.over) {
        const speed = st.ff ? 6 : st.h >= 22 ? 1.6 : 0.4; // game-hours per real second
        const dh = dt * speed; st.h += dh;
        if (st.h >= 22) ffB.hidden = false;
        const sol = solarKW(st.h);
        let load = base(st.h);
        for (const a of APPS) { const s = st.apps[a.id]; if (s.left > 0) { load += a.kw; s.left -= dh; if (s.left <= 0) { s.left = 0; s.done = true; renderApps(); } } }
        let ev = 0;
        const surplus = sol - load, room = (st.hbCap - st.hbE) / Math.max(dh, 1e-6);
        const hbFirst = Math.max(0, Math.min(surplus, 3, room)); // sunny-mode leaves room for the home battery first
        if (st.car < 1 && st.ev === 'on') ev = 7.7;
        else if (st.car < 1 && st.ev === 'sun' && surplus - hbFirst > 0.8) ev = Math.min(7.7, surplus - hbFirst);
        st.car = Math.min(1, st.car + ev * dh / PACK);
        let need = load + ev - sol, hb = 0;
        if (need < 0) { const ch = Math.min(-need, 5, (st.hbCap - st.hbE) / dh); hb = -ch; st.hbE += ch * dh; need += ch; need = Math.min(0, need); }
        else {
          const allow = st.hb === 'now' || peak(st.h) || st.h % 24 >= 21;
          if (allow) { const d = Math.min(need, 5, st.hbE / dh); hb = d; st.hbE -= d * dh; need -= d; }
        }
        const grid = need; // >0 buy, <0 export
        if (grid > 0) { st.buy += grid * dh; if (peak(st.h)) st.peakBuy += grid * dh; }
        st.solarUsed += Math.min(sol, load + ev + Math.max(0, -hb)) * dh;
        flow = { sol, load, ev, hb, grid };
        if (!st.hist.length || st.h - st.hist[st.hist.length - 1].h > 0.2) st.hist.push({ h: st.h, sol, use: load + ev, grid });
        if (st.h >= 31) { st.over = true; finish(); }
      }
      draw(now);
    });
    function finish() {
      const carOK = st.car >= 0.695, appsOK = APPS.every(a => st.apps[a.id].done), peakOK = st.peakBuy <= 3;
      const res = `${icon('car', 30)} ${Math.round(st.car * 100)}% ${carOK ? '&#10004;' : '&#10008;'} &nbsp; ${icon('washer', 30)} ${appsOK ? '&#10004;' : '&#10008;'} &nbsp; ${icon('pylon', 30)} peak ${st.peakBuy.toFixed(1)} kWh ${peakOK ? '&#10004;' : '&#10008;'}`;
      if (carOK && appsOK && peakOK) P.bossWin(`Energy Hero! ${res}`, 'You used the sun while it was shining, saved energy for the evening peak, and charged the car smartly.');
      else P.bossLose(res, 'Run chores while the sun is out, save the home battery for the evening, and charge the car with sunshine or after 9 PM (off-peak). Peak goal: 3 kWh or less.');
    }
    function draw(now) {
      const g = S.g, hh = st.h % 24, sun = solarKW(st.h) > 0;
      S.clear(sun ? '#bde8fb' : '#2b2a4a');
      g.fillStyle = '#7bd389'; g.fillRect(0, 230, 470, 130);
      drawHouseC(g, 170, 230, 2.4, !sun || flow.load > 1.5);
      g.save(); g.translate(170, 230); g.scale(2.4, 2.4); g.fillStyle = '#3a6ea5'; g.strokeStyle = INK; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(4, -64); g.lineTo(30, -42); g.lineTo(26, -38); g.lineTo(1, -60); g.closePath(); g.fill(); g.stroke(); g.restore();
      // home battery box
      g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = 3; rr(g, 270, 150, 40, 80, 8); g.fill(); g.stroke();
      g.fillStyle = C.green; const hf = st.hbE / st.hbCap; if (hf > 0.01) { rr(g, 275, 225 - 70 * hf, 30, 70 * hf, 4); g.fill(); }
      btext(g, Math.round(hf * 100) + '%', 290, 140, 14, sun ? INK : '#fff');
      drawCar(g, 400, 260, 0.5, { color: C.blue, plug: flow.ev > 0, blink: (now / 1000) % 4 < .12 });
      ctext(g, clockStr(st.h), 120, 30, 30, sun ? INK : '#fff');
      if (peak(st.h)) ctext(g, 'PEAK HOURS', 120, 64, 20, C.accent, 'center', 4);
      // flows panel
      cpanel(g, 490, 14, 396, 332);
      const rows = [['sun', 'Solar making', flow.sol], ['house', 'House using', flow.load], ['car', 'Car charging', flow.ev], ['homebatt', flow.hb < 0 ? 'Battery storing' : 'Battery giving', Math.abs(flow.hb)], ['pylon', flow.grid < 0 ? 'Sending to grid' : 'Buying from grid', Math.abs(flow.grid)]];
      rows.forEach(([ic, n, v], i) => {
        const y = 44 + i * 44; cicon(g, ic, 520, y, 34); btext(g, n, 545, y, 16, INK, 'left');
        g.fillStyle = '#e9e2cf'; rr(g, 700, y - 9, 110, 18, 6); g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
        g.fillStyle = i === 4 && flow.grid > 0 && peak(st.h) ? C.accent : C.green; if (v > 0.05) { rr(g, 700, y - 9, 110 * Math.min(1, v / 10), 18, 6); g.fill(); g.stroke(); }
        btext(g, v.toFixed(1), 845, y, 15);
      });
      btext(g, 'kW', 845, 22, 12);
      g.strokeStyle = '#d8d0bd'; g.lineWidth = 2; g.beginPath(); g.moveTo(506, 262); g.lineTo(870, 262); g.stroke();
      btext(g, `Car battery: ${Math.round(st.car * 100)}% (goal 70%)`, 688, 282, 16, st.car >= .695 ? '#078a63' : INK);
      btext(g, `Peak grid power bought: ${st.peakBuy.toFixed(1)} kWh`, 688, 308, 16, st.peakBuy > 3 ? '#d6204a' : '#078a63');
      btext(g, `Ends 7:00 AM tomorrow`, 688, 332, 14, '#555');
      if (!st.run) ctext(g, 'TAP "START THE DAY"', 240, 120, 26, '#fff', 'center', 6);
    }
  },
  quiz: [
    { q: 'When do panels make the MOST power?', a: ['Sunny midday', 'Midnight', 'Stormy sunrise', 'Only in winter'], ic: ['sun', 'moon', 'storm', 'snow'], c: 0, why: 'The sun is highest at <b>midday</b>!', hint: 'When is the sun highest?' },
    { art: icon('homebatt', 72), q: 'What does a home battery do?', a: ['Saves solar for later', 'Makes energy from nothing', 'Charges the panels', 'Burns gas'], ic: ['homebatt', 'star', 'panel', 'gasplant'], c: 0, why: 'It <b>stores</b> energy for later. It can\'t make energy!', hint: 'Remember the big rule from Mission 1.' },
    { art: icon('washer', 72), q: 'Best time to run the washer?', a: ['When sunny', '6 PM peak', 'Never matters', 'In a storm'], ic: ['sun', 'clock', 'none', 'storm'], c: 0, why: 'Use your own <b>sunshine</b> power!', hint: 'When are panels working?' },
  ],
};

/* ================= boot ================= */
const MISSIONS = [M1, M2, M3, M4, M5, M6];
syncMute();
$$('.muteBtn').forEach(b => b.onclick = () => { save.mute = !save.mute; persist(); syncMute(); if (!save.mute) { initAudio(); sfx.blip(); } });
$('#badgesBtn').onclick = () => { sfx.tap(); showBadges(); };
$('#toMap').onclick = () => { sfx.tap(); backToMap(); };
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' && !cur) hideOverlay(); });
let rT = 0;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!$('#title').hidden) drawMap(); }, 120); });
renderTitle();
showScreen('title');
// test hook
window.__game = {
  open: openMission, phase: i => runPhase(i), map: backToMap, save: () => save,
  unlockAll() { MISSIONS.forEach(m => save.done[m.id] = true); persist(); renderTitle(); },
  reset() { save = { done: {}, stars: {}, mute: save.mute }; persist(); renderTitle(); },
  cur: () => cur, bossWin: () => cur && (cur.bossWon = true),
};
</script>
