<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rescue Raid Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b26;--paper:#fffaf0;--accent:#ff4d6d;--yellow:#ffd23f;--green:#06d6a0;--blue:#4cc9f0;--purple:#9b5de5;--orange:#ff9f1c;
  --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2440;color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toon{font-family:var(--toon);font-weight:400;letter-spacing:1px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink)}

#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:9px 10px;z-index:20;pointer-events:none}
#top>*{pointer-events:auto}
#top .sp{flex:1 1 auto;pointer-events:none}
.round{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);
  font-size:26px;display:grid;place-items:center;padding:0;flex:none;line-height:1;text-decoration:none;color:var(--ink)}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round.q{font-family:var(--toon);font-size:30px;padding-top:5px}
.pill{height:60px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);
  font-family:var(--toon);font-size:22px;padding:6px 18px 0;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);flex:none;white-space:nowrap}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip{height:60px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--toon);
  display:flex;align-items:center;gap:6px;padding:6px 16px 0;flex:none;white-space:nowrap}
#timer{background:var(--paper);font-size:38px;min-width:150px;justify-content:center}
#timer.hot{background:var(--accent);color:#fff;animation:throb .5s infinite}
@keyframes throb{50%{transform:scale(1.08)}}
#found{background:var(--blue);font-size:30px}
#bHint{background:var(--yellow);font-size:24px}
#bHint:disabled{opacity:.5}

#titleUI{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#logo{margin-top:max(78px,6vh);text-align:center;font-family:var(--toon);color:var(--yellow);line-height:.95;letter-spacing:2px;
  font-size:min(10.5vw,14vh);-webkit-text-stroke:4px var(--ink);paint-order:stroke;text-shadow:6px 6px 0 var(--ink);
  transform:rotate(-3deg);animation:bob 2.4s ease-in-out infinite}
#logo .l2{display:block;color:#fff;font-size:.62em;margin-top:.12em}
#logo .l2 b{color:var(--accent);font-weight:400}
@keyframes bob{50%{transform:rotate(-1deg) translateY(-6px)}}
#bStart{pointer-events:auto;position:absolute;bottom:max(36px,7vh)}
.btn{background:var(--accent);color:#fff;font-family:var(--toon);font-size:26px;min-height:64px;padding:12px 28px 6px;border-radius:999px;
  border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);letter-spacing:1px;line-height:1.1;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.go{background:var(--green);color:var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.yel{background:var(--yellow);color:var(--ink)}
.btn.big{font-size:min(44px,9vw);padding:18px 46px 10px;min-height:84px}
.btn.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

#bubble{position:fixed;z-index:15;max-width:340px;padding:10px 12px 8px 16px;display:flex;align-items:center;gap:10px;
  font-family:var(--toon);font-size:22px;line-height:1.1;pointer-events:auto;transition:opacity .25s}
#bubble.off{opacity:0;pointer-events:none}
#bubble .say{width:46px;height:46px;font-size:21px;border-width:3px;box-shadow:0 3px 0 var(--ink)}

.ov{position:fixed;inset:0;z-index:40;background:rgba(20,18,40,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:min(860px,100%);max-height:calc(100% - 10px);overflow-y:auto;padding:16px 18px 18px;position:relative;touch-action:pan-y}
.sheet h2{font-family:var(--toon);font-weight:400;font-size:38px;margin:0 60px 10px 0;color:var(--accent);letter-spacing:1px;line-height:1}
.sheet .x{position:absolute;right:10px;top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:10px 6px 8px;text-align:center}
.tile .i{font-size:46px;line-height:1.1}
.tile b{display:block;font-family:var(--toon);font-weight:400;font-size:20px;letter-spacing:.5px;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}

/* end panel */
#endS{width:min(620px,100%);text-align:center}
#endS h2{margin:0 0 6px;text-align:center;font-size:48px;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:4px 4px 0 var(--ink)}
.stars{font-size:54px;letter-spacing:6px;line-height:1.1}
.stars .off{filter:grayscale(1);opacity:.3}
.stars span{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.rankbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
.rankbox b{font-family:var(--toon);font-weight:400;font-size:30px;color:var(--purple);letter-spacing:1px;line-height:1}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.tally div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 4px 3px;font-family:var(--toon);font-size:22px}
.tally div.neg{background:#ffe1e6}
.total{font-family:var(--toon);font-size:40px;margin:2px 0 12px}

/* initials */
.pick{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.col .let{width:96px;height:110px;border:4px solid var(--ink);border-radius:18px;background:var(--ink);color:var(--yellow);
  font-family:var(--toon);font-size:84px;display:grid;place-items:center;padding-top:10px;box-shadow:0 6px 0 #000}
.col button{width:96px;height:64px;font-size:30px;border-radius:16px;border:3px solid var(--ink);background:var(--blue);box-shadow:0 5px 0 var(--ink)}
.col button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* board */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{min-width:60px;height:60px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-size:26px;padding:0 8px}
.tabs button.on{background:var(--yellow);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.brow{display:grid;grid-template-columns:44px 52px 1fr auto auto;align-items:center;gap:10px;padding:4px 10px;border:3px solid var(--ink);
  border-radius:14px;background:#fff;margin-bottom:6px;font-family:var(--toon);font-size:26px}
.brow .n{font-size:22px;color:#777}
.brow .tm{font-family:Nunito,system-ui,sans-serif;font-size:16px;color:#666}
.brow.seed{background:#eeeaf3;color:#8a8597}
.brow.real{background:#fff6c7}
.brow.me{background:var(--green);animation:pop .5s}
.brow .you{font-size:14px;background:var(--accent);color:#fff;border-radius:8px;padding:3px 6px 0;margin-left:6px;vertical-align:middle}
.brow canvas{width:46px;height:46px}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,77,109,.45);pointer-events:none}
@media (max-width:640px){
  #top{gap:5px;padding:6px 5px}
  .round{width:48px;height:48px;font-size:21px}
  .round.q{font-size:25px}
  .chip{height:48px;padding:4px 9px 0}
  #timer{font-size:28px;min-width:96px}
  #found{font-size:22px}
  #bHint{font-size:19px;padding:4px 8px 0}
  .pill{height:48px;font-size:18px;padding:4px 12px 0}
  #bubble{font-size:18px;max-width:250px}
  .sheet h2{font-size:30px}
  #logo{font-size:min(17vw,11vh)}
  .rankbox b{font-size:24px}
  .col .let{width:76px;height:92px;font-size:66px}
  .col button{width:76px}
  .brow{grid-template-columns:30px 46px 1fr auto;font-size:22px;gap:6px}
  .brow .tm{display:none}
  .tally div{font-size:18px}
  #endS h2{font-size:38px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <a id="bBack" class="pill" href="../">⬅ Games</a>
  <button id="bMap" class="round" title="Map" aria-label="Back to map">🗺️</button>
  <div id="timer" class="chip">3:00</div>
  <div id="found" class="chip">🔍 0/5</div>
  <button id="bHint" class="chip">💡 HINT</button>
  <div class="sp"></div>
  <button id="bBoard" class="round" title="Leaderboard" aria-label="Leaderboard">🏆</button>
  <button id="bHelp" class="round q" title="How to play" aria-label="How to play">?</button>
  <button id="bMute" class="round" title="Sound" aria-label="Sound on or off">🔊</button>
</div>
<div id="titleUI">
  <div id="logo">RESCUE<span class="l2">RAID <b>TEAM!</b></span></div>
  <button id="bStart" class="btn big pulse">PRESS START</button>
</div>
<div id="bubble" class="panel off"><span id="bubT"></span><button id="bSay" class="round say" aria-label="Read aloud">🗣️</button></div>
<div id="ovHelp" class="ov" hidden><div class="sheet panel"></div></div>
<div id="ovEnd" class="ov" hidden><div id="endS" class="sheet panel"></div></div>
<div id="ovBoard" class="ov" hidden><div class="sheet panel"></div></div>
<script>
'use strict';
/* ===================== core utils ===================== */
const INK = '#1d1b26', PAPER = '#fffaf0';
const COL = { red:'#ff4d6d', yellow:'#ffd23f', green:'#06d6a0', blue:'#4cc9f0', purple:'#9b5de5', orange:'#ff9f1c' };
const TOON = '"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif';
const font = px => `${Math.max(1, px) | 0}px ${TOON}`;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3), easeIn = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function E(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function R(c, x, y, w, h, r) { if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; } r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function PL(c, p, close = true) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); if (close) c.closePath(); }
function F(c, col) { c.fillStyle = col; c.fill(); c.stroke(); }
function FO(c, col) { c.fillStyle = col; c.fill(); }
function L(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function STAR(c, x, y, ro, rin, n = 5, rot = -Math.PI / 2) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const r = i % 2 ? rin : ro, a = rot + i * Math.PI / n; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); }
function ARC(c, x, y, r, a0, a1) { c.beginPath(); c.arc(x, y, r, a0, a1); c.stroke(); }
// text at any scale (props are drawn in unit space)
function TX(c, t, x, y, sz, col, strokeW = 0, mirror = false) {
  c.save(); c.translate(x, y); const k = sz / 100; c.scale(mirror ? -k : k, k); c.font = font(100); c.textAlign = 'center'; c.textBaseline = 'middle';
  if (strokeW) { c.lineWidth = strokeW / k; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(t, 0, 6); }
  c.fillStyle = col; c.fillText(t, 0, 6); c.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; } else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
// seeded rng for stable seeds / map decor
function srng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

/* ===================== audio ===================== */
let AC = null, master = null, muted = false, noiseBuf = null, rainGain = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(AC.destination);
    const n = AC.sampleRate * 2; noiseBuf = AC.createBuffer(1, n, AC.sampleRate); const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    // rain bed (always running, gain 0 unless raining)
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.6;
    rainGain = AC.createGain(); rainGain.gain.value = 0; src.connect(bp); bp.connect(rainGain); rainGain.connect(master); src.start();
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.15, when = 0, f2 = null) {
  if (!AC || muted) return; const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v = 0.3, fq = 1000, type = 'lowpass', when = 0, fq2 = null) {
  if (!AC || muted) return; const t = AC.currentTime + when;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(fq, t);
  if (fq2) f.frequency.exponentialRampToValueAtTime(fq2, t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + d + 0.05);
}
function vib(f, d, when, v = 0.12) {
  if (!AC || muted) return; const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain(), lp = AC.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); lfo.frequency.value = 6; lg.gain.value = f * 0.03; lfo.connect(lg); lg.connect(o.frequency);
  lp.type = 'lowpass'; lp.frequency.value = 1200; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.04); g.gain.setValueAtTime(v, t + d - 0.08); g.gain.linearRampToValueAtTime(0.0001, t + d);
  o.connect(lp); lp.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + d + 0.02); lfo.stop(t + d + 0.02);
}
const SFX = {
  pew() { tone(1300, 0.12, 'square', 0.06, 0, 260); tone(2600, 0.06, 'triangle', 0.04); },
  hit() { tone(320, 0.12, 'square', 0.12, 0, 110); noise(0.08, 0.2, 2000, 'bandpass'); },
  boom() { noise(0.7, 0.55, 1200, 'lowpass', 0, 120); tone(150, 0.55, 'sine', 0.45, 0, 35); },
  poof() { noise(0.35, 0.3, 3000, 'bandpass', 0, 600); tone(500, 0.3, 'triangle', 0.14, 0, 1500); },
  found() { [660, 880, 1320].forEach((f, i) => tone(f, 0.16, 'triangle', 0.18, i * 0.07)); },
  combo(n) { for (let i = 0; i < Math.min(5, n + 1); i++) tone(880 * Math.pow(1.12, i), 0.1, 'square', 0.06, i * 0.05); },
  unlock() { tone(1500, 0.08, 'square', 0.07); tone(2300, 0.18, 'triangle', 0.12, 0.06); },
  morph() { if (!AC || muted) return; const t = AC.currentTime; const o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.8); l.frequency.value = 14; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.85); o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t + 0.9); l.stop(t + 0.9); },
  blorp() { tone(180, 0.18, 'sine', 0.3, 0, 520); tone(600, 0.1, 'triangle', 0.1, 0.12, 300); },
  trombone() { vib(392, 0.3, 0); vib(370, 0.3, 0.32); vib(349, 0.3, 0.64); vib(330, 0.95, 0.96); },
  bzzt() { tone(90, 0.3, 'sawtooth', 0.14); tone(97, 0.3, 'square', 0.07); },
  click() { tone(760, 0.05, 'square', 0.06); },
  kick() { noise(0.3, 0.7, 500); tone(95, 0.3, 'sine', 0.55, 0, 40); noise(0.15, 0.3, 3000, 'highpass', 0.05); },
  siren() { tone(700, 0.3, 'sawtooth', 0.05, 0, 1050); tone(1050, 0.3, 'sawtooth', 0.05, 0.3, 700); },
  zip() { noise(0.12, 0.25, 2500, 'highpass', 0, 6000); },
  tick() { tone(1900, 0.03, 'square', 0.05); },
  splat() { noise(0.55, 0.55, 700, 'lowpass', 0, 100); tone(220, 0.45, 'sine', 0.3, 0, 50); },
  laser() { tone(1800, 0.9, 'sawtooth', 0.07, 0, 160); tone(120, 0.9, 'square', 0.08); },
  slam() { noise(0.25, 0.6, 300); tone(70, 0.25, 'sine', 0.5, 0, 35); },
  whoosh() { noise(0.6, 0.35, 400, 'bandpass', 0, 3000); },
  uhoh() { tone(520, 0.18, 'triangle', 0.16); tone(390, 0.3, 'triangle', 0.16, 0.2); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i > 3 ? 0.35 : 0.15, 'square', 0.08, i * 0.12)); },
  lose() { vib(300, 0.4, 0, 0.1); vib(240, 0.8, 0.42, 0.1); },
  thud() { tone(120, 0.15, 'sine', 0.4, 0, 50); },
  ding() { tone(1320, 0.3, 'triangle', 0.14); },
};
function setRain(on) { if (!AC || !rainGain) return; const t = AC.currentTime; rainGain.gain.cancelScheduledValues(t); rainGain.gain.setTargetAtTime(on && !muted ? 0.16 : 0, t, on ? 0.15 : 0.4); }
// tense synth loop for raids
const Music = { on: false, next: 0, step: 0, timer: null, tempo: 118 };
const BASS = [41.2, 0, 41.2, 49, 41.2, 0, 55, 58.3, 41.2, 0, 41.2, 49, 61.7, 0, 58.3, 55];
function musicStart() { if (!AC) return; Music.on = true; Music.next = AC.currentTime + 0.06; Music.step = 0; if (!Music.timer) Music.timer = setInterval(musicTick, 40); }
function musicStop() { Music.on = false; }

  if (hasNext) $('#eNext').onclick = () => { SFX.click(); $('#ovEnd').hidden = true; startIntro(P.i + 1); };
  $('#eAgain').onclick = () => { SFX.click(); $('#ovEnd').hidden = true; startIntro(P.i); };
  $('#eMap').onclick = () => { SFX.click(); $('#ovEnd').hidden = true; goMap(); };
  if (win) $('#eBoard').onclick = () => { SFX.click(); openBoard(P.i); };
}
function showInitials() {
  const a = $('#endAct'), ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let L3 = (SAVE.nm || 'AAA').toUpperCase().replace(/[^A-Z]/g, 'A').padEnd(3, 'A').slice(0, 3).split('');
  a.innerHTML = `<h2 class="toon" style="font-size:34px;color:#06d6a0">NEW HIGH SCORE!</h2><div class="pick">${[0, 1, 2].map(k => `<div class="col"><button data-up="${k}" aria-label="Next letter">▲</button><div class="let" id="let${k}">${L3[k]}</div><button data-dn="${k}" aria-label="Previous letter">▼</button></div>`).join('')}</div><button class="btn go big" id="iOk">✔ OK</button>`;
  const upd = k => { $('#let' + k).textContent = L3[k]; };
  a.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const k = +b.dataset.up; L3[k] = ABC[(ABC.indexOf(L3[k]) + 1) % 26]; upd(k); SFX.click(); });
  a.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { const k = +b.dataset.dn; L3[k] = ABC[(ABC.indexOf(L3[k]) + 25) % 26]; upd(k); SFX.click(); });
  $('#iOk').onclick = () => { addEntry(P.i, L3.join(''), P.score); SFX.win(); endButtons(true); openBoard(P.i); };
  speak('New high score! Pick your letters!');
}
/* ===================== INPUT ===================== */
function toTitleStart() { initAudio(); SFX.click(); goMap(); }
$('#bStart').onclick = toTitleStart;
$('#bMap').onclick = () => { SFX.click(); P && (P.done = true); goMap(); };
$('#bHint').onclick = () => useHint();
$('#bHelp').onclick = () => { initAudio(); SFX.click(); openHelp(); };
$('#bBoard').onclick = () => { initAudio(); SFX.click(); openBoard(boardTab); };
$('#bSay').onclick = () => speak(bubText);
$('#bMute').onclick = () => { initAudio(); muted = !muted; $('#bMute').textContent = muted ? '🔇' : '🔊'; if (master) master.gain.value = muted ? 0 : .7; if (muted) { hush(); setRain(false); } };
document.addEventListener('click', e => { const t = e.target.closest('[data-close]'); if (t) { SFX.click(); closeOv(t.dataset.close); } });
document.querySelectorAll('.ov').forEach(o => o.addEventListener('pointerdown', e => { if (e.target === o && o.id !== 'ovEnd') closeOv('#' + o.id); }));
cv.addEventListener('pointerdown', e => {
  initAudio(); const x = e.clientX, y = e.clientY;
  if (G.scene === 'map' && G.map && G.map.enter < 0) { const { pts, s } = mapNodes(); const hit = pts.findIndex(p => Math.hypot(p.x - x, p.y - y) < s * .65); const m = G.map; if (hit >= 0) { m.tx = pts[hit].x; m.ty = pts[hit].y; } else { m.tx = x; m.ty = y; } m.drag = true; hideBubble(); }
  else if (G.scene === 'intro') { if (G.st > .3) startPlay(); }
  else if (G.scene === 'play') playTap(x, y);
  else if (G.scene === 'title') toTitleStart();
});
cv.addEventListener('pointermove', e => { if (G.scene === 'map' && G.map && G.map.drag && e.buttons) { G.map.tx = e.clientX; G.map.ty = e.clientY; } });
window.addEventListener('pointerup', () => { if (G.map) G.map.drag = false; });
window.addEventListener('keydown', e => {
  G.keys[e.key] = true;
  if (e.key === 'Escape') { ['#ovHelp', '#ovBoard'].forEach(id => { if (!$(id).hidden) closeOv(id); }); }
  if (anyOverlay() || !$('#ovEnd').hidden) return;
  if ((e.key === 'Enter' || e.key === ' ') && G.scene === 'title') { e.preventDefault(); toTitleStart(); }
  else if ((e.key === 'Enter' || e.key === ' ') && G.scene === 'intro') { e.preventDefault(); startPlay(); }
  else if ((e.key === 'h' || e.key === 'H') && G.scene === 'play') useHint();
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { G.keys[e.key] = false; });
window.addEventListener('resize', resize);
/* ===================== LOOP ===================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; G.t += dt; G.st += dt;
  try {
    if (G.scene === 'map') { updMap(dt); if (bubTimer > 0) { bubTimer -= dt; if (bubTimer <= 0) hideBubble(); } }
    else if (G.scene === 'play') updPlay(dt);
    updFx(dt);
    const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.save();
    if (G.shake) c.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
    if (G.scene === 'title') drawTitle(c); else if (G.scene === 'map') drawMap(c); else if (G.scene === 'intro') drawIntro(c);
    else if (G.scene === 'play') drawPlay(c); else if (G.scene === 'win') drawWin(c); else if (G.scene === 'lose') drawLose(c);
    c.restore();
  } catch (err) { console.error(err); if (window.__game) window.__game.errors.push(String(err && err.stack || err)); }
  requestAnimationFrame(frame);
}
/* ===================== TEST HOOK ===================== */
window.__game = {
  errors: [],
  get scene() { return G.scene; }, get P() { return P; }, get G() { return G; }, save: SAVE, RAIDS,
  start() { toTitleStart(); }, raid(i) { initAudio(); $('#ovEnd').hidden = true; startIntro(i); }, skip() { if (G.scene === 'intro') startPlay(); },
  diffPt(j = 0, k = 0) { const d = P.diffs.filter(d => !d.found)[j]; return d ? toScr(k, d.x, d.y) : null; },
  missPt() { const o = P.objsL.find(o => !o.hid && P.diffs.every(d => Math.hypot(d.x - o.x, d.y - (o.by - o.s / 2)) > CELL * 1.2)); return toScr(0, o.x, o.by - o.s / 2); },
  alienPts() { return P.aliens.filter(a => a.ph === 'hop').map(a => { const p = alienPos(a); return toScr(a.room === 'L' ? 0 : 1, p.u, p.v); }); },
  killAliens() { for (const a of P.aliens.slice()) { a.ph = 'hop'; a.hp = 1; const p = alienPos(a), q = toScr(a.room === 'L' ? 0 : 1, p.u, p.v); hitAlien(a, q.x, q.y); } },
  setTime(s) { P.left = s; }, hint() { useHint(); }, nodes() { return mapNodes(); }, unlockAll() { SAVE.u = NR; },
  check(n = 40) { const out = []; for (let i = 0; i < NR; i++) { let minS = 9, kinds = {}; for (let k = 0; k < n; k++) { const g = genRooms(RAIDS[i], THEMES[RAIDS[i].th]); if (g.diffs.length !== RAIDS[i].N) throw new Error('bad count'); for (const d of g.diffs) { kinds[d.kind] = (kinds[d.kind] || 0) + 1; const o = g.R[d.iR]; minS = Math.min(minS, o.s, d.iL >= 0 ? g.L[d.iL].s : 9); } } out.push({ i, minPx: Math.round(minS * LAY.rooms[0].w), kinds }); } return out; },
};
loadSave(); resize(); setTop(); requestAnimationFrame(frame);
</script>
