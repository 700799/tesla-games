<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planet Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16133a; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #sky { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  button, a.btn { font:inherit; cursor:pointer; color:inherit; text-decoration:none; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .screen[hidden] { display:none; }

  h1 { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(46px,8vw,92px); line-height:.95; color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1 span { color:var(--accent); }
  h2 { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(28px,4vw,42px); color:var(--yellow); letter-spacing:1px;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); line-height:1.05; }
  h3 { margin:0; font-family:var(--toon); font-weight:400; font-size:26px; letter-spacing:1px; color:var(--accent);
    -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:2px 2px 0 var(--ink); line-height:1.1; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px; background:var(--accent); color:#fff;
    font-family:var(--toon); font-weight:400; font-size:24px; padding:10px 26px 6px; border-radius:999px; border:3px solid var(--ink);
    box-shadow:0 6px 0 var(--ink); letter-spacing:1px; transition:transform .05s; touch-action:manipulation; }
  .btn:active, .btn.down { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn.blue { background:var(--blue); color:var(--ink); }
  .btn.purple { background:var(--purple); }
  .btn.small { min-height:52px; font-size:19px; padding:8px 16px 4px; }
  .btn[disabled] { background:#d9d2c2; color:#8d8577; box-shadow:0 6px 0 #8d8577; border-color:#8d8577; cursor:default; }
  .btn.round { width:60px; height:60px; padding:0; font-size:26px; border-radius:50%; flex:none; }
  .btn.wide { width:100%; }

  /* ---------- title ---------- */
  #title { align-items:center; justify-content:center; overflow:auto; padding:16px; }
  .tcard { position:relative; padding:20px 30px 24px; text-align:center; max-width:min(900px,96vw); width:100%; border-radius:26px; box-shadow:6px 6px 0 var(--ink); }
  .tgrid { display:flex; align-items:center; gap:18px; justify-content:center; flex-wrap:wrap; }
  #titlePup { width:min(300px,56vw); height:min(300px,56vw); }
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:16px 0 6px; }
  .chip { border:3px solid var(--ink); border-radius:999px; padding:4px 14px 2px; font-family:var(--toon); font-size:18px; letter-spacing:1px; }
  .tcard p { font-size:19px; margin:10px auto; max-width:620px; }
  .row { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .corner { position:absolute; top:12px; right:12px; }

  /* ---------- hub ---------- */
  .bar { display:flex; align-items:center; gap:10px; padding:10px 12px; flex-wrap:wrap; position:relative; z-index:2; }
  .bar h2 { margin-right:auto; }
  #hubMain { flex:1; min-height:0; display:grid; grid-template-columns:1fr minmax(280px,340px); gap:14px; padding:0 12px 12px; overflow:auto; }
  #stops { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-content:start; position:relative; }
  .stop { position:relative; padding:10px 10px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; border-radius:20px; transition:transform .1s; }
  .stop:active { transform:scale(.97); }
  .stop canvas { width:100%; max-width:min(240px,26vh); aspect-ratio:1; }
  .stop .nm { font-family:var(--toon); font-size:30px; letter-spacing:1px; line-height:1; }
  .stop .q { font-size:15px; line-height:1.2; min-height:36px; }
  .stop .st { font-size:28px; letter-spacing:3px; color:#f4a100; -webkit-text-stroke:1.5px var(--ink); line-height:1; }
  .stop .st .off { color:#e7e0cf; }
  .stop .need { font-size:14px; background:#ffe1e7; border:2px solid var(--ink); border-radius:12px; padding:4px 8px; line-height:1.2; }
  .stop.locked { background:#cfc8b8; }
  .stop.locked canvas { filter:grayscale(.8) brightness(.8); }
  .stop.next { animation:glow 1.4s infinite; }
  @keyframes glow { 50% { box-shadow:4px 4px 0 var(--ink), 0 0 0 6px var(--yellow); } }
  .stop .badge { position:absolute; top:-12px; left:50%; transform:translateX(-50%) rotate(-3deg); background:var(--yellow); border:3px solid var(--ink);
    border-radius:999px; padding:3px 12px 0; font-family:var(--toon); font-size:16px; white-space:nowrap; }
  .stop .extra { font-size:14px; color:#6a3cc0; text-decoration:underline; padding:6px; }
  #locker { padding:12px; align-self:start; }
  #locker h3 { margin-bottom:6px; }
  .gearGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .gear { border:3px solid var(--ink); border-radius:14px; background:#fff; padding:6px 4px; text-align:center; font-size:14px; line-height:1.15; }
  .gear canvas { width:64px; height:64px; display:block; margin:0 auto 2px; }
  .gear.off { background:#e7e0cf; color:#8d8577; border-style:dashed; }
  .gear.off canvas { opacity:.25; filter:grayscale(1); }
  .gear small { display:block; font-size:12px; opacity:.75; }
  .hubHint { font-size:15px; margin:8px 2px 0; }

  /* ---------- mission ---------- */
  .topbar { display:flex; align-items:center; gap:8px; padding:8px 10px; flex-wrap:wrap; }
  .topbar .pname { font-family:var(--toon); font-size:28px; color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke;
    text-shadow:2px 2px 0 var(--ink); letter-spacing:1px; }
  #tracker { display:flex; gap:4px; flex-wrap:wrap; margin:0 auto; }
  #tracker span { border:3px solid var(--ink); border-radius:999px; background:#fff; padding:4px 10px 1px; font-family:var(--toon); font-size:16px;
    letter-spacing:1px; opacity:.6; }
  #tracker span.done { background:var(--green); opacity:1; }
  #tracker span.on { background:var(--yellow); opacity:1; transform:scale(1.08); box-shadow:2px 2px 0 var(--ink); }
  #timer { border:3px solid var(--ink); border-radius:999px; background:#fff; padding:4px 12px 1px; font-family:var(--toon); font-size:20px; min-width:84px; text-align:center; }
  #timer.low { background:#ffe1e7; }
  #timer[hidden] { display:none; }
  #stage { flex:1; min-height:0; position:relative; padding:0 10px 10px; }
  .play { height:100%; display:grid; grid-template-columns:1fr minmax(300px,390px); gap:12px; }
  .cvbox { position:relative; min-height:0; min-width:0; border:3px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:4px 4px 0 var(--ink); background:#000; }
  .cvbox canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .side { overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .side > *, #bs > * { flex-shrink:0; }
  #bs { display:flex; flex-direction:column; gap:10px; }
  .side p { margin:0; font-size:18px; line-height:1.3; }
  .msg { font-size:18px; line-height:1.3; border:3px solid var(--ink); border-radius:14px; padding:8px 12px; background:#fff; }
  .msg:empty { display:none; }
  .msg.good { background:#c7f9e5; }
  .msg.bad { background:#ffe1e7; }
  .msg.info { background:#fff3c4; }
  .nav { margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; padding-top:6px; }
  .opts { display:grid; grid-template-columns:1fr; gap:10px; }
  .opts.two { grid-template-columns:1fr 1fr; }
  .opt { min-height:60px; border:3px solid var(--ink); border-radius:16px; background:#fff; box-shadow:0 5px 0 var(--ink); font-size:18px;
    padding:8px 12px; text-align:left; display:flex; align-items:center; gap:10px; line-height:1.2; touch-action:manipulation; }
  .opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .opt.sel { background:var(--yellow); }
  .opt.right { background:#c7f9e5; }
  .opt.wrong { background:#ffd0d8; }
  .opt canvas { width:48px; height:48px; flex:none; }
  .opt[disabled] { cursor:default; }
  .slider { display:flex; flex-direction:column; gap:2px; }
  .slider label { display:flex; justify-content:space-between; font-size:17px; gap:8px; }
  .slider label b { font-family:var(--toon); font-weight:400; font-size:20px; color:var(--purple); letter-spacing:1px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:0; touch-action:pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height:16px; border-radius:10px; background:#e9e2cf; border:3px solid var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:38px; height:38px; margin-top:-14px; border-radius:50%;
    background:var(--yellow); border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  input[type=range]::-moz-range-track { height:12px; border-radius:10px; background:#e9e2cf; border:3px solid var(--ink); }
  input[type=range]::-moz-range-thumb { width:34px; height:34px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); }
  .tasks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .tasks li { border:3px solid var(--ink); border-radius:12px; padding:6px 10px; background:#fff; font-size:16px; line-height:1.25; display:flex; gap:8px; }
  .tasks li::before { content:"☐"; font-size:18px; }
  .tasks li.ok { background:#c7f9e5; }
  .tasks li.ok::before { content:"✔"; color:#078a66; }
  .tabs { display:flex; gap:8px; }
  .tabs .btn { flex:1; }
  .tabs .btn.on { background:var(--yellow); color:var(--ink); }
  .meter { height:22px; border:3px solid var(--ink); border-radius:12px; background:#e9e2cf; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--green); transition:width .1s; }
  .mlabel { font-size:16px; display:flex; justify-content:space-between; }
  .holdrow { display:flex; gap:10px; }
  .holdrow .btn { flex:1; min-height:76px; font-size:26px; }

  /* discover cards */
  .disc { height:100%; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .dhead { padding:10px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dhead p { margin:0; font-size:18px; flex:1; min-width:200px; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:6px; text-align:left; transition:transform .1s; }
  .card:active { transform:scale(.98); }
  .card canvas { width:100%; aspect-ratio:4/3; border:3px solid var(--ink); border-radius:12px; background:#111; }
  .card .ct { font-family:var(--toon); font-size:22px; letter-spacing:1px; line-height:1.05; }
  .card .cf { font-size:17px; line-height:1.3; }
  .card .tap { font-size:16px; background:var(--yellow); border:3px solid var(--ink); border-radius:999px; padding:6px 12px; text-align:center; }
  .card.shown .tap.first { display:none; }
  .card:not(.shown) .cf { display:none; }
  .card .tap.again { background:var(--blue); }
  .card:not(.shown) .tap.again { display:none; }

  /* quiz */
  .quiz { height:100%; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding-top:6px; }
  .qcard { width:min(820px,100%); padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .qcard .qn { font-size:16px; opacity:.7; }
  .qcard .qq { font-size:24px; line-height:1.25; }
  .bigstars { font-size:64px; color:#f4a100; letter-spacing:8px; -webkit-text-stroke:2px var(--ink); line-height:1; text-align:center; }
  .bigstars .off { color:#e7e0cf; }
  .award { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .award .gear { width:150px; animation:popIn .6s cubic-bezier(.3,1.6,.5,1) both; font-size:16px; }
  .award .gear canvas { width:90px; height:90px; }
  @keyframes popIn { from { transform:scale(0) rotate(-20deg); } to { transform:scale(1) rotate(0); } }

  /* overlays */
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(20,10,50,.55); z-index:20; padding:12px; }
  .overlay[hidden] { display:none; }
  .ocard { padding:18px 20px; max-width:min(760px,96vw); max-height:92vh; overflow:auto; border-radius:22px; box-shadow:6px 6px 0 var(--ink); }
  #logList h4 { font-family:var(--toon); font-weight:400; font-size:22px; margin:12px 0 4px; letter-spacing:1px; }
  #logList ul { margin:0; padding-left:22px; }
  #logList li { font-size:17px; line-height:1.3; margin:4px 0; }
  #timeup { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:15; padding:10px 14px; display:flex; gap:10px; align-items:center;
    flex-wrap:wrap; justify-content:center; max-width:94vw; background:#fff3c4; }
  #timeup[hidden] { display:none; }
  #timeup span { font-size:18px; }

  .burst { position:fixed; z-index:30; pointer-events:none; width:220px; height:150px; margin:-75px 0 0 -110px; animation:burst .9s ease-out forwards; }
  .burst svg { width:100%; height:100%; overflow:visible; }
  @keyframes burst { 0% { transform:scale(.2) rotate(-12deg); opacity:1; } 18% { transform:scale(1.15) rotate(4deg); } 30% { transform:scale(1) rotate(0); }
    75% { opacity:1; } 100% { transform:scale(1) translateY(-30px); opacity:0; } }
  #toast { position:fixed; top:78px; left:50%; transform:translate(-50%,-10px) rotate(-1deg); padding:8px 18px 6px; font-size:20px; opacity:0;
    transition:.25s; z-index:25; background:var(--yellow); max-width:92vw; text-align:center; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,0) rotate(-1deg); }

  @media (max-width:1100px) { .cards { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:900px) { #hubMain { grid-template-columns:1fr; } #stops { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:860px), (max-aspect-ratio:1/1) {
    .play { grid-template-columns:1fr; grid-template-rows:minmax(200px,46%) 1fr; }
    .topbar .pname { font-size:22px; }
    #tracker span { font-size:13px; padding:3px 7px 0; }
    #tracker span em { display:none; }
  }
  @media (max-width:520px) {
    .cards { grid-template-columns:1fr; }
    .card canvas { aspect-ratio:16/9; }
    .tcard { padding:16px 12px 18px; }
    .btn { font-size:21px; padding:10px 18px 6px; }
    .stop .nm { font-size:24px; }
    .stop .q { font-size:13px; }
    .opts.two { grid-template-columns:1fr; }
    .side p, .msg { font-size:16px; }
    h3 { font-size:22px; }
    .bar h2 { font-size:26px; width:100%; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<!-- TITLE -->
<section id="title" class="screen">
  <div class="tcard panel">
    <button class="btn alt round corner mute" aria-label="Sound on/off">🔊</button>
    <div class="tgrid">
      <canvas id="titlePup" width="300" height="300"></canvas>
      <div>
        <h1>Planet<br><span>Explorer</span></h1>
        <div class="chips">
          <span class="chip" style="background:var(--blue)">Physics</span>
          <span class="chip" style="background:var(--yellow)">Astronomy</span>
          <span class="chip" style="background:var(--green)">Chemistry</span>
        </div>
      </div>
    </div>
    <p>Fly with <b>Captain Pup</b> to Mars, Jupiter, Saturn and Europa! Learn one big science idea on each world, earn new space gear, and use it to explore further.</p>
    <div class="row">
      <button class="btn go" id="startBtn" style="font-size:32px;padding:12px 40px 8px">🚀 Blast off!</button>
      <a class="btn alt" href="../">⬅ Games</a>
    </div>
  </div>
</section>

<!-- HUB / STAR MAP -->
<section id="hub" class="screen" hidden>
  <div class="bar">
    <h2>⭐ Star Map</h2>
    <button class="btn yel small" id="logBtn">📖 Captain's Log</button>
    <button class="btn alt small" id="toTitle">⌂ Title</button>
    <button class="btn alt round mute" aria-label="Sound on/off">🔊</button>
  </div>
  <div id="hubMain">
    <div>
      <div id="stops"></div>
      <p class="hubHint panel" style="padding:8px 12px" id="hubHint"></p>
    </div>
    <div id="locker" class="panel">
      <h3>🧰 Gear Locker</h3>
      <div class="gearGrid" id="gearGrid"></div>
    </div>
  </div>
</section>

<!-- MISSION -->
<section id="mission" class="screen" hidden>
  <div class="topbar">
    <button class="btn alt round" id="exitBtn" aria-label="Back to star map">✕</button>
    <span class="pname" id="pname">Mars</span>
    <div id="tracker"></div>
    <span id="timer">0:30</span>
    <button class="btn alt round mute" aria-label="Sound on/off">🔊</button>
  </div>
  <div id="stage"></div>
</section>

<div id="timeup" class="panel" hidden></div>
<div id="toast" class="panel"></div>

<div id="logOv" class="overlay" hidden>
  <div class="ocard panel">
    <h2>📖 Captain's Log</h2>
    <div id="logList"></div>
    <div class="row"><button class="btn go" id="logClose">Close</button></div>
  </div>
</div>
<script>
'use strict';
// ================= core helpers =================
const INK = '#1d1b26', TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function rr(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
function hx(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hx(a), B = hx(b); t = clamp(t, 0, 1); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function fs(c, fill, stroke = true) { c.fillStyle = fill; c.fill(); if (stroke) c.stroke(); }
function txt(c, s, x, y, size = 20, color = '#fff', align = 'center', stroke = true) {
  c.font = `${size}px "Luckiest Guy","Comic Sans MS",system-ui,sans-serif`;
  c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (stroke) { c.strokeStyle = INK; c.lineWidth = Math.max(3, size * 0.22); c.strokeText(s, x, y); }
  c.fillStyle = color; c.fillText(s, x, y);
}
function ntxt(c, s, x, y, size = 16, color = INK, align = 'center') {
  c.font = `900 ${size}px Nunito,system-ui,sans-serif`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(s, x, y);
}

// ================= save =================
const KEY = 'planetExplorer.v1';
let save = { done: {}, gear: [], muted: false };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
if (!save.done || typeof save.done !== 'object') save.done = {};
if (!Array.isArray(save.gear)) save.gear = [];
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (_) {} }
const hasGear = g => save.gear.includes(g);

// ================= sound =================
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { actx = null; } }
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (_) {}
}
function tone(f, d, type = 'sine', v = 0.12, when = 0, slide = 0) {
  if (save.muted || !actx) return;
  try {

<script>
'use strict';
// ================= game engine =================
const PLANETS = [];   // filled by the mission scripts below
const PHASES = [
  { key: 'challenge', n: '1', name: 'Challenge', secs: 30 },
  { key: 'discover', n: '2', name: 'Discover', secs: 60 },

  { key: 'check', n: '✔', name: 'Check', secs: 0 },

let cur = null, view = 'title';

function show(id) {

// ---------- title ----------
let titleAnim = null;

// ---------- hub ----------
function isUnlocked(i) { return i === 0 || !!save.done[PLANETS[i - 1].id]; }

    const d = el(`<div class="stop panel ${open ? '' : 'locked'} ${i === nextIdx && open ? 'next' : ''}" role="button" tabindex="0" data-i="${i}">

        `<div class="need">🔒 ${!isUnlocked(i) ? 'Finish ' + PLANETS[i - 1].name + ' first' : ''}${(P.needs || []).length ? (!isUnlocked(i) ? '<br>' : '') + 'Needs: ' + P.needs.map(g => GEAR[g].emoji + ' ' + GEAR[g].name).join(', ') : ''}</div>`}
      ${P.extra ? P.extra : ''}</div>`);
    box.appendChild(d);
    const cv = d.querySelector('canvas');
    const a = anim(cv, (c, W, H, t) => { c.clearRect(0, 0, W, H); drawPlanet(c, P.id, W / 2, H / 2, W * (P.id === 'saturn' ? 0.22 : 0.36), t);
      if (!open) { txt(c, '🔒', W * 0.82, H * 0.18, W * 0.14, '#fff', 'center', false); } });

    gg.appendChild(d);

// ---------- mission ----------
function startMission(i) {

function cleanupPhase() {

  tu.hidden = false;
  $('tuKeep').onclick = () => { tu.hidden = true; cur.tLeft = 30; cur.timeUpShown = false; };

}

  $('stage').innerHTML = `<div class="play"><div class="cvbox"><canvas></canvas></div><div class="side panel">${sideHtml}</div></div>`;
  return { cv: $('stage').querySelector('canvas'), side: $('stage').querySelector('.side') };
}
const nextBtn = (label = 'Next ▶', dis = true) => `<div class="nav"><button class="btn go" data-next ${dis ? 'disabled' : ''}>${label}</button></div>`;
function wireNext(side, fn = nextPhase) { const b = side.querySelector('[data-next]'); if (b) b.onclick = () => { if (!b.disabled) fn(); }; return b; }
function enableNext(side) { const b = side.querySelector('[data-next]'); if (b && b.disabled) { b.disabled = false; b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 400 }); } }
function taskList(side, sel, tasks) {
  const ul = side.querySelector(sel); ul.innerHTML = tasks.map(t => `<li><span>${t}</span></li>`).join('');
  const done = new Set();
  return { tick(i) { if (done.has(i)) return false; done.add(i); ul.children[i].classList.add('ok'); sfx.good(); burst(['YES!', 'WOW!', 'NICE!'][done.size % 3], '#06d6a0'); return true; }, count: () => done.size, has: i => done.has(i) };
}

// ---------- discover ----------
function buildDiscover() {
  const P = cur.P, replay = !!save.done[P.id];
  $('stage').innerHTML = `<div class="disc"><div class="dhead panel"><p>🔍 <b>Discover:</b> tap each card to learn a secret about ${P.name}!</p>
    <button class="btn alt small" id="dSkip" ${replay ? '' : 'hidden'}>Skip ▶</button><button class="btn go" data-next disabled>Next ▶</button></div><div class="cards"></div></div>`;
  const box = $('stage').querySelector('.cards'), seen = new Set(), head = $('stage').querySelector('.dhead');

// ---------- knowledge check ----------
function buildCheck() {
  const P = cur.P, qs = P.quiz; let qi = 0, right = 0;
  $('stage').innerHTML = `<div class="quiz"><div class="qcard panel"></div></div>`;
  const card = $('stage').querySelector('.qcard');

    const q = qs[qi], order = shuffle(q.opts.map((o, k) => k));
    card.innerHTML = `<div class="qn">Question ${qi + 1} of ${qs.length}</div><div class="qq">${q.q}</div>
      <div class="opts ${q.opts.length > 3 ? 'two' : ''}">${order.map(k => `<button class="opt" data-k="${k}">${q.opts[k]}</button>`).join('')}</div>
      <div class="msg" id="qmsg"></div><div class="nav"></div>`;

      const k = +b.dataset.k, ok = k === q.a;

      anim(d.querySelector('canvas'), (c, W, H, t) => { c.clearRect(0, 0, W, H); drawGear(c, g, W / 2, H / 2, W * 0.42, t); });
    }

    $('toMap').onclick = () => show('hub');

function winBoss(side, html) {

// ---------- log ----------
function openLog() {

    ? `<h4>${P.name} ${'★'.repeat(save.done[P.id].stars || 0)}</h4><ul>${P.log.map(f => `<li>${f}</li>`).join('')}</ul>`

$('logBtn').onclick = openLog;
$('logClose').onclick = () => { $('logOv').hidden = true; };
$('logOv').addEventListener('click', e => { if (e.target === $('logOv')) $('logOv').hidden = true; });

// ---------- main loop ----------
let last = performance.now();
function frame(now) {

// ================= MARS =================
function marsSky(dust, sunset) {
  const dayTop = mix('#1d2a4f', '#c98a55', dust), dayBot = mix('#3a4a72', '#e9b98c', dust);
  const setTop = mix('#0e1430', '#4a2f2c', dust), setBot = mix('#1d2748', '#7a5548', dust);
  return [mix(dayTop, setTop, sunset), mix(dayBot, setBot, sunset)];
}
const ROCKS = Array.from({ length: 14 }, () => [Math.random(), rand(0.06, 0.2), rand(0.4, 1)]);

    c.fillStyle = hg; c.fillRect(0, 0, W, gy);

  // far hills
  c.fillStyle = mix('#a5512e', sky[1], 0.35 + sunset * 0.2);
  c.beginPath(); c.moveTo(0, gy); for (let x = 0; x <= W; x += W / 12) c.lineTo(x, gy - H * (0.05 + 0.04 * Math.sin(x * 0.013 + 1))); c.lineTo(W, gy); c.fill();
  // ground

  }

    c.fillStyle = `rgba(230,150,90,${0.25 + dust * 0.4})`;
    for (let i = 0; i < 40 * dust; i++) { const x = ((i * 97.3 + t * 25 * (1 + i % 3)) % W), y = (i * 53.7 + Math.sin(t + i) * 10) % gy; ell(c, x, y, 1.6, 1.6); c.fill(); }
  }

}
function drawLander(c, x, y, s) {

  c.beginPath(); c.moveTo(-s * 0.4, -s * 0.85); c.lineTo(0, -s * 1.25); c.lineTo(s * 0.4, -s * 0.85); fs(c, '#ff4d6d');

// cloud scene, depth 0..1 (0 = high, 1 = deep). depth darkens & reddens things
function jupClouds(c, W, H, t, depth = 0, scroll = 0) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix('#f6e2bd', '#7a3b22', depth)); g.addColorStop(1, mix('#c8865a', '#3b160d', depth));
  c.fillStyle = g; c.fillRect(0, 0, W, H);

    const y = ((i / 7) * H * 1.3 - scroll * H * 0.9) % (H * 1.3); const yy = y < -H * 0.15 ? y + H * 1.3 : y;
    c.fillStyle = mix(JUP_BANDS[i % 6], '#4a1d10', depth * 0.8); c.globalAlpha = 0.75;
    c.beginPath(); c.moveTo(0, yy);

}

  for (const sd of [-1, 1]) { rr(c, sd * s * 0.4 - s * 0.16, -s * 0.1, s * 0.32, s * 0.6, s * 0.12); fs(c, o.boost ? '#ff4d6d' : '#b9c2d6'); }

function saturnTop(c, W, H, t, o = {}) {
  c.fillStyle = '#100d2a'; c.fillRect(0, 0, W, H);

// orbit sim (dimensionless): GM = 1, units of radius. Circular speed at r: sqrt(1/r)
function orbStep(o, dt, GM = 1) {

        // thermometer
        const tx = W * 0.92, th = H * 0.6, ty = H * 0.18; c.strokeStyle = INK; c.lineWidth = 3;
        rr(c, tx - 10, ty, 20, th, 10); fs(c, '#fff'); ell(c, tx, ty + th + 8, 16, 16); fs(c, '#ff4d6d');
        c.fillStyle = '#ff4d6d'; c.fillRect(tx - 5, ty + th * (1 - S.ocean * 0.95), 10, th * S.ocean * 0.95 + 5);
        txt(c, S.ocean < 0.06 ? 'FROZEN!' : 'OCEAN ' + Math.round(S.ocean / 0.85 * 100) + '%', cx, H * 0.08, H * 0.065, S.ocean < 0.06 ? '#4cc9f0' : '#ffd23f');
      } else {
        oceanBg(c, W, H, t);
        const bx = W * 0.5, by = H * 0.55, bw = Math.min(W * 0.4, H * 0.5), bh = bw * 1.1;
        c.strokeStyle = INK; c.lineWidth = 4; c.fillStyle = 'rgba(255,255,255,.2)';
        c.beginPath(); c.moveTo(bx - bw / 2, by - bh / 2); c.lineTo(bx - bw / 2, by + bh / 2 - 12); c.quadraticCurveTo(bx - bw / 2, by + bh / 2, bx - bw / 2 + 12, by + bh / 2);
        c.lineTo(bx + bw / 2 - 12, by + bh / 2); c.quadraticCurveTo(bx + bw / 2, by + bh / 2, bx + bw / 2, by + bh / 2 - 12); c.lineTo(bx + bw / 2, by - bh / 2); c.fill(); c.stroke();
        const items = [...S.beaker], em = { water: '💧', chem: '🧪', energy: '⚡', candy: '🍬', gold: '🪙', music: '🎵' };
        c.font = `${bw * 0.18}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle';
        const mixing = S.mixT > 0 ? t - S.mixT : -1;
        items.forEach((k, i) => { const a = i / Math.max(1, items.length) * TAU + (mixing > 0 ? mixing * 6 : 0);
          c.fillText(em[k], bx + Math.cos(a) * bw * 0.22, by + bh * 0.15 + Math.sin(a) * bh * 0.15); });
        if (mixing > 0.6 && S.ok) { txt(c, '✨ COULD BE ✨', bx, by - bh * 0.62, H * 0.07, '#06d6a0'); txt(c, 'LIFE-FRIENDLY!', bx, by - bh * 0.48, H * 0.06, '#06d6a0'); }
        drawSub(c, W * 0.15, H * 0.2, H * 0.08, t);
      }
    });
  },

  boss() {
    const { cv, side } = playLayout(`<h3>4 · Boss: Ocean Explorer</h3><div id="bs"></div>`);
    const bs = side.querySelector('#bs');
    const S = cur.S = { stage: 'nav', y: 0, vy: 0, hold: false, drill: 0, heat: 0, sx: 0.3, sy: 0.3, tx: 0.3, ty: 0.3, face: 1, found: new Set(), msgT: 0 };
    const gearRow = ids => `<div class="row" style="margin:0;justify-content:flex-start">${ids.map(g => `<span class="chip" style="background:#fff;font-size:15px">${GEAR[g].emoji} ${GEAR[g].name} ✔</span>`).join('')}</div>`;
    function stageNav() {
      bs.innerHTML = `<p><b>Step 1: Get into orbit.</b> Europa zooms around Jupiter fast! Use your <b>Orbit Navigator</b> to match Europa's speed.</p>${gearRow(['nav'])}
        <button class="btn blue wide" id="navB">🧭 Match orbit speed</button><div class="msg" id="bm"></div>`;
      $('navB').onclick = () => { $('navB').disabled = true; S.stage = 'navAnim'; S.navT = performance.now() / 1000; sfx.whoosh();
        setMsg($('bm'), 'good', 'Orbit matched! Just like on Saturn: the right sideways speed lets you "fall around" Europa.'); setTimeout(stageLand, 1700); };
    }
    function stageLand() {
      S.stage = 'land'; S.y = 0.05; S.vy = 0.02;
      bs.innerHTML = `<p><b>Step 2: Land softly!</b> Hold <b>BRAKE</b> to fire your Gravity Boosters. Touch down slower than the green line.</p>${gearRow(['boost'])}
        <div class="holdrow"><button class="btn go" id="brk">🚀 BRAKE</button></div>
        <div class="mlabel"><span>Falling speed</span><span id="vT"></span></div><div class="meter"><i id="vB"></i></div>
        <div class="msg info" id="bm">Europa's gravity is weak (about 1/7 of Earth's), so it falls gently — but there's no air to slow you down!</div>`;
      holdBtn($('brk'), v => S.hold = v);
    }
    function stageDrill() {
      S.stage = 'drill'; S.drill = 0; S.heat = 0;
      bs.innerHTML = `<p><b>Step 3: Melt through the ice!</b> Hold <b>MELT</b> to run the heat-drill. Let go if it gets too hot, so it can cool down.</p>${gearRow(['suit'])}
        <div class="holdrow"><button class="btn go" id="dr">🔥 MELT</button></div>
        <div class="mlabel"><span>Depth through ice</span><span id="dT">0%</span></div><div class="meter"><i id="dB" style="background:var(--blue)"></i></div>
        <div class="mlabel"><span>Drill heat</span><span id="hT">cool</span></div><div class="meter"><i id="hB" style="background:var(--accent)"></i></div>
        <div class="msg info" id="bm">Pup's <b>Pressure Suit</b> keeps him safe — Europa has almost no air. (This is a game super-drill. Real ice this thick would take a very long time!)</div>`;
      holdBtn($('dr'), v => S.hold = v);
    }
    function stageSub() {
      S.stage = 'sub'; S.sx = 0.5; S.sy = 0.12; S.tx = 0.5; S.ty = 0.3;
      bs.innerHTML = `<p><b>Step 4: Pilot the sub-probe!</b> <b>Tap or drag</b> in the ocean to steer (or use arrow keys). Test samples for the 3 ingredients of life.</p>
        <ul class="tasks" id="lt"></ul><div class="msg info" id="bm">You made it into the ocean! 💧</div>`;
      S.lt = taskList(bs, '#lt', ['💧 Liquid water', '🧪 Salty chemicals (near the rocky seafloor)', '⚡ Energy (a warm vent on the seafloor)']);
      setTimeout(() => { if (S.stage === 'sub') { S.lt.tick(0); S.found.add(0); setMsg($('bm'), 'good', '💧 Water test: <b>liquid salt water — check!</b> Now find chemicals and energy.'); } }, 900);
    }
    const SPOTS = [null, { x: 0.18, y: 0.82, i: 1 }, { x: 0.8, y: 0.82, i: 2 }];
    pointer(cv, { down: (x, y) => { S.tx = x / cv.clientWidth; S.ty = y / cv.clientHeight; }, move: (x, y, d) => { if (d) { S.tx = x / cv.clientWidth; S.ty = y / cv.clientHeight; } } });
    cur.tick = (dt, t) => {
      if (S.stage === 'land') {
        const brake = S.hold || keys[' '] || keys.ArrowUp;
        S.vy += dt * (brake ? -0.22 : 0.11); S.vy = Math.max(-0.05, S.vy); S.y += S.vy * dt;
        S.y = Math.max(0, S.y);
        const v = Math.round(S.vy * 100);
        $('vB').style.width = clamp(S.vy / 0.4, 0, 1) * 100 + '%'; $('vB').style.background = S.vy > 0.12 ? 'var(--accent)' : 'var(--green)';
        $('vT').textContent = (S.vy > 0.12 ? 'too fast! ' : 'gentle ') + Math.max(0, v);
        if (S.y >= 0.62) {
          if (S.vy > 0.12) { sfx.bad(); burst('BUMP!', '#ff9f1c'); setMsg($('bm'), 'bad', 'Too fast! The autopilot pulled up. Use your Gravity Boosters to slow down earlier.'); S.y = 0.1; S.vy = 0.03; }
          else { S.stage = 'landed'; S.y = 0.62; sfx.good(); burst('LANDED!', '#06d6a0'); setTimeout(stageDrill, 1300); }
        }
      } else if (S.stage === 'drill') {
        const on = (S.hold || keys[' '] || keys.ArrowDown) && S.heat < 1;
        if (on) { S.drill = Math.min(1, S.drill + dt / 9); S.heat = Math.min(1, S.heat + dt * 0.32); if (Math.random() < 0.3) sfx.drill(); }
        else S.heat = Math.max(0, S.heat - dt * (S.heat >= 1 ? 0.35 : 0.5));
        if (S.heat >= 1 && !S.over) { S.over = 1; sfx.bad(); setMsg($('bm'), 'bad', 'Overheated! Let it cool a moment, then keep melting.'); }
        if (S.heat < 0.4) S.over = 0;
        $('dB').style.width = S.drill * 100 + '%'; $('dT').textContent = Math.round(S.drill * 100) + '%';
        $('hB').style.width = S.heat * 100 + '%'; $('hT').textContent = S.heat > 0.8 ? 'HOT!' : S.heat > 0.45 ? 'warm' : 'cool';
        if (S.drill >= 1) { S.stage = 'splash'; sfx.whoosh(); burst('SPLASH!', '#4cc9f0'); setTimeout(stageSub, 1000); }
      } else if (S.stage === 'sub') {
        let kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
        if (kx || ky) { S.tx = clamp(S.sx + kx * 0.2, 0.05, 0.95); S.ty = clamp(S.sy + ky * 0.2, 0.15, 0.9); }
        const dx = S.tx - S.sx, dy = S.ty - S.sy, d = Math.hypot(dx, dy), sp = 0.35 * dt;
        if (d > 0.01) { S.sx += dx / d * Math.min(sp, d); S.sy += dy / d * Math.min(sp, d); if (Math.abs(dx) > 0.01) S.face = Math.sign(dx); }
        S.sy = clamp(S.sy, 0.15, 0.88);
        for (const sp2 of SPOTS) if (sp2 && !S.found.has(sp2.i) && Math.hypot(S.sx - sp2.x, (S.sy - sp2.y) * 0.8) < 0.12) {
          S.found.add(sp2.i); S.lt.tick(sp2.i);
          setMsg($('bm'), 'good', sp2.i === 1 ? '🧪 Chemical test: <b>salts and minerals from the rocky seafloor — check!</b>' : '⚡ Energy test: <b>warm water from a seafloor vent — check!</b> (Scientists think Europa <i>might</i> have vents like this.)');
        }
        if (S.found.size >= 3 && S.stage === 'sub') {
          S.stage = 'won';
          setTimeout(() => winBoss(side, 'Water ✔ Chemicals ✔ Energy ✔ — Europa\'s ocean <b>might</b> have everything life needs!<br><br><b style="font-size:22px">Could life exist there? Scientists are still exploring! 🔭</b>'), 900);
        }
      }
    };
    anim(cv, (c, W, H, t) => {
      if (S.stage === 'nav' || S.stage === 'navAnim') {
        c.fillStyle = '#100d2a'; c.fillRect(0, 0, W, H);
        for (let i = 0; i < 40; i++) { c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, (i * 131.7) % W, (i * 71.3) % H, 1.1, 1.1); c.fill(); }
        drawPlanet(c, 'jupiter', W * 0.12, H * 0.5, H * 0.35, t);
        const ex = W * 0.6, ey = H * 0.5, er = Math.min(W, H) * 0.2; drawPlanet(c, 'europa', ex, ey, er, t);
        const k = S.stage === 'navAnim' ? clamp((t - S.navT) / 1.2, 0, 1) : 0;
        const a = t * (k ? 1.4 : 3), rad = lerp(er * 2.2, er * 1.4, k);
        c.strokeStyle = k ? 'rgba(6,214,160,.8)' : 'rgba(255,255,255,.25)'; c.setLineDash([8, 6]); c.lineWidth = 2; ell(c, ex, ey, rad, rad * 0.8); c.stroke(); c.setLineDash([]);
        if (!k) drawShip(c, W * 0.9 - (t * 40 % 30), H * 0.2, H * 0.06, Math.PI * 0.8, t, 0.5);
        else drawShip(c, ex + Math.cos(a) * rad, ey + Math.sin(a) * rad * 0.8, H * 0.06, a + Math.PI / 2, t);
        drawGear(c, 'nav', W * 0.88, H * 0.82, H * 0.1, t);
        return;
      }
      if (S.stage === 'land' || S.stage === 'landed') {
        const gy = H * 0.78; europaSurface(c, W, H, t, gy);
        const by = lerp(H * 0.1, gy - H * 0.06, S.y / 0.62);
        const brake = S.stage === 'land' && (S.hold || keys[' '] || keys.ArrowUp);
        c.save(); c.translate(W * 0.45, by); c.strokeStyle = INK; c.lineWidth = 3;
        if (brake) for (const sd of [-1, 1]) { const f = H * 0.06 * (1 + 0.3 * Math.sin(t * 40)); c.beginPath(); c.moveTo(sd * H * 0.06 - 8, H * 0.04); c.lineTo(sd * H * 0.06, H * 0.04 + f); c.lineTo(sd * H * 0.06 + 8, H * 0.04); fs(c, '#ffd23f'); }
        c.restore();
        drawLander(c, W * 0.45, by + H * 0.06, H * 0.16);
        drawGear(c, 'boost', W * 0.88, H * 0.18, H * 0.08, brake ? t : 0);
        c.strokeStyle = '#06d6a0'; c.setLineDash([8, 6]); c.lineWidth = 2; c.beginPath(); c.moveTo(0, gy - 2); c.lineTo(W, gy - 2); c.stroke(); c.setLineDash([]);
        if (S.stage === 'landed') txt(c, 'TOUCHDOWN!', W / 2, H * 0.12, H * 0.08, '#06d6a0');
        return;
      }
      if (S.stage === 'drill' || S.stage === 'splash') {
        const gy = H * 0.3; europaSurface(c, W, H, t, gy);
        c.fillStyle = '#d6e6ee'; c.fillRect(0, gy + 4, W, H * 0.55);
        c.strokeStyle = 'rgba(120,160,190,.5)'; c.lineWidth = 2; for (let i = 1; i < 6; i++) { c.beginPath(); c.moveTo(0, gy + i * H * 0.09); c.lineTo(W, gy + i * H * 0.09 + 6); c.stroke(); }
        oceanBg(c, W, H, t, gy + H * 0.55);
        c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(0, gy + H * 0.55); c.lineTo(W, gy + H * 0.55); c.stroke();
        const dep = gy + S.drill * H * 0.55;
        c.fillStyle = '#9ec9e0'; rr(c, W * 0.5 - 14, gy, 28, dep - gy + 2, 6); c.fill(); c.stroke();
        c.save(); c.translate(W * 0.5, dep); c.strokeStyle = INK; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-14, -26); c.lineTo(14, -26); c.lineTo(14, 0); c.lineTo(0, 14); c.lineTo(-14, 0); c.closePath(); fs(c, mix('#b9c2d6', '#ff4d6d', S.heat));
        if (S.heat > 0.2) { c.fillStyle = `rgba(255,140,60,${S.heat * 0.6})`; ell(c, 0, 6, 26, 18); c.fill(); }
        c.restore();
        drawPup(c, W * 0.3, gy - H * 0.13, H * 0.075, { t, mood: S.heat >= 1 ? 'oops' : '' });
        txt(c, S.stage === 'splash' ? 'SPLASH!' : 'ICE SHELL', W * 0.85, gy + H * 0.25, H * 0.06, S.stage === 'splash' ? '#4cc9f0' : '#fff');
        txt(c, 'OCEAN', W * 0.85, gy + H * 0.62, H * 0.06, '#4cc9f0');
        return;
      }
      // ocean
      oceanBg(c, W, H, t, 0);
      c.fillStyle = '#d6e6ee'; c.fillRect(0, 0, W, H * 0.08); c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(0, H * 0.08); c.lineTo(W, H * 0.08); c.stroke();
      c.fillStyle = '#4a3b3f'; c.beginPath(); c.moveTo(0, H); for (let x = 0; x <= W; x += W / 10) c.lineTo(x, H * (0.9 + 0.04 * Math.sin(x * 0.02))); c.lineTo(W, H); c.fill(); c.stroke();
      // chemical rocks & vent
      const r1 = SPOTS[1], r2 = SPOTS[2];
      for (let i = 0; i < 4; i++) { c.strokeStyle = INK; c.lineWidth = 2.5; ell(c, r1.x * W + (i - 1.5) * 22, r1.y * H + 26 + (i % 2) * 6, 18, 12); fs(c, ['#9b5de5', '#06d6a0', '#ffd23f', '#ff9f1c'][i]); }
      drawVent(c, r2.x * W, H * 0.93, H * 0.12, t);
      for (const sp of SPOTS) if (sp && !S.found.has(sp.i)) { const pr = 18 + Math.sin(t * 4) * 5; c.strokeStyle = '#ffd23f'; c.lineWidth = 3; c.setLineDash([6, 5]); ell(c, sp.x * W, sp.y * H, pr * 2, pr * 1.5); c.stroke(); c.setLineDash([]); txt(c, '?', sp.x * W, sp.y * H - pr * 2.2, 26, '#ffd23f'); }
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.setLineDash([4, 6]); c.beginPath(); c.moveTo(S.sx * W, S.sy * H); c.lineTo(S.tx * W, S.ty * H); c.stroke(); c.setLineDash([]);
      drawSub(c, S.sx * W, S.sy * H, Math.min(W, H) * 0.07, t, S.face);
      if (S.stage === 'won') { txt(c, 'COULD LIFE EXIST?', W / 2, H * 0.22, H * 0.07, '#ffd23f'); txt(c, 'Scientists are still exploring!', W / 2, H * 0.32, H * 0.05, '#fff'); }
    });
    stageNav();
  },
});

// ================= boot =================
updMute();
const hasDone = Object.keys(save.done).length > 0;
show('title');
requestAnimationFrame(frame);
window.__game = {
  get save() { return save; }, get cur() { return cur; }, PLANETS,
  start: i => startMission(i), phase: i => goPhase(i), next: () => nextPhase(), hub: () => show('hub'),
  winBoss: () => { winBoss($('stage').querySelector('.side'), 'Test win.'); },
  unlockAll() { for (const P of PLANETS) save.done[P.id] = save.done[P.id] || { stars: 1 }; save.gear = GEAR_ORDER.slice(); persist(); },
  reset() { save = { done: {}, gear: [], muted: save.muted }; persist(); },
};
</script>
