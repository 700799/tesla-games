<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planet Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#9b5de5; --orange:#ff9f1c; --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16133a; color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #sky { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  button, a.btn { font:inherit; cursor:pointer; color:inherit; text-decoration:none; }
  .panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .screen[hidden] { display:none; }

  h1 { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(46px,8vw,92px); line-height:.95; color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
  h1 span { color:var(--accent); }
  h2 { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(28px,4vw,42px); color:var(--yellow); letter-spacing:1px;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); line-height:1.05; }
  h3 { margin:0; font-family:var(--toon); font-weight:400; font-size:26px; letter-spacing:1px; color:var(--accent);
    -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; text-shadow:2px 2px 0 var(--ink); line-height:1.1; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:60px; background:var(--accent); color:#fff;
    font-family:var(--toon); font-weight:400; font-size:24px; padding:10px 26px 6px; border-radius:999px; border:3px solid var(--ink);
    box-shadow:0 6px 0 var(--ink); letter-spacing:1px; transition:transform .05s; touch-action:manipulation; }
  .btn:active, .btn.down { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  .btn.go { background:var(--green); color:var(--ink); }
  .btn.yel { background:var(--yellow); color:var(--ink); }
  .btn.blue { background:var(--blue); color:var(--ink); }
  .btn.fire { background:var(--orange); color:#fff; -webkit-text-stroke:1px var(--ink); }
  .btn.small { min-height:52px; font-size:19px; padding:8px 16px 4px; }
  .btn[disabled] { background:#d9d2c2; color:#8d8577; box-shadow:0 6px 0 #8d8577; border-color:#8d8577; cursor:default; -webkit-text-stroke:0; }
  .btn.round { width:60px; height:60px; padding:0; font-size:26px; border-radius:50%; flex:none; }
  .btn.wide { width:100%; }
  .btn.pulse:not([disabled]) { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.07); } }

  /* coach: Captain Pup speech bubble */
  .coach { display:flex; align-items:flex-start; gap:6px; flex-shrink:0; }
  .coach .phead { width:64px; height:64px; flex:none; }
  .bub { position:relative; flex:1; background:#fff; border:3px solid var(--ink); border-radius:18px; padding:8px 12px; font-size:20px;
    line-height:1.25; box-shadow:3px 3px 0 var(--ink); min-height:56px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
  .bub::before { content:""; position:absolute; left:-13px; top:18px; border:10px solid transparent; border-right-color:var(--ink); border-left:0; }
  .bub.good { background:#c7f9e5; } .bub.bad { background:#ffe1e7; } .bub.info { background:#fff3c4; }
  .bub.wig { animation:wig .45s; }
  @keyframes wig { 20% { transform:translateX(-8px) rotate(-1deg); } 40% { transform:translateX(8px) rotate(1deg); } 60% { transform:translateX(-5px); } 80% { transform:translateX(4px); } }
  .say { flex:1 1 180px; }
  .bubBtns { display:flex; gap:6px; }
  .spk, .moreB { border:3px solid var(--ink); border-radius:999px; background:var(--yellow); min-width:48px; min-height:48px; font-size:20px;
    box-shadow:0 3px 0 var(--ink); padding:0 10px; touch-action:manipulation; }
  .moreB { background:#fff; font-size:16px; }
  .spk:active, .moreB:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  body.nospeech .spk { display:none; }
  .more { flex-basis:100%; font-size:16px; line-height:1.35; background:#f6f1e3; border-radius:12px; padding:8px 10px; font-weight:700; }

  /* picture tiles */
  .tiles { display:grid; grid-template-columns:repeat(var(--cols,3),1fr); gap:10px; flex-shrink:0; }
  .tile { border:3px solid var(--ink); border-radius:18px; background:#fff; box-shadow:0 5px 0 var(--ink); padding:8px 4px 6px; min-height:96px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; touch-action:manipulation; }
  .tile .ti { font-size:40px; line-height:1.1; display:flex; align-items:center; justify-content:center; min-height:46px; }
  .tile .tl { font-size:17px; line-height:1.1; text-align:center; }
  .tile .sw { display:inline-block; width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); }
  .tile:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  .tile.sel { background:var(--yellow); transform:scale(1.04); }
  .tile.right { background:#c7f9e5; animation:boing .5s; }
  .tile.wrong { background:#ffe1e7; animation:wig .45s; }
  .tile[disabled] { cursor:default; }
  @keyframes boing { 30% { transform:scale(1.15) rotate(-3deg); } 60% { transform:scale(.95); } }

  /* demo hand */
  .hand { position:fixed; z-index:40; font-size:54px; pointer-events:none; margin:-6px 0 0 -18px; filter:drop-shadow(3px 3px 0 var(--ink)); }
  .hand.tap { animation:hTap 1s infinite; }
  .hand.hold { animation:hHold 1.6s infinite; }
  .hand.drag { animation:hDrag 2.2s infinite; }
  .hand.slide { animation:hSlide 1.8s infinite; }
  @keyframes hTap { 0%,100% { transform:translate(0,22px); } 50% { transform:translate(0,0) scale(.88); } }
  @keyframes hHold { 0% { transform:translate(0,24px); } 25%,85% { transform:translate(0,0) scale(.85); } 100% { transform:translate(0,24px); } }
  @keyframes hDrag { 0%,100% { transform:translate(0,0); } 25% { transform:translate(70px,-30px); } 50% { transform:translate(20px,-70px); } 75% { transform:translate(-60px,-20px); } }
  @keyframes hSlide { 0%,100% { transform:translate(-60px,0); } 50% { transform:translate(60px,0); } }

  /* ---------- title ---------- */
  #title { align-items:center; justify-content:center; overflow:auto; padding:70px 16px 16px; gap:4px; }
  #title h1 { font-size:clamp(56px,10vw,120px); text-align:center; }
  #title #titlePup { width:min(320px,42vh,70vw); height:min(320px,42vh,70vw); }
  #startBtn { font-size:clamp(30px,4vw,44px); padding:14px 44px 10px; min-height:84px; }
  .tcorner { position:absolute; top:12px; }
  .helpGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .helpGrid div { border:3px solid var(--ink); border-radius:18px; background:#fff; text-align:center; padding:10px 6px; font-size:18px; box-shadow:0 4px 0 var(--ink); }
  .helpGrid b { display:block; font-size:46px; line-height:1.2; font-weight:400; }
  .tcard { position:relative; padding:20px 30px 24px; text-align:center; max-width:min(900px,96vw); width:100%; border-radius:26px; box-shadow:6px 6px 0 var(--ink); }
  .tgrid { display:flex; align-items:center; gap:18px; justify-content:center; flex-wrap:wrap; }
  #titlePup { width:min(300px,56vw); height:min(300px,56vw); }
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:16px 0 6px; }
  .chip { border:3px solid var(--ink); border-radius:999px; padding:4px 14px 2px; font-family:var(--toon); font-size:18px; letter-spacing:1px; }
  .row { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .corner { position:absolute; top:12px; right:12px; }
  .tcard .coach { max-width:620px; margin:12px auto 0; text-align:left; }

  /* ---------- hub: flyable solar system ---------- */
  #hubCv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .hubTop { position:absolute; top:10px; left:10px; right:10px; display:flex; align-items:flex-start; gap:8px; pointer-events:none; }
  .hubTop > * { pointer-events:auto; }
  .hubTop h2 { margin-right:auto; pointer-events:none; }
  #hubScore { white-space:nowrap; font-family:var(--toon); font-size:24px; padding:6px 14px 2px; background:#fff; }
  #hubCoach { position:absolute; left:10px; top:84px; width:min(440px,calc(100vw - 20px)); pointer-events:auto; }
  #gearBar { position:absolute; left:10px; bottom:12px; display:flex; gap:6px; padding:6px; align-items:center; }
  #gearBar canvas { width:48px; height:48px; border:2px dashed #b8af9c; border-radius:10px; background:#efe8d6; }
  #gearBar canvas.on { border:2px solid var(--ink); background:#fff; }
  #gearBar b { font-size:26px; padding:0 4px; }
  #hubFire { position:absolute; right:16px; bottom:16px; width:110px; height:110px; border-radius:50%; font-size:28px; padding:0; flex-direction:column; gap:0; }
  #hubFire span { font-size:16px; }

  /* ---------- mission ---------- */
  .topbar { display:flex; align-items:center; gap:8px; padding:8px 10px; flex-wrap:wrap; }
  .topbar .pname { font-family:var(--toon); font-size:28px; color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke;
    text-shadow:2px 2px 0 var(--ink); letter-spacing:1px; }
  #tracker { display:flex; gap:4px; flex-wrap:wrap; margin:0 auto; }
  #tracker span { border:3px solid var(--ink); border-radius:999px; background:#fff; padding:4px 10px 1px; font-family:var(--toon); font-size:16px;
    letter-spacing:1px; opacity:.6; }
  #tracker span.done { background:var(--green); opacity:1; }
  #tracker span.on { background:var(--yellow); opacity:1; transform:scale(1.08); box-shadow:2px 2px 0 var(--ink); }
  #timer { border:3px solid var(--ink); border-radius:999px; background:#fff; padding:4px 12px 1px; font-family:var(--toon); font-size:20px; min-width:84px; text-align:center; }
  #timer.low { background:#ffe1e7; }
  #timer[hidden] { display:none; }
  #stage { flex:1; min-height:0; position:relative; padding:0 10px 10px; }
  .play { height:100%; display:grid; grid-template-columns:1fr minmax(300px,400px); gap:12px; }
  .cvbox { position:relative; min-height:0; min-width:0; border:3px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:4px 4px 0 var(--ink); background:#000; }
  .cvbox canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .side { overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .side > * { flex-shrink:0; }
  .nav { margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; padding-top:6px; }
  .slider { display:flex; flex-direction:column; gap:0; }
  .slider label { display:flex; justify-content:space-between; font-size:20px; gap:8px; align-items:center; }
  .slider label b { font-family:var(--toon); font-weight:400; font-size:22px; color:var(--purple); letter-spacing:1px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:48px; background:transparent; margin:0; touch-action:pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height:18px; border-radius:10px; background:#e9e2cf; border:3px solid var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:42px; height:42px; margin-top:-15px; border-radius:50%;
    background:var(--yellow); border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  input[type=range]::-moz-range-track { height:12px; border-radius:10px; background:#e9e2cf; border:3px solid var(--ink); }
  input[type=range]::-moz-range-thumb { width:36px; height:36px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); }
  .tasks { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
  .tasks li { border:3px solid var(--ink); border-radius:14px; padding:6px 10px; background:#fff; font-size:17px; line-height:1.2; display:flex; gap:6px; align-items:center; }
  .tasks li::before { content:"⬜"; font-size:16px; }
  .tasks li.ok { background:#c7f9e5; animation:boing .5s; }
  .tasks li.ok::before { content:"✅"; }
  .tabs { display:flex; gap:8px; }
  .tabs .btn { flex:1; }
  .tabs .btn.on { background:var(--yellow); color:var(--ink); }
  .meter { height:24px; border:3px solid var(--ink); border-radius:12px; background:#e9e2cf; overflow:hidden; flex:1; }
  .meter i { display:block; height:100%; width:0; background:var(--green); transition:width .1s; }
  .mrow { display:flex; align-items:center; gap:8px; font-size:24px; }
  .mrow span { min-width:34px; text-align:center; }
  .mrow em { font-style:normal; font-family:var(--toon); font-size:20px; min-width:56px; text-align:right; }
  .pad { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pad .btn { min-height:78px; font-size:28px; }
  .pad .btn.fire { grid-column:1 / -1; min-height:84px; font-size:30px; }
  .pad.three { grid-template-columns:1fr 1fr 1fr; }
  .pad.three .btn.fire { grid-column:auto; }

  /* discover cards */
  .disc { height:100%; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .dhead { padding:8px 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .dhead .coach { flex:1; min-width:240px; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { padding:10px; display:flex; flex-direction:column; gap:6px; text-align:left; }
  .card canvas { width:100%; aspect-ratio:4/3; border:3px solid var(--ink); border-radius:12px; background:#111; cursor:pointer; }
  .card .ct { font-family:var(--toon); font-size:22px; letter-spacing:1px; line-height:1.05; }
  .card .bub { font-size:18px; min-height:0; }
  .card .bub::before { display:none; }
  .card:not(.shown) .bub { display:none; }

  /* blaster quiz */
  .blast { height:100%; display:grid; grid-template-rows:auto 1fr auto; gap:10px; }
  .qline { padding:6px 10px; display:flex; align-items:center; gap:10px; }
  .qline .qn { font-family:var(--toon); font-size:22px; background:var(--purple); color:#fff; border:3px solid var(--ink); border-radius:999px; padding:4px 12px 0; flex:none; }
  .qline .say { font-size:24px; line-height:1.15; }
  .qline .combo { font-family:var(--toon); font-size:22px; color:var(--orange); -webkit-text-stroke:1px var(--ink); flex:none; }
  .qfoot { padding:8px 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .qfoot .coach { flex:1; min-width:260px; }
  .qfoot[hidden] { display:none; }
  .result { height:100%; overflow:auto; display:flex; justify-content:center; align-items:flex-start; }
  .rcard { width:min(760px,100%); padding:16px 20px; display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }
  .bigstars { font-size:72px; color:#f4a100; letter-spacing:8px; -webkit-text-stroke:2px var(--ink); line-height:1; }
  .bigstars .off { color:#e7e0cf; }
  .bigstars span { display:inline-block; animation:popIn .6s cubic-bezier(.3,1.6,.5,1) both; }
  .award { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .award .gear { width:150px; animation:popIn .6s cubic-bezier(.3,1.6,.5,1) both; font-size:17px; }
  .award .gear canvas { width:96px; height:96px; }
  @keyframes popIn { from { transform:scale(0) rotate(-20deg); } to { transform:scale(1) rotate(0); } }
  .gearGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
  .gear { border:3px solid var(--ink); border-radius:14px; background:#fff; padding:6px 4px; text-align:center; font-size:16px; line-height:1.15; }
  .gear canvas { width:76px; height:76px; display:block; margin:0 auto 2px; }
  .gear.off { background:#e7e0cf; color:#8d8577; border-style:dashed; }
  .gear.off canvas { opacity:.25; filter:grayscale(1); }
  .gear small { display:block; font-size:13px; opacity:.75; }

  /* overlays */
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(20,10,50,.55); z-index:20; padding:12px; }
  .overlay[hidden] { display:none; }
  .ocard { padding:16px 18px; width:min(760px,96vw); max-height:92vh; overflow:auto; border-radius:22px; box-shadow:6px 6px 0 var(--ink); display:flex; flex-direction:column; gap:10px; }
  .logp { border:3px solid var(--ink); border-radius:14px; padding:8px 10px; background:#fff; }
  .logp h4 { font-family:var(--toon); font-weight:400; font-size:22px; margin:0 0 4px; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
  .logp h4 .spk { margin-left:auto; }
  .logp ul { margin:0; padding-left:4px; list-style:none; }
  .logp li { font-size:18px; line-height:1.3; margin:4px 0; }
  .logp.off { opacity:.55; background:#eee8da; }
  #timeup { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:15; padding:10px 14px; display:flex; gap:10px; align-items:center;
    flex-wrap:wrap; justify-content:center; max-width:94vw; background:#fff3c4; font-size:22px; }
  #timeup[hidden] { display:none; }

  .burst { position:fixed; z-index:30; pointer-events:none; width:220px; height:150px; margin:-75px 0 0 -110px; animation:burst .9s ease-out forwards; }
  .burst svg { width:100%; height:100%; overflow:visible; }
  @keyframes burst { 0% { transform:scale(.2) rotate(-12deg); opacity:1; } 18% { transform:scale(1.15) rotate(4deg); } 30% { transform:scale(1) rotate(0); }
    75% { opacity:1; } 100% { transform:scale(1) translateY(-30px); opacity:0; } }
  #toast { position:fixed; top:78px; left:50%; transform:translate(-50%,-10px) rotate(-1deg); padding:8px 18px 6px; font-size:24px; opacity:0;
    transition:.25s; z-index:25; background:var(--yellow); max-width:92vw; text-align:center; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,0) rotate(-1deg); }

  @media (max-width:1100px) { .cards { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:860px), (max-aspect-ratio:1/1) {
    .play { grid-template-columns:1fr; grid-template-rows:minmax(200px,44%) 1fr; }
    .topbar .pname { font-size:22px; }
    #tracker span { font-size:13px; padding:3px 7px 0; }
    #tracker span em { display:none; }
  }
  @media (max-width:520px) {
    .cards { grid-template-columns:1fr; }
    .card canvas { aspect-ratio:16/9; }
    .tcard { padding:16px 12px 18px; }
    .btn { font-size:21px; padding:10px 18px 6px; }
    .bub { font-size:18px; }
    .coach .phead { width:52px; height:52px; }
    .tile { min-height:84px; } .tile .ti { font-size:34px; } .tile .tl { font-size:15px; }
    .pad .btn { min-height:68px; font-size:24px; }
    .qline .say { font-size:19px; }
    .hubTop { gap:5px; } .hubTop .btn.round { width:48px; height:48px; min-height:48px; font-size:21px; } #hubScore { font-size:19px; padding:6px 8px 2px; }
    .topbar .btn.round { width:50px; height:50px; min-height:50px; font-size:22px; }
    .hubTop h2 { font-size:0; } .hubTop h2::before { content:'⭐'; font-size:30px; }
    #hubCoach { top:74px; }
    #hubFire { width:92px; height:92px; }
    #gearBar canvas { width:38px; height:38px; }
    h3 { font-size:22px; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<!-- TITLE -->
<section id="title" class="screen">
  <a class="btn alt small tcorner" style="left:12px" href="../">⬅ Games</a>
  <div class="tcorner" style="right:12px;display:flex;gap:8px"><button class="btn alt round help" aria-label="How to play">?</button><button class="btn alt round mute" aria-label="Sound on/off">🔊</button></div>
  <h1>Planet<br><span>Explorer</span></h1>
  <canvas id="titlePup" width="300" height="300"></canvas>
  <button class="btn go pulse" id="startBtn">▶ PRESS START</button>
</section>

<!-- HUB: flyable solar system -->
<section id="hub" class="screen" hidden>
  <canvas id="hubCv"></canvas>
  <div class="hubTop">
    <h2>⭐ Star Map</h2>
    <span id="hubScore" class="panel">☄️ 0</span>
    <button class="btn yel round" id="logBtn" aria-label="Captain's Log">📖</button>
    <button class="btn alt round help" aria-label="How to play">?</button>
    <button class="btn alt round" id="toTitle" aria-label="Title screen">⌂</button>
    <button class="btn alt round mute" aria-label="Sound on/off">🔊</button>
  </div>
  <div id="hubCoach"></div>
  <button id="gearBar" class="panel" aria-label="Gear locker"><b>🧰</b></button>

<script>
'use strict';

// ================= core helpers =================
const INK = '#1d1b26', TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function rr(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
function hx(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hx(a), B = hx(b); t = clamp(t, 0, 1); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function fs(c, fill, stroke = true) { c.fillStyle = fill; c.fill(); if (stroke) c.stroke(); }
function txt(c, s, x, y, size = 20, color = '#fff', align = 'center', stroke = true) {
  c.font = `${size}px "Luckiest Guy","Comic Sans MS",system-ui,sans-serif`;
  c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (stroke) { c.strokeStyle = INK; c.lineWidth = Math.max(3, size * 0.22); c.strokeText(s, x, y); }
  c.fillStyle = color; c.fillText(s, x, y);
}
function ntxt(c, s, x, y, size = 16, color = INK, align = 'center') {
  c.font = `900 ${size}px Nunito,system-ui,sans-serif`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(s, x, y);
}

// ================= save =================
const KEY = 'planetExplorer.v1';
let save = { done: {}, gear: [], muted: false };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
if (!save.done || typeof save.done !== 'object') save.done = {};
if (!Array.isArray(save.gear)) save.gear = [];
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (_) {} }
const hasGear = g => save.gear.includes(g);

// ================= sound =================
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { actx = null; } }
  try { if (actx && actx.state === 'suspended') actx.resume(); } catch (_) {}
}
function tone(f, d, type = 'sine', v = 0.12, when = 0, slide = 0) {
  if (save.muted || !actx) return;
  try {
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (_) {}
}
const sfx = {
  tap() { tone(660, 0.07, 'square', 0.04); },
  pop() { tone(700, 0.09, 'sine', 0.12, 0, 500); },
  good() { [523, 659, 784].forEach((f, i) => tone(f, 0.16, 'triangle', 0.13, i * 0.08)); },
  bad() { tone(240, 0.28, 'sawtooth', 0.06, 0, -110); },
  whoosh() { tone(200, 0.45, 'sine', 0.09, 0, 600); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, 'triangle', 0.14, i * 0.1)); },
  drill() { tone(110 + Math.random() * 40, 0.06, 'square', 0.025); },
  pew() { tone(1250, 0.12, 'square', 0.05, 0, -900); },
  boom(big = 1) { noise(0.35 + big * 0.25, 0.22 * big, 900); tone(90, 0.4, 'sine', 0.18 * big, 0, -50); },
  thud() { tone(130, 0.18, 'triangle', 0.16, 0, -70); noise(0.08, 0.08, 400); },
  zap() { tone(900, 0.2, 'sawtooth', 0.05, 0, 700); tone(1400, 0.15, 'square', 0.03, 0.05, -600); },
  ding() { tone(1320, 0.12, 'triangle', 0.1); tone(1760, 0.18, 'triangle', 0.08, 0.06); },
};
function noise(d, v = 0.15, lp = 1200) {
  if (save.muted || !actx) return;
  try {
    const n = Math.floor(actx.sampleRate * d), buf = actx.createBuffer(1, n, actx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v;
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
  } catch (_) {}
}
document.addEventListener('pointerdown', audio, { capture: true });
document.addEventListener('click', e => { if (e.target.closest('button,.btn,.tile')) sfx.tap(); });
function updMute() { document.querySelectorAll('.mute').forEach(b => { b.textContent = save.muted ? '🔇' : '🔊'; }); }
document.addEventListener('click', e => { if (e.target.closest('.mute')) { save.muted = !save.muted; persist(); updMute(); } });

// ================= feedback =================
function burst(text, color = '#ffd23f', x, y) {
  if (x == null) { x = innerWidth / 2; y = innerHeight * 0.42; }
  let pts = '';
  for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, r = i % 2 ? 0.72 : 1; pts += `${(Math.cos(a) * 100 * r).toFixed(1)},${(Math.sin(a) * 66 * r).toFixed(1)} `; }
  const b = el(`<div class="burst"><svg viewBox="-110 -75 220 150"><polygon points="${pts}" fill="${color}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
    <text x="0" y="12" text-anchor="middle" font-family="Luckiest Guy, Comic Sans MS, system-ui" font-size="${text.length > 6 ? 28 : 36}" fill="#fff" stroke="${INK}" stroke-width="6" paint-order="stroke" stroke-linejoin="round">${text}</text></svg></div>`);
  b.style.left = clamp(x, 110, innerWidth - 110) + 'px'; b.style.top = clamp(y, 80, innerHeight - 80) + 'px';
  document.body.appendChild(b); setTimeout(() => b.remove(), 950);
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function setMsg(node, kind, html) { if (!node) return; node.className = 'msg ' + (kind || ''); node.innerHTML = html; }

// ================= canvas registry & main loop =================
const anims = new Set();
function anim(cv, fn) { const a = { cv, fn }; anims.add(a); return a; }
function fit(cv) {
  const d = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  const pw = Math.round(w * d), ph = Math.round(h * d);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); return { c, W: w, H: h };
}
function pointer(cv, h) {
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  let down = false;
  cv.addEventListener('pointerdown', e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} h.down && h.down(...pos(e)); e.preventDefault(); });
  cv.addEventListener('pointermove', e => { h.move && h.move(...pos(e), down); });
  const up = e => { if (!down) return; down = false; h.up && h.up(...pos(e)); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}
// a "hold" button that works with touch, mouse and keyboard keys
function holdBtn(btn, onChange) {
  let on = false;
  const set = v => { if (v === on) return; on = v; btn.classList.toggle('down', v); onChange(v); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (_) {} set(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => btn.addEventListener(n, () => set(false)));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  return set;
}
const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && !e.target.closest('input')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key] = false; });

// ================= starry background =================
const STARS = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.6, 2.2), p: rand(0, TAU) }));
function drawSky(t) {
  const { c, W, H } = fit($('sky'));
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#1b1650'); g.addColorStop(0.55, '#2a1d5e'); g.addColorStop(1, '#0f2a52');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const n = c.createRadialGradient(W * 0.8, H * 0.2, 10, W * 0.8, H * 0.2, Math.max(W, H) * 0.45);
  n.addColorStop(0, 'rgba(155,93,229,.35)'); n.addColorStop(1, 'rgba(155,93,229,0)'); c.fillStyle = n; c.fillRect(0, 0, W, H);
  const m = c.createRadialGradient(W * 0.12, H * 0.85, 10, W * 0.12, H * 0.85, Math.max(W, H) * 0.4);
  m.addColorStop(0, 'rgba(76,201,240,.25)'); m.addColorStop(1, 'rgba(76,201,240,0)'); c.fillStyle = m; c.fillRect(0, 0, W, H);
  for (const s of STARS) { c.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(t * 1.3 + s.p)); c.fillStyle = '#fff'; ell(c, s.x * W, s.y * H, s.r, s.r); c.fill(); }
  c.globalAlpha = 1;
}

// ================= Captain Pup =================
// head centre at (x,y); s = head radius. Whole pup spans roughly y-1.3s .. y+2.5s
function drawPup(c, x, y, s, o = {}) {
  const t = o.t || 0, lw = Math.max(1.5, s * 0.075);
  c.save(); c.translate(x, y + (o.bob === false ? 0 : Math.sin(t * 3) * s * 0.04));
  if (o.flip) c.scale(-1, 1);
  if (o.rot) c.rotate(o.rot);
  if (o.squash) c.scale(1 + (1 - o.squash) * 0.6, o.squash);
  c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = lw;
  const suit = o.suit || '#f4f1ff', trim = o.trim || '#ff9f1c', helmet = o.helmet !== false;
  if (o.body !== false) {
    if (helmet) { c.fillStyle = '#b9c2d6'; rr(c, -s * 0.8, s * 0.75, s * 1.6, s * 1.1, s * 0.25); c.fill(); c.stroke(); }
    const step = o.walk ? Math.sin(t * 11) * s * 0.16 : 0;
    for (const sd of [-1, 1]) {
      const st = sd > 0 ? step : -step;
      c.fillStyle = suit; rr(c, sd * s * 0.36 - s * 0.25 + st * 0.5, s * 1.72, s * 0.5, s * 0.62, s * 0.18); c.fill(); c.stroke();
      c.fillStyle = helmet ? trim : '#fff'; ell(c, sd * s * 0.38 + st, s * 2.36, s * 0.32, s * 0.17); c.fill(); c.stroke();
    }
    c.fillStyle = suit; ell(c, 0, s * 1.42, s * 0.78, s * 0.62); c.fill(); c.stroke();
    if (helmet) {
      c.fillStyle = trim; rr(c, -s * 0.3, s * 1.27, s * 0.6, s * 0.36, s * 0.08); c.fill(); c.stroke();
      c.fillStyle = '#06d6a0'; ell(c, -s * 0.13, s * 1.45, s * 0.07, s * 0.07); c.fill();
      c.fillStyle = '#ff4d6d'; ell(c, s * 0.13, s * 1.45, s * 0.07, s * 0.07); c.fill();
    }
    for (const sd of [-1, 1]) {
      c.save(); c.translate(sd * s * 0.66, s * 1.18);
      let a = -sd * 0.45;
      if (sd > 0 && o.wave) a = -2.5 + Math.sin(t * 8) * 0.35;
      if (o.arms === 'up') a = sd > 0 ? -2.6 : 2.6;
      if (o.reach && sd > 0) a = -1.7;
      c.rotate(a);
      c.fillStyle = suit; rr(c, -s * 0.18, 0, s * 0.36, s * 0.72, s * 0.17); c.fill(); c.stroke();
      c.fillStyle = helmet ? trim : '#fff'; ell(c, 0, s * 0.74, s * 0.2, s * 0.18); c.fill(); c.stroke();
      c.restore();
    }
    if (helmet) { c.fillStyle = '#c9d1e3'; rr(c, -s * 0.72, s * 0.95, s * 1.44, s * 0.26, s * 0.12); c.fill(); c.stroke(); }
  }
  // floppy black ears
  c.fillStyle = '#1f1d22';
  for (const sd of [-1, 1]) { ell(c, sd * s * 0.86, s * 0.2 + Math.sin(t * 4 + sd) * s * 0.03, s * 0.3, s * 0.6, -sd * 0.35); c.fill(); c.stroke(); }
  // fluffy white head with cheek tufts
  c.fillStyle = '#fff';
  for (const sd of [-1, 1]) { ell(c, sd * s * 0.78, s * 0.36, s * 0.24, s * 0.2, sd * 0.4); c.fill(); c.stroke(); }
  ell(c, 0, 0, s * 0.95, s * 0.86); c.fill(); c.stroke();
  for (const sd of [-1, 1]) { ell(c, sd * s * 0.74, s * 0.33, s * 0.2, s * 0.17); c.fill(); }
  // black cap + eye patches, white blaze in the middle
  c.save(); ell(c, 0, 0, s * 0.95 - lw / 2, s * 0.86 - lw / 2); c.clip();
  c.fillStyle = '#1f1d22';
  ell(c, 0, -s * 0.78, s * 0.85, s * 0.34); c.fill();
  for (const sd of [-1, 1]) { ell(c, sd * s * 0.42, -s * 0.12, s * 0.33, s * 0.38, -sd * 0.35); c.fill(); }
  c.fillStyle = '#fff'; ell(c, 0, -s * 0.42, s * 0.12, s * 0.62); c.fill();
  c.restore();
  // eyes
  const blink = o.blink || ((t % 3.7) < 0.12 && o.t);
  for (const sd of [-1, 1]) {
    const ex = sd * s * 0.39, ey = -s * 0.07;
    if (blink) { c.lineWidth = lw * 0.8; c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(ex - s * 0.15, ey); c.quadraticCurveTo(ex, ey + s * 0.1, ex + s * 0.15, ey); c.stroke(); c.strokeStyle = INK; continue; }
    c.lineWidth = lw * 0.6;
    c.fillStyle = '#8a5530'; ell(c, ex, ey, s * 0.2, s * 0.21); c.fill(); c.stroke();
    c.fillStyle = '#2b1810'; ell(c, ex + s * 0.02, ey + s * 0.02, s * 0.11, s * 0.11); c.fill();
    c.fillStyle = '#fff'; ell(c, ex + s * 0.07, ey - s * 0.07, s * 0.065, s * 0.065); c.fill();
    ell(c, ex - s * 0.07, ey + s * 0.08, s * 0.03, s * 0.03); c.fill();
  }
  c.lineWidth = lw;
  // blush
  c.fillStyle = 'rgba(255,120,150,.45)'; for (const sd of [-1, 1]) { ell(c, sd * s * 0.62, s * 0.3, s * 0.12, s * 0.07); c.fill(); }
  // nose + mouth + tongue
  c.fillStyle = INK; ell(c, 0, s * 0.2, s * 0.11, s * 0.08); c.fill();
  if (o.mood === 'oops') {
    c.fillStyle = '#7a1f35'; ell(c, 0, s * 0.46, s * 0.1, s * 0.12); c.fill(); c.stroke();
    c.fillStyle = '#7fd4ff'; c.beginPath(); c.moveTo(s * 0.72, -s * 0.62); c.quadraticCurveTo(s * 0.86, -s * 0.38, s * 0.72, -s * 0.34); c.quadraticCurveTo(s * 0.58, -s * 0.38, s * 0.72, -s * 0.62); c.fill(); c.lineWidth = lw * 0.6; c.stroke(); c.lineWidth = lw;
  } else {
    c.beginPath(); c.moveTo(0, s * 0.26); c.lineTo(0, s * 0.34); c.stroke();
    c.fillStyle = '#7a1f35'; c.beginPath(); c.moveTo(-s * 0.23, s * 0.34); c.quadraticCurveTo(0, s * 0.78, s * 0.23, s * 0.34); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff8fb1'; c.lineWidth = lw * 0.6; ell(c, 0, s * 0.58, s * 0.12, s * 0.12); c.fill(); c.stroke();
    c.strokeStyle = '#e0607f'; c.lineWidth = lw * 0.35; c.beginPath(); c.moveTo(0, s * 0.5); c.lineTo(0, s * 0.64); c.stroke();
  }
  // whiskers
  c.strokeStyle = INK; c.lineWidth = Math.max(1, lw * 0.35);
  for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * s * 0.3, s * 0.24); c.lineTo(sd * s * 0.7, s * 0.14); c.moveTo(sd * s * 0.3, s * 0.3); c.lineTo(sd * s * 0.7, s * 0.34); c.stroke(); }
  c.lineWidth = lw;
  if (o.hat === 'cap') {
    c.fillStyle = '#4cc9f0'; c.beginPath(); c.arc(0, -s * 0.55, s * 0.6, Math.PI * 1.05, Math.PI * 1.95); c.closePath(); c.fill(); c.stroke();
    rr(c, s * 0.2, -s * 0.62, s * 0.75, s * 0.14, s * 0.07); c.fill(); c.stroke();
  }
  if (helmet) {
    if (o.fog) { c.fillStyle = `rgba(190,110,60,${0.6 * o.fog})`; ell(c, 0, -s * 0.02, s * 1.28, s * 1.22); c.fill(); }
    c.fillStyle = 'rgba(180,225,255,.2)'; ell(c, 0, -s * 0.02, s * 1.28, s * 1.22); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = lw * 1.3;
    c.beginPath(); c.ellipse(0, -s * 0.02, s * 1.07, s * 1.01, 0, 3.55, 4.35); c.stroke();
    c.beginPath(); c.ellipse(0, -s * 0.02, s * 1.07, s * 1.01, 0, 4.5, 4.62); c.stroke();
  }
  c.restore();
}

// ================= planets =================
const CRACKS = [[-.7, -.3, .2, .5], [-.4, -.8, .5, .1], [-.9, .3, .6, .7], [.1, -.9, .8, -.2], [-.5, .6, .4, -.4], [-.2, .2, .9, .4], [-.8, -.6, -.1, .9]];
function drawPlanet(c, id, x, y, r, t = 0, opt = {}) {
  c.save(); c.lineJoin = 'round'; const lw = Math.max(2, r * 0.05); c.lineWidth = lw; c.strokeStyle = INK;
  const ring = (front) => {
    c.save(); c.beginPath(); if (front) c.rect(x - r * 3, y, r * 6, r * 3); else c.rect(x - r * 3, y - r * 3, r * 6, r * 3); c.clip();
    c.translate(x, y); c.rotate(-0.18);
    c.beginPath(); c.ellipse(0, 0, r * 2.15, r * 0.6, 0, 0, TAU); c.ellipse(0, 0, r * 1.35, r * 0.34, 0, 0, TAU);
    c.fillStyle = '#e9cf98'; c.fill('evenodd'); c.stroke();
    c.beginPath(); c.ellipse(0, 0, r * 1.78, r * 0.48, 0, 0, TAU); c.strokeStyle = 'rgba(120,80,40,.6)'; c.lineWidth = lw * 0.9; c.stroke();
    c.beginPath(); c.ellipse(0, 0, r * 1.55, r * 0.41, 0, 0, TAU); c.strokeStyle = 'rgba(120,80,40,.3)'; c.lineWidth = lw * 1.5; c.stroke();
    c.restore();
  };
  if (id === 'saturn') ring(false);
  c.save(); ell(c, x, y, r, r); c.clip();
  if (id === 'mars') {
    c.fillStyle = '#e2703a'; c.fillRect(x - r, y - r, 2 * r, 2 * r);

function orbStep(o, dt, GM = 1) {

// side panel for an action scene: coach + meters + button pad
function actionLayout(title, meters, pad) {
  const { cv, side } = playLayout(`<h3>${title}</h3><div class="aco"></div>
    ${meters.map(m => `<div class="mrow"><span>${m.icon}</span><div class="meter"><i id="${m.id}" style="background:${m.col || 'var(--green)'}"></i></div><em id="${m.id}T"></em></div>`).join('')}

  return { cv, side, co: side.querySelector('.aco') };
}
function setMeter(id, v, label) { const m = $(id); if (m) m.style.width = clamp(v, 0, 1) * 100 + '%'; if (label != null && $(id + 'T')) $(id + 'T').textContent = label; }
// drag-joystick on a canvas + keyboard. returns live {x,y} in -1..1 and a draw function for the ring
function joystick(cv, onTap) {
  const J = { x: 0, y: 0, drag: null };
  pointer(cv, {
    down(x, y) { J.drag = { x0: x, y0: y, x, y, t: performance.now(), m: 0 }; },
    move(x, y, d) { if (d && J.drag) { J.drag.x = x; J.drag.y = y; J.drag.m = Math.max(J.drag.m, Math.hypot(x - J.drag.x0, y - J.drag.y0)); } },
    up(x, y) { const d = J.drag; J.drag = null; if (d && d.m < 14 && performance.now() - d.t < 300 && onTap) onTap(x, y); },
  });
  J.read = () => {
    let x = 0, y = 0;
    if (J.drag) { const dx = J.drag.x - J.drag.x0, dy = J.drag.y - J.drag.y0, d = Math.hypot(dx, dy); if (d > 8) { const k = Math.min(1, d / 60); x = dx / d * k; y = dy / d * k; } }
    if (keys.ArrowLeft) x -= 1; if (keys.ArrowRight) x += 1; if (keys.ArrowUp) y -= 1; if (keys.ArrowDown) y += 1;
    x += J.bx || 0; y += J.by || 0;
    J.x = clamp(x, -1, 1); J.y = clamp(y, -1, 1); return J;
  };
  J.draw = (c) => {
    const d = J.drag; if (!d || d.m < 8) return;
    const dx = d.x - d.x0, dy = d.y - d.y0, dd = Math.hypot(dx, dy), k = Math.min(1, 60 / (dd || 1));
    c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 4; ell(c, d.x0, d.y0, 60, 60); c.stroke();
    c.fillStyle = 'rgba(255,210,63,.85)'; c.strokeStyle = INK; c.lineWidth = 3; ell(c, d.x0 + dx * k, d.y0 + dy * k, 24, 24); c.fill(); c.stroke();
  };
  return J;
}

function padDir(J, id, ax, v) { const b = $(id); if (b) holdBtn(b, on => { J[ax] = on ? v : 0; }); }

  const upd = () => { const d = DIST[+$('sD').value]; $('vD').textContent = DNAME[+$('sD').value]; $('vV').textContent = Math.round(curV() * 100) + ' / ' + Math.round(Math.sqrt(1 / d) * 100) + ' 🎯'; };

    S.pebbles.push({ o: { x: d, y: 0, vx: 0, vy: -v }, d, v, col, trail: [], age: 0, done: false, minR: d, maxR: d });
    if (S.pebbles.length > 5) S.pebbles.shift(); sfx.whoosh();
  };

  });

    holdBtn($('brk'), v => S.hold = v); hand($('brk'), 'hold', 0.5, 0.6);
  }
  let J;
  function stageDrill() {
    S.stage = 'drill'; S.depth = 0; S.chunks = []; S.x = 0.5;
    say('bco', '3️⃣ 💥 Blast the ice! ⬅➡ Aim.', 'info', 'This is a game super-drill! Real Europa ice is many kilometres thick.');
    bs.innerHTML = `<div class="row" style="margin:0">${gearChip('suit')}</div>
      <div class="mrow"><span>🧊</span><div class="meter"><i id="dB" style="background:var(--blue)"></i></div><em id="dBT"></em></div>
      <div class="pad three"><button class="btn blue" id="bL">⬅</button><button class="btn fire" id="bFire">💥 DRILL</button><button class="btn blue" id="bR">➡</button></div>`;
    J = joystick(cv, () => fire()); padDir(J, 'bL', 'bx', -1); padDir(J, 'bR', 'bx', 1);
    holdBtn($('bFire'), v => S.fireHeld = v); hand($('bFire'), 'hold', 0.5, 0.6);
  }
  function stageSub() {
    S.stage = 'sub'; S.sx = 0.5; S.sy = 0.15; S.tx = 0.5; S.ty = 0.3;
    say('bco', '4️⃣ 👆 Steer! Find 💧🧪⚡', 'info');
    bs.innerHTML = `<ul class="tasks" id="lt"></ul>`;
    S.lt = taskList(bs, '#lt', ['💧 Water', '🧪 Chemicals', '⚡ Energy']);
    J = null; hand(cv, 'tap', 0.2, 0.75);
    setTimeout(() => { if (S.stage === 'sub') { S.lt.tick(0); S.found.add(0); say('bco', '💧 Liquid salty water — check!', 'good'); } }, 900);
  }
  const SPOTS = [null, { x: 0.18, y: 0.82, i: 1 }, { x: 0.8, y: 0.82, i: 2 }];
  pointer(cv, { down: (x, y) => { if (S.stage === 'sub') { S.tx = x / cv.clientWidth; S.ty = y / cv.clientHeight; } },
    move: (x, y, d) => { if (d && S.stage === 'sub') { S.tx = x / cv.clientWidth; S.ty = y / cv.clientHeight; } } });
  const fire = () => {
    if (S.stage !== 'drill' || S.cool > 0) return;
    S.bolts.push({ x: S.x * S.W, y: S.H * 0.3 + 30, vy: 700 }); S.cool = 0.13; sfx.pew();
  };
  cur.tick = (dt0) => {
    const dt = fxTime(F, dt0); fxStep(F, dt0); S.t += dt;
    const W = S.W, H = S.H;
    if (S.stage === 'land') {
      const brake = S.hold || keys[' '] || keys.ArrowUp;
      S.vy += dt * (brake ? -0.22 : 0.11); S.vy = Math.max(-0.05, S.vy); S.y = Math.max(0, S.y + S.vy * dt);
      setMeter('vB', S.vy / 0.4, S.vy > 0.12 ? '😱' : '🙂'); $('vB').style.background = S.vy > 0.12 ? 'var(--accent)' : 'var(--green)';
      if (S.y >= 0.62) {
        if (S.vy > 0.12) { sfx.thud(); F.shake = 12; burst('BUMP!', '#ff9f1c'); say('bco', 'Too fast! Brake sooner! 🚀', 'bad'); S.y = 0.1; S.vy = 0.03; S.dust = 1; }
        else { S.stage = 'landed'; S.y = 0.62; sfx.good(); burst('LANDED!', '#06d6a0'); S.dust = 1; setTimeout(stageDrill, 1300); }
      }
    } else if (S.stage === 'drill' && W) {
      J.read(); S.x = clamp(S.x + J.x * dt * 0.8, 0.08, 0.92);
      S.cool -= dt0; if (S.fireHeld || keys[' ']) fire();
      // keep a field of ice chunks in the shaft below
      S.spawn -= dt;
      if (S.chunks.length < 7 && S.spawn <= 0) { S.spawn = 0.25; const big = Math.random() < 0.3;
        S.chunks.push({ x: rand(0.1, 0.9) * W, y: H * rand(0.62, 0.95), r: H * (big ? 0.085 : 0.055), hp: big ? 3 : 1, hit: 0, rot: rand(0, TAU), vx: rand(-30, 30), vy: 0 }); }
      for (const ch of S.chunks) { ch.hit = Math.max(0, ch.hit - dt * 5); ch.x += ch.vx * dt; ch.y += ch.vy * dt; ch.vx *= Math.pow(0.3, dt); ch.vy *= Math.pow(0.3, dt);
        if (ch.x < ch.r) ch.vx = Math.abs(ch.vx); if (ch.x > W - ch.r) ch.vx = -Math.abs(ch.vx); }
      for (let i = S.bolts.length - 1; i >= 0; i--) {
        const b = S.bolts[i]; b.y += b.vy * dt; let gone = b.y > H + 20;
        for (let j = S.chunks.length - 1; j >= 0 && !gone; j--) {
          const ch = S.chunks[j];
          if (Math.hypot(b.x - ch.x, b.y - ch.y) < ch.r + 6) {
            gone = true; ch.hp--; ch.hit = 1; ch.vy += 40; ch.vx += (ch.x - b.x) * 2;
            if (ch.hp <= 0) {
              S.chunks.splice(j, 1); S.depth = Math.min(1, S.depth + (ch.r > H * 0.07 ? 0.11 : 0.06));
              fxBoom(F, ch.x, ch.y, { n: ch.r > H * 0.07 ? 30 : 18, cols: ['#dff6ff', '#4cc9f0', '#fff', '#ffd23f'], smokeCol: '230,245,255', shake: ch.r > H * 0.07 ? 12 : 6 });
              fxPop(F, ch.x, ch.y - ch.r, ch.r > H * 0.07 ? 'SMASH!' : 'CRACK!', '#ffd23f', 24); sfx.boom(ch.r > H * 0.07 ? 1.2 : 0.7);
              for (const o of S.chunks) { const d = Math.hypot(o.x - ch.x, o.y - ch.y); if (d < ch.r * 3) { o.vx += (o.x - ch.x) / (d || 1) * 160; o.vy += (o.y - ch.y) / (d || 1) * 160; } }   // shockwave pushes neighbors
            } else { fxSpark(F, b.x, b.y, 10, '#dff6ff'); sfx.thud(); }
          }
        }
        if (gone) S.bolts.splice(i, 1);
      }
      setMeter('dB', S.depth, Math.round(S.depth * 100) + '%');
      if (S.depth >= 1) { S.stage = 'splash'; F.slow = 0.7; fxConfetti(F, W / 2, H * 0.8, 70, 500); for (const ch of S.chunks) fxBoom(F, ch.x, ch.y, { n: 10, cols: ['#dff6ff', '#4cc9f0'] }); S.chunks = []; sfx.whoosh(); burst('SPLASH!', '#4cc9f0'); setTimeout(stageSub, 1300); }
    } else if (S.stage === 'sub') {
      const kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
      if (kx || ky) { S.tx = clamp(S.sx + kx * 0.2, 0.05, 0.95); S.ty = clamp(S.sy + ky * 0.2, 0.15, 0.9); }
      const dx = S.tx - S.sx, dy = S.ty - S.sy, d = Math.hypot(dx, dy), sp = 0.35 * dt;
      if (d > 0.01) { S.sx += dx / d * Math.min(sp, d); S.sy += dy / d * Math.min(sp, d); if (Math.abs(dx) > 0.01) S.face = Math.sign(dx); }
      S.sy = clamp(S.sy, 0.15, 0.88);
      for (const sp2 of SPOTS) if (sp2 && !S.found.has(sp2.i) && Math.hypot(S.sx - sp2.x, (S.sy - sp2.y) * 0.8) < 0.12) {
        S.found.add(sp2.i); S.lt.tick(sp2.i); fxConfetti(F, sp2.x * W, sp2.y * H, 40, 380); sfx.ding();
        say('bco', sp2.i === 1 ? '🧪 Salty minerals from the rocks — check!' : '⚡ Warm vent energy — check!', 'good', sp2.i === 2 ? 'Scientists think Europa might have warm seafloor vents like this.' : '');
      }
      if (S.found.size >= 3) { S.stage = 'won'; F.slow = 1; setTimeout(() => winBoss(side, '💧✔ 🧪✔ ⚡✔ Could life exist? Scientists are still exploring! 🔭'), 900); }
    }
  };
  anim(cv, (c, W, H, t) => {
    S.W = W; S.H = H;
    c.save(); fxBegin(c, F);
    if (S.stage === 'nav' || S.stage === 'navAnim') {
      c.fillStyle = '#100d2a'; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) { c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, (i * 131.7) % W, (i * 71.3) % H, 1.1, 1.1); c.fill(); }
      drawPlanet(c, 'jupiter', W * 0.12, H * 0.5, H * 0.35, t);
      const ex = W * 0.6, ey = H * 0.5, er = Math.min(W, H) * 0.2; drawPlanet(c, 'europa', ex, ey, er, t);
      const k = S.stage === 'navAnim' ? clamp((t - S.navT) / 1.2, 0, 1) : 0, a = t * (k ? 1.4 : 3), rad = lerp(er * 2.2, er * 1.4, k);
      c.strokeStyle = k ? 'rgba(6,214,160,.8)' : 'rgba(255,255,255,.25)'; c.setLineDash([8, 6]); c.lineWidth = 2; ell(c, ex, ey, rad, rad * 0.8); c.stroke(); c.setLineDash([]);
      if (!k) drawShip(c, W * 0.9 - (t * 40 % 30), H * 0.2, H * 0.06, Math.PI * 0.8, t, 0.5);
      else drawShip(c, ex + Math.cos(a) * rad, ey + Math.sin(a) * rad * 0.8, H * 0.06, a + Math.PI / 2, t);
      drawGear(c, 'nav', W * 0.88, H * 0.82, H * 0.1, t);
    } else if (S.stage === 'land' || S.stage === 'landed') {
      const gy = H * 0.78; europaSurface(c, W, H, t, gy);
      const by = lerp(H * 0.1, gy - H * 0.06, S.y / 0.62), brake = S.stage === 'land' && (S.hold || keys[' '] || keys.ArrowUp);
      if (S.dust) { S.dust = 0; fxBoom(F, W * 0.45, gy, { n: 14, smokeCol: '240,230,210', cols: ['#f1e6cf', '#fff'], shake: 6 }); }
      c.save(); c.translate(W * 0.45, by); c.strokeStyle = INK; c.lineWidth = 3;
      if (brake) for (const sd of [-1, 1]) { const f = H * 0.06 * (1 + 0.3 * Math.sin(t * 40)); c.beginPath(); c.moveTo(sd * H * 0.06 - 8, H * 0.04); c.lineTo(sd * H * 0.06, H * 0.04 + f); c.lineTo(sd * H * 0.06 + 8, H * 0.04); fs(c, '#ffd23f'); }
      c.restore();
      drawLander(c, W * 0.45, by + H * 0.06, H * 0.16);
      drawGear(c, 'boost', W * 0.88, H * 0.18, H * 0.08, brake ? t : 0);
      c.strokeStyle = '#06d6a0'; c.setLineDash([8, 6]); c.lineWidth = 2; c.beginPath(); c.moveTo(0, gy - 2); c.lineTo(W, gy - 2); c.stroke(); c.setLineDash([]);
      if (S.stage === 'landed') txt(c, 'TOUCHDOWN!', W / 2, H * 0.12, H * 0.08, '#06d6a0');
    } else if (S.stage === 'drill' || S.stage === 'splash') {
      const top = H * 0.3; europaSurface(c, W, H, t, top);
      const ig = c.createLinearGradient(0, top, 0, H); ig.addColorStop(0, '#d6e6ee'); ig.addColorStop(1, mix('#9ec9e0', '#2a7fc0', S.depth)); c.fillStyle = ig; c.fillRect(0, top + 3, W, H - top);
      c.strokeStyle = 'rgba(120,160,190,.5)'; c.lineWidth = 2; for (let i = 1; i < 6; i++) { const yy = top + ((i * H * 0.13 - S.depth * H * 0.6) % (H * 0.7) + H * 0.7) % (H * 0.7); c.beginPath(); c.moveTo(0, yy); c.lineTo(W, yy + 6); c.stroke(); }
      if (S.stage === 'splash') { oceanBg(c, W, H, t, H * 0.55); }
      for (const ch of S.chunks) drawIce(c, ch.x, ch.y, ch.r, ch.rot + t * 0.3, ch.hit);
      for (const b of S.bolts) drawBolt(c, b.x, b.y, 0, b.vy, '#ff9f1c');
      const dx = S.x * W;
      c.save(); c.translate(dx, top + 6); c.strokeStyle = INK; c.lineWidth = 3;
      rr(c, -22, -20, 44, 30, 8); fs(c, '#b9c2d6'); c.beginPath(); c.moveTo(-16, 10); c.lineTo(16, 10); c.lineTo(0, 34); c.closePath(); fs(c, '#ff9f1c'); c.restore();
      drawPup(c, dx, top - H * 0.09, H * 0.06, { t });
      txt(c, '🧊 ' + Math.round(S.depth * 100) + '%', W * 0.04, top + 26, H * 0.06, '#1d1b26', 'left', false);
    } else {
      oceanBg(c, W, H, t, 0);
      c.fillStyle = '#d6e6ee'; c.fillRect(0, 0, W, H * 0.08); c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(0, H * 0.08); c.lineTo(W, H * 0.08); c.stroke();
      c.fillStyle = '#4a3b3f'; c.beginPath(); c.moveTo(0, H); for (let x = 0; x <= W; x += W / 10) c.lineTo(x, H * (0.9 + 0.04 * Math.sin(x * 0.02))); c.lineTo(W, H); c.fill(); c.stroke();
      const r1 = SPOTS[1], r2 = SPOTS[2];
      for (let i = 0; i < 4; i++) { c.strokeStyle = INK; c.lineWidth = 2.5; ell(c, r1.x * W + (i - 1.5) * 22, r1.y * H + 26 + (i % 2) * 6, 18, 12); fs(c, ['#9b5de5', '#06d6a0', '#ffd23f', '#ff9f1c'][i]); }
      drawVent(c, r2.x * W, H * 0.93, H * 0.12, t);
      for (const sp of SPOTS) if (sp && !S.found.has(sp.i)) { const pr = 18 + Math.sin(t * 4) * 5; c.strokeStyle = '#ffd23f'; c.lineWidth = 3; c.setLineDash([6, 5]); ell(c, sp.x * W, sp.y * H, pr * 2, pr * 1.5); c.stroke(); c.setLineDash([]); txt(c, sp.i === 1 ? '🧪?' : '⚡?', sp.x * W, sp.y * H - pr * 2.2, 26, '#ffd23f'); }
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.setLineDash([4, 6]); c.beginPath(); c.moveTo(S.sx * W, S.sy * H); c.lineTo(S.tx * W, S.ty * H); c.stroke(); c.setLineDash([]);
      drawSub(c, S.sx * W, S.sy * H, Math.min(W, H) * 0.07, t, S.face);
      if (S.stage === 'won') { txt(c, 'COULD LIFE EXIST?', W / 2, H * 0.22, H * 0.07, '#ffd23f'); txt(c, 'Still exploring! 🔭', W / 2, H * 0.32, H * 0.05, '#fff'); }
    }
    fxDraw(c, F, W, H);
    if (J && S.stage === 'drill') J.draw(c);
    c.restore();
  });
  stageNav();
};
})();

// ================= boot =================
updMute();
wireHub();
show('title');
requestAnimationFrame(frame);
window.__game = {
  get save() { return save; }, get cur() { return cur; }, get hub() { return HUB; }, PLANETS,
  start: i => startMission(i), phase: i => goPhase(i), next: () => nextPhase(), toHub: () => show('hub'),
  unlockAll() { for (const P of PLANETS) save.done[P.id] = save.done[P.id] || { stars: 1 }; save.gear = GEAR_ORDER.slice(); persist(); },
  reset() { save = { done: {}, gear: [], muted: save.muted, rocks: 0 }; persist(); },
};

</script>
