<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style><script id="nozoom-js">/* Block browser page zoom (iOS ignores user-scalable=no); in-game zoom uses pointer events and still works. */(function(){var p=function(e){e.preventDefault()};["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,p,{passive:false})});})();</script>
<title>The Iliad: Heroes of Troy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0; --purple:#9b5de5; --orange:#ff9f1c;
  --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; --bg:#2b2a4a; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:800;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
button { font:inherit; cursor:pointer; border:0; color:inherit; }
a { color:inherit; }
.toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
.panel { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); }
.screen { position:fixed; inset:0; display:flex; flex-direction:column; }
.screen[hidden] { display:none; }
.bgc { position:absolute; inset:0; width:100%; height:100%; display:block; }

.btn { background:var(--accent); color:#fff; font-family:var(--toon); font-weight:400; font-size:clamp(20px,2.3vw,28px); min-height:60px;
  padding:12px 28px 6px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); letter-spacing:1px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; line-height:1.1; }
.btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
.btn.alt { background:#fff; color:var(--ink); }
.btn.go { background:var(--green); color:var(--ink); }
.btn.y { background:var(--yellow); color:var(--ink); }
.btn.b { background:var(--blue); color:var(--ink); }
.btn.p { background:var(--purple); }
.btn.sm { font-size:clamp(17px,1.8vw,22px); padding:10px 18px 4px; }
.btn[disabled] { opacity:.45; pointer-events:none; }
.btn.pulse { animation:pulse 1s infinite; }
@keyframes pulse { 50% { transform:scale(1.06); } }
.round { width:60px; height:60px; border-radius:50%; font-size:26px; display:grid; place-items:center; padding:0; background:#fff; }

h1.big { margin:0; font-family:var(--toon); font-weight:400; font-size:clamp(44px,7vw,96px); line-height:.95; color:var(--yellow);
  -webkit-text-stroke:3px var(--ink); paint-order:stroke; text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); letter-spacing:2px; }
h1.big small { display:block; font-size:.45em; color:#fff; margin-top:8px; }
h2.t { margin:0 0 8px; font-family:var(--toon); font-weight:400; font-size:clamp(28px,3.4vw,44px); color:var(--accent); line-height:1.05;
  -webkit-text-stroke:2px var(--ink); paint-order:stroke; text-shadow:3px 3px 0 var(--ink); letter-spacing:1px; }
h3 { font-family:var(--toon); font-weight:400; margin:0 0 6px; font-size:clamp(20px,2.2vw,28px); letter-spacing:1px; }

/* title */
#title { align-items:center; justify-content:center; text-align:center; overflow:hidden; }
#title .tbox { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; max-width:96vw; }
#title .tag { color:#fff; font-size:clamp(17px,1.8vw,24px); text-shadow:2px 2px 0 var(--ink); max-width:760px; margin:0; }
#title .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
#title .corner { position:absolute; z-index:3; display:flex; gap:10px; align-items:center; }
#title .tl { top:14px; left:14px; } #title .tr { top:14px; right:14px; } #title .br { bottom:14px; right:14px; }
.other { font-size:16px; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:12px 18px; box-shadow:0 5px 0 var(--ink);
  text-decoration:none; min-height:56px; display:inline-flex; align-items:center; }
#starsTotal { font-family:var(--toon); color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke; font-size:30px; text-shadow:2px 2px 0 var(--ink); }

/* top bar */
.bar { position:relative; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 12px; flex-wrap:nowrap; }
.bar .grow { flex:1; min-width:0; }
.bar .ttl { color:#fff; font-family:var(--toon); font-size:clamp(20px,2.4vw,30px); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke;
  text-shadow:2px 2px 0 var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:1px; }
.chip { background:var(--yellow); border:3px solid var(--ink); border-radius:999px; padding:6px 14px 4px; font-family:var(--toon); font-size:20px;
  white-space:nowrap; box-shadow:2px 2px 0 var(--ink); }
.chip.calm { background:#c7f9e5; font-family:Nunito,system-ui,sans-serif; font-weight:900; font-size:16px; }

/* map */
#map { background:#4cc9f0; }
#mapWrap { position:relative; flex:1; min-height:0; }
.stop { position:absolute; transform:translate(-50%,-50%); min-width:64px; min-height:64px; border-radius:999px; border:3px solid var(--ink);
  background:#fff; box-shadow:0 5px 0 var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 12px 2px;
  font-size:15px; line-height:1.05; z-index:3; }
.stop b { font-family:var(--toon); font-weight:400; font-size:18px; letter-spacing:.5px; }
.stop .st { color:#f4a100; font-size:15px; letter-spacing:1px; -webkit-text-stroke:.5px var(--ink); }
.stop .st .off { color:#d8d0bd; }
.stop.locked { background:#e7e0cf; color:#8d8577; border-color:#8d8577; box-shadow:0 5px 0 #8d8577; }
.stop.next { background:var(--yellow); animation:bob 1.4s ease-in-out infinite; }
.stop.done { background:#c7f9e5; }
@keyframes bob { 50% { transform:translate(-50%,-58%); } }
.stop:active { box-shadow:0 2px 0 var(--ink); }

/* mission */
#mission { background:#2b2a4a; }
.tracker { display:flex; gap:6px; flex-wrap:nowrap; overflow:hidden; }
.tracker > span { background:#fff; border:3px solid var(--ink); border-radius:999px; padding:5px 10px 3px; font-size:15px; white-space:nowrap; opacity:.6; }
.tracker > span.on { background:var(--yellow); opacity:1; transform:scale(1.06); }
.tracker > span.ok { background:var(--green); opacity:1; }
.mbody { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:14px; padding:0 14px 14px; }
.mbody.full { grid-template-columns:1fr; }
.stage { position:relative; min-height:0; overflow:hidden; border-radius:18px; }
.stage > canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.side { min-height:0; overflow:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; touch-action:pan-y; }
.side p { margin:0; font-size:clamp(17px,1.7vw,22px); line-height:1.35; }
.prompt { font-size:clamp(19px,1.9vw,25px) !important; }
.opts { display:flex; flex-direction:column; gap:10px; }
.opt { background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); padding:12px 16px; min-height:60px;
  text-align:left; font-size:clamp(16px,1.6vw,21px); line-height:1.25; }
.opt:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
.opt.good { background:#c7f9e5; } .opt.bad { background:#ffd6dc; } .opt.tried { border-style:dashed; }
.res { border:3px dashed var(--ink); border-radius:16px; padding:12px 14px; background:#fff3c4; font-size:clamp(16px,1.6vw,21px); line-height:1.35; }
.res.good { background:#c7f9e5; } .res.bad { background:#ffe1e6; }
.res[hidden] { display:none; }
.nav { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:auto; padding-top:6px; }
.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.dcard { background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); padding:8px; text-align:left; min-height:120px;
  display:flex; flex-direction:column; gap:6px; }
.dcard canvas { width:100%; height:110px; border-radius:10px; border:2px solid var(--ink); display:block; }
.dcard .cap { font-family:var(--toon); font-size:19px; letter-spacing:.5px; }
.dcard .txt { font-size:clamp(15px,1.4vw,18px); line-height:1.3; }
.dcard.hid .txt { display:none; }
.dcard.hid .tap { display:block; }
.dcard .tap { display:none; font-size:15px; opacity:.7; }
.tchip { display:inline-block; background:var(--purple); color:#fff; border:2px solid var(--ink); border-radius:999px; padding:2px 10px; font-size:14px; margin-top:2px; }
.meters { display:flex; flex-direction:column; gap:8px; }
.meter { display:grid; grid-template-columns:110px 1fr 40px; gap:8px; align-items:center; font-size:16px; }
.meter .mb { height:22px; border:3px solid var(--ink); border-radius:12px; background:#e9e2cf; overflow:hidden; }
.meter .mb i { display:block; height:100%; width:50%; background:var(--green); transition:width .5s, background .5s; }
.qa { display:flex; flex-direction:column; gap:10px; }
.qnum { font-size:15px; opacity:.7; }
.lesson { background:#fff8dc; border:4px solid var(--ink); border-radius:22px; box-shadow:6px 6px 0 var(--ink); padding:18px 20px; position:relative; }
.lesson .moral { font-family:var(--toon); font-size:clamp(24px,2.6vw,34px); line-height:1.15; color:var(--ink); letter-spacing:.5px; margin:6px 0 10px; }
.lesson .today { background:#e3f6ff; border:3px solid var(--ink); border-radius:14px; padding:10px 14px; font-size:clamp(16px,1.6vw,21px); line-height:1.35; }
.ribbon { display:inline-block; background:var(--accent); color:#fff; font-family:var(--toon); font-size:18px; padding:4px 14px 2px;
  border:3px solid var(--ink); border-radius:10px; transform:rotate(-2deg); letter-spacing:1px; }
.starsBig { font-size:clamp(48px,6vw,70px); color:#f4a100; letter-spacing:6px; line-height:1; -webkit-text-stroke:2px var(--ink); text-align:center; }
.starsBig .off { color:#e7e0cf; }
.earned { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.mini-card { width:130px; background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--ink); padding:6px; text-align:center; font-size:14px; }
.mini-card canvas { width:100%; height:80px; display:block; }
.mini-card b { font-family:var(--toon); font-weight:400; font-size:16px; display:block; letter-spacing:.5px; }

/* mini-game */
.mg { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.mghud { position:absolute; top:10px; left:10px; right:10px; display:flex; gap:8px; align-items:flex-start; justify-content:space-between; pointer-events:none; z-index:2; }
.mghud .chip { pointer-events:none; }
.mgmeter { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:4px 10px; font-size:15px; min-width:150px; }
.mgmeter .mb { height:14px; border:2px solid var(--ink); border-radius:8px; background:#e9e2cf; overflow:hidden; margin-top:2px; }
.mgmeter .mb i { display:block; height:100%; background:var(--green); }
.mgov { position:absolute; inset:0; display:grid; place-items:center; background:rgba(30,20,60,.45); z-index:4; padding:12px; }
.mgov[hidden] { display:none; }
.mgov .panel { padding:18px 22px; text-align:center; max-width:560px; display:flex; flex-direction:column; gap:10px; align-items:center; max-height:96%; overflow:auto; }
.mgov p { margin:0; font-size:clamp(17px,1.7vw,22px); line-height:1.3; }
.mgctl { position:absolute; bottom:12px; left:12px; right:12px; display:flex; justify-content:space-between; gap:12px; z-index:3; pointer-events:none; }
.mgctl .btn { pointer-events:auto; min-width:96px; min-height:76px; font-size:26px; touch-action:none; }

/* pup narrator */
.pupsay { display:flex; gap:10px; align-items:center; }
.pupsay canvas { width:84px; height:84px; flex:0 0 84px; }
.pupsay .bub { position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px 12px; font-size:clamp(15px,1.5vw,19px); line-height:1.3; }
.pupsay .bub::before { content:''; position:absolute; left:-12px; top:50%; margin-top:-8px; border:8px solid transparent; border-right:12px solid var(--ink); border-left:0; }

/* overlays */
.overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(30,20,60,.55); z-index:20; padding:12px; }
.overlay[hidden] { display:none; }
.overlay > .panel { padding:20px 24px; max-width:min(860px,96vw); max-height:94vh; overflow:auto; display:flex; flex-direction:column; gap:12px; touch-action:pan-y; }
.overlay p { margin:0; font-size:clamp(17px,1.7vw,22px); line-height:1.35; }

/* book */
#book, #review { background:#3a2f5c; }
.tabs { display:flex; gap:8px; }
.tabs .btn { font-size:20px; }
.tabs .btn.on { background:var(--yellow); color:var(--ink); }
.scroll { flex:1; min-height:0; overflow:auto; padding:6px 14px 20px; touch-action:pan-y; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.tcard { background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); padding:10px; display:flex; flex-direction:column; gap:4px; }
.tcard canvas { width:100%; height:110px; border-radius:12px; border:2px solid var(--ink); display:block; }
.tcard b { font-family:var(--toon); font-weight:400; font-size:22px; letter-spacing:.5px; }
.tcard i { font-style:normal; color:#7a4dc9; font-size:15px; }
.tcard p { margin:0; font-size:16px; line-height:1.3; }
.tcard.lock { opacity:.55; filter:grayscale(1); }
.tcard .from { font-size:14px; opacity:.75; }
.wis { background:#fff8dc; }
.wis .m { font-family:var(--toon); font-size:21px; line-height:1.15; letter-spacing:.3px; }

/* review */
.match { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.col { display:flex; flex-direction:column; gap:10px; }
.mitem { background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); padding:10px 12px; min-height:60px; text-align:left;
  font-size:clamp(15px,1.5vw,19px); line-height:1.25; }
.mitem.sel { background:var(--yellow); }
.mitem.done { background:#c7f9e5; opacity:.75; box-shadow:none; transform:translateY(3px); }
.mitem.shake { animation:shake .35s; background:#ffd6dc; }
@keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }

/* burst */
.burst { position:fixed; z-index:50; pointer-events:none; width:220px; height:150px; margin:-75px 0 0 -110px; animation:pop .9s ease-out forwards; }
.burst svg { position:absolute; inset:0; }
.burst span { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--toon); font-size:34px; color:#fff;
  -webkit-text-stroke:2px var(--ink); paint-order:stroke; letter-spacing:1px; padding-top:6px; }
@keyframes pop { 0% { transform:scale(.2) rotate(-10deg); opacity:0; } 20% { transform:scale(1.15) rotate(3deg); opacity:1; }
  35% { transform:scale(1) rotate(-2deg); } 80% { opacity:1; } 100% { transform:scale(1.05) translateY(-20px); opacity:0; } }

@media (max-aspect-ratio: 1/1) {
  .mbody { grid-template-columns:1fr; grid-template-rows:minmax(150px,34%) minmax(0,1fr); }
  .mbody.full { grid-template-rows:1fr; }
  .tracker span .lbl { display:none; }
  .match { grid-template-columns:1fr 1fr; gap:8px; }
}
@media (max-width:700px) {
  .cards { grid-template-columns:1fr 1fr; gap:8px; }
  .dcard canvas { height:76px; }
  .side { padding:12px 12px; }
  .bar { padding:8px; gap:6px; }
  .tracker > span { padding:4px 8px 2px; font-size:13px; }
  .meter { grid-template-columns:84px 1fr 34px; font-size:14px; }
  .pupsay canvas { width:64px; height:64px; flex-basis:64px; }
  .grid { grid-template-columns:1fr 1fr; gap:10px; }
  .tcard canvas { height:80px; }
  .tcard b { font-size:18px; }
  .tcard p { font-size:14px; }
  .bar .ttl { font-size:20px; }
}

/* ===== visual-first redesign ===== */
.mbody.story { grid-template-columns:1fr !important; grid-template-rows:1fr !important; }
.mbody.story .stage { display:none; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.tile { background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink); padding:6px; display:flex; flex-direction:column; gap:4px; align-items:stretch; min-height:64px; }
.tile canvas { width:100%; aspect-ratio:16/10; height:auto; border-radius:12px; border:2px solid var(--ink); display:block; background:#eee; }
.tile .lb { font-family:var(--toon); font-weight:400; font-size:clamp(17px,1.7vw,23px); line-height:1.05; text-align:center; padding:4px 2px 2px; letter-spacing:.5px; }
.tile.txtonly .lb { font-family:Nunito,system-ui,sans-serif; font-weight:900; font-size:clamp(17px,1.8vw,23px); padding:12px 6px; }
.tile.good { background:#c7f9e5; } .tile.bad { background:#ffe1e6; } .tile.dim { opacity:.6; }
.tile.wig { animation:wig .5s; }
@keyframes wig { 20% { transform:rotate(-4deg); } 40% { transform:rotate(4deg); } 60% { transform:rotate(-3deg); } 80% { transform:rotate(2deg); } }
.tile:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
.spk { width:54px; height:54px; min-width:54px; min-height:54px; border-radius:50%; background:var(--blue); border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; padding:0; }
.spk svg { width:28px; height:28px; display:block; }
.spk:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.spk.talk { background:var(--yellow); }
.pupsay .bub { display:flex; align-items:center; gap:10px; font-size:clamp(18px,1.9vw,25px); line-height:1.25; flex:1; }
.pupsay .bub .bt { flex:1; }
.pupsay.pop .bub { animation:bpop .35s; }
@keyframes bpop { 0% { transform:scale(.92); } 60% { transform:scale(1.04); } }
.strip { display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:14px; }
.cpanel { position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); overflow:hidden; display:flex; flex-direction:column; padding:0; text-align:left; }
.cpanel canvas { width:100%; aspect-ratio:4/3; height:auto; display:block; border-bottom:3px solid var(--ink); }
.cpanel .cap { display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:clamp(15px,1.5vw,20px); line-height:1.25; }
.cpanel .cap .ct { flex:1; }
.cpanel.hid .cap, .cpanel.hid .extra { visibility:hidden; }
.cpanel .num { position:absolute; top:8px; left:8px; width:36px; height:36px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); display:grid; place-items:center; font-family:var(--toon); font-size:20px; padding-top:3px; }
.cpanel .extra { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:0 10px 10px; }
.more { background:#fff; border:2px dashed var(--ink); border-radius:999px; padding:4px 12px; font-size:15px; min-height:44px; }
.moretxt { font-size:15px; line-height:1.3; flex-basis:100%; }
.lesson .moral { display:flex; align-items:center; gap:10px; }
.lesson .moral span { flex:1; }
.lesson .today { display:flex; align-items:center; gap:10px; }
.lesson .today canvas { width:70px; height:70px; flex:0 0 70px; }
.lesson .today .tt { flex:1; }
.dots { display:flex; gap:6px; } .dots i { width:16px; height:16px; border-radius:50%; border:3px solid var(--ink); background:#fff; } .dots i.on { background:var(--yellow); } .dots i.ok { background:var(--green); }
#fxc { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; }
.demo { width:min(420px,80vw); aspect-ratio:16/10; border:3px solid var(--ink); border-radius:16px; display:block; }
.mtile { display:flex; gap:8px; align-items:center; }
.mtile canvas { width:96px; height:64px; flex:0 0 96px; border:2px solid var(--ink); border-radius:10px; }
.tcard .row { display:flex; gap:8px; align-items:center; }
.tcard .row p { flex:1; }
.toggle { font-size:16px; }
@media (max-aspect-ratio: 1/1) {
  .strip { --n:2 !important; gap:8px; }
  .cpanel .cap { font-size:15px; padding:6px; gap:4px; }
  .cpanel .spk, .pupsay .spk { width:46px; height:46px; min-width:46px; min-height:46px; }

}

.side[hidden] { display:none !important; }

.autoBtn { gap:8px; } .autoBtn svg { width:26px; height:26px; } .autoBtn.on { background:var(--yellow); }
@media (max-aspect-ratio: 1/1) { .tracker > span .lbl { display:none; } .autoBtn span { display:none; } }

.rot { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:5; background:var(--yellow); border:3px solid var(--ink); border-radius:999px; padding:8px 14px; font-size:15px; white-space:nowrap; box-shadow:3px 3px 0 var(--ink); pointer-events:none; }
.rot span { display:inline-block; animation:spin 1.5s linear infinite; font-size:20px; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (max-aspect-ratio: 1/1) {
  #title .tl { top:10px; left:10px; } #title .tr { top:10px; right:10px; flex-direction:column; align-items:flex-end; gap:6px; }

}

#mapWrap { touch-action:none; cursor:pointer; }
.qbar { position:absolute; top:8px; left:8px; right:8px; z-index:3; display:flex; gap:8px; align-items:center; flex-wrap:wrap; pointer-events:none; }

@media (max-aspect-ratio: 1/1) { #bookCount { display:none; } #book .tabs .btn { font-size:16px; padding:8px 10px 4px; } }

</style>

<script>
'use strict';
// ================= shared engine (copied into each game) =================
const TAU = Math.PI * 2, INK = '#1d1b26';
const COL = { ink: INK, paper: '#fffaf0', accent: '#ff4d6d', yellow: '#ffd23f', green: '#06d6a0', blue: '#4cc9f0', purple: '#9b5de5', orange: '#ff9f1c' };
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// ---------- canvas helpers ----------
function E(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function fs(c, fill, lw = 3) { if (fill) { c.fillStyle = fill; c.fill(); } if (lw) { c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); } }
function RR(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function P(c, pts, close = true) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); if (close) c.closePath(); }
function L(c, x1, y1, x2, y2, lw = 3, col = INK) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = lw; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); }
function txt(c, s, x, y, size = 20, fill = '#fff', align = 'center', stroke = 4) {
  if (window.NOTXT) return;
  c.font = `${size}px "Luckiest Guy","Comic Sans MS",system-ui,sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = stroke; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
// contain a virtual VWxVH box inside w x h (centered)
function virt(c, w, h, VW, VH) { const s = Math.min(w / VW, h / VH); c.translate((w - VW * s) / 2, (h - VH * s) / 2); c.scale(s, s); return s; }
function bigRect(c, fill) { c.fillStyle = fill; c.fillRect(-3000, -3000, 7000, 7000); }

// ---------- live canvases: redrawn every frame (or once per resize) ----------
const live = new Set();
function addLive(cv, fn, once = false) { const o = { cv, fn, once, w: 0, h: 0, dirty: true }; live.add(o); return o; }
function frame(now) {
  const t = now / 1000;
  for (const o of live) {
    if (!o.cv.isConnected) { live.delete(o); continue; }
    const r = o.cv.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) continue;
    const d = Math.min(2, window.devicePixelRatio || 1);
    const sizeChanged = Math.abs(r.width - o.w) > .5 || Math.abs(r.height - o.h) > .5;
    if (o.once && !sizeChanged && !o.dirty) continue;
    if (sizeChanged) { o.w = r.width; o.h = r.height; o.cv.width = Math.round(r.width * d); o.cv.height = Math.round(r.height * d); }
    o.dirty = false;
    const c = o.cv.getContext('2d');
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, r.width, r.height);
    c.save();
    try { o.fn(c, r.width, r.height, t); } catch (e) { live.delete(o); setTimeout(() => { throw e; }); }
    c.restore();
  }
  requestAnimationFrame(frame);
}

// ---------- storage ----------
const Store = {
  d: { done: {}, themes: [], lessons: [], intro: false, review: 0, mute: false },
  load(key) { this.key = key; try { const s = JSON.parse(localStorage.getItem(key) || 'null'); if (s && typeof s === 'object') Object.assign(this.d, s); } catch (_) {} },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (_) {} },
};

// ---------- sound (synthesized) ----------
const Snd = {
  ctx: null, mute: false,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone(f, d = .12, type = 'square', v = .05, when = 0, slide = 0) {
    if (this.mute || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
    } catch (_) {}
  },
  blip() { this.tone(660, .07, 'square', .035); },
  tap() { this.tone(880, .05, 'triangle', .05); },
  good() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .16, 'triangle', .07, i * .08)); },
  bad() { this.tone(260, .22, 'sawtooth', .035, 0, 140); },
  whoosh() { this.tone(180, .5, 'sine', .06, 0, 700); },
  star(i) { this.tone(784 + i * 200, .2, 'triangle', .07, i * .18); },
  boom() { this.tone(120, .35, 'sawtooth', .07, 0, 40); this.tone(70, .4, 'square', .05, .02, 30); },
  pew() { this.tone(1200, .12, 'square', .03, 0, 300); },
  thud() { this.tone(90, .15, 'triangle', .09, 0, 50); },
  bonk() { this.tone(520, .1, 'square', .05, 0, 200); this.tone(260, .12, 'triangle', .06, .04); },
  splash() { this.tone(300, .25, 'sine', .05, 0, 900); },
  lyre() { [392, 494, 587, 784].forEach((f, i) => this.tone(f, .5, 'triangle', .05, i * .12)); },
};

// ---------- comic bursts ----------
function burst(text, x, y, color = COL.yellow) {
  if (x == null) { x = innerWidth / 2; y = innerHeight * .4; }
  x = clamp(x, 112, innerWidth - 112); y = clamp(y, 80, innerHeight - 80);
  const b = el('div', 'burst'); b.style.left = x + 'px'; b.style.top = y + 'px';
  const pts = []; for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, r = i % 2 ? 48 : 70; pts.push((110 + Math.cos(a) * r * 1.45).toFixed(1) + ',' + (75 + Math.sin(a) * r).toFixed(1)); }
  b.innerHTML = `<svg viewBox="0 0 220 150"><polygon points="${pts.join(' ')}" fill="${color}" stroke="#1d1b26" stroke-width="4" stroke-linejoin="round"/></svg><span>${esc(text)}</span>`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 950);
}
function burstAt(node, text, color) { const r = node.getBoundingClientRect(); burst(text, r.left + r.width / 2, r.top + r.height / 2, color); }

// ---------- Captain Pup (Japanese Chin) ----------
// head radius ~44 at s=1; (x,y) = head centre
function drawPup(c, x, y, s = 1, o = {}) {
  const t = o.t || 0;
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.flip) c.scale(-1, 1);
  c.rotate(Math.sin(t * 2.2) * .04 * (o.wiggle ?? 1));
  c.lineJoin = 'round'; c.lineCap = 'round';
  const W = '#ffffff', B = '#1f1d22';
  if (o.body !== false) {
    // curly plume tail
    c.beginPath(); c.moveTo(26, 62); c.bezierCurveTo(70 + Math.sin(t * 6) * 6, 40, 66, 4, 40, 18); c.bezierCurveTo(56, 26, 52, 50, 24, 50); c.closePath(); fs(c, W, 4);
    E(c, 0, 60, 36, 30); fs(c, W, 4);
    for (const sd of [-1, 1]) { E(c, sd * 16, 86, 12, 8); fs(c, W, 4); }
    if (o.outfit === 'sailor') {
      P(c, [-26, 36, 26, 36, 0, 62]); fs(c, COL.accent, 4);
      E(c, 0, 44, 6, 5); fs(c, COL.yellow, 3);
    } else if (o.outfit === 'chiton') {
      c.beginPath(); c.moveTo(-34, 50); c.quadraticCurveTo(0, 40, 34, 50); c.lineTo(30, 80); c.quadraticCurveTo(0, 88, -30, 80); c.closePath(); fs(c, '#f7f1e3', 4);
      L(c, -30, 58, 30, 58, 4, COL.purple); E(c, 0, 50, 6, 6); fs(c, COL.yellow, 3);
    } else if (o.outfit === 'old') {
      E(c, -20, 66, 8, 4); fs(c, '#e8e1d2', 0); E(c, 14, 54, 9, 5); fs(c, '#e8e1d2', 0);
    }
  }
  // floppy black ears
  for (const sd of [-1, 1]) { E(c, sd * 40, 8 + (o.droop ? 6 : 0), 16, 30, sd * (o.droop ? .15 : .35)); fs(c, B, 4); }
  // head
  E(c, 0, 0, 44, 40); fs(c, W, 4);
  // black eye patches with a white blaze between
  for (const sd of [-1, 1]) { E(c, sd * 21, -4, 17, 19, sd * -.3); c.fillStyle = B; c.fill(); }
  c.fillStyle = W; RR(c, -5, -40, 10, 40, 5); c.fill();
  // big round brown eyes (blink every few seconds)
  const blink = (o.blink ?? true) && (t % 4.3) < .12;
  for (const sd of [-1, 1]) {
    if (blink || o.closed) { c.beginPath(); c.arc(sd * 20, -2, 8, .2, Math.PI - .2); c.lineWidth = 3.5; c.strokeStyle = '#fff'; c.stroke(); continue; }
    E(c, sd * 20, -2, 10.5, 11.5); fs(c, '#7a4a21', 2.5);
    E(c, sd * 20, -1, 6, 6.5); c.fillStyle = '#2a160a'; c.fill();
    E(c, sd * 20 - 3.5, -6, 3.4, 3.4); c.fillStyle = '#fff'; c.fill();
    E(c, sd * 20 + 3.5, 2, 1.5, 1.5); c.fill();
  }
  if (o.tear) { c.beginPath(); c.moveTo(28, 8); c.quadraticCurveTo(32, 18, 28, 20); c.quadraticCurveTo(24, 18, 28, 8); fs(c, COL.blue, 2); }
  // muzzle, nose, open mouth, tongue
  E(c, 0, 18, 15, 11); c.fillStyle = W; c.fill();
  c.beginPath(); c.moveTo(-9, 22); c.quadraticCurveTo(0, 36, 9, 22); c.closePath(); fs(c, '#7a1f3a', 3);
  c.beginPath(); c.moveTo(-5, 26); c.quadraticCurveTo(-6, 36 + Math.sin(t * 7) * 1.5, 0, 37 + Math.sin(t * 7) * 1.5); c.quadraticCurveTo(6, 36 + Math.sin(t * 7) * 1.5, 5, 26); fs(c, '#ff8fb1', 2.5);
  E(c, 0, 12, 6.5, 4.8); c.fillStyle = B; c.fill(); E(c, -2, 10.5, 2, 1.2); c.fillStyle = '#777'; c.fill();
  c.strokeStyle = '#9a9aa8'; c.lineWidth = 1.6;
  for (const sd of [-1, 1]) for (const k of [-1, 0, 1]) { c.beginPath(); c.moveTo(sd * 14, 18 + k * 3); c.lineTo(sd * 30, 15 + k * 6); c.stroke(); }
  // hats
  if (o.hat === 'captain') {
    c.save(); c.translate(0, -36); c.rotate(-.12);
    RR(c, -30, -16, 60, 20, 8); fs(c, '#fff', 4);
    c.beginPath(); c.moveTo(-34, 2); c.quadraticCurveTo(0, -6, 34, 2); c.lineTo(30, 8); c.quadraticCurveTo(0, 2, -30, 8); c.closePath(); fs(c, '#1d3557', 4);
    RR(c, -30, -4, 60, 7, 3); fs(c, '#1d3557', 3);
    E(c, 0, -8, 6, 6); fs(c, COL.yellow, 3);
    c.restore();
  } else if (o.hat === 'helmet') {
    c.save(); c.translate(0, -30);
    c.beginPath(); c.moveTo(-34, 6); c.quadraticCurveTo(-36, -30, 0, -32); c.quadraticCurveTo(36, -30, 34, 6); c.closePath(); fs(c, '#e9b44c', 4);
    L(c, -30, 2, 30, 2, 4);
    c.beginPath(); c.moveTo(-24, -26); c.quadraticCurveTo(0, -70 + Math.sin(t * 4) * 2, 30, -28 + Math.sin(t * 4) * 2); c.quadraticCurveTo(34, -14, 22, -30); c.quadraticCurveTo(0, -44, -16, -26); c.closePath(); fs(c, COL.accent, 4);
    for (let i = 0; i < 4; i++) L(c, -8 + i * 9, -40 + i * 2, -2 + i * 10, -30, 2);
    c.restore();
  }
  c.restore();
}

// ---------- cartoon people ----------
// (x,y) = feet; total height ~ 150*s. o: skin, tunic, hair, beard, hat, crest, mood, long, cape, arms, prop
function drawPerson(c, x, y, s = 1, o = {}) {
  const t = o.t || 0, skin = o.skin || '#f2c49b', tunic = o.tunic || '#4cc9f0', hair = o.hair || '#5a3a22';
  c.save(); c.translate(x, y); c.scale(s, s); if (o.flip) c.scale(-1, 1);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const bob = Math.sin(t * 3 + (o.ph || 0)) * 1.5; c.translate(0, bob);
  if (o.cape) { c.beginPath(); c.moveTo(-20, -86); c.quadraticCurveTo(-34, -40, -26, -10); c.lineTo(22, -10); c.quadraticCurveTo(30, -50, 20, -86); c.closePath(); fs(c, o.cape, 3); }
  if (o.long) { RR(c, -24, -128, 48, 62, 18); fs(c, hair, 3); }
  // legs
  if (!o.robe) for (const sd of [-1, 1]) { RR(c, sd * 10 - 5, -34, 10, 32, 4); fs(c, skin, 3); E(c, sd * 11, -2, 9, 5); fs(c, '#8a5a2b', 3); }
  // tunic body
  c.beginPath();
  if (o.robe) { c.moveTo(-18, -86); c.lineTo(18, -86); c.lineTo(30, 0); c.lineTo(-30, 0); }
  else { c.moveTo(-17, -86); c.lineTo(17, -86); c.lineTo(24, -30); c.lineTo(-24, -30); }
  c.closePath(); fs(c, tunic, 3);
  L(c, -18, -56, 18, -56, 3, o.belt || '#8a5a2b');
  if (o.armor) { c.beginPath(); c.moveTo(-17, -86); c.lineTo(17, -86); c.lineTo(19, -58); c.lineTo(-19, -58); c.closePath(); fs(c, o.armor, 3); L(c, 0, -84, 0, -60, 2); }
  // arms
  const arms = o.arms || 'down';
  for (const sd of [-1, 1]) {
    c.beginPath(); c.moveTo(sd * 15, -82);
    let hx, hy;
    if (arms === 'up') { hx = sd * 30; hy = -128; }
    else if (arms === 'out') { hx = sd * 40; hy = -78; }
    else if (arms === 'hold') { hx = sd * 14; hy = -62; }
    else if (arms === 'wave' && sd > 0) { hx = 34; hy = -120 + Math.sin(t * 8) * 6; }
    else { hx = sd * 26; hy = -44; }
    c.lineTo(hx, hy); c.lineWidth = 11; c.strokeStyle = INK; c.stroke(); c.lineWidth = 6; c.strokeStyle = skin; c.stroke();
    E(c, hx, hy, 6, 6); fs(c, skin, 2.5);
  }
  // head
  c.save(); c.translate(0, -112);
  E(c, 0, 0, 26, 27); fs(c, skin, 3);
  if (o.hair !== false && !o.long) { c.beginPath(); c.arc(0, -4, 26, Math.PI * 1.05, Math.PI * 1.95); c.quadraticCurveTo(0, -18, -25, -10); c.closePath(); fs(c, hair, 3); }
  if (o.long) { c.beginPath(); c.arc(0, -4, 26, Math.PI * 1.02, Math.PI * 1.98); c.quadraticCurveTo(0, -14, -26, -6); c.closePath(); fs(c, hair, 3); }
  if (o.beard) { c.beginPath(); c.moveTo(-24, 2); c.quadraticCurveTo(-22, 34, 0, 36); c.quadraticCurveTo(22, 34, 24, 2); c.quadraticCurveTo(12, 16, 0, 14); c.quadraticCurveTo(-12, 16, -24, 2); fs(c, o.beard, 3); }
  // face by mood
  const mood = o.mood || 'happy';
  for (const sd of [-1, 1]) {
    if (mood === 'sleep') { c.beginPath(); c.arc(sd * 9, -2, 4, .3, Math.PI - .3); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke(); continue; }
    E(c, sd * 9, -3, 3.8, 4.6); c.fillStyle = INK; c.fill(); E(c, sd * 9 - 1.2, -4.5, 1.3, 1.3); c.fillStyle = '#fff'; c.fill();

    update(g, dt) {

  mapDoneSay: 'You finished the Iliad! Try the Epic Review!',
  stopWord: 'Book', pupHat: 'helmet', pupOutfit: 'chiton', mapStyle: 'land',
  mapRock: (c, o, s, t) => { E(c, o.x, o.y + o.r * .3, o.r * 1.1, o.r * .45); c.fillStyle = 'rgba(0,0,0,.15)'; c.fill(); E(c, o.x, o.y, o.r, o.r * .75); fs(c, '#a68a64', 3); E(c, o.x - o.r * .3, o.y - o.r * .25, o.r * .3, o.r * .18); c.fillStyle = '#c9b38a'; c.fill(); },
  mapWhirl: (c, o, s, t) => { for (let i = 0; i < 5; i++) { E(c, o.x + Math.sin(t * 3 + i) * 6, o.y - i * 14 * s, (o.r * .5 + i * 9 * s), (o.r * .2 + i * 3 * s)); c.lineWidth = 4; c.strokeStyle = 'rgba(255,240,210,.85)'; c.stroke(); } },
  quizBg: (c, H, t) => { sky(c, '#ffd6a5', '#fff1d0'); c.fillStyle = '#c9b38a'; c.fillRect(0, H * .8, 800, H); },
  quizSkin: { shot: 'stone',
    target: (c, r, t) => { E(c, 0, 0, r, r); fs(c, GOLD, 5); E(c, 0, 0, r * .78, r * .78); fs(c, null, 3); for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; E(c, Math.cos(a) * r * .89, Math.sin(a) * r * .89, 4, 4); c.fillStyle = INK; c.fill(); } },
    drawShot: (c, sh, t) => { c.save(); c.translate(sh.x, sh.y); c.rotate(t * 12); E(c, 0, 0, 16, 14); fs(c, '#8d8577', 3); E(c, -4, -4, 5, 3); c.fillStyle = '#adb5bd'; c.fill(); c.restore(); },
    launcher: (c, x, y, a, rec, t) => { RR(c, x - 70, y - 10, 140, 34, 8); fs(c, '#8a5a2b', 4); for (const k of [-46, 46]) { E(c, x + k, y + 26, 18, 18); fs(c, '#6b4226', 3); } c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2 - rec * .6); L(c, 0, 0, 0, -80, 12, INK); L(c, 0, 0, 0, -80, 7, '#c08552'); c.beginPath(); c.arc(0, -86, 16, 0, Math.PI); fs(c, '#6b4226', 3); c.restore(); drawPup(c, x + 90, y + 6, .4, { t, hat: 'helmet', body: false }); } },
  themes: THEMES, missions: MISSIONS, review: REVIEW, games: GAMES,
  finale: { title: 'You Know the Iliad!', text: 'From anger to mercy. That\'s the whole Iliad! (The Trojan Horse comes later, in the Odyssey.)',
    art: (c, t) => { sky(c, '#2b2a4a', '#5a4f8a'); for (let i = 0; i < 12; i++) drawStar(c, 40 + i * 66, 30 + (i % 3) * 30, 8, '#fffaf0'); c.fillStyle = '#4a4466'; c.fillRect(-100, 260, 1000, 100); priam(c, 300, 300, .8, t); achilles(c, 480, 300, .8, t, { noArmor: true, flip: true }); drawHeart(c, 390, 90, 2); drawPup(c, 620, 270, .45, { t, hat: 'helmet', outfit: 'chiton' }); } },
};
// ---------- Iliad action overrides ----------
GAMES.duel = () => ({ time: 40, ctl: [{ key: 'left', label: '◀' }, { key: 'act', label: 'BONK!', cls: 'y' }, { key: 'right', label: '▶' }], hand: ['tap', 400, 420],
  init(g) { g.px = 300; g.ex = 520; g.pk = 0; g.ek = 0; g.ps = 1; g.es = 1; g.cd = 0; g.ecd = 1.4; g.swing = 0; g.eswing = 0; g.warn = 0; },
  timeout(g) { g.ps >= g.es ? g.win('Night falls! The duel ends and they swap gifts.') : g.lose('Hector bonked more shields. Try again!'); },
  press(g, k) { if (k === 'act') this.bonk(g); },
  down(g, x) { if (x < g.px - 40) g.tx = x; else if (x > g.px + 40 && x < g.ex - 60) g.tx = x; else this.bonk(g); },
  up(g) { g.tx = null; },
  bonk(g) { if (g.cd > 0) return; g.cd = .45; g.swing = .25; Snd.pew(); if (Math.abs(g.ex - g.px) < 150) { if (g.eguard > 0) { Snd.bonk(); g.sparks((g.px + g.ex) / 2, g.VH * .6, '#fff', 10); g.ek = 120; mgPop(g, g.ex, g.VH * .4, 'BLOCK!', COL.blue); } else { g.es -= .12; g.ek = 320; g.boom(g.ex - 30, g.VH * .62, GOLD, 20, .8); mgPop(g, g.ex, g.VH * .4, 'BONK!', COL.yellow); } } },
  update(g, dt) {
    let mv = 0; if (g.keys.left) mv -= 1; if (g.keys.right) mv += 1; if (g.tx != null) mv += Math.sign(g.tx - g.px);
    g.px = clamp(g.px + mv * 260 * dt + g.pk * dt, 80, g.ex - 90); g.pk *= Math.pow(.02, dt);
    g.ex = clamp(g.ex + g.ek * dt, g.px + 90, 740); g.ek *= Math.pow(.02, dt);
    g.cd -= dt; g.swing -= dt; g.eswing -= dt; g.eguard = (g.eguard || 0) - dt;
    // enemy AI: approach, warn, swing; sometimes guard
    const d = g.ex - g.px; if (d > 140 && g.warn <= 0) g.ex -= 120 * dt;
    g.ecd -= dt;
    if (g.ecd <= 0 && g.warn <= 0) { if (Math.random() < .3) { g.eguard = .8; g.ecd = 1; } else { g.warn = .6; } }
    if (g.warn > 0) { g.warn -= dt; if (g.warn <= 0) { g.eswing = .25; g.ecd = rand(1.1, 1.8); Snd.pew(); if (g.ex - g.px < 160) { if (mv < 0 || g.px <= 82) { mgPop(g, g.px, g.VH * .4, 'DODGE!', COL.green); g.sparks(g.px + 40, g.VH * .6, COL.green, 8); } else { g.ps -= .12; g.pk = -320; g.boom(g.px + 30, g.VH * .62, '#adb5bd', 18, .7); g.shake(8, .25); } } } }
    if (g.es <= 0) g.win('Shield-bonked! Hector and Ajax shake hands and swap gifts.');
    if (g.ps <= 0) g.lose('Your shield got bonked too much! Step back when Hector\'s "!" flashes.');
    g.info(g.meter('Ajax (you)', g.ps, COL.green) + g.meter('Hector', g.es, COL.purple));
  },
  draw(g, c, W, H) {
    const t = g.t, gy = H * .85; troy(c, H);
    for (let i = 0; i < 6; i++) drawPerson(c, 60 + i * 140, H * .7, .45, { t, ph: i, tunic: i < 3 ? GRK[i] : TRO[i - 3], hat: 'helmet', arms: 'up' });
    c.save(); c.translate(g.px, gy); c.rotate(g.swing > 0 ? .25 : 0); ajax(c, 0, 0, 1, t, { arms: 'out' }); c.restore();
    c.save(); c.translate(g.ex, gy); c.rotate(g.eswing > 0 ? -.25 : 0); hector(c, 0, 0, 1, t, { flip: true, arms: 'out', prop: 'shield', shieldCol: g.eguard > 0 ? COL.blue : '#adb5bd' }); c.restore();
    if (g.warn > 0) { txt(c, '!', g.ex, gy - 220, 60, COL.accent); E(c, g.ex, gy - 220, 36, 36); c.lineWidth = 5; c.strokeStyle = COL.accent; c.stroke(); }
    mgDrawPops(g, c);
  } });
GAMES.wall = () => ({ time: 35, hand: ['tap', 420, 260],
  init(g) { g.fl = []; g.sp = .8; g.ships = 1; g.n = 0; },
  timeout(g) { g.win('The wall held until night! But the Greeks still need Achilles...'); },
  down(g, x, y) { let hit = false; for (const f of g.fl) if (!f.dead && Math.hypot(x - f.x, y - f.y) < 60) { f.dead = true; hit = true; g.n++; Snd.splash(); g.boom(f.x, f.y, COL.blue, 18, .7); mgPop(g, f.x, f.y - 30, 'SPLASH!', COL.blue); break; } if (!hit) g.sparks(x, y, COL.blue, 5); },
  update(g, dt) {
    g.sp -= dt; if (g.sp <= 0) { g.fl.push({ x: rand(60, 740), y: -30, vx: rand(-40, 40), vy: rand(130, 190) + g.t * 3 }); g.sp = rand(.4, .75); }
    for (const f of g.fl) { f.x += f.vx * dt; f.y += f.vy * dt; if (!f.dead && f.y > g.VH * .78) { f.dead = true; g.ships -= .14; g.boom(f.x, g.VH * .8, COL.orange, 16, .8); g.shake(6, .2); mgPop(g, f.x, g.VH * .7, 'HOT!', COL.orange); } }
    g.fl = g.fl.filter(f => !f.dead);
    if (g.ships <= 0) g.lose('The ships caught fire! Splash the torches faster.');
    g.info(g.meter('Ships safe', g.ships, COL.blue));
  },
  draw(g, c, W, H) {
    const t = g.t; camp(c, H, t);
    c.fillStyle = '#c9b38a'; c.fillRect(0, H * .86, 800, H);
    for (let i = 0; i < 3; i++) drawShip(c, 140 + i * 260, H * .88, .7, { t, crew: 2, sail: false });
    for (const f of g.fl) { c.save(); c.translate(f.x, f.y); c.rotate(Math.atan2(f.vy, f.vx) - Math.PI / 2); L(c, 0, -30, 0, 10, 6, '#8a5a2b'); drawFlame(c, 0, 18, 1, t); c.restore(); }
    mgDrawPops(g, c);
  } });
(() => {
  const by = id => MISSIONS.find(m => m.id === id);
  Object.assign(by('hector').boss, { game: 'duel', name: 'Shield-Bonk Duel!', how: 'Next, Hector duels Ajax! Bonk his shield. Step back when "!" flashes!', hands: [['tap', 400, 420]] });
  Object.assign(by('embassy').boss, { game: 'wall', name: 'Save the Ships!', how: 'Without Achilles, Trojans attack! Tap torches to splash them!', hands: [['tap', 420, 230]] });
  by('hector').quiz.splice(2, 0, { q: 'How did Hector and Ajax\'s duel end?', o: ['Swapping gifts', 'A big fight', 'Running away'], a: 0, why: 'Night came. They swapped gifts with respect!' });
  by('hector').quiz.length = 3; by('hector').quiz[2].moral = true; by('hector').quiz[2].q = 'Hector and Ajax swapped gifts after their duel. What does that show?'; by('hector').quiz[2].o = ['Rivals can respect each other', 'Gifts are boring', 'They were scared']; by('hector').quiz[2].why = 'Even enemies can show respect.';
  // keep the family moral question too
  by('hector').quiz[1] = { q: 'What does Hector\'s goodbye show about war?', moral: true, o: ['War is fun', 'War hurts families', 'Only soldiers matter'], a: 1, why: 'War hurts families on both sides.' };
})();
(() => {
  const wrapU = (k, fn) => { const f = GAMES[k]; GAMES[k] = (b) => { const s = f(b); fn(s); return s; }; };
  wrapU('calm', s => { const u = s.update; s.update = function (g, dt) { const n = g.items.length, cl = g.calm; u.call(this, g, dt); if (g.calm > cl + .03) g.boom(470, g.y, COL.accent, 14, .6); else if (g.calm < cl - .08) { g.shake(6, .2); g.flash = .2; } }; });
  wrapU('tug', s => { const tp = s.tap; s.tap = function (g) { const r = g.rope; tp.call(this, g); if (g.rope > r) g.boom(400 + g.rope * 180, g.VH * .66, COL.yellow, 14, .6); else g.shake(4, .15); }; });
  wrapU('drive', s => { const u = s.update; s.update = function (g, dt) { const a = g.saved; u.call(this, g, dt); if (Math.floor(g.saved * 5) > Math.floor(a * 5)) { g.poof(300 + 200, g.VH * .78, 10); mgPop(g, 520, g.VH * .6, 'POOF!', COL.yellow); } }; });
  wrapU('shield', s => { const d = s.down; s.down = function (g, x, y) { const n = g.rings.filter(Boolean).length; d.call(this, g, x, y); if (g.rings.filter(Boolean).length > n) { g.boom(520, g.VH * .52, GOLD, 26, 1); Snd.bonk(); } }; });
  wrapU('race', s => { const u = s.update; s.update = function (g, dt) { const b = g.bumps; for (const o of g.obs) if (o.k === 'car' && !o.hit && Math.abs(o.x - 220) < 70 && Math.abs(o.y - g.y) < 50 && g.ram) { o.hit = true; g.boom(o.x, o.y, COL.green, 20, .8); mgPop(g, o.x, o.y - 50, 'FOUL!', COL.accent); g.bumps++; } u.call(this, g, dt); if (g.bumps > b) { g.shake(9, .3); g.flash = .2; g.sparks(220, g.y, COL.yellow, 14); } for (const o of g.obs) if (o.hit && o.k === 'star') {} }; });
  wrapU('night', s => { const u = s.update; s.update = function (g, dt) { u.call(this, g, dt); if (!g.inL && Math.random() < .1) g.sparks(g.x - 30, g.VH * .9, '#fff', 1); }; });
})();

boot(GAME);
