<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b26; --paper:#fffaf0; --accent:#ff4d6d; --yellow:#ffd23f; --green:#06d6a0; --blue:#4cc9f0;
    --toon:"Luckiest Guy","Comic Sans MS","Chalkboard SE",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { color:var(--ink); font-family:Nunito,system-ui,sans-serif; font-weight:800; background-color:#2b2a4a;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .toon { font-family:var(--toon); font-weight:400; letter-spacing:1px; }
  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:block; }

  /* ---------- title ---------- */
  #title { background:radial-gradient(circle at 50% 35%, #4a3f8f 0, #2b2a4a 70%); overflow:hidden; }
  #title .stars span { position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; opacity:.7; animation:tw 2s infinite alternate; }
  @keyframes tw { to { opacity:.15; } }
  #title .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; padding:16px; }
  h1 { margin:0; font-size:clamp(52px,11vw,130px); line-height:.95; text-align:center; color:var(--yellow);
    -webkit-text-stroke:4px var(--ink); paint-order:stroke; text-shadow:7px 7px 0 var(--ink); transform:rotate(-3deg); }
  h1 span { color:var(--accent); display:block; }
  #titlePup { width:min(34vh,62vw); height:auto; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-12px) rotate(2deg); } }
  #start { font-family:var(--toon); font-size:clamp(34px,6vw,58px); color:#fff; background:var(--green); padding:16px 56px 8px;
    border:4px solid var(--ink); border-radius:999px; box-shadow:0 8px 0 var(--ink); animation:pulse 1.1s ease-in-out infinite; }
  #start:active { transform:translateY(5px); box-shadow:0 3px 0 var(--ink); animation:none; }
  @keyframes pulse { 50% { transform:scale(1.07); } }

  /* ---------- map ---------- */
  #map { background:#7fd1ff; overflow:hidden; }
  #sea { position:absolute; inset:0; background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.35) 0 6%, transparent 7%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,.3) 0 5%, transparent 6%),
      linear-gradient(#8fdcff, #4cc9f0); }
  #land { position:absolute; left:3%; right:3%; top:96px; bottom:24px; background:#b5e48c; border:4px solid var(--ink);
    border-radius:48px; box-shadow:8px 8px 0 rgba(29,27,38,.5); }
  #path { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .stop { position:absolute; width:var(--s); height:var(--s); margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius:50%; background:var(--bg); border:4px solid var(--ink); box-shadow:0 6px 0 var(--ink);
    display:grid; place-items:center; font-size:calc(var(--s) * .5); transition:transform .15s; }
  .stop:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .stop .name { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); white-space:nowrap;
    font-family:var(--toon); font-size:clamp(13px,1.6vw,19px); background:var(--paper); border:3px solid var(--ink);
    border-radius:999px; padding:3px 12px 0; letter-spacing:.5px; }
  .stop .done { position:absolute; top:-8px; right:-8px; font-size:22px; background:var(--green); border:3px solid var(--ink);
    border-radius:50%; width:34px; height:34px; display:grid; place-items:center; }
  .stop.next { animation:glow 1s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow:0 6px 0 var(--ink), 0 0 0 12px rgba(255,210,63,.75); } }
  #arrow { position:absolute; font-size:48px; transform:translate(-50%,-100%); pointer-events:none;
    animation:hop .7s ease-in-out infinite; filter:drop-shadow(3px 3px 0 var(--ink)); }
  @keyframes hop { 50% { margin-top:-14px; } }
  #pup { position:absolute; width:80px; height:auto; margin:-94px 0 0 -40px; pointer-events:none;
    transition:left .7s ease-in-out, top .7s ease-in-out; filter:drop-shadow(0 6px 0 rgba(0,0,0,.2)); z-index:5; }
  #pup.walk { animation:waddle .18s infinite alternate; }
  @keyframes waddle { from { transform:rotate(-6deg); } to { transform:rotate(6deg); } }

  .bar { position:absolute; left:0; right:0; top:0; height:84px; display:flex; align-items:center; gap:12px; padding:12px 16px; z-index:10; }
  .chip { background:var(--paper); border:3px solid var(--ink); border-radius:999px; box-shadow:0 5px 0 var(--ink);
    min-width:60px; height:60px; padding:0 18px; display:grid; place-items:center; font-size:26px; }
  .chip:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink); }
  #bubble { flex:1; display:flex; justify-content:center; }
  #bubble div { background:var(--yellow); border:3px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink);
    padding:8px 20px 4px; font-family:var(--toon); font-size:clamp(18px,2.6vw,28px); letter-spacing:1px; text-align:center; }

  /* ---------- help + confirm sheets ---------- */
  .sheet { position:fixed; inset:0; background:rgba(29,27,38,.55); display:none; place-items:center; z-index:20; padding:16px; }
  .sheet.on { display:grid; }
  .card { background:var(--paper); border:4px solid var(--ink); border-radius:26px; box-shadow:8px 8px 0 var(--ink);
    padding:22px 26px; width:min(560px,94vw); text-align:center; }
  .card h2 { margin:0 0 12px; font-family:var(--toon); font-weight:400; font-size:40px; color:var(--accent); letter-spacing:1px; }
  .how { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .how div { background:#fff; border:3px solid var(--ink); border-radius:16px; padding:10px 6px; font-size:18px; }
  .how b { display:block; font-size:42px; line-height:1.2; }
  .btn { font-family:var(--toon); font-size:30px; color:#fff; background:var(--green); padding:12px 40px 6px; margin-top:16px;
    border:4px solid var(--ink); border-radius:999px; box-shadow:0 6px 0 var(--ink); letter-spacing:1px; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.alt { background:#fff; color:var(--ink); }
  #gIcon { font-size:84px; width:140px; height:140px; margin:0 auto 8px; border-radius:50%; border:4px solid var(--ink); display:grid; place-items:center; }
  #gName { font-family:var(--toon); font-size:40px; color:var(--accent); letter-spacing:1px; }
  #gTag { font-size:20px; margin:4px 0 0; }
</style>
</head>
<body>

<!-- 1. title -->
<section id="title" class="screen on">
  <div class="stars" id="stars"></div>
  <div class="wrap">
    <h1 class="toon">TESLA<span>GAMES</span></h1>
    <svg id="titlePup" viewBox="0 0 200 200" aria-label="Captain Pup"></svg>
    <button id="start" aria-label="Press start">PRESS START</button>
  </div>
</section>

<!-- 2. map -->
<section id="map" class="screen">
  <div id="sea"></div>
  <div class="bar">
    <button class="chip" id="home" aria-label="Title screen">🏠</button>
    <div id="bubble"><div id="say">👆 Tap a game!</div></div>
    <button class="chip" id="talk" aria-label="Read aloud">🔊</button>
    <button class="chip toon" id="help" aria-label="How to play">?</button>
  </div>
  <div id="land">
    <svg id="path" preserveAspectRatio="none"></svg>
    <div id="arrow">⬇️</div>
    <svg id="pup" viewBox="0 0 200 200"></svg>
  </div>
</section>

<!-- how to play (reference) -->
<div class="sheet" id="howSheet">
  <div class="card">
    <h2>How to play</h2>
    <div class="how">
      <div><b>👆</b>Tap a game</div>
      <div><b>▶️</b>Press GO</div>
      <div><b>⬇️</b>Follow the arrow</div>
      <div><b>🔊</b>Tap to listen</div>
      <div><b>⭐</b>Win stars</div>
      <div><b>⬅️</b>Games = back here</div>
    </div>
    <button class="btn" id="howOk">OK!</button>
  </div>
</div>

<!-- game confirm -->
<div class="sheet" id="goSheet">
  <div class="card">
    <div id="gIcon"></div>
    <div id="gName"></div>
    <p id="gTag"></p>
    <button class="btn" id="go">GO ▶</button>
    <button class="btn alt" id="back">Back</button>
  </div>
</div>

<script>
'use strict';
// Each game: folder, short name, icon, colour, 5-word tagline
const GAMES = [
  ['hole',              'Hole City',      '👾', '#cdb4ff', 'Gobble the whole city!'],
  ['slice-dojo',        'Slice Dojo',     '🍉', '#ff8fa3', 'Slice fruit. Learn ounces!'],
  ['martian-jump',      'Martian Jump',   '🚀', '#f4a261', 'Jump across Mars!'],
  ['planet-explorer',   'Planets',        '🪐', '#9d8df1', 'Explore four space worlds!'],
  ['science-lab',       'Science Lab',    '🧪', '#4cc9f0', 'Mix, melt and boom!'],
  ['physics-park',      'Physics Park',   '🎢', '#ffb86b', 'Ride the physics park!'],
  ['charge-up',         'Charge Up!',     '🔋', '#06d6a0', 'Power up electric cars!'],
  ['body-explorer',     'Inside the Body','🫀', '#ffafcc', 'Fly through your tummy!'],
  ['time-travel',       'Time Travel',    '⏳', '#ffd166', 'Visit ancient worlds!'],
  ['odyssey',           'The Odyssey',    '⛵', '#74c0fc', 'Sail home with Odysseus!'],
  ['iliad',             'The Iliad',      '🛡️', '#e9c46a', 'Heroes of Troy!'],
  ['philosophers',      'Big Ideas',      '⚔️', '#c3b1ff', 'Duel the great thinkers!'],
  ['civics-quest',      'Capitol Quest',  '🏛️', '#a2d2ff', 'How government works!'],
  ['money-heist-defense','Vault Guardians','🏦', '#95d5b2', 'Stop robbers and scams!'],
];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
let visited = store.get('tg.visited', []);

// ---------- Captain Pup (SVG) ----------
function pupSVG(svg) {
  svg.innerHTML = `
    <g stroke="#1d1b26" stroke-width="6" stroke-linejoin="round">
      <ellipse cx="44" cy="96" rx="26" ry="42" fill="#1f1d22" transform="rotate(18 44 96)"/>
      <ellipse cx="156" cy="96" rx="26" ry="42" fill="#1f1d22" transform="rotate(-18 156 96)"/>
      <ellipse cx="100" cy="168" rx="46" ry="26" fill="#fbfbfb"/>
      <circle cx="100" cy="100" r="62" fill="#fbfbfb"/>
    </g>
    <ellipse cx="72" cy="88" rx="22" ry="26" fill="#1f1d22" transform="rotate(-25 72 88)"/>
    <ellipse cx="128" cy="88" rx="22" ry="26" fill="#1f1d22" transform="rotate(25 128 88)"/>
    <circle cx="75" cy="92" r="13" fill="#6b3d22"/><circle cx="125" cy="92" r="13" fill="#6b3d22"/>
    <circle cx="76" cy="93" r="7" fill="#120a08"/><circle cx="126" cy="93" r="7" fill="#120a08"/>
    <circle cx="80" cy="88" r="4" fill="#fff"/><circle cx="130" cy="88" r="4" fill="#fff"/>
    <ellipse cx="100" cy="116" rx="11" ry="8" fill="#3b3436"/>
    <path d="M86 128 Q100 140 114 128 L112 150 Q100 162 88 150 Z" fill="#ff8fb1" stroke="#1d1b26" stroke-width="4"/>
    <g stroke="rgba(40,30,30,.5)" stroke-width="2"><path d="M82 120 L52 114 M82 124 L52 126 M118 120 L148 114 M118 124 L148 126"/></g>
    <path d="M52 52 Q100 18 148 52 L140 62 Q100 40 60 62 Z" fill="#ff4d6d" stroke="#1d1b26" stroke-width="5"/>
    <text x="100" y="52" text-anchor="middle" font-size="22">⭐</text>`;
}
pupSVG($('titlePup')); pupSVG($('pup'));

// title stars
for (let i = 0; i < 60; i++) {
  const s = document.createElement('span');
  s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = (Math.random() * 2) + 's';
  $('stars').appendChild(s);
}

// ---------- sound + voice ----------
let ac = null;
function blip(f = 660, d = 0.12) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'square'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + d);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (_) {}
}
function speak(t) {
  try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/[^\w\s!?.,'-]/g, '')); u.rate = 0.95; speechSynthesis.speak(u); } catch (_) {}
}
if (!('speechSynthesis' in window)) $('talk').style.display = 'none';

// ---------- screens ----------
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function goMap() {
  blip(520); show('map');
  try { sessionStorage.setItem('tg.started', '1'); } catch (_) {}
  layout();
  if (!store.get('tg.howSeen', false)) { store.set('tg.howSeen', true); setTimeout(() => $('howSheet').classList.add('on'), 400); }
}
$('start').onclick = goMap;
addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && $('title').classList.contains('on')) { e.preventDefault(); goMap(); }
  if (e.key === 'Escape') { $('howSheet').classList.remove('on'); $('goSheet').classList.remove('on'); }
});
$('home').onclick = () => { blip(400); show('title'); };
$('help').onclick = () => { blip(); $('howSheet').classList.add('on'); speak('Tap a game. Press go. Follow the arrow. Win stars!'); };
$('howOk').onclick = () => { blip(); $('howSheet').classList.remove('on'); };
$('talk').onclick = () => speak($('say').textContent);

// ---------- map layout: a winding road of stops ----------
let pos = [], pupAt = -1;
function layout() {
  const land = $('land'), W = land.clientWidth, H = land.clientHeight;
  const portrait = W < H;
  const cols = portrait ? 2 : (W > 1200 ? 5 : 4);
  const rows = Math.ceil(GAMES.length / cols);
  const size = Math.max(64, Math.min(120, (portrait ? W / 3.2 : W / (cols * 2.1)), H / (rows * 1.9)));
  land.style.setProperty('--s', size + 'px');
  pos = GAMES.map((g, i) => {
    const r = Math.floor(i / cols), c0 = i % cols, c = r % 2 ? cols - 1 - c0 : c0;   // snake back and forth
    const x = (c + 0.5) / cols * W, y = (r + 0.5) / rows * H - size * 0.15;
    return [x + (r % 2 ? -1 : 1) * (c0 % 2 ? size * 0.12 : 0), y];
  });
  // road
  const d = pos.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(0) + ' ' + p[1].toFixed(0)).join(' ');
  $('path').setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('path').innerHTML = `<path d="${d}" fill="none" stroke="#1d1b26" stroke-width="${size * 0.36}" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#ffe8a3" stroke-width="${size * 0.26}" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#f4a261" stroke-width="4" stroke-dasharray="14 16" stroke-linecap="round"/>`;
  // stops
  land.querySelectorAll('.stop').forEach(n => n.remove());
  const next = GAMES.findIndex(g => !visited.includes(g[0]));
  GAMES.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'stop' + (i === next ? ' next' : '');
    b.style.left = pos[i][0] + 'px'; b.style.top = pos[i][1] + 'px';
    b.style.setProperty('--bg', g[3]);
    b.setAttribute('aria-label', g[1]);
    b.innerHTML = `${g[2]}<span class="name">${g[1]}</span>${visited.includes(g[0]) ? '<span class="done">✓</span>' : ''}`;
    b.onclick = () => pick(i);
    land.appendChild(b);
  });
  const ai = next < 0 ? 0 : next;
  $('arrow').style.left = pos[ai][0] + 'px'; $('arrow').style.top = (pos[ai][1] - size * 0.55) + 'px';
  const narrow = innerWidth < 600;
  $('say').textContent = next < 0 ? (narrow ? '⭐ Pick any!' : '⭐ You tried them all! Pick any!') : (narrow ? `👆 ${GAMES[ai][2]}` : `👆 Tap ${GAMES[ai][2]} ${GAMES[ai][1]}!`);
  if (pupAt < 0) pupAt = ai;
  placePup(pupAt, false, size);
}
function placePup(i, walk, size) {
  const s = size || parseFloat(getComputedStyle($('land')).getPropertyValue('--s')) || 100;
  const p = $('pup');
  p.style.width = s * 0.75 + 'px'; p.style.marginLeft = -s * 0.375 + 'px'; p.style.marginTop = -s * 1.25 + 'px';
  if (walk) p.classList.add('walk');
  p.style.left = (pos[i][0] - s * 0.62) + 'px'; p.style.top = (pos[i][1] + s * 0.25) + 'px';
  if (walk) setTimeout(() => p.classList.remove('walk'), 700);
}

// tap a stop: Pup walks there, then a GO card pops up
let picked = -1;
function pick(i) {
  blip(600 + i * 20); picked = i;
  placePup(i, true); pupAt = i;
  const g = GAMES[i];
  setTimeout(() => {
    $('gIcon').textContent = g[2]; $('gIcon').style.background = g[3];
    $('gName').textContent = g[1]; $('gTag').textContent = g[4];
    $('goSheet').classList.add('on');
    speak(g[1] + '. ' + g[4]);
  }, 650);
}
$('back').onclick = () => { blip(400); $('goSheet').classList.remove('on'); };
$('go').onclick = () => {
  const g = GAMES[picked]; if (!g) return;
  blip(880, .2);
  if (!visited.includes(g[0])) { visited.push(g[0]); store.set('tg.visited', visited); }
  location.href = g[0] + '/';
};
addEventListener('resize', () => { if ($('map').classList.contains('on')) layout(); });

// Coming back from a game (same visit) goes straight to the map.
try { if (sessionStorage.getItem('tg.started') === '1') goMap(); } catch (_) {}
</script>
</body>
</html>
